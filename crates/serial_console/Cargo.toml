[package]
name = "serial_console"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The serial console for a real board (milestone 216): open the port, log every byte, recognise how
# far the boot got, and stop on a deadline instead of hanging.
#
# A crate rather than code inside `xtask` for the reason CLAUDE.md rule 7 and every host-logic crate
# here give: the interesting half is a recogniser over text, and a recogniser is worth thousands of
# host tests in milliseconds. `xtask` keeps the argument parsing and nothing else.
#
# **No dependencies, deliberately.** Talking to a serial port is a `termios` call, and the crate that
# would do it (`serialport`, or `libc` and doing it by hand) is a dependency decision under
# DECISIONS §46 that this lane has no authority to take. `stty(1)` is in every base system, has been
# for forty years, and configures the same struct; see `port.rs` for what that costs.

[lints]
workspace = true

[dependencies]
# **The one dependency**, and the header above's "no dependencies, deliberately" now has an
# exception worth stating rather than quietly breaking. `screen` (milestone 243) reads nife's
# framebuffer console back out of a screendump, and the only way to do that without guessing is to
# compare each 7x8 cell against the glyph table the console drew it from. A second copy of that
# table in a host tool would be a gate that cannot disagree with the thing it gates, which is the
# one property a gate has to have. It is ours, in this workspace, has no dependencies of its own,
# and contains no `unsafe`; §46's concern is external code and this is none.
bitmap_font = { version = "0.1.0", path = "../bitmap_font" }
# **The second dependency, and the same argument as the first** (milestone 268). The recogniser
# below keys on the lines the kernel prints at each rung of the boot. A second copy of those strings
# here would be a gate that cannot disagree with the thing it gates, which is the one property a
# gate has to have; milestone 268's finding 3 is what the second copy actually costs. Ours, in this
# workspace, `no_std`, no dependencies of its own, no `unsafe`: §46's concern is external code and
# this is none.
boot_ladder = { version = "0.1.0", path = "../boot_ladder" }
# **The third dependency, and the same argument as the first two** (milestone 324 part 2). The
# recogniser now reads the job-mix sweep's console markers, and they were three private `const`s in
# `kernel/src/job_mix.rs` plus four string literals in `xtask`. A fourth copy here would be a gate
# that cannot disagree with the thing it gates, which is the one property a gate has to have; this
# crate is the workload's own definition, which both halves of the instrument already read. Ours, in
# this workspace, `no_std`, no dependencies of its own, no `unsafe`: §46's concern is external code
# and this is none.
job_mix = { version = "0.1.0", path = "../job_mix" }
# **The fourth, and the same argument again** (2026-10-04, on the xenon bench of milestone 261 (the
# NVMe driver leaves the kernel)). The console
# now draws a wide screen at an integer scale, and `screen` must decode at the scale the painter
# chose. A second copy of `ScreenConsole::scale_for` here would be a gate that cannot disagree with
# the thing it gates. Ours, `no_std`, no `unsafe`; it was already a dev-dependency below.
screen_console = { version = "0.1.0", path = "../screen_console" }

[dev-dependencies]
# The *writer* the `screen` tests read back from, so that "what the kernel draws is what this
# reads" is asserted against the crate the kernel actually links rather than against a second
# painter written here. Same rule as `uefi_loader`'s handoff tests.
machine_discovery = { version = "0.1.0", path = "../machine_discovery" }
# **The second writer**, out of milestone 377 (two screendump decoders, in two crates, reading
# the same font): the display terminal's default colors are that crate's
# choice, and `screen::decode` is proven against the scheme as `video_terminal::Attr::DEFAULT`
# defines it, not against a copy of two RGB words that could drift. Ours, in this workspace,
# sans-IO with `bitmap_font` as its one dependency, no `unsafe`: §46 (thin primitives or whole
# subsystems) is about external code, and this is none.
video_terminal = { version = "0.1.0", path = "../video_terminal" }
