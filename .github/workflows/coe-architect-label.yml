name: coe architect label

# Observed failing: 2026-10-03, run 37160727245: detected
#   notes/coes/2026-10-03-the-queue-judged-one-pull-request-at-a-time.md on #1564 and applied
#   `needs-architect` (github-actions[bot], 23:07:29Z). Green by design. Its first COE, on #1166, got
#   no label and a pass, which is half of why this record exists. See notes/observed-failing.md.

# **calef, 2026-09-23: he wants to review every correction of error, and asked that
# `needs-architect` be added to each COE pull request by default.** "Default" is the requirement.
# AGENTS.md already prices what happens when a label depends on someone remembering: it is rung
# four of the ladder ("A note, a report, or a comment on a pull request... the floor, and it is
# what everything that failed on 2026-08-04 was relying on"), and §88 (`needs-architect` as a
# required check, rather than as a script's restraint) built the enforcement half of this label as
# a required check, but said plainly what it does not do: *"It enforces the label; it cannot apply
# the label... The mechanisms that could close that are separate and harder... a check that reads
# the diff and demands the label when the syscall surface or the dependency graph moved. The
# second is the real answer."* This workflow is that answer's shape, scoped to one case: a COE.
#
# **A separate workflow, not a change to architect-hold.yml.** That workflow's own header is
# explicit: *"It is deliberately read-only... Nothing here writes anything, no comment, no label
# change, no merge action -- so nothing beyond read access is asked for."* Adding a write path to
# it would contradict a stance that file argues for on purpose, and would put a write permission on
# a required check sitting in the merge queue's critical path (its own header calls out PR #546's
# two-hour stall as the reason that check must never be the thing that gets stuck). A required
# check earns its keep by being small, deterministic and read-only; a labeler earns its keep by
# being best-effort. Mixing the two would cost architect-hold.yml its argument without buying this
# job anything, since this job does not need to be required or fast to be useful.
#
# **What "a COE pull request" means here.** decision 210, "a correction of error, and its action
# items are decisions, proposals or milestones", proposed that COE records live at
# `notes/corrections/`, one file per correction (they now live in `notes/coes/`). That decision is UNRATIFIED and UNMERGED as of
# this writing (branch `maintainer/a-correction-names-its-action`, pull request #1148; deliberately
# not written as a section-sign citation here, since that form is checked tree-wide against the
# decisions this branch actually has, and this branch does not have that one yet). Its own number is
# provisional per its first line too, because two other decision files were open on unmerged
# branches the same night. So the directory this workflow watches is named once, as COE_DIR below,
# with this comment as the only place that needs to change if an architect ratifies a different
# layout or
# number.
#
# **A record, not any file in that directory** (2026-09-24, path updated 2026-10-03). COEs moved
# from `notes/corrections/` to `notes/coes/` on 2026-09-30 (UTC); both are watched (see COE_DIR and
# LEGACY_DIR below). Each directory also holds files that are not records: #1247 added
# `notes/corrections/README.md`, a naming-provenance note, and was labelled at 20:56 UTC by the rule
# as it stood. So only a dated `.md` file directly in one of them counts, which is COE_RECORD below,
# and an index such as `notes/coes/README.md` never does.
#
# **This is a convenience, not a gate.** It routes attention; it does not block anything, and
# nothing here is added to branch protection's required checks. A COE must never fail to exist
# because a label API call failed, so every step below is written to report and continue rather
# than to fail the job. See the detection step's comment for why a `synchronize` asks one extra
# question of the pull request's own diff (did this file exist before the push) rather than
# reading a different diff.
#
# BUGS: **a rebase or amended force-push used to make the label return after a human removed it**,
# observed twice on pull request #1166 within three hours, 2026-09-24 UTC. Two stacked causes, both
# now fixed below and both worth recording because the second would still be true had only the
# first been noticed:
#
#  1. **The `synchronize`-only-diff branch never ran, for any PR, ever.** The detection step read
#     `EVENT_NAME` from `github.event_name`, which is the literal string `pull_request` for every
#     action type (`opened`, `synchronize`, `reopened` alike); the per-action value lives at
#     `github.event.action` instead. So `[ "$EVENT_NAME" = "synchronize" ]` was always false, and
#     every event, including an ordinary incremental push, took the "read the whole PR" branch.
#     Confirmed by reading this workflow's own run logs for PR #1166: a plain synchronize at
#     2026-09-23T21:57:26Z logged "coe-label: pull_request event, reading the whole PR's file list
#     (base...head)". Fixed by reading `github.event.action`.
#  2. **Even with that branch reachable, `compare/BEFORE...AFTER` is not safe across a rebase.** A
#     force-push that rewrites history leaves `before` and `after` without a linear relationship;
#     GitHub reports the pair `"status":"diverged"` and diffs against their merge base rather than
#     against `before` itself, so a file added on an earlier, ordinary push can come back with
#     `"status":"added"`. Reproduced directly against PR #1166's real SHAs
#     (`97c43d28...03e72d24`, the force-push at 02:13:48Z): the compare reports `diverged`, 59
#     ahead and 7 behind, and lists `notes/corrections/2026-09-23-the-sweep-that-swept-nothing.md`
#     as `added`, though it already existed at `before` (confirmed via the contents API at that
#     SHA). Fixed below by re-verifying each `synchronize`-branch candidate directly against
#     `BEFORE_SHA`'s tree instead of trusting `status`.
#
#     **Both fixes are exercised against #1166's real history above, not against a live trigger**:
#     this workflow was not re-run on that pull request to confirm the fix, because touching #1166
#     (already approved, auto-merge armed) risks tripping the very defect being fixed, a third
#     time, on somebody else's approved work. What is confirmed is that the corrected logic,
#     applied to the exact SHAs and file that produced the wrong answer twice, produces the right
#     one. The residual gap: if `BEFORE_SHA` itself becomes unreachable (garbage-collected after a
#     rebase old enough that GitHub drops the orphaned commit), the contents-API check 404s for a
#     reason other than genuine absence and the file reads as new again, same failure shape as
#     cause 2, just narrower. Not fixed; recorded here if it recurs.
#
#  3. **A rebase labelled a pull request that adds no COE at all**, 2026-09-24 20:20 UTC, pull
#     request #1194 (272 files, none under `notes/corrections/`), minutes after #1166's COE merged
#     to `main`. The `synchronize` path diffed `compare/BEFORE...AFTER`, which is what the push
#     changed, and a rebase onto a `main` that has just gained a COE record changes the branch by
#     exactly that record. The cause-2 check could not help: the record really was absent at
#     `before`, so it verified as new. The mistake was the diff, not the check, so the fix is the
#     diff: every event now reads the pull request's own file list (`pulls/N/files`, base...head),
#     which cannot name a file `main` added, and a `synchronize` keeps the cause-2 question for
#     each candidate from that list. The compare call is gone, and cause 2's `diverged` case with
#     it. Replayed against #1194's 20:20 event (no label) and #1166 (label) before merging.

#  4. **Six more wrong labels after cause 3's fix merged**, 2026-09-24 21:34 to 21:49 UTC, on
#     #1230, #1244, #1246, #1249, #1254 and #1255. Each run logged "diffing this push only", cause
#     3's removed wording: a `pull_request` run takes this file from the pull request's head, so a
#     branch cut before #1248 kept running the old copy until it was rebased onto a `main` that had
#     the fix. #1249's run is the example (head e7ff791a, which lacks #1248's merge): it labelled
#     for `notes/corrections/README.md`, which `main` had gained. Nothing in this file can reach
#     a branch that does not contain it, so that half is recorded, not fixed. The other half is
#     fixed: candidates from the PR's file list must also be absent at the merge base of the base
#     branch and the event's head, read from the event's own SHAs rather than from GitHub's cached
#     list. Proved 2026-09-25 by simulated events: this step's script, extracted and run locally
#     with each event's env (base ref set to `main`'s SHA at the event's time) and real read-only
#     `gh api` calls, except that a `gh` stub fed the file list the old diff produced. #1166's
#     opening labels. #1194's 20:20 rebase and #1249's 21:49 rebase do not, and #1194's does not
#     with `before` removed either, so the merge-base check alone rejects `main`'s record.

on:
  # `synchronize` needs `before`/`after` from the event payload (see the detection step), which is
  # why this does not also listen for `labeled`/`unlabeled`/`ready_for_review` the way
  # architect-hold.yml does: those events carry no new commits, so there is nothing new to detect
  # a file addition against, and firing on them would only add cost with no chance of a different
  # outcome. `reopened` is included because a closed-then-reopened PR is still a PR nobody has
  # scanned since whatever happened while it was closed.
  pull_request:
    types: [opened, reopened, synchronize]

# `pull-requests: write` is the one thing this job needs beyond the `contents: read` every other
# workflow here defaults to (see architect-hold.yml's header on the same point): adding a label to
# a pull request. Nothing here reads or writes repository contents, opens a comment, or touches
# anything else the token could reach, so nothing wider is asked for. This is deliberately NOT
# `pull_request_target`: that trigger runs with base-repo token privileges against a fork's
# workflow-controlled event, which is the wrong trade for a job this small. The cost is accepted
# and stated rather than hidden: for a pull request opened from a fork, GitHub gives the
# `GITHUB_TOKEN` read-only access regardless of this block (its own documented fork-safety
# default), so the label call below will fail there and log why. That failure is silent to nobody:
# it prints to the job log and, same as every other case, does not fail the build. A human already
# has to review a fork's first-time run before anything in it executes, so the label being missing
# for that one case is a smaller cost than widening this token to run against fork-controlled code.
permissions:
  contents: read
  pull-requests: write

# One run per PR at a time, so two events firing close together (e.g. `opened` immediately followed
# by a `synchronize` from a force-push) cannot interleave their `gh` calls. `cancel-in-progress` is
# false on purpose: unlike ci.yml/verify.yml, a superseded run here is not wasted work whose result
# nobody wants -- an `opened` run and a later `synchronize` run can each be the one that finds a
# COE file, over two different diffs (see below), and cancelling the first would silently drop that
# detection instead of just being late with it.
concurrency:
  group: coe-architect-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    name: label a new COE with needs-architect
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      # **Requirement 1 lives entirely in this step: it adds, and it must never re-add what a
      # human took off.** The obvious approach, asking "does this PR's diff (base...head) add a
      # file under COE_DIR", is wrong for a repeat-labelled PR: GitHub reports a file's status as
      # `added` for as long as it exists in the head and did not exist in the base, for the WHOLE
      # PR, on every single event, no matter which push introduced it. A maintainer who removes the
      # label after reading a COE would see it silently reappear on this PR's very next push, which
      # is worse than never having the mechanism: the label would stop meaning "unread."
      #
      # So every event reads the same diff, the pull request's own (base...head, via the
      # pulls/files API), and the event decides one extra question:
      #   - `opened` / `reopened`: no earlier event exists, so every COE file the PR adds counts.
      #   - `synchronize`: the payload's `before` is the previous head. A file the PR adds counts
      #     only if it did not exist at `before`, so a push that does not add a COE finds nothing
      #     and a removed label stays removed, while a push that adds a second correction to the
      #     same PR is still caught.
      #
      # **This took four tries, all recorded in BUGS.** The `synchronize` path never ran (cause 1);
      # once it ran it read `compare/BEFORE...AFTER`, which a rebase makes lie in two directions:
      # it re-reported this PR's own old file as added (cause 2), and it reported a file `main`
      # had just gained as this PR's (cause 3, #1194). Reading only the PR's own diff removes both.
      - name: Detect whether this event adds a COE record
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          # The head this event is about and the branch it merges into. `after` is empty on
          # `opened` and `reopened`, so the merge-base question below asks with `head.sha`.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # COE_DIR is where COEs live now: `notes/coes/` since 2026-09-30 (UTC). The workflow
          # kept watching only `notes/corrections/` after the move, so no COE was labelled until
          # this was fixed (seen on #1513: "nothing newly added under notes/corrections/").
          # `notes/corrections/` is still watched as LEGACY_DIR because it still holds a record
          # (the 2026-09-23 sweep correction) and a stray new file there should still reach an
          # architect. Drop LEGACY_DIR when that directory is retired.
          COE_DIR="notes/coes/"
          LEGACY_DIR="notes/corrections/"
          # A record is `<date>-<slug>.md` directly in one of those directories; a README or
          # anything else they hold is not a correction of error.
          COE_RECORD="^(${COE_DIR}|${LEGACY_DIR})[0-9]{4}-[0-9]{2}-[0-9]{2}-[^/]+\.md\$"

          add=false
          files=""
          synchronize_diff=false

          # `before` is the all-zero SHA on a few documented GitHub edge cases (a branch's very
          # first push to an existing PR ref); treat that the same as "no usable before" rather
          # than asking the contents API about a SHA that names nothing.
          #
          # **Every event reads the pull request's own diff, base...head.** It used to read
          # `compare/BEFORE...AFTER` on a `synchronize`, which is what THIS push changed, and after a
          # rebase onto a `main` that had just gained a COE that push includes `main`'s record (see
          # BUGS, cause 3). The pulls/files list is the one diff that can only name files this pull
          # request adds. What the `synchronize` path still needs from `before` is not a diff but a
          # question, "did this file already exist before this push", and the verification loop below
          # asks it per candidate.
          if [ "$EVENT_NAME" = "synchronize" ] && [ -n "$BEFORE_SHA" ] && [ -n "$AFTER_SHA" ] \
             && [ "$BEFORE_SHA" != "$AFTER_SHA" ] \
             && ! printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
            echo "coe-label: synchronize event; this PR's own added files, each checked against $BEFORE_SHA"
            synchronize_diff=true
          else
            echo "coe-label: $EVENT_NAME event, reading the whole PR's file list (base...head)"
          fi
          if ! files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
                --jq '.[] | select(.status=="added") | .filename' 2>&1)"; then
            echo "coe-label: could not read PR #$PR_NUMBER's file list; skipping this run." >&2
            echo "coe-label: gh said: $files" >&2
            echo "add=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matches="$(printf '%s\n' "$files" | grep -E "$COE_RECORD" || true)"

          # **A record the base branch already had at the merge base is never this PR's** (cause
          # 4 in BUGS). The pulls/files list should already exclude it, since it is base...head,
          # but that list is GitHub's cached view of the pull request. This asks the same question
          # from the event's own head: the merge base of BASE_REF and HEAD_SHA, and each candidate
          # must be absent there. If the merge base cannot be read, the list stands alone, which
          # is the behaviour before this check existed.
          if [ -n "$matches" ] && [ -n "$HEAD_SHA" ] && [ -n "$BASE_REF" ]; then
            if mb="$(gh api "repos/$REPO/compare/$BASE_REF...$HEAD_SHA?per_page=1" \
                  --jq '.merge_base_commit.sha' 2>&1)" && [ -n "$mb" ]; then
              echo "coe-label: merge base of $BASE_REF and $HEAD_SHA is $mb"
              kept=""
              while IFS= read -r candidate; do
                [ -z "$candidate" ] && continue
                if gh api "repos/$REPO/contents/$candidate?ref=$mb" >/dev/null 2>&1; then
                  echo "coe-label: $candidate is already on $BASE_REF at the merge base; not this PR's"
                else
                  kept="$(printf '%s\n%s' "$kept" "$candidate")"
                fi
              done < <(printf '%s\n' "$matches")
              matches="$(printf '%s\n' "$kept" | sed '/^$/d')"
            else
              echo "coe-label: could not read the merge base ($mb); using the PR's file list alone" >&2
            fi
          fi

          # On a `synchronize`, a file the PR adds is only NEW if it did not exist before this
          # push; otherwise every push would re-add a label a human removed (requirement 1). So
          # each candidate is checked directly against BEFORE_SHA's tree before counting it. A 404 there means the
          # file was genuinely absent before this push. Any other failure (rate limit, transient
          # error) is treated as "already existed" rather than "new": the requirement this step
          # exists for is that a removed label must not return, and an uncertain answer should fail
          # toward that, not toward re-adding.
          if [ "$synchronize_diff" = "true" ] && [ -n "$matches" ]; then
            verified=""
            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              if err="$(gh api "repos/$REPO/contents/$candidate?ref=$BEFORE_SHA" 2>&1 >/dev/null)"; then
                echo "coe-label: $candidate already existed at $BEFORE_SHA; not new in this push"
              elif printf '%s' "$err" | grep -q 'HTTP 404'; then
                if [ -z "$verified" ]; then
                  verified="$candidate"
                else
                  verified="$(printf '%s\n%s' "$verified" "$candidate")"
                fi
              else
                echo "coe-label: could not confirm whether $candidate existed at $BEFORE_SHA ($err); treating it as not-new to be safe" >&2
              fi
            done < <(printf '%s\n' "$matches")
            matches="$verified"
          fi

          if [ -n "$matches" ]; then
            echo "coe-label: newly added under $COE_DIR or $LEGACY_DIR:"
            printf '%s\n' "$matches" | sed 's/^/  /'
            add=true
          else
            echo "coe-label: nothing newly added under $COE_DIR or $LEGACY_DIR in this event; leaving the label alone"
          fi
          echo "add=$add" >> "$GITHUB_OUTPUT"

      # **Requirement 2: least privilege was argued above, at the permissions block, not here.**
      # **Requirement 3: this step must not fail the build.** `gh pr edit` can fail for reasons
      # that have nothing to do with whether a COE was added: a fork PR's read-only token (see the
      # permissions comment), a transient API error, or the label having been deleted from the
      # repository entirely. None of those are reasons a correction of error should be blocked
      # from existing, so failure here is logged and swallowed rather than propagated. The `if`
      # guards the `gh` call, which keeps this step's own exit code at whatever the trailing `echo`
      # leaves it (0), regardless of which branch ran; nothing later in this file depends on it.
      - name: Add needs-architect (never removes it)
        if: steps.check.outputs.add == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # **`--repo` is not optional here, and its absence made this step a no-op on the first
          # COE it ever saw** (pull request #1166, 2026-09-23). This job never checks the
          # repository out, so `gh pr edit` fell back to reading a git remote, found no `.git`, and
          # exited with `failed to run git: fatal: not a git repository`. The `if` then took the
          # else arm exactly as designed and the job reported **pass** with no label applied. The
          # detection step above was never affected because it names the repository explicitly, in
          # `gh api "repos/$REPO/..."`; only this step inferred it. That is the failure the
          # correction of error this label exists to route
          # (`notes/corrections/2026-09-23-the-sweep-that-swept-nothing.md`) is about, arriving in
          # the labeler for that correction: a best-effort step whose swallowed failure is
          # indistinguishable from success.
          REPO: ${{ github.repository }}
        run: |
          # `architect-ruled` or a send-back's `held-by-lane` wins, read live (see architect-label.yml).
          # Inlined rather than calling helpers/architect-ruled.sh because this job never checks the
          # repository out.
          if on="$(gh api "repos/$REPO/issues/$PR_NUMBER" --jq '.labels[].name' 2>/dev/null | grep -xE 'architect-ruled|held-by-lane' | head -1)" && [ -n "$on" ]; then
            echo "coe-label: $on is on PR #$PR_NUMBER; not adding needs-architect." >&2
            exit 0
          fi
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-architect 2>&1; then
            echo "coe-label: needs-architect added (or already present) on PR #$PR_NUMBER"
          else
            echo "coe-label: could not add needs-architect to PR #$PR_NUMBER." >&2
            echo "coe-label: not fatal -- a human reading the diff still sees the new COE file." >&2
          fi
          exit 0

      # **Requirement 5: deliberately no `## What I need from you` comment here.** AGENTS.md pairs
      # the label with that comment and says what makes the comment worth writing: it must be
      # "answerable without reading the diff" and "name the specific ask." A script that only knows
      # a file landed under COE_DIR cannot write that sentence -- it does not know whether the ask
      # is "rule on the root cause," "pick between two proposed action items," or something the
      # author has not framed yet.
      #
      # milestone 251 (a needs-architect label outlives the question that earned it, so the queue lies)
      # already found the analogous automated comment -- an activity/age report on stale
      # `needs-architect` PRs -- has to stop at reporting for the same reason: the tooling cannot
      # tell what a human has and has not actually answered.
      #
      # A generic stub ("A COE was added, please review") would sit on the PR looking like the real
      # thing AGENTS.md asks for while carrying none of its content, which is worse than the
      # silence it would replace: a reader who trusts the convention would stop looking for the
      # author's actual ask. Writing the specific ask stays the COE's author's job, same as it is
      # for every other `needs-architect` PR today.
