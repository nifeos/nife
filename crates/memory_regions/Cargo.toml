[package]
name = "memory_regions"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true
description = "Untyped memory regions for a kernel: page budgets, a bump watermark, subtree ceilings and a single-winner reclaim claim."
keywords = ["no-std", "allocator", "capability", "kernel", "memory"]
categories = ["no-std", "no-std::no-alloc", "os", "memory-management"]

[lints]
workspace = true

[dependencies]
# The generational table the region names are. It is what makes the
# destroy claim single-winner rather than merely first: removing a slot bumps its generation, so the
# loser's name is dead by the time it looks.
generational_table = { version = "0.1.0-pre.3", git = "https://github.com/partsfoundry/generational_table", rev = "832836094b1170f0f07275bb2adbb889d949ccc5" }

# Loom is a dependency of this crate ONLY under `--cfg loom`, which nothing but
# the loom interleaving check sets. Cargo evaluates `cfg(loom)` as false for every real target, so a
# normal `cargo build`, `cargo test`, `cargo clippy` or `cargo tree` never resolves it and never
# compiles a line of it. The only place it is visible is Cargo.lock. This is tokio's own gating pattern, for the same reason.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
