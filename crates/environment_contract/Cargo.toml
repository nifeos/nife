[package]
name = "environment_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The read-only page that carries a process's time zone, locale and terminal type, with a closed list of values each may take"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/environment_contract"
readme = "README.md"
keywords = ["no-std", "environment", "configuration"]
categories = ["no-std", "no-std::no-alloc", "os"]
documentation = "https://docs.rs/environment_contract"
publish = false     # set to true only in the release that publishes

# The inert-configuration contract: the layout of the read-only page that carries TZ, LANG and TERM,
# and the closed, validated list of values each declared key is checked against before it is allowed
# onto the page at all. Pure logic, host-tested, no_std, dependency-free, so whoever assembles the
# page and whoever reads it share ONE definition and cannot drift.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harness.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
