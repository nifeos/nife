[package]
name = "address_space_layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Which band of a process's low half holds what, the same on every architecture, with compile-time checked windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/address_space_layout"
readme = "README.md"
keywords = ["no-std", "address-space", "memory-layout", "kani"]
categories = ["no-std", "memory-management"]
publish = false     # stays until the release that publishes

# The user address-space layout: which band of a process's low half holds what, so every loader,
# runtime, fixture and linker script that places a page derives its address from one table instead
# of choosing a number beside the others. Pure constants and const fns, no_std and dependency-free,
# because the kernel, the userspace loader, the protocol crates that site a page and every fixture
# depend on it.

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
