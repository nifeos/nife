# Name: the block lives in src/lib.rs, where `script/names` reads it.
[package]
name = "subtree_scope"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The rights arithmetic a step narrows with. `no_std` and dependency-free.
file_system_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/file_system_contract", rev = "7577a7d0df339107f75747c3681f5990f116cf61" }
