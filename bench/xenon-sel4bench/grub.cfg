# GRUB configuration for sel4bench on xenon (milestone 127). build.sh embeds this, with one
# configuration's seL4 kernel and sel4benchapp, into one BOOTX64.EFI per configuration.
#
# seL4 on x86 is started by multiboot, which xenon's UEFI firmware does not speak, so GRUB does it:
# multiboot2 under UEFI hands seL4 the ACPI root pointer and memory map boot_sys.c reads.
#
# The serial console is COM1 at 115200, the rate libplatsupport's pc99 serial driver programs, so
# GRUB, seL4 and sel4bench all speak on one line. Entry 0 boots after the timeout with nobody at the
# keyboard, which is why the configuration is chosen by which file is served rather than by a menu:
# script/board-console sends nothing to the board.

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=5
set default=0
source /sel4/variant.cfg

# What clock the core runs at while seL4 does, read just before seL4 starts. sel4bench's x86
# "cycles" are rdtsc ticks, and the TSC runs at the part's nominal clock whatever the core does, so
# a tick is a core cycle only when the core runs at that nominal clock. seL4 writes none of these.
#
# Guarded to the two parts in this comparison, because rdmsr of an MSR a CPU lacks is a #GP that
# GRUB cannot catch, and QEMU's rehearsal CPU lacks several of these.
function clock_probe {
  smbios --type 4 --get-string 16 --set cpu
  echo "probe: variant ${variant}"
  echo "probe: cpu ${cpu}"
  if regexp 'i5-7500T|i7-6700' "${cpu}"; then
    echo -n "probe: msr 0x0ce platform_info     "; rdmsr 0xce
    echo -n "probe: msr 0x1ad turbo_ratio_limit "; rdmsr 0x1ad
    echo -n "probe: msr 0x198 perf_status       "; rdmsr 0x198
    echo -n "probe: msr 0x199 perf_ctl          "; rdmsr 0x199
    echo -n "probe: msr 0x1a0 misc_enable       "; rdmsr 0x1a0
    echo -n "probe: msr 0x770 pm_enable (hwp)   "; rdmsr 0x770
    echo -n "probe: msr 0x08b bios_sign_id      "; rdmsr 0x8b
  else
    echo "probe: not one of the two parts compared; MSRs not read"
  fi
}

menuentry "sel4bench ${variant}" {
  clock_probe
  echo "probe: handing over to seL4"
  multiboot2 /sel4/kernel
  module2 /sel4/sel4benchapp
  boot
}

# Reads IA32_ARCH_CAPABILITIES (0x10a), for someone at xenon's keyboard. If the CPU does not
# enumerate the MSR this is a #GP and GRUB hangs, which is itself the answer.
menuentry "probe: IA32_ARCH_CAPABILITIES (hangs if the CPU lacks it)" {
  echo -n "probe: msr 0x10a arch_capabilities "; rdmsr 0x10a
  echo "probe: bit 0 is RDCL_NO; clear means seL4 refuses a noksw kernel on this CPU"
}
