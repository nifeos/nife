[package]
name = "supervision_contract"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The user address-space map (milestone 206 (a program image has under 896 KiB)): `CHILD_STACK_VA`
# is the map's `STACK_TOP_PAGE_VIRTUAL_ADDRESS`, so neither can move without the other.
address_space_layout = { version = "0.1.0", git = "https://github.com/nifeos/address_space_layout", rev = "2a22dbdb966d50eb98e8c69ccb59d86275cf3065" }
# The window a child's startup page lists, which `ChildEndowment::windows` carries.
startup_page_contract = { version = "0.1.0", path = "../startup_page_contract" }
