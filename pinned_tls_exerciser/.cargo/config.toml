# The same build configuration as cryptography_exerciser/.cargo/config.toml, line for line, because
# this program links the same provider and every line there is load-bearing on at least one
# architecture: `getrandom_backend="custom"` selects `entropy_backend`'s hook, and the six
# portable-backend cfgs keep x86_64-unknown-nife from compiling (or, for `chacha20`, executing) SIMD it
# has no state for. That file carries the reasons; notes/cryptography-provider.md the finding.
#
# Two copies of one list is a foot gun, said here where the second copy is: a cfg added to the
# provider's graph has to be added to both. A `.cargo/config.toml` cannot include another, and
# hoisting these into the repository's root config would apply them to every build in the tree.
[build]
rustflags = [
    "--cfg", "getrandom_backend=\"custom\"",
    "--cfg", "sha2_backend=\"soft\"",
    "--cfg", "polyval_backend=\"soft\"",
    "--cfg", "poly1305_backend=\"soft\"",
    "--cfg", "chacha20_backend=\"soft\"",
    "--cfg", "aes_backend=\"soft\"",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
]
