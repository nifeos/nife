# fixtures: every program and crate that exists to be tested against. Never in a release image.
#
# Milestone 611 (every program and crate belongs to a package). The kind, home and membership are
# provisional, the lane's proposal for calef to ratify; the format is helpers/packages.py's
# header, and notes/package-boundaries.md has the table and the reasons.
#
# Name: ratified 2026-10-28 (calef, relayed by the maintainer, pull request #2872).

name = "fixtures"
kind = "test"
home = { repo = "fixtures", status = "provisional" }
# filesystem_fixture is an interface, not an internal crate, on purpose: the crash injector's word
# and the throughput shapes are test hooks compiled into shipping programs (redoxfs_server links
# it), which is exactly what milestone 886's ruling ordered them to be.
interfaces = ["filesystem_fixture"]
crates = [
    "fixtures",
    # Milestone 886 (the filesystem test fixture moves to its own crate) moved the filesystem test
    # data out of the wire-protocol crate; it is test
    # data, not a contract, so it is here and not in `contracts`.
    "coremark",
    "job_mix",
    "soak_page",
    "c_seam",
    "loaded_image_check",
    "std_exerciser",
    "cryptography_exerciser",
    "pinned_tls_exerciser",
    "fuzz",
]
paths = [
    "packages/greeting.recipe.toml",
    "packages/greeting-riscv64.recipe.toml",
    "packages/greeting-x86_64.recipe.toml",
    "packages/greeting-0.2.0.recipe.toml",
    "packages/greeting-0.2.0-riscv64.recipe.toml",
    "packages/greeting-0.2.0-x86_64.recipe.toml",
    "packages/seeker.recipe.toml",
    "packages/seeker-riscv64.recipe.toml",
    "packages/seeker-x86_64.recipe.toml",
    "packages/seeker-0.2.0.recipe.toml",
    "packages/seeker-0.2.0-riscv64.recipe.toml",
    "packages/seeker-0.2.0-x86_64.recipe.toml",
    "packages/noteless.recipe.toml",
    "packages/noteless-riscv64.recipe.toml",
    "packages/noteless-x86_64.recipe.toml",
    "packages/duet.recipe.toml",
    "packages/duet-riscv64.recipe.toml",
    "packages/duet-x86_64.recipe.toml",
    "packages/solo.recipe.toml",
    "packages/solo-riscv64.recipe.toml",
    "packages/solo-x86_64.recipe.toml",
    "packages/dialer.recipe.toml",
    "packages/servant.recipe.toml",
    "packages/servant-riscv64.recipe.toml",
    "packages/servant-x86_64.recipe.toml",
    "packages/dialer-riscv64.recipe.toml",
    "packages/dialer-x86_64.recipe.toml",
    "packages/reach.recipe.toml",
    "packages/reach-riscv64.recipe.toml",
    "packages/reach-x86_64.recipe.toml",
]
# `redoxfs` since the fuzz-service-handlers lane (2026-10-04 UTC): `fuzz`'s
# `redoxfs_server_session` target links the file server's core and the engine under it, to replay
# client sessions against the dispatch the running server runs.
depends = ["init", "time", "timetable", "network", "host-tools", "redoxfs"]
