name: mutation testing

# Observed failing: 2026-09-28, run 36416663945: shard 4/8 went red with `run FAILED (exit 4): this
#   is a broken run, not a survivor count` when a test binary could not build under the memory
#   ceiling. This records the outcome arm (the run did not happen) firing as written, not the
#   survivor-inflow arm. See notes/observed-failing.md.

# **Would any test notice if this line were wrong?** Asked weekly, of every host crate.
#
# The coverage job answers "did this line run"; cargo-mutants answers the question that suite
# actually exists for, by rewriting one function at a time and rerunning the tests. A survivor is a
# place the code could be wrong with every test staying green. The baseline this reports against
# lives in .cargo/mutants-baseline.txt, with the prose (what each survivor means, and the triage
# rule for new ones) in notes/mutation-testing.md.
#
# **A report, not a gate**, per roadmap 85: the full run costs hours, so it cannot sit on a merge,
# and a new survivor is a worklist entry, not a defect in whatever commit happened to precede the
# weekly cron. It becomes a gate only if these numbers prove stable enough that a new survivor
# deserves to fail something; that decision is on the record there, not here.
#
# Weekly rather than per-push for cost, sharded eight ways for wall clock: the full run is **9,857
# mutants** as of 2026-09-03, each one a build plus a test run, so about 1,230 to a shard. (It was
# ~6,000 when this workflow was written a month earlier, which is the rate this tree grows at and
# the reason the box below is generous.)
#
# **Shards split the mutant list, not the crates, and `round-robin` rather than the default
# `slice`.** Mutant `i` goes to shard `i % 8`, so every shard holds a sample of every crate instead
# of an alphabetical block of a few. Two things follow, and the second is why it changed. The jobs
# finish together instead of one carrying `filesystem_contract` alone, which is what the original
# four-way split was reaching for. And **a lost shard costs an eighth of every crate rather than all
# of a few**: with `slice`, losing shard 1 on 2026-08-31 meant `gpt` and `grant_plan` went entirely
# unmeasured and the surviving report could say nothing about them, where a round-robin loss leaves
# every crate with seven eighths of its mutants and a rate still worth reading.
#
# **The inflow check (milestone 740 (the survivors a merged pull request adds are checked against a triage record)), calef 2026-10-04 UTC: "Yes, build the inflow
# check."** Fatal risk 3's ruled condition is that the survivors each merged pull request adds on its
# own lines are triaged, and until now nothing could tell. Two jobs after the report. `inflow` diffs
# this census against the previous committed survivor list
# (notes/project-metrics/mutation-survivors/), blames each new survivor to the pull request that
# wrote the line, and **fails this run listing any with no row in
# notes/project-metrics/mutation-triage.csv**. It is red on the scheduled run and nowhere else:
# the weekly inflow never sits on a merge; the check that does is the per-pull-request diff gate,
# .github/workflows/mutation-gate.yml (milestone 924 (a survivor on a pull request's own lines
# cannot merge untriaged)).
# `record` then opens a pull request (the App token and the `automation` environment, the way
# metrics.yml does, and for the same reason: a PR opened by GITHUB_TOKEN never starts CI) that adds
# this census's per-crate row to mutation-census.csv and its survivor list, so capture stops
# depending on someone running `script/mutation-census --add-run` before the artifacts expire. It
# records only a complete census (all eight shards, `mutants` green): a partial one is a sample, and
# a lost shard would read as a crate that got better and then worse. The logic is
# helpers/mutation_inflow.py, whose docstring has the key and what counts as inflow.
#
# BUGS: **this workflow had never once succeeded** before milestone 238. Four scheduled runs,
# 2026-08-10 through 2026-08-31, every one red, found by milestone 232's audit (audit every check
# against two questions: does anything run it, and does it block) on 2026-09-03. Two distinct
# causes, and only one of them is fixed here:
#
#  1. **The shard indices were off by one, and that is repaired above.** `--shard 4/4` is not a
#     shard; cargo-mutants counts from zero and rejects k >= n. So one job died in twenty seconds
#     on every run, and shard 0 was never tested at all. `script/mutation` reported this correctly
#     and loudly ("run FAILED (exit 1): this is a broken run, not a survivor count") to a scheduled
#     job that nothing reads, which is the actual defect this milestone is about.
#  2. **The surviving shards are killed by a single runaway mutant exhausting the machine's memory
#     in about twenty seconds.** Measured 2026-09-03, and it is worth reading how, because the
#     first instrumented run said the opposite and was believed for an hour.
#
#     At a 60-second sampling interval the evidence was unambiguous and wrong: shard 0 died 57
#     seconds after a sample showing 14.7 GB of memory available of 16 and 107 GB of disk. Three
#     shards, three samples, no pressure anywhere, so the conclusion drawn was runner eviction that
#     nothing here could fix. **A sampler whose interval is longer than the event reports
#     innocence.** At 10 seconds the same failure looks like this:
#
#         20:35:31  mem_used_mb=1352   mem_avail_mb=14595
#         20:35:41  mem_used_mb=6335   mem_avail_mb=9611
#         20:35:51  mem_used_mb=15763  mem_avail_mb=183
#         20:36:16  The runner has received a shutdown signal
#
#     1.4 GB to 15.8 GB in twenty seconds, then the runner agent dies with the machine and takes
#     every later step with it, `if: always()` included, which is why no artifact survives a
#     terminated shard. **The per-mutant timeout cannot save this**: it is auto-derived at 28 to 51
#     seconds on this tree, and 16 GB is gone well inside that. A mutant that turns a bound into an
#     unbounded allocation is a hang the clock never gets to notice.
#
#     So `-j 2` is not the constraint and lowering it would not help: one runaway takes 14 GB by
#     itself. **This is repaired as of milestone 277**: every mutant's test binary now runs under a
#     4 GiB address-space ceiling, applied per test binary through a cargo runner
#     (`helpers/memory-bounded-runner.sh`, wired up by `script/mutation`). A mutant that allocates
#     without limit now fails its own allocation at 4 GiB and is recorded as an ordinary CAUGHT
#     mutant, in under nine seconds and inside the auto timeout, and the sweep continues. The
#     ceiling is 4.0x the largest honest test binary in the tree (`serial_console`, 1,028 MiB
#     measured across all 143 of them) and 2 x 4 GiB is survivable on a 16 GiB runner, which is what
#     picks 4 rather than a rounder number. cargo-mutants itself offers no memory option at any
#     version this tree has pinned; its whole set of limits is clocks.
#
#     **This BUGS entry stays because the repair is not yet PROVEN here.** It has been demonstrated
#     against a synthetic runaway and measured against the tree's honest suite, both on Linux, but
#     the first green scheduled run of this workflow is the evidence that matters and it has not
#     happened yet. Until one lands, "never once succeeded" is still the true sentence about this
#     file.
#
#     **The round-robin split stays too, and stays damage control, because the honest accounting is
#     that it costs shards to buy a usable report.** Spreading the mutants spreads the runaways too, so more
#     shards meet one: the four-way `slice` run lost 3 of 4, the eight-way round-robin run lost 7 of
#     8. That trade is still worth taking, because the one surviving round-robin shard is a uniform
#     eighth of every crate and yields a rate for the tree (83.4%, against a 92.4% baseline), where
#     a surviving `slice` shard is an alphabetical block that can only speak for the crates inside
#     it. A representative sample beats a complete answer about a fifth of the tree. Anyone
#     reversing this should reverse it by fixing the allocation bound, not by going back to slices.
#
# The cost is not the missing weekly report. `design/fatal-risks/README.md`'s third risk stands at
# MEASURED green on a 2026-08-03 number and closes by saying "the weekly workflow already publishes
# the report", and that sentence is what makes a stale number acceptable. See
# notes/check-inventory.md and notes/mutation-testing.md.

on:
  schedule:
    # 05:00 UTC Monday: after the weekend's quiet, before the toolchain-drift daily at 07:00.
    - cron: "0 5 * * 1"
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, the same decision every workflow here makes: this reads the
# source, runs the tests, and writes nothing but its own artifacts and summary.
permissions:
  contents: read

# A queued weekly run has nothing to say that the newer one will not say better.
concurrency:
  group: mutants
  cancel-in-progress: true

jobs:
  mutants:
    name: "mutants (shard ${{ matrix.shard }}/8)"
    runs-on: ubuntu-24.04-arm
    # A generous box around a run whose cost moves with the tree. Four shards of ~2,465 mutants
    # each as of 2026-09-03; the shard re-runs its own baseline build first, and a few mutants (dtb's walker, the
    # calendar parser) legitimately burn their whole auto-timeout, two minutes and change apiece.
    # Under the 6-hour job ceiling so a hang still fails loudly rather than billing silent hours.
    #
    # **The mutant timeout is the budget item, not the job timeout.** The baseline found 96 mutants
    # that hang rather than fail: a cursor `+=` becoming `-=` in a walker never terminates, so the
    # only thing that ends the run is cargo-mutants' per-mutant timeout. That timeout is auto-derived
    # from each package's own baseline test time (5x it, floor 20s), which on this tree came out at
    # 112 seconds, and 96 of those is nearly three hours of wall clock spent proving that infinite
    # loops are infinite. Sharded four ways that was about 45 minutes a shard when the corpus was
    # ~6,000 mutants, which is why the box below is 330 minutes and not 90. The first shard ever to
    # finish (2026-09-03, shard 3 of 4, 2,462 mutants) took 17m34s, so the box has room to spare.
    #
    # Do NOT remove the auto timeout, and think before overriding it with `--timeout`: too low and a
    # legitimately slow mutant is recorded as a hang it is not, which corrupts the one column of the
    # report that is supposed to mean "the tests noticed". If the hang budget ever needs cutting,
    # cut it by killing the hangs (they are real findings) rather than by shortening the clock.
    timeout-minutes: 330
    strategy:
      # One shard failing (a flaky test, a runner death) should not scrap the other three quarters
      # of the report.
      fail-fast: false
      matrix:
        # **Zero-indexed, because cargo-mutants counts shards from zero.** `--shard k/n` requires
        # k < n, so the old `[1, 2, 3, 4]` was two bugs wearing one costume: `--shard 4/4` was
        # rejected as an invalid argument before a single mutant ran (the twenty-second death on
        # every scheduled run since 2026-08-10), and `--shard 0/4`, the first quarter of the mutant
        # list, was never run at all.
        #
        # The tool's own `--help` is what invited the mistake, and it is worth knowing before
        # touching this line: it reads "specify as e.g. 1/4", which is a valid shard and reads
        # exactly like a one-based first-of-four. Milestone 238.
        #
        # **Eight rather than four, and the reason is damage control rather than speed.** A shard
        # dies when one mutant exhausts the machine's memory (see BUGS above), which eight shards
        # do nothing to prevent. What they change is the cost of a death, and `round-robin` is the
        # half that does the work: a lost shard takes an eighth of every crate rather than all of a
        # few. The measured shard time is about 17 minutes at four ways and the overhead sharding
        # pays is tiny, 3 seconds of baseline build and 6 of test per shard against that. Nothing is
        # measured less; the same 9,857 mutants are attempted, in smaller pieces.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # A prebuilt binary rather than `cargo install`, the same trade the supply-chain and coverage
      # jobs make. The version comes from .cargo-mutants-version so this and script/mutation cannot
      # disagree; cargo-mutants changes which mutants it GENERATES between versions, so an unpinned
      # tool would move the weekly numbers with nothing in the tree having changed.
      - name: Read the pinned cargo-mutants version
        id: mutants
        run: echo "version=$(cat .cargo-mutants-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@${{ steps.mutants.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # script/mutation runs -j 2, and that bound is load-bearing here too: each job holds a full
      # tree copy with its own target/, and the run that established the baseline OOM-killed a
      # 16 GiB machine at -j 4. These runners have no more headroom than that.
      #
      # **The resource line is not noise, it is the only autopsy available.** Three
      # of the four scheduled runs before milestone 238 ended with `The runner has received a
      # shutdown signal` partway through, which terminates the runner agent itself: an `if: always()`
      # step does not get to run, an artifact does not get uploaded, and the log stops at whatever
      # the step had already printed. So the evidence has to be *in the stream* before the death
      # rather than collected after it. `free` and `df` are one line every ten seconds against a job
      # that costs hours, and if the next death is memory or disk the last line before the cut says
      # so instead of leaving another lane to reproduce it.
      #
      # **Ten seconds rather than sixty, because sixty was measured and was too coarse.** On the
      # first instrumented run (2026-09-03) shard 1 died 41 seconds after its last sample, and that
      # sample showed 10.7 GB of memory free and 107 GB of disk: no pressure at all by the only
      # evidence available, and yet the previous sample a minute before that showed usage climbing
      # from 929 MB to 5,259 MB in sixty seconds. A sampler whose interval is longer than the event
      # it is watching for reports innocence, which is worse than reporting nothing.
      #
      # Read it with the run's own conclusion: a `cancelled` step plus a falling `available` column
      # is the runner being reclaimed for resource exhaustion, and a flat one is the host reclaiming
      # the VM for its own reasons, which is not something this repository can fix.
      - name: Run this shard of the mutants
        run: |
          while true; do
            echo "[resource] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "mem_used_mb="$3" mem_avail_mb="$7}') $(df -m --output=avail / | tail -1 | awk '{print "disk_avail_mb="$1}')"
            sleep 10
          done &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          script/mutation --shard ${{ matrix.shard }}/8 --sharding round-robin

      # Uploaded even when the step above hiccups: a partial report beats none, and the report job
      # below states which shards it actually saw.
      - name: Upload this shard's outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/*.txt
            mutants.out/outcomes.json
          if-no-files-found: warn

  report:
    name: report against the baseline
    needs: mutants
    # `always()`: three shards of survivors are still a report worth publishing when the fourth
    # died; the summary names the shards it aggregated.
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download every shard's outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-shard-*
          path: shards
      # **Find the run directories by what is in them, not by where they were meant to land.**
      # `set -- shards/mutants-shard-*` looked obviously right and had a failure mode nobody would
      # guess: `download-artifact` gives each artifact its own subdirectory when it fetches several,
      # and unpacks a LONE artifact flat into `path` instead. So the glob matched nothing, stayed
      # literal, and `script/mutation --report` said "no run output at shards/mutants-shard-*" and
      # exited 2 -- **only in the case where exactly one shard survived**, which is precisely the
      # case this job's `if: always()` exists to serve. It cost the one real report the 2026-09-03
      # run produced, and would have cost 2026-08-24's too.
      #
      # A search for `caught.txt` is indifferent to both layouts and to any future third one.
      - name: Publish the per-crate report
        run: |
          dirs=$(find shards -name caught.txt -exec dirname {} \; 2>/dev/null | sort -u)
          {
            echo '### Mutation testing: host crates'
            echo
            if [ -z "$dirs" ]; then
              echo '**No shard produced any output.** Every one of the four either failed before'
              echo 'testing a mutant or was terminated before it could upload. There is no report'
              echo 'to give, and that is the finding: see this workflow header, milestone 238.'
            else
              # shellcheck disable=SC2086  # $dirs is a deliberately word-split list of directories
              set -- $dirs
              echo "aggregated from: $* ($# of 8 shards)"
              echo
              echo '```'
              script/mutation --report "$@"
              echo '```'
              echo
              echo 'Baseline: `.cargo/mutants-baseline.txt`; triage rule and survivor prose:'
              echo '`notes/mutation-testing.md`. A survivor here is a worklist entry, not a failure.'
              echo
              echo '**A partial report is a partial number.** The shards are alphabetical slices of'
              echo 'the mutant list, not random samples, so a rate computed from some of them says'
              echo 'nothing about the whole corpus and must not be compared to the baseline total.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The inflow check (see the header). Its own job so that the report above stays a report: this
  # one is allowed to be red, and a red job here means "untriaged survivors", not "the census broke".
  inflow:
    name: inflow against the triage record
    needs: mutants
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      complete: ${{ steps.shards.outputs.complete }}
      census: ${{ steps.shards.outputs.census }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: the blame walks every commit that wrote a new survivor's line, and
      # `merge-base --is-ancestor` needs the previous census's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download every shard's outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Is this a complete census?
        id: shards
        run: |
          n=$(find shards -name missed.txt 2>/dev/null | wc -l | tr -d ' ')
          census=$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq '.createdAt[:10]')
          echo "census=$census" >> "$GITHUB_OUTPUT"
          if [ "$n" = "8" ] && [ "${{ needs.mutants.result }}" = "success" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Mutation inflow: not checked'
              echo
              echo "$n of 8 shards uploaded outcomes and the mutants job concluded \`${{ needs.mutants.result }}\`."
              echo 'A partial census is a sample, so it is neither diffed nor recorded (helpers/mutation_inflow.py).'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # `continue-on-error` so the survivor list is uploaded even when the check is red: the list is
      # the evidence for what the next triage lane works from.
      - name: Check the new survivors against the triage record
        id: check
        if: steps.shards.outputs.complete == 'true'
        continue-on-error: true  # outcome: re-raised
        run: |
          mapfile -t dirs < <(find shards -name missed.txt -exec dirname {} \; | sort)
          python3 helpers/mutation_inflow.py check \
            --census "${{ steps.shards.outputs.census }}" --run "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" \
            --snapshot-out "inflow/${{ steps.shards.outputs.census }}.csv.gz" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${dirs[@]}"

      - name: Keep this census's survivor list
        if: steps.shards.outputs.complete == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-inflow
          path: inflow/
          if-no-files-found: error

      - name: Fail if any inflow survivor is untriaged
        if: steps.check.outcome == 'failure'
        run: |
          echo "Untriaged inflow survivors: the list is in this run's summary."
          echo "Add a row per survivor to notes/project-metrics/mutation-triage.csv (notes/mutation-testing.md, the ledger)."
          exit 1

  # Appends this census to the tree through a pull request, never a push to main (metrics.yml's
  # argument: a record other people quote is irreversible once it lands unreviewed). The environment's
  # deployment branches are `main` only, so a dispatch from another branch skips this job.
  record:
    name: record this census
    needs: inflow
    if: always() && needs.inflow.outputs.complete == 'true' && github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # **The App is optional** (milestone 889 (the tree's gates stop depending on the fleet tooling),
    # provisional), as in toolchain-bump.yml, which has the full argument. With the App's secrets
    # absent (a fork, or a repository the App is not installed on) the token step is skipped and
    # every `steps.app-token.outputs.token || github.token` below falls through to the ephemeral
    # token. That token pushes the branch but may not open a pull request, so the run ends green
    # with the compare link in its summary (helpers/pull-request-by-hand.sh). The secrets context is not readable in a step's
    # `if`, so only the App ID is lifted here, and only so its presence can be tested.
    env:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
    steps:
      - name: Mint an installation token for the automation App, when it is installed
        id: app-token
        if: env.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-shard-*
          path: shards

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-inflow
          path: inflow

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # Who the pull request's opening line names: the App, or the fallback above.
          PR_AUTHOR: ${{ steps.app-token.outputs.token && 'nife-smelter[bot]' || 'github-actions[bot]' }}
          # Non-empty only when the App's token was minted; see the push-only branch below.
          USING_APP: ${{ steps.app-token.outputs.token && 'yes' || '' }}
          CENSUS: ${{ needs.inflow.outputs.census }}
        run: |
          set -e
          mapfile -t dirs < <(find shards -name caught.txt -exec dirname {} \; | sort)
          script/mutation-census --add "$CENSUS" "$GITHUB_RUN_ID" "${dirs[@]}"
          mkdir -p notes/project-metrics/mutation-survivors
          cp "inflow/$CENSUS.csv.gz" notes/project-metrics/mutation-survivors/
          if git diff --quiet -- notes/project-metrics && [ -z "$(git ls-files --others --exclude-standard notes/project-metrics)" ]; then
            echo "Nothing to record."
            exit 0
          fi
          branch="mutation/census"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add notes/project-metrics
          git commit -m "mutation census: record $CENSUS (run $GITHUB_RUN_ID)

          Per-crate rows for mutation-census.csv and the survivor list the next census is diffed
          against, from the scheduled workflow's own artifacts, which expire in about 90 days."
          git push --force origin "$branch"
          body="**Lane:** $branch, opened by a scheduled workflow; $PR_AUTHOR is the author GitHub shows.

          Records the $CENSUS mutation census ([run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)): one row per crate in \`mutation-census.csv\` and the survivor list \`mutation-survivors/$CENSUS.csv.gz\`. Append-only; nothing from a past census changes."
          # No App token: push only, and leave the pull request to a person (calef's ruling on
          # #2442, 2026-10-20 UTC). `github.token` may not open one, and the repository setting
          # that would let it stays off. The summary carries the compare link, title and body.
          if [ -z "$USING_APP" ]; then
            helpers/pull-request-by-hand.sh "$branch" "mutation census: record $CENSUS" "$body"
            exit 0
          fi
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title "mutation census: record $CENSUS" --body "$body"
          else
            gh pr edit "$existing" --title "mutation census: record $CENSUS" --body "$body"
          fi
