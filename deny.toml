# cargo-deny: the supply-chain gate (milestone 42).
#
# The thesis is that this kernel confines code it did not write (DECISIONS §14, §27, §31). Not
# knowing when that code has a published advisory was an odd blind spot for a project making that
# claim, and licence obligations stop being cosmetic the moment milestone 39 ships a distribution.
#
# One config for four workspaces. The tree has four cargo workspaces on purpose (the main one,
# redoxfs_server, tools/redoxfs_host, and the vendored engine), so `script/supply-chain` runs cargo-deny
# once per manifest with `--config deny.toml`. One policy, applied everywhere, is the point: a
# licence we would refuse in the kernel is not acceptable in the host tooling either.

[graph]
# Only targets we actually build. This is a deliberate narrowing, not laziness: cargo-deny defaults
# to every target in the universe, which drags `windows-sys`, `wasi`, and the whole redox-native
# side of RedoxFS into the licence and advisory verdict for code that never enters a build here.
# An advisory against a crate we do not compile is not a finding, it is noise, and noise is how an
# alert list becomes wallpaper (DECISIONS §35).
#
# Three bare-metal targets (the kernel, user, and the EL0 redoxfs_server binary) and three hosts
# (the Apple Silicon dev machine, CI's aarch64 Linux runner, and an x86_64 Linux contributor).
#
# `x86_64-unknown-none` joined on 2026-09-23, and the history is the useful part of this comment.
# The array carried a scope note reading "x86_64 bare metal is declared in §19 (architectural
# parity is a tenet; the targets are aarch64, riscv64, and x86_64) but not started; it joins this
# list when it does". It started: milestone 161 (the x86_64 kernel port) brought up the third
# architecture and nothing widened this, so a reader who checked was told a gap was tracked while
# cargo-deny had never resolved that target's graph, and a crate reached only under
# `cfg(target_arch = "x86_64")` got no advisory, licence, or ban verdict. A stale scope note is
# worse than an absent one, because it answers the question a careful reader came to ask.
#
# BUGS: **TOML cannot call a script**, so unlike the `rustup target add` lists in `script/`, which
# milestone 186 (derive the architecture list) derived from `rust-toolchain.toml`, this copy stays
# hand-maintained and a fourth architecture will not appear here on its own. The UEFI targets in that pin are deliberately not
# here: exactly one crate builds for them, so resolving the whole graph against them would assert
# something untrue about every other crate, which is the same judgment `script/drift` makes when it
# selects the `*-none` subset for its workspace build.
targets = [
    "aarch64-unknown-none-softfloat",
    "riscv64imac-unknown-none-elf",
    "x86_64-unknown-none",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Evaluate every feature, not just the default set. redoxfs_server's `el0` feature and RedoxFS's `std`
# pull different dependency graphs, and a feature nobody's default build enables is exactly where an
# unexamined dependency would hide.
all-features = true

[advisories]
version = 2
# Yanked means the publisher withdrew it. Warning about that is the wrong strength: a yanked crate in
# a committed lockfile is a build that will stop resolving, and we would rather learn it here.
yanked = "deny"
# "all", not the default "workspace": an unmaintained crate three levels down is still the one whose
# next CVE nobody will fix. If this ever fires on something we cannot move off, the answer is an
# `ignore` entry below WITH a written reason, per §35's rule that a dismissal is an argument.
unmaintained = "all"
# **One entry, and it is the tree's first.** Every entry here is a known-vulnerable dependency we
# have decided to keep, so each one carries the sentence that says why, in the `reason` field
# rather than only in a comment: cargo-deny prints `reason` in its own output, so the argument
# travels with the finding instead of living in a file the reader may not open.
#
# Keep this list short, and read the entry below as the shape the next one should take: a **bounded
# claim about a path we do not call**, with what would end it, rather than a dismissal.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "The Marvin attack is a timing side channel in RSA PKCS#1 v1.5 DECRYPTION, which recovers a private key from an oracle that decrypts attacker-chosen ciphertexts. This tree uses `rsa` in exactly one place, `cryptography_provider`'s certificate and handshake signature verification, which performs public-key operations only: it holds no RSA private key, decrypts nothing, and has no oracle to offer. The advisory names a path we do not call. THIS STOPS BEING TRUE the moment anything here decrypts with `rsa`, signs with it, or uses RSA key transport; TLS 1.3 has no RSA key exchange, so the provider being TLS 1.3 only is part of what holds this claim up. Taken on calef's ruling of 2026-09-20 (\"Take rsa\") because `objects.githubusercontent.com` serves RSA 2048 and `ghcr.io` RSA 4096, so a client without RSA verification can reach GitHub and not download from it. See DECISIONS §198 (the glue is ours, the primitives are not) and notes/cryptography-provider.md." },
]

[licenses]
version = 2
unused-allowed-license = "allow"
# nife is MIT OR Apache-2.0 (see Cargo.toml, LICENSE-MIT, LICENSE-APACHE). The allow-list is
# what a dependency may offer such that our dual licence still holds downstream. It is an allow-list
# rather than a deny-list because the failure we care about is a licence nobody looked at, and only
# an allow-list makes the unexamined case loud.
allow = [
    "MIT",
    "Apache-2.0",
    # LLVM's Apache-2.0 exception. Carried by `wasi` and by the compiler-support crates; it only
    # relaxes the Apache terms around binary redistribution, so it is strictly easier than Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    # `subtle` (constant-time primitives, under RedoxFS's encryption path) is BSD-3-Clause only.
    # Permissive, attribution plus a no-endorsement clause; compatible with shipping under either
    # half of our dual licence.
    "BSD-3-Clause",
    # `smoltcp` and `managed`, milestone 26's TCP/IP stack. 0BSD is public-domain-equivalent: no
    # attribution required at all.
    "0BSD",
    # **ISC, arriving with the TLS provider.** That is milestone 442 (a crypto provider `rustls`
    # can use on all three bare-metal targets). `rustls-webpki` and `untrusted` are ISC-only, and both are
    # on the certificate-verification path rather than beside it, so this is a shipped licence and
    # not a tooling one. ISC is OpenBSD's licence and the FSF treats it as equivalent to a
    # simplified BSD: permissive, attribution, no endorsement clause, no copyleft, and strictly
    # easier than the Apache half of our own pair. `rustls` itself offers ISC among three and
    # satisfies the list through MIT; these two offer nothing else.
    #
    # **Approved by calef on 2026-09-20**, with the reasoning above put to him: permissive,
    # no copyleft, and strictly easier than the Apache half of the pair this tree publishes under.
    "ISC",
]

# **NCSA, for `libfuzzer-sys` and nothing else** (milestone 42's fuzzing leg). An exception rather
# than an allow-list entry, so it is scoped to the one crate that needs it: a second crate arriving
# with NCSA would still stop the build and get looked at, which is the whole reason this file uses an
# allow-list.
#
# The licence is not a compromise. NCSA (University of Illinois/NCSA Open Source) is OSI approved and
# FSF free, and reads as BSD-3-Clause and MIT stapled together: permissive, attribution, no
# endorsement, no copyleft. `libfuzzer-sys` carries it because it vendors LLVM's libFuzzer C++ source,
# which is where the runtime actually comes from; the Rust half is the usual MIT OR Apache-2.0.
#
# It is also the narrowest possible exposure. Nothing that boots links it: the fuzz workspace is
# excluded from the main one, produces no artifact this project ships, and is built only by
# `script/fuzz` and the CI job of the same name.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# **Unicode-3.0, approved by calef on 2026-09-20 and scoped to the one crate that needs it.**
# `unicode-ident` carries `(MIT OR Apache-2.0) AND Unicode-3.0` and reaches this tree only through
# `syn`, a proc-macro dependency that runs on the build host and is never linked into a nife
# program. The licence is permissive, covering Unicode's character tables rather than code, with
# attribution and no copyleft.
#
# **Why an exception rather than a row in `allow` above, which is a ships-versus-builds question
# calef asked on 2026-09-20.** The list above is what this project accepts in code it *distributes*;
# obligations attach to distribution, and nothing here distributes `unicode-ident`. A second global
# list for build-only licences was considered and refused: cargo-deny cannot split a graph by
# dependency kind (it offers `--exclude`, `--exclude-dev` and `--exclude-unpublished`, and nothing
# for build dependencies), so a two-list scheme would mean computing the shipped graph ourselves
# from `cargo metadata` and keeping that classifier right, which is machinery to be wrong in for a
# problem this file already solves.
#
# **The per-crate exception is strictly tighter than a global row**, which is the argument for it
# rather than merely the argument against the alternative: it fails closed. A different crate
# arriving tomorrow under Unicode-3.0 is refused until somebody decides about that crate, where a
# global row would have admitted it silently. The cost is one entry per build-only crate, and that
# cost is the mechanism working: a decision per crate rather than per licence.
[[licenses.exceptions]]
crate = "unicode-ident"
allow = ["Unicode-3.0"]
# NOT allowed, and the reason is worth stating rather than leaving as an absence: anything copyleft.
# `r-efi` offers `MIT OR Apache-2.0 OR LGPL-2.1-or-later` and resolves cleanly because MIT is on the
# list; a crate offering LGPL *only* would fail here, which is the intended behaviour for a kernel
# people are meant to be able to vendor.

# One warning is expected on every run and is not a defect: the vendored engine publishes
# `license-file = "LICENSE"` instead of an SPDX expression, so cargo-deny emits `no-license-field`
# before reading the file and identifying it as MIT (which it then accepts; `licenses ok`). A
# `[[licenses.clarify]]` entry is the usual answer and is deliberately NOT used here: its whole value
# is pinning the licence file's bytes, and script/vendor-verify already pins every byte of
# vendor/redoxfs against the published tarball, which is the stronger check of the two.

[bans]
# A duplicate version is not a licence problem, it is a "which copy got audited" problem, and on a
# bare-metal target it is also image size: two copies of a crate link twice.
multiple-versions = "deny"
# A `version = "*"` dependency from a registry is a pin that is not a pin. We have none, and this is
# what keeps it that way.
wildcards = "deny"
# An in-tree `path` dependency with no version is not a version range at all: it resolves to the
# bytes in this repository, which the git history pins far more tightly than semver would. Several
# of ours are written that way (redoxfs_server -> ../vendor/redoxfs, redoxfs_host -> the same), and the
# check that matters, "is this really upstream 0.9.1", is script/vendor-verify's job, not semver's.
allow-wildcard-paths = true

# `rayon` is ruled for one package: `std_exerciser`, as milestone 812 (`std::thread::spawn` runs
# real threads in one address space)'s exit test (calef on pull request #1892, 2026-10-10 UTC, §46
# (thin primitives or whole subsystems)). Nothing in the kernel or the image's services may take it.
# A `wrappers` list makes cargo-deny refuse the crate when anything else depends on it directly, in
# every graph `script/supply-chain` checks, so a second consumer is a red gate, not a review catch.
deny = [
    { crate = "rayon", wrappers = ["std_exerciser"], reason = "ruled for std_exerciser only (#1892)" },
    { crate = "rayon-core", wrappers = ["rayon"], reason = "reached only through rayon (#1892)" },
]

skip = [
    # RedoxFS 0.9.1 depends on getrandom 0.2 directly while its uuid 1.x pulls getrandom 0.4. Both
    # are host-side only: the bare-metal redoxfs_server builds the engine `--no-default-features`, where
    # neither is present (creation APIs are std-gated, roadmap §32 port plan item 4). Nothing we
    # wrote chose either version, and moving off it means advancing the vendored pin, which is a
    # deliberate re-vendor (vendor/README.md) rather than a config change. Drops when the pin does.
    { crate = "getrandom@0.2.17", reason = "redoxfs 0.9.1's direct dep; uuid pulls 0.4. Host-side only; goes away with the next redoxfs pin" },
    # smoltcp 0.14 is built on bitflags 1, and pulldown-cmark (`documentation`'s parser, ruled
    # 2026-10-20 UTC for milestone 784 item (f2)) on bitflags 2. Both are in `components`. Neither
    # version is ours to choose, and bitflags is macros over an integer, so two copies cost compile
    # time and no behavior. Drops when smoltcp takes bitflags 2.
    { crate = "bitflags@1.3.2", reason = "smoltcp 0.14's; pulldown-cmark takes 2.x. Goes away when smoltcp moves to bitflags 2" },
]

[sources]
# Where code is allowed to come from. This is the check that would notice a dependency quietly
# repointed at somebody's fork, which is the shape most real supply-chain attacks on a small project
# would take. Everything here is crates.io, an in-tree path, or a git repository in the nifeos
# organization pinned by `rev` to a commit that has landed on its main (DECISIONS §305 (git dependencies are allowed on `nifeos/*` only, pinned to a landed commit)). A git
# dependency anywhere else stays refused.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# cargo-deny warns "no crate source fell under this organization" until the first git dependency
# exists; the warning is expected and not a failure.
[sources.allow-org]
github = ["nifeos"]
