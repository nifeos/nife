# The std demo workload (milestone 27): ordinary Rust, no attributes, no `no_std`, built for the
# `*-unknown-nife` custom targets with `-Zbuild-std` against the patched rust-src that carries
# the nife PAL (patches/std-nife; `cargo xtask std-src`).
#
# Deliberately NOT a member of the main workspace: it builds under the linked `nife-dev`
# toolchain with build-std flags the workspace crates must never inherit, and its target dir is
# its own. `cargo xtask std-exerciser` is the front door.

# Name: recorded (program `allocator_exerciser`, ratified 2026-08-01 by calef in milestone 63).
# The `_exerciser` half is not this package's coinage and was argued at length: 63 turned down
# `demo` as a suffix anywhere, on the ground that "exercise" is this tree's own verb, that memory,
# bus and disk exercisers have meant this for decades in real systems vocabulary, and that a demo
# shows something off where an exerciser puts a subsystem under load and sees whether it holds.
# That is exactly what this package does to `std` on nife. `std` is the standard library's own
# name. This is also the package the `script/names` blind spot was found through: it sat here for
# weeks answering "neither a name in the tree nor a recorded refusal", because the tool only
# looked in `crates/`, `components/src/`, `fixtures/src/` and `script/`. no architect has ratified it.

[package]
name = "std_exerciser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Not publishable, which is what lets `deny.toml`'s `allow-wildcard-paths` cover the in-tree path
# dependencies below once `script/supply-chain` checks this graph (milestone 812, for `rayon`).
publish = false

[workspace]

# The FS-service contract's shared fixture (the file the test image ships and its exact bytes), so
# the demo, the host image builder, and the kernel test agree on one definition. `filesystem_contract` is
# `no_std` and dependency-free, and the demo touches only its `fixture` module: it does NOT speak
# the wire protocol, because that is `std::fs`'s job now (the whole point of this milestone).
[dependencies]
filesystem_contract = { path = "../crates/filesystem_contract" }
filesystem_fixture = { path = "../crates/filesystem_fixture" }

# The socket contract's shared fixture (milestone 64's inbound half): the port the runners forward
# a host port to, the port no test grants, and the two strings the gate trades. Same reasoning as
# `filesystem_contract` above and rule 7's: a port number two binaries agree on is a crate. The demo touches
# only `socket_contract::fixture` and never the wire constants, because speaking the wire is
# `std::net`'s job now, which is this milestone's whole point.
socket_contract = { path = "../crates/socket_contract" }

# Milestone 121 (`ripgrep` on nife: enumeration as a capability)'s walk pricing: plain `std::fs` code that runs unchanged on a host, so the walk
# priced through a granted directory here is the same function a host comparison prices. It
# depends on `filesystem_contract` alone, for the priced tree's shape.
walk_pricing = { path = "../crates/walk_pricing" }

# `std_echo`'s manifest note (milestone 205 (how a foreign program is told what to do)): the note's
# encoding and the manifest it encodes, both no_std, so a `std` program carries one the same way a
# native program does.
grant_plan = { path = "../crates/grant_plan" }
capability_manifest_note = { path = "../crates/capability_manifest_note" }

# `std_resolve`'s names (milestone 801 (packages over the internet)): the resolver test's cases, so
# this program and the native client of milestone 384 (in a capability system the resolver is a
# grant) are judged against one zone. `no_std`, and its one
# dependency, `domain_name_system`, is too.
domain_name_resolution_contract = { path = "../crates/domain_name_resolution_contract" }

# `std_rayon`'s parallel sum (milestone 812 (`std::thread::spawn` runs real threads in one address
# space)'s exit test). Unmodified, from crates.io, and a dependency of this package only: calef
# ruled (a) on pull request #1892, 2026-10-10 (UTC), under §46 (thin primitives or whole
# subsystems). `deny.toml`'s `[bans]` refuses `rayon` and `rayon-core` in every other graph
# `script/supply-chain` checks, and this manifest is one of those graphs.
rayon = "1.11"

# The kernel's ELF loader maps whole pages per segment and the initial ramdisk carries the file;
# keep the binary small and the build deterministic.
# Overflow checks in release, ruled by calef 2026-10-04 (UTC) (notes/overflow-checks.md, option A).
# The shipped build now means by `a + b` what every tested build means: an overflow halts rather
# than wraps into a quiet wrong answer. Where a hot path wants a wrap, it says so at the site with
# `wrapping_*` and a reason.
# This profile also builds the `std` under the program (`-Zbuild-std`), so the checks cover it.
[profile.release]
overflow-checks = true
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"
