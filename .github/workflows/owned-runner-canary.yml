name: owned runner canary

# Observed failing: 2026-11-03, by script: a failing canary needs an owned runner that is down or
#   an egress host that is blocked, which cannot be staged from a branch. helpers/owned_runner_check.py
#   --selftest plants the two ways a workflow can send an owned job where it must not go (a
#   pull_request trigger, and a missing merge_group/push guard) and requires both to fail; the real
#   first run after merge is the first observation of the canary itself. The isolation jobs
#   (canary-owned-write, -check, -isolation) follow the same rule: a leak needs a dirty owned slot,
#   which a branch cannot stage, and the selftest also requires an unguarded matrix job to fail.
#   notes/owned-runners.md.

# **Monitoring of the owned runners beside their hosted twin.** It gates nothing, but the flip to
# owned runners waits for it: canary-owned (strict image checks) and canary-owned-dry-run must be
# green on the pool first, and a maintainer reads these summaries after the flip too. Both jobs run the
# same steps on the merge queue and on `main`, never on a pull request: the owned host admits
# nothing else. `canary-owned` also checks the container's walls (no direct egress past the proxy,
# no container-engine socket) and prints a FINDING for each one that is open. `canary-owned` is strict and
# fails on any FINDING; none of the canary jobs is a required check, so none can fail the queue. Names are provisional.
# notes/owned-runners.md is the runbook.

on:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canary-owned:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: [nife-owned-x86_64]
    timeout-minutes: 15
    steps:
      - name: Start clock
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/canary-start"
          : > "$RUNNER_TEMP/canary-fetch-failures"
      - name: Probe
        env:
          CANARY_KIND: owned
        shell: bash
        run: |
          set +e
          set -o pipefail
          start=$(date +%s)
          {
            echo "## canary-owned"
            echo '```'
            echo "kind: $CANARY_KIND"
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "hostname: $(hostname)"
            echo "id: $(id)"
            if test -w /dev/kvm; then echo "kvm: writable"; else echo "kvm: NOT writable"; fi
            qemu-system-x86_64 --version 2>&1 | head -1 || echo "qemu: missing"
            if command -v cargo >/dev/null 2>&1; then cargo --version; else echo "cargo: not installed"; fi
            for url in https://index.crates.io/config.json https://api.github.com; do
              t=$(date +%s)
              code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$url" 2>&1)
              echo "curl $url: $code ($(( $(date +%s) - t )) s)"
              if test "$code" != 200; then
                host=${url#https://}; host=${host%%/*}
                echo "$host: $code" >> "$RUNNER_TEMP/canary-fetch-failures"
              fi
            done
            echo "total: $(( $(date +%s) - start )) s"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # The summary is the record; the verdict comes from the same facts.
          test -w /dev/kvm && command -v qemu-system-x86_64 >/dev/null
      # The image, from inside: the stage 1 jobs need a Rust toolchain, an apt that uses the proxy
      # and a pip that reaches its index. A FINDING here fails this job, which cannot fail the
      # queue; it is what a maintainer reads before flipping NIFE_RUNNER_OWNED (notes/owned-runners.md).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        shell: bash
        run: |
          if command -v rustup >/dev/null 2>&1; then
            helpers/rustup-retry.sh toolchain install
          else
            echo "rustup is not installed; the image check below names it"
          fi
      - name: Image
        if: always()
        shell: bash
        run: |
          # The wrapper exits 1 for a non-zero probe or any FINDING line, and keeps the verdict out of a pipe.
          helpers/owned-canary-image.sh tools toolchain apt-proxy pip
      # The container's walls, from inside: egress must go through the proxy, and no socket may
      # hand the job a container engine (which is the host). Each open wall is a FINDING and fails
      # this job, which cannot fail the queue.
      - name: Walls
        if: always()
        shell: bash
        run: |
          set +e
          open=0
          {
            echo "### walls: canary-owned"
            echo '```'
            if curl -sS -o /dev/null -m 10 --noproxy '*' https://api.github.com 2>/dev/null; then
              echo "FINDING direct egress: api.github.com answered with the proxy bypassed"; open=1
            else
              echo "direct egress: refused (traffic must use the proxy)"
            fi
            for s in /var/run/docker.sock /run/docker.sock /run/podman/podman.sock \
                     "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" /run/containerd/containerd.sock; do
              if test -S "$s"; then echo "FINDING engine socket: $s"; open=1; fi
            done
            test "$open" = 1 || echo "engine sockets: none"
            echo '```'
          } >"$RUNNER_TEMP/canary-walls" 2>&1
          # No pipe: open=1 above lives in this shell, so the verdict below sees it.
          tee -a "$GITHUB_STEP_SUMMARY" <"$RUNNER_TEMP/canary-walls"
          test "$open" = 0
      - name: Resources
        if: always()
        env:
          CANARY_JOB: canary-owned
        shell: bash
        run: |
          set +e
          start=$(cat "$RUNNER_TEMP/canary-start" 2>/dev/null || date +%s)
          {
            echo "### resources: $CANARY_JOB"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "wall: $(( $(date +%s) - start )) s"
            free -m
            if test -r /sys/fs/cgroup/memory.peak; then
              echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
            else
              echo "cgroup memory.peak: absent"
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo absent)"
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo absent)"
            fi
            echo "df: HOME=$HOME, /tmp, slot volume=${GITHUB_WORKSPACE:-.}"
            df -h "$HOME" /tmp "${GITHUB_WORKSPACE:-.}"
            echo '```'
            if test -s "$RUNNER_TEMP/canary-fetch-failures"; then
              echo "fetch failures (host: status):"
              sed 's/^/- /' "$RUNNER_TEMP/canary-fetch-failures"
            else
              echo "fetch failures: none recorded"
            fi
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # The dry run: the setup steps of every job the runs-on expression can place on the pool, run on
  # the owned label without their real work, so the image can be proven before NIFE_RUNNER_OWNED
  # is set. crate-probes: the pinned toolchain. KVM: the same step the QEMU jobs run, then a VM created. prove: Kani. swish-check-x86_64 and bench: the QEMU
  # cache and the build-or-skip decision, and what a cold build fetches (apt, the source tarball,
  # pip). Every step runs even after an earlier one fails, so one run names everything missing. It
  # reports and never blocks.
  canary-owned-dry-run:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: [nife-owned-x86_64]
    continue-on-error: true  # outcome: exception, the dry run reports on the image and must never block the queue
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain (crate-probes)
        shell: bash
        run: helpers/rustup-retry.sh toolchain install
      - name: Toolchain
        if: always()
        shell: bash
        run: |
          bad=0
          helpers/owned-image-probe.sh tools || bad=1
          helpers/owned-image-probe.sh toolchain || bad=1
          test "$bad" = 0
      - name: Open /dev/kvm to the runner user
        if: always()
        run: helpers/open-kvm.sh
      - name: A VM can be created on /dev/kvm
        if: always()
        shell: bash
        run: helpers/owned-image-probe.sh kvm
      - name: Install Kani (prove)
        if: always()
        shell: bash
        run: script/kani-install
      - name: Cache QEMU (swish-check-x86_64, bench)
        if: always()
        id: qemu-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-ubuntu-26.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: The QEMU build-or-skip decision
        if: always()
        shell: bash
        env:
          QEMU_CACHE_HIT: ${{ steps.qemu-cache.outputs.cache-hit }}
        run: helpers/owned-image-probe.sh qemu
      - name: What a cold QEMU build fetches (apt, source tarball, pip)
        if: always()
        shell: bash
        run: |
          bad=0
          helpers/owned-image-probe.sh apt-proxy || bad=1
          helpers/owned-image-probe.sh qemu-fetch || bad=1
          test "$bad" = 0

  canary-hosted:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Start clock
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/canary-start"
          : > "$RUNNER_TEMP/canary-fetch-failures"
      - name: Probe
        env:
          CANARY_KIND: hosted
        shell: bash
        run: |
          set +e
          set -o pipefail
          start=$(date +%s)
          {
            echo "## canary-hosted"
            echo '```'
            echo "kind: $CANARY_KIND"
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "hostname: $(hostname)"
            echo "id: $(id)"
            if test -w /dev/kvm; then echo "kvm: writable"; else echo "kvm: NOT writable"; fi
            qemu-system-x86_64 --version 2>&1 | head -1 || echo "qemu: missing"
            if command -v cargo >/dev/null 2>&1; then cargo --version; else echo "cargo: not installed"; fi
            for url in https://index.crates.io/config.json https://api.github.com; do
              t=$(date +%s)
              code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$url" 2>&1)
              echo "curl $url: $code ($(( $(date +%s) - t )) s)"
              if test "$code" != 200; then
                host=${url#https://}; host=${host%%/*}
                echo "$host: $code" >> "$RUNNER_TEMP/canary-fetch-failures"
              fi
            done
            echo "total: $(( $(date +%s) - start )) s"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # The hosted twin reports the same facts but never fails: it is the reference.
          true
      - name: Resources
        if: always()
        env:
          CANARY_JOB: canary-hosted
        shell: bash
        run: |
          set +e
          start=$(cat "$RUNNER_TEMP/canary-start" 2>/dev/null || date +%s)
          {
            echo "### resources: $CANARY_JOB"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "wall: $(( $(date +%s) - start )) s"
            free -m
            if test -r /sys/fs/cgroup/memory.peak; then
              echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
            else
              echo "cgroup memory.peak: absent"
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo absent)"
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo absent)"
            fi
            echo "df: HOME=$HOME, /tmp, slot volume=${GITHUB_WORKSPACE:-.}"
            df -h "$HOME" /tmp "${GITHUB_WORKSPACE:-.}"
            echo '```'
            if test -s "$RUNNER_TEMP/canary-fetch-failures"; then
              echo "fetch failures (host: status):"
              sed 's/^/- /' "$RUNNER_TEMP/canary-fetch-failures"
            else
              echo "fetch failures: none recorded"
            fi
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"


  # Isolation, part one: write a marker named for this run to three places an earlier job could
  # leave behind. The container is rootless; sudo is tried when present. A path that cannot be
  # written is a finding in the summary, not a failure.
  canary-owned-write:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: [nife-owned-x86_64]
    continue-on-error: true  # outcome: exception, the canary measures the owned pool and must never block the queue
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.write.outputs.runner }}
    steps:
      - name: Start clock
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/canary-start"
          : > "$RUNNER_TEMP/canary-fetch-failures"
      - name: Write markers
        id: write
        shell: bash
        run: |
          set +e
          echo "runner=${RUNNER_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          {
            echo "## canary-owned-write"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "id: $(id)"
            for dir in "$HOME" /tmp /etc; do
              f="$dir/nife-canary-marker-$GITHUB_RUN_ID"
              if echo "$RUNNER_NAME" > "$f" 2>/dev/null; then
                echo "$dir: written"
              elif command -v sudo >/dev/null 2>&1 \
                  && sudo -n sh -c "echo '$RUNNER_NAME' > '$f'" 2>/dev/null; then
                echo "$dir: written with sudo"
              else
                echo "FINDING $dir: not writable (no sudo or no permission)"
              fi
            done
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Resources
        if: always()
        env:
          CANARY_JOB: canary-owned-write
        shell: bash
        run: |
          set +e
          start=$(cat "$RUNNER_TEMP/canary-start" 2>/dev/null || date +%s)
          {
            echo "### resources: $CANARY_JOB"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "wall: $(( $(date +%s) - start )) s"
            free -m
            if test -r /sys/fs/cgroup/memory.peak; then
              echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
            else
              echo "cgroup memory.peak: absent"
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo absent)"
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo absent)"
            fi
            echo "df: HOME=$HOME, /tmp, slot volume=${GITHUB_WORKSPACE:-.}"
            df -h "$HOME" /tmp "${GITHUB_WORKSPACE:-.}"
            echo '```'
            if test -s "$RUNNER_TEMP/canary-fetch-failures"; then
              echo "fetch failures (host: status):"
              sed 's/^/- /' "$RUNNER_TEMP/canary-fetch-failures"
            else
              echo "fetch failures: none recorded"
            fi
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Isolation, part two: five parallel jobs after the writer. None may find a marker or a leftover
  # file; each prints its runner name so the summary shows whether one landed on the writer's slot.
  canary-owned-check:
    needs: canary-owned-write
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: [nife-owned-x86_64]
    continue-on-error: true  # outcome: exception, the canary measures the owned pool and must never block the queue
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    steps:
      - name: Start clock
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/canary-start"
          : > "$RUNNER_TEMP/canary-fetch-failures"
      - name: Check markers
        env:
          WRITER_RUNNER: ${{ needs.canary-owned-write.outputs.runner }}
          INSTANCE: ${{ matrix.instance }}
        shell: bash
        run: |
          set +e
          dirty=0
          {
            echo "## canary-owned-check $INSTANCE"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "writer runner: ${WRITER_RUNNER:-unknown}"
            # Just-in-time runners get a fresh -<hex> suffix per job; the slot is the part before it.
            my_slot=${RUNNER_NAME%-*}
            writer_slot=${WRITER_RUNNER%-*}
            echo "slot: $my_slot (writer slot: $writer_slot)"
            if test -n "$my_slot" && test "$my_slot" = "$writer_slot"; then
              echo "writer slot: SEEN AGAIN (same slot, new runner name)"
            else
              echo "writer slot: not this one"
            fi
            for dir in "$HOME" /tmp /etc; do
              f="$dir/nife-canary-marker-$GITHUB_RUN_ID"
              if test -e "$f"; then echo "LEAK $f exists"; dirty=1; else echo "$f: absent"; fi
            done
            left=$(find "$HOME" -maxdepth 2 -name 'nife-canary-marker-*' 2>/dev/null)
            if test -n "$left"; then echo "LEAK in HOME: $left"; dirty=1; else echo "HOME: clean"; fi
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          # tee ends the pipeline's own status, so re-derive the verdict from the disk.
          test ! -e "$HOME/nife-canary-marker-$GITHUB_RUN_ID" \
            && test ! -e "/tmp/nife-canary-marker-$GITHUB_RUN_ID" \
            && test ! -e "/etc/nife-canary-marker-$GITHUB_RUN_ID" \
            && test -z "$(find "$HOME" -maxdepth 2 -name 'nife-canary-marker-*' 2>/dev/null)"
      - name: Resources
        if: always()
        env:
          CANARY_JOB: canary-owned-check
        shell: bash
        run: |
          set +e
          start=$(cat "$RUNNER_TEMP/canary-start" 2>/dev/null || date +%s)
          {
            echo "### resources: $CANARY_JOB"
            echo '```'
            echo "runner: ${RUNNER_NAME:-unknown}"
            echo "wall: $(( $(date +%s) - start )) s"
            free -m
            if test -r /sys/fs/cgroup/memory.peak; then
              echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
            else
              echo "cgroup memory.peak: absent"
              echo "cgroup memory.current: $(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo absent)"
              echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo absent)"
            fi
            echo "df: HOME=$HOME, /tmp, slot volume=${GITHUB_WORKSPACE:-.}"
            df -h "$HOME" /tmp "${GITHUB_WORKSPACE:-.}"
            echo '```'
            if test -s "$RUNNER_TEMP/canary-fetch-failures"; then
              echo "fetch failures (host: status):"
              sed 's/^/- /' "$RUNNER_TEMP/canary-fetch-failures"
            else
              echo "fetch failures: none recorded"
            fi
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Says in one place whether any check instance ran on the writer's slot, from the jobs API.
  # Runner names end in -sNN-<hex>; the hex is fresh per job, so equal slots (the name without the
  # hex) mean one slot.
  canary-owned-isolation:
    needs: [canary-owned-write, canary-owned-check]
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'push') }}
    runs-on: ubuntu-26.04
    continue-on-error: true  # outcome: exception, a reading aid and never a verdict on the queue
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Compare runner names
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | [.name, (.runner_name // "none"), .conclusion] | @tsv')
          writer=$(printf '%s\n' "$jobs" | awk -F'\t' '$1 == "canary-owned-write" {print $2}')
          {
            echo "## canary-owned-isolation"
            echo '```'
            printf '%s\n' "$jobs" | grep '^canary-owned-'
            echo "writer runner: ${writer:-unknown}"
            # A slot is the runner name without its per-job -<hex> suffix (nife-owned-x86_64-s01).
            slot=$(printf '%s' "$writer" | sed 's/-[^-]*$//')
            echo "writer slot: ${slot:-unknown}"
            seen=$(printf '%s\n' "$jobs" | awk -F'\t' -v w="$slot" '
              w != "" && w != "none" && $1 ~ /^canary-owned-check/ {
                s = $2; sub(/-[^-]*$/, "", s); if (s == w) n++ }
              END { print n + 0 }')
            total=$(printf '%s\n' "$jobs" | grep -c '^canary-owned-check')
            echo "check instances on the writer slot: $seen of $total"
            if test "$seen" -gt 0; then
              echo "writer slot seen again: yes, in $seen of $total check instances"
            else
              echo "writer slot seen again: no (the check proved nothing about slot reuse this run)"
            fi
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
