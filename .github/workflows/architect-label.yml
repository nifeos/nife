name: architect label

# Observed failing: 2026-10-04, run 37226530701: fired on #1617's `crates/abi` change
#   (abi-surface), applied `needs-architect` (github-actions[bot], 18:59:39Z) and commented. Green by
#   design; the label is the arm that carries the claim. See notes/observed-failing.md.

# **The general case of `coe-architect-label.yml`.** That workflow's own header quotes §88 (`needs-
# architect` as a required check, rather than as a script's restraint): it built the enforcement
# half of `needs-architect` (`architect-hold.yml` fails while the label sits on a pull request) and
# named the harder half it did not build, *"a check that reads the diff and demands
# the label when the syscall surface or the dependency graph moved... the second is the real
# answer,"* then built one shape of it, a correction of error. This workflow is the rest of it: the
# syscall surface, the dependency graph, a format crate's wire layout, the spawn protocol, and
# CLAUDE.md/`design/decisions/`. A bookkeeping edit to a decision (a link retargeted, a backticked
# path moved, a paragraph rewrapped) no longer fires: calef ruled on 2026-10-11 (UTC) that it does
# not need him, and §88 (`needs-architect` as a required check)'s amendment records it.
#
# **A separate workflow, not an extension of `coe-architect-label.yml`, and not a change to
# `architect-hold.yml`.** `coe-architect-label.yml`'s own header already argues the second half of
# that (read it there: a labeler earns its keep by being best-effort, a required check earns its
# keep by being small, deterministic and read-only, and mixing them costs the required check its
# argument for nothing this job needs). Its first half does not carry over to a second labeler
# unmodified, though, and the difference is what decided "separate file" here: that workflow reads
# ONLY the pull request's changed-file *names*, over the API, so it never checks the repository out
# and needs nothing past `contents: read` plus the one label-write scope. This workflow's rules
# cannot be answered from file names. Rule 2 (an external dependency) has to tell a version bump
# of an existing dependency from a brand-new one, which means parsing each `Cargo.toml`'s
# dependency table on both sides of the change; rule 3 (a format crate) has to classify a file from
# its own content (does it declare a `VERSION`/`MAGIC` constant, does its module doc carry a
# version table) before deciding whether a change to it counts. Both need the file, not just its
# path, on both sides of the diff. So this workflow checks the repository out (still never
# `pull_request_target`, for the same fork-safety reason `coe-architect-label.yml`'s header gives:
# the risk that trigger carries is base-repo token privilege against a fork-controlled event, which
# nothing here is worth) and hands a `git diff` to the actual predicate,
# `helpers/architect-label-rules.py`, which is pure text-in, text-out and has its own `--selftest`
# (wired into `script/lint`, so it costs nothing there and needs no repository or subprocess to
# run).
#
# **The six rules live in that script's own docstring, not duplicated here.** A comment here
# describing them would drift from the code the moment either changed without the other; the
# script is the one place they are decided, and this file's job is only to feed it a diff and act
# on what it says.
#
# **`architect-ruled` is the label that makes a ruling stick.** Unlike `coe-architect-label.yml`
# (whose own detection question, "did THIS push add the file", already tells a re-added label from
# a human's removal), this workflow has no such memory: every run re-diffs base...head from
# scratch, so any push that leaves a matched rule's line still in the diff, including an ordinary
# rebase that carries no new decision at all, re-adds `needs-architect` the moment the maintainer
# removes it. That happened twice within hours, 2026-09-27 04:10 UTC: #1378 and #1400, both
# unlabelled by hand after calef ruled on their syscall surface, both re-labelled by the next push.
# `architect-ruled` records that the ruling happened, not just that someone once removed the
# consequence of it: a pull request that carries it is skipped outright, logged and not
# re-evaluated, regardless of what its diff still matches. The maintainer applies it with
# `script/record-ruling`, which posts the ruling (what calef said) and swaps the labels in one step
# (lane/architect-queue, 2026-10-06), the same discipline
# `Blocked-by: #N` uses for a hold that releases itself (notes/merge-queue.md); this is a hold that
# a decision releases rather than a commit. **Scope: it sticks until a person removes it.** A later
# push with a decision the ruling did not cover is not re-flagged; the maintainer removes the label
# when they see one (helpers/architect-ruled.sh has the record). The check reads the LIVE labels
# (helpers/architect-ruled.sh), because the payload lost a race on #1712, 2026-10-05. It is never applied by this workflow itself, only read
# by it, so creating the label in the repository (`gh label create`) is a one-time, out-of-band
# step, not a run of this job.

on:
  # Same three types `coe-architect-label.yml` listens for, and the same reason: only a new commit
  # can change what the diff says, so `labeled`/`unlabeled`/`ready_for_review` would cost a run for
  # no chance of a different answer (this label is never removed by this job, so `unlabeled` in
  # particular has nothing to react to). No draft-skip condition: a lane's first act is a draft
  # pull request (AGENTS.md; DECISIONS §90 (the claim is a draft pull request; the status flip is
  # a gate)), and the whole point of a diff-reading check is to tell a lane about its own syscall
  # or dependency change before it asks to be reviewed, not after.
  pull_request:
    types: [opened, reopened, synchronize]

# `contents: read` for the checkout (this job, unlike `coe-architect-label.yml`, needs actual file
# content, not just the API's changed-file list; see the header above). `pull-requests: write` for
# the label and the one comment. Nothing else: no merge action, no repository write, no wider API
# scope. Same fork caveat as `coe-architect-label.yml`: this is deliberately `pull_request`, not
# `pull_request_target`, so a fork's `GITHUB_TOKEN` is read-only regardless of this block and both
# the label and the comment steps below log why they could not act rather than failing the job.
permissions:
  contents: read
  pull-requests: write

# **`cancel-in-progress: true`, unlike `coe-architect-label.yml`'s `false` for the same trigger
# shape, and deliberately the opposite call.** That workflow's header explains its `false`: an
# `opened` run and a later `synchronize` run there read two DIFFERENT diffs (a `synchronize` there
# asks "what did THIS push add" so it can tell a re-added label from a human's removal), so
# cancelling the older one can silently drop a detection rather than just being late with it. This
# workflow has no such split: every run here diffs the same two things, the pull request's base sha
# and its current head, regardless of which event triggered it, and it never removes the label
# either, so an in-flight run superseded by a newer push is answering a question a newer run is
# about to answer again from scratch. Cancelling it costs nothing this job needs and saves a
# runner-minute on every force-push.
concurrency:
  group: architect-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label the diff's syscall/dependency/format/decision surface
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` + `filter: blob:none` is `merge-drain.yml`'s own pairing for the same
      # reason: this needs history to diff against the pull request's base, but not every blob in
      # that history, and a partial clone fetches on demand exactly the blobs the diff below
      # actually touches (the changed files on both sides) rather than the whole tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      # **The diff, at unlimited context, is the whole contract `helpers/architect-label-rules.py`
      # is written against**: its own docstring explains why `--unified=1000000` turns each changed
      # file's hunk into that file's whole content with the changed lines marked, which is what
      # lets its rules reconstruct both the pre-image and the post-image without a second `git
      # show` per file. No pathspec restricts this diff; an unchanged file emits nothing regardless
      # of the context width, so widening it costs bytes only for files that already changed.
      #
      # **Never `github.event.pull_request.base.sha` on its own.** That field is a snapshot GitHub
      # took when this pull request's base last changed FOR THIS PULL REQUEST (opened, or last
      # synchronized), not the base branch's current tip, so a two-dot diff against it goes stale
      # the moment another pull request merges into the base branch without any push to this one.
      # #1416 was flagged for `dependency: xtask/Cargo.toml: toml`, a dependency #1405 added to
      # `main` after #1416 branched: the payload's cached `base.sha` still pointed one commit
      # behind #1405's own merge, so the diff read #1405's addition as though #1416 had made it.
      # `ci.yml`'s nine scope-check steps (four build jobs since the 2026-09-30 split, plus cpu
      # matrix, watchdog, bench, fuzz, coverage) read the same field the same way and share the same
      # exposure; fixed there too, in the same pass, with the same script (see its own header).
      #
      # `helpers/scope-merge-base.sh` is the fix: it takes the merge base of HEAD against
      # `origin/<base-ref>`, the base branch's ACTUAL current tip, already fetched fresh by this
      # job's own `fetch-depth: 0` checkout above, falling back to the payload sha only if that
      # local ref cannot be resolved (a base branch renamed or deleted between the event firing and
      # this job running). That merge base is what a three-dot diff computes, and it is what "the
      # pull request's own changes" means regardless of how far the base branch has moved past the
      # fork point. `architect-ruled` short-circuits everything below: it is read straight off the
      # event payload's own label list (`github.event.pull_request.labels`), so this costs no extra
      # API call, and it means what an architect said, not what this event's diff still matches.
      # See this file's header for the two mislabelled pull requests (#1378, #1400) that this
      # exists to stop from recurring, and `helpers/scope-merge-base-selftest.sh` for this one.
      - name: Run the diff-reading rules
        id: rules
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # **Live labels, not the payload** (the payload snapshot lost a race on #1712, 2026-10-05:
          # `architect-ruled` at 19:24:14Z, `needs-architect` re-added by this job at 19:24:35Z).
          # This is the early exit; the add step below asks again, since the diff takes time.
          if on="$(helpers/architect-ruled.sh "$PR_NUMBER" "$GITHUB_REPOSITORY")"; then
            echo "architect-label: $on is on this PR; an architect has already ruled" >&2
            echo "architect-label: on its surface, so this run is not re-adding needs-architect." >&2
            echo "add=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The base branch's live tip (`helpers/scope-merge-base.sh` has why, #1416), the
          # payload's sha only if that ref is missing. The rules diff HEAD from EVERY merge base
          # with it and keep what each base yields (`--against`): one `git merge-base` picks a base
          # at random when a branch merged another branch main also merged, and main's own edits
          # then read as this pull request's (#3416, #3167). Each open pull request that carries
          # `architect-ruled` and not `held-by-lane` goes in as `--ruled N:SHA`, so a file this
          # branch carries byte for byte from one of them is not asked again (#3450).
          if git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
            main_ref="origin/$BASE_REF"
          else
            main_ref="$BASE_SHA"
          fi
          set --
          for pair in $(helpers/architect-ruled-heads.sh "$GITHUB_REPOSITORY" "$PR_NUMBER"); do
            set -- "$@" --ruled "$pair"
          done
          # **A run that examined nothing routes to a person; it never reads as "no rule fired"**
          # (milestone 641 (a mechanism that reports clean says over how many units, and zero is
          # loud), provisional). The rules helper crashes with 3 and exits 4 when there is no
          # merge base; anything above 1 labels.
          echo "architect-label: diffing HEAD against every merge base with $main_ref"
          rc=0
          report="$(python3 helpers/architect-label-rules.py --against "$main_ref" HEAD "$@")" || rc=$?
          if [ "$rc" -eq 4 ]; then
            report="unexamined: no base to diff against, so no rule read this pull request"
          elif [ "$rc" -gt 1 ]; then
            report="unexamined: helpers/architect-label-rules.py exited $rc (see this run's log), so no rule read this pull request"
          fi
          if [ -n "$report" ]; then
            echo "architect-label: fired:"
            printf '%s\n' "$report" | sed 's/^/  /'
            echo "add=true" >> "$GITHUB_OUTPUT"
            {
              echo "report<<ARCHITECT_LABEL_EOF"
              printf '%s\n' "$report"
              echo "ARCHITECT_LABEL_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "architect-label: nothing in this diff matched a rule"
            echo "add=false" >> "$GITHUB_OUTPUT"
          fi

      # **Never fails the build, same as `coe-architect-label.yml`'s label step and for the same
      # reason: this is a convenience that routes attention, not a gate**, and no `design/decisions/`
      # section or dependency addition should ever be blocked from existing because a label API call
      # failed. `--repo` is passed explicitly for the same reason that workflow's own header records
      # about the cost of leaving it out: this job never checks the repository out under a git
      # remote `gh` can infer from (it does check the repository out here, but not via a remote
      # named the same as `github.repository`'s normalized form, and the earlier failure cost a
      # whole labeler silently doing nothing for a day), so naming it is cheap insurance either way.
      - name: Add needs-architect (never removes it)
        if: steps.rules.outputs.add == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Second live check, immediately before the write: a ruling that landed while the diff
          # was being read must still win. A failed read (exit 2) falls through and labels, which
          # is the safe side (a spurious hold is visible; a missed one is not).
          if on="$(helpers/architect-ruled.sh "$PR_NUMBER" "$REPO")"; then
            echo "architect-label: $on appeared during this run; not adding needs-architect." >&2
            exit 0
          fi
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label needs-architect 2>&1; then
            echo "architect-label: needs-architect added (or already present) on PR #$PR_NUMBER"
          else
            echo "architect-label: could not add needs-architect to PR #$PR_NUMBER." >&2
            echo "architect-label: not fatal -- a human reading the diff still sees the change." >&2
          fi
          exit 0

      # **The one comment, marker-guarded so it posts once.** The composition and the marker-guard
      # both live in `helpers/architect-label-comment.sh` (its own header has the reasoning,
      # including why a YAML `run:` block is the wrong place to write a multi-line comment body: a
      # block literal's indentation rule makes a fenced code block starting in column 1 invalid
      # YAML the moment it is written the way a human would write a comment). What stays here is
      # only: do it if a rule fired, and pass the three things the script needs.
      - name: Comment once, naming which rule fired
        if: steps.rules.outputs.add == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.rules.outputs.report }}
        run: |
          helpers/architect-label-comment.sh \
            "$PR_NUMBER" \
            "$GITHUB_REPOSITORY" \
            "$REPORT"
