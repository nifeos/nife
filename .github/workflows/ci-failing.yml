name: ci failing

# Observed failing: never. Its first Actions run, 37227933655 (2026-10-04, dispatched), went red at
#   `jq: Argument list too long` (helpers/ci-failing.sh line 91, the check runs passed with
#   `--argjson`) before judging any pull request. That is a real defect of its own, fixed by #1627,
#   but not this record's sense of failing: the arm that carries the claim (label and comment a ready
#   pull request whose required check is red) never ran, and a crash looks the same whatever the
#   checks say. The 17 runs after #1627, to 21:02 UTC that day, are green and no pull request has
#   carried the `ci-failing` label. notes/ci-failing.md's stubbed `gh` exercised that arm outside
#   Actions. A ready pull request with a red required check would stage it. See
#   notes/observed-failing.md.

# **Flags a ready pull request whose head fails a required check** (calef approved 2026-10-04 UTC).
# calef twice spotted failing pull request CI (#1611, #1597) before any session did, and a session
# may not run a watch loop, so the watching runs here as `nife-smelter[bot]`, at zero token cost.
# The decision, what counts as failing and why, is helpers/ci-failing.jq; the pass is
# helpers/ci-failing.sh. Names (this file, the script, the `ci-failing` label) are provisional.
#
# It labels and comments and does nothing else: no dequeue, no disabling auto-merge, no rerun.
# notes/merge-queue.md has the BUGS. Like every scheduled workflow it runs only from `main`, so
# `helpers/ci-failing.sh --dry-run` from a checkout is how a change is tried first.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # The schedule alone is nearly silent here (see notes/ci-failing.md BUGS), so a pass also runs
  # whenever CI completes, as merge-drain.yml does, which is when a head can have just turned red.
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  group: ci-failing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flag:
    name: flag failing required checks
    # The App's secrets live in the `automation` environment, deployable from `main` only; see the
    # comment on the same line of merge-drain.yml.
    environment: automation
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: one pass
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CI_FAILING_INSTANCE: actions:${{ github.run_id }}
        run: helpers/ci-failing.sh
