# Homes for tracked paths in no package. Milestone 611 (every program and crate belongs to a
# package, and every package has a home); provisional.
#
# calef, 2026-09-27: "Everything in the tree may not be in a package, but it may be in a repo." A
# package's paths take the package's home, in packages/<name>.package.toml. Everything else is
# claimed here, one [[home]] table per home listing its path prefixes, and the longest prefix naming
# a file wins across both. TOML since calef's ruling of 2026-09-27; the keys are helpers/packages.py's
# header, provisional; the reasons are notes/package-boundaries.md.
#
# The end state is that everything leaves this repository, so "undecided" is allowed and counted,
# and every undecided home says in a few words what the decision is waiting on. Nothing here is a
# default: a new top-level directory has no home until somebody writes one.
#
# How big a home is: amended 2026-09-27T15:06Z (§235 (the OS is built and updated from packages,
# and the tree divides by what releases together), Fork 3's amendment). A home is sized by what
# changes together, measured by a per-package co-change column milestone 610 (the interface's
# stability is measured weekly) owes and does not yet carry. No package moves to a new home, and no
# `.package.toml` file's `home = { status = "provisional" }` settles, before that measurement
# exists.

[[home]]
status = "undecided"
reason = "project records; whether this repository keeps them is calef's call"
paths = [
    "design/",
    "briefs/",
    "AGENTS.md",
    "CLAUDE.md",
    "ARCHITECTS.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "README.md",
    "art/",
    "packages/homes.toml",
    "packages/base-image.toml",
]

[[home]]
status = "undecided"
reason = "documentation; the site, a package or the records is an open question"
paths = ["notes/", "vendor/README.md", "vendor/upstream-status.md"]

[[home]]
status = "undecided"
reason = "the build and gates follow the integrating repository, not yet named"
paths = ["script/", "helpers/", ".github/", ".githooks/", ".claude/", ".agents/"]

[[home]]
status = "undecided"
reason = "measurements; they follow the integrating repository, not yet named"
paths = ["bench/"]

[[home]]
status = "undecided"
reason = "the workspace root dissolves as packages move out"
paths = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    ".cargo/",
    ".gitignore",
    "clippy.toml",
    "rustfmt.toml",
    "deny.toml",
    "_typos.toml",
    ".qemu-version",
    ".cargo-deny-version",
    ".cargo-fuzz-version",
    ".cargo-mutants-version",
    ".cargo-mutants-sha256",
    ".kani-version",
]

[[home]]
status = "undecided"
reason = "every repository carries its own copy; this one follows the root"
paths = ["LICENSE-MIT", "LICENSE-APACHE"]

[[home]]
status = "undecided"
reason = "the publish allowlist, milestone 887 (crate repositories share one CI template, adapted from nife's gates); it leaves with the last crate that moves, because its purpose is what stops a crate leaving unallowlisted"
paths = ["crates/publish-allowlist.txt"]
