[package]
name = "universal_serial_bus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The host side of a USB boot keyboard as pure computation: descriptors, setup packets and the boot report, proven total with Kani"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["usb", "hid", "keyboard", "no-std", "kani"]
categories = ["no-std", "embedded", "hardware-support"]
publish = false     # held until the maintainers decide the first release

# no_std for a driver, std for host tests. What a Universal Serial Bus (USB) device says about
# itself (descriptors), what a host asks it (setup packets), and what a boot protocol keyboard's
# eight-byte report means. Every byte this crate parses came from a device a stranger plugged in,
# so it is written to refuse rather than to trust, and it is the part of a keyboard driver the model
# checker reaches.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# This crate has no `unsafe` code, so this lint has nothing to read; the shared standalone gate asks
# every crate to carry it, and it costs nothing here.
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
