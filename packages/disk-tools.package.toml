# disk-tools: the disk tools. disk_surveyor (lsblk) and disk_partitioner (fdisk).
#
# Milestone 611 (every program and crate belongs to a package). The package's kind, home and
# membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.
#
# Name: ratified 2026-10-06 (calef, relayed to lane/disk-tools-rename). "util-linux is a horrible
# package name for a nife package." Then: "Yes rename util-linux to disk-tools and move uuid to
# coreutils." Refused `util-linux` (this package is not Linux; §235 (the OS is built and updated
# from packages)'s "follow the distributions' grouping" governs grouping, not names). `uuid` left
# in the same ruling: "uuid can be used for lots of applications. Putting it in disk-utils doesn't
# seem right." Debian's grouping of uuidgen (util-linux, uuid-runtime) was refused as wrong for a
# general tool. `coreutils` became `core-tools` the same day, so uuid is in
# packages/core-tools.package.toml. Ratified 2026-10-28 as the repository's name too (calef,
# relayed by the maintainer on the naming review, pull request #2870): `nifeos/disk-tools`, the
# repository its programs leave as (§316 (a package's programs leave as one repository, after their
# crates)). The `home` line stays provisional until the repository exists (§316).

name = "disk-tools"
kind = "base"
home = { repo = "disk-tools", status = "provisional" }
programs = ["disk_surveyor", "disk_partitioner"]
