[package]
name = "direct_memory_access_validator"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The ring layout these proofs cover (`moho_abi::virtual_io`), so the proved layout is the one the
# kernel runs and each driver reads (milestone 1113 (virtio outside review), Decision 2). The
# crate's only dependency, itself with none.
moho_abi = { version = "0.1.0", git = "https://github.com/nifeos/moho_abi", rev = "c8d556ec5ca7e567df529368c7dd24943423ab74" }
