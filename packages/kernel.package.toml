# kernel: the kernel and the crates only it links. Debian's linux-image.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "kernel"
kind = "base"
home = { repo = "kernel", status = "provisional" }
crates = [
    "kernel",
    "capability",
    "paging",
    "page_frames",
    "pci",
    "address_space_identifier",
    "cpu_set",
    "generational_table",
    "inter_process_communication",
    "intrusive_fifo",
    "memory_corruption_canary_gate",
    "memory_regions",
    "thread_wake_handshake",
    "work_steal_slot",
    "direct_memory_access_validator",
    "firmware_configuration",
    "jh7110_watchdog",
]
# `jh7110_clock_and_reset` names the JH7110 clock controllers' spellings and decodes their
# properties; the device-tree walk in `machine_discovery` (contracts) reads the tree with them and
# fills in its types. Two packages link it, so it is an interface.
interfaces = ["jh7110_clock_and_reset"]

[[exception]]
date = 2026-10-04
member = "kernel"
crate = "extensible_host_controller_interface"
reason = "the kernel draws the xHCI driver's register window and hands it extensible_host_controller_interface::Handoff, a contract living in the USB keyboard's crate (milestone 242 (USB host and HID))"

[[exception]]
date = 2026-09-27
member = "kernel"
crate = "coremark"
reason = "the bench feature runs coremark inside the kernel; a benchmark is a fixture a release kernel should not link"

[[exception]]
date = 2026-09-27
member = "kernel"
crate = "job_mix"
reason = "the kernel runs the job mix at boot; a fixture a release kernel should not link"

[[exception]]
