[package]
name = "direct_memory_access_validator"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The ring layout these proofs cover (`moho_abi::virtual_io`), so the proved layout is the one the
# kernel runs and each driver reads (milestone 1113 (what an outside maintainer would fix before
# `virtio` leaves this tree), Decision 2). The crate's only dependency, itself with none.
moho_abi = { version = "0.1.0-pre.1", git = "https://github.com/nifeos/moho_abi", rev = "1e99eedd208b36d752a2d630a7bd129a933d81a6" }
