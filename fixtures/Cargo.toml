# three are already in the shipping graph through `components`; nothing external was taken.
network_time_protocol = { version = "0.1.0", path = "../crates/network_time_protocol" }
socket_contract = { version = "0.1.0", path = "../crates/socket_contract" }
# The name resolver's contract and the boot test's cases, which `name_resolver_test_client` and the
# kernel's test must agree on (milestone 384, provisional name).
domain_name_resolution_contract = { version = "0.1.0", path = "../crates/domain_name_resolution_contract" }
clock_contract = { version = "0.1.0", path = "../crates/clock_contract" }
# `unreachable_network_witness`'s entropy probe (milestone 202's unvouched-child claim, DECISIONS
# §219 (how the shell names an installed program to the spawner) gate D2): a real `GET`, so a child wrongly handed the service gets an answer rather than a
# request the service would not recognise. Already in the shipping graph through `components`.
entropy_contract = { version = "0.1.0", path = "../crates/entropy_contract" }
