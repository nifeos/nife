# Name: provisional, minted by milestone 268's lane on 2026-09-14. The provenance block, with the
# refusals, lives in src/lib.rs, which is where the naming gate reads it and where a reader meets
# the crate.
[package]
name = "boot_ladder"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The rungs of the boot ladder, as the exact bytes that appear on a console.
#
# A crate rather than a constant in each place, because anything two binaries must agree on is
# code both use. The kernel prints these, a console reader matches them, and the shell prints the
# last one. No dependencies, and `no_std`, so the kernel can always compile it.

[lints]
workspace = true
