# **Programs this package builds that no boot image packs** (milestone 198 (a package manager)
# rung 3a). `xtask`'s `declared_programs` reads this and leaves them out of all three archives; a
# program here reaches a machine only as a package a recipe under `packages/` builds. It must also
# be a `[[bin]]` above, and must not be a program the shell or the boot needs, and `xtask` refuses
# the archive otherwise. Key name provisional.
[package.metadata.nife]
packaged_only = ["greeting", "noteless", "greeting_v2", "alto", "tenor", "dialer"]

[dependencies]
