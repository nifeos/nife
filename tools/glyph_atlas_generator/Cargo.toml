# Its own workspace root, deliberately NOT a member of the nife workspace, for the reason
# tools/redoxfs_host is one: the outline parser and the rasteriser below are build-time
# dependencies, and keeping them in their own lockfile keeps them out of the graph any shipped
# program is built from. `script/lint`, `script/fmt` and `cargo xtask test` reach this tool by
# --manifest-path, and `script/supply-chain` finds its lockfile on its own.
[workspace]

# Name: provisional. Considered `glyph_atlas_builder` (a builder reads as a Rust builder type) and
# `font_rasteriser` (says how, not what it makes). calef names things.
[package]
name = "glyph_atlas_generator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Turns vendor/dejavu's four TrueType faces into the coverage tables `crates/glyph_atlas` ships
# (milestone 142 (a text display good enough that people use it instead of a GUI) increment 3). The
# pair below is §166 (the rasteriser dependency, and whether the glyph atlas ships one face or
# four)'s ruling, and the block's determinism appendix
# (design/roadmap/0142-a-text-display-worth-living-in/determinism.md) is why each pin is what it is.
[dependencies]
# The outline parser: Google's fontations `skrifa` (with `read-fonts` and `font-types`, and
# `bytemuck` and `bytemuck_derive` beneath them), MIT OR Apache-2.0, ruled by calef on 2026-10-20
# (UTC) after `ttf-parser` was flagged unmaintained; §166 (the rasteriser dependency, and whether
# the glyph atlas ships one face or four). A TrueType parser is a subsystem this tree would never
# write (§46 (thin primitives or whole subsystems)). Pinned exactly: a parser bump that changed one
# outline point would fail the regenerate gate, and the pin says which version made the tables.
# Default features off but `std`: the autohinter's shaping is unused, since outlines are drawn
# unhinted.
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
# The rasteriser. **Pinned exactly at 0.1.10**: 0.1.4 through 0.1.8 panic on some outlines, and a
# patch bump (0.1.5) has already changed raw coverage. The checked-in table is what is gated, so a
# bump that moves one pixel fails `cargo test` here rather than changing a screen in silence.
ab_glyph_rasterizer = "=0.1.10"
# The geometry the tables are drawn at, from the crate that ships them, so the tool and the reader
# cannot disagree about a cell's size or where the baseline sits.
glyph_atlas = { version = "0.1.0", path = "../../crates/glyph_atlas" }
