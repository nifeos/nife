# Homes for tracked paths in no package. Milestone 611 (every program and crate belongs to a
# package, and every package has a home); provisional.
#
# calef, 2026-09-27: "Everything in the tree may not be in a package, but it may be in a repo." A
# package's paths take the package's home, in packages/<name>.package.toml. Everything else is
# claimed here, one [[home]] table per home listing its path prefixes, and the longest prefix naming
# a file wins across both. TOML since calef's ruling of 2026-09-27; the keys are helpers/packages.py's
# header, provisional; the reasons are notes/package-boundaries.md.
#
# The end state is that everything leaves this repository, so "undecided" is allowed and counted,
# and every undecided home says in a few words what the decision is waiting on. Nothing here is a
# default: a new top-level directory has no home until somebody writes one.
#
# How big a home is: a repository has one purpose (§235 (the OS is built and updated from packages,
# and its source divides by purpose), "How big a repository is"). A program package's home holds
# its programs and the crates only it uses; a crate published on its own, or consumed by more than
# one repository, gets a home of its own (§316 (a program package leaves as one repository, with
# the crates only it uses)). Milestone 610 (the interface's stability is measured weekly)'s
# per-package co-change column informs how packages group and holds no move. A `.package.toml`
# file's `home = { status = "provisional" }` settles when its repository exists.

[[home]]
status = "undecided"
reason = "each repository carries its own copy of these, or they follow the integrating repository, not yet named"
paths = [
    "AGENTS.md",
    "CLAUDE.md",
    "ARCHITECTS.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "README.md",
    "art/",
    "packages/homes.toml",
    "packages/base-image.toml",
    "packages/base-image.approval.toml",
]

# ---- What moves: the design record ------------------------------------------------------------
[[home]]
# The design record, milestone 1018 (the design record moves to `nifeos/record` and is published as
# a website): the roadmap, decisions, journeys, naming, tenets, cross-cutting notes, the briefs and
# the lane skills, in a repository of their own. The website pulls them at build time.
status = "provisional"
repo = "record"
paths = ["design/", "briefs/", "notes/"]

[[home]]
# Tool data and the scripts' own documentation under notes/, which stay with the code whose tools
# read or describe them (milestone 1018, question 4).
status = "undecided"
reason = "tool data; it leaves with the tool that reads it, whose repository is not yet named"
paths = ["notes/project-metrics/", "notes/mutation-testing/", "notes/kernel-dependency-unsafe/sites.tsv",
         "notes/scripts.md"]

[[home]]
status = "undecided"
reason = "documentation; the site, a package or the records is an open question"
paths = ["vendor/README.md", "vendor/upstream-status.md"]

[[home]]
# The site build, milestone 1018 (the design record moves to `nifeos/record` and is published as a
# website) step 3. The website repository pulls the record, each crate's page and the tutorial at
# build time, and builds and deploys the site.
status = "provisional"
repo = "nifeos.org"
paths = ["site/"]

[[home]]
status = "undecided"
reason = "the build and gates follow the integrating repository, not yet named"
