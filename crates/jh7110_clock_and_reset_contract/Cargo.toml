[package]
name = "jh7110_clock_and_reset_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Request and reply words for a server that brings a StarFive JH7110 device's clocks and resets up, named by the caller's badge"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "jh7110", "clock"]
categories = ["no-std", "embedded", "hardware-support"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# The JH7110 clock and reset wire: the request and reply words a client and the clock and reset
# server exchange, and the bring-up summary's packing. Pure logic, host-tested, no_std,
# dependency-free, so the server, the starters that call it and their tests share ONE definition.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
