name: host-reordering

# Observed failing: 2026-10-24, by script: a workflow new on this branch cannot cite the run its own
#   first push raises (notes/observed-failing.md). Its arm is a measurement rather than a gate; the
#   runs it fired, and what each counted, are in notes/benchmarks/host-reordering-under-tcg.md.

# **Temporary, and scoped to one lane's branch** (maintainer/measure-arm64-host-reordering,
# 2026-10-24 UTC). It measures whether an aarch64 CI host shows a guest memory reorderings an
# x86_64 host does not: the litmus guest in tools/host_reordering_litmus, then the kernel suite's
# aarch64 and riscv64 legs with every kernel spinlock weakened by
# tools/host_reordering_litmus/weaken-spin.sh. Two jobs per host (the litmus guest, the weakened
# suite), the same steps on both, each bounded at 20 minutes. It fires only on a push to that
# branch that touches the measurement, never on a pull request or the merge queue, and is removed
# before the pull request is ready. See notes/benchmarks/host-reordering-under-tcg.md.
on:
  push:
    branches: [maintainer/measure-arm64-host-reordering]
    paths:
      - "tools/host_reordering_litmus/**"
      - ".github/workflows/host-reordering.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: host reordering (${{ matrix.part }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
        part: [litmus, suite]
        include:
          - part: litmus
            args: 60 none 0
          - part: suite
            args: 0 both 840
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"
      # The suite's deadline counts from the script's start, after setup, and a run begun before
      # it finishes; 840 s leaves room for that last run inside the job's 20 minutes.
      - run: tools/host_reordering_litmus/measure.sh ${{ matrix.args }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: host-reordering-${{ matrix.part }}-${{ matrix.runner }}
          path: target/host-reordering/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"
