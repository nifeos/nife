[package]
name = "memory_region_heap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A global allocator that grows a talc heap one mapped page at a time from a page source, under a cap, for a process that pays for its own memory"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "allocator", "heap"]
categories = ["no-std", "memory-management"]
publish = false     # `false` until the release that publishes; that release deletes the line

# The host tests and the README example drive the growth and wiring logic through a page source
# that hands out host memory, so no system call runs. There are no benches.
[lib]
bench = false

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
abi = { version = "0.1.0", path = "../abi" }
# The heap's default base is the address-space map's heap band.
address_space_layout = { version = "0.1.0", git = "https://github.com/nifeos/address_space_layout", rev = "2a22dbdb966d50eb98e8c69ccb59d86275cf3065" }
# The heap algorithm, with no features: `counters` and the rest stay off. A consuming workspace's
# `[patch.crates-io]` may build it from a vendored copy that carries upstream's fix SFBdragon/talc#57
# until a release does. Without such a patch the crate builds crates.io's 5.1.1 unpatched.
talc = { version = "5.1.1", default-features = false }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
