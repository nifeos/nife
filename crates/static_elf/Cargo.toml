[package]
name = "static_elf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A validating parser for static ELF64 executables: the segments a loader maps, checked before it maps one, proven with Kani"
license = "MIT OR Apache-2.0"
repository = "https://github.com/partsfoundry/static_elf"
readme = "README.md"
keywords = ["elf", "loader", "no-std", "kani", "parser"]
categories = ["no-std", "parser-implementations", "os"]
publish = false     # held until the maintainers decide the first release

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
