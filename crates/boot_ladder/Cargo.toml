# Name: provisional, minted by milestone 268's lane on 2026-09-14. The provenance block, with the
# refusals, lives in src/lib.rs, which is where the naming gate reads it and where a reader meets
# the crate.
[package]
name = "boot_ladder"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The rungs of the boot ladder, as the exact bytes that appear on a console (milestone 268).
#
# A crate rather than a constant in each place, because AGENTS.md rule 7 is exactly this case:
# anything two binaries must agree on is a crate. The kernel prints these; `serial_console` matches
# them; `swish` prints the last one. Three binaries, one definition.
#
# **No dependencies, and `no_std`.** It is six `&'static str`s. A crate that could fail to compile
# into a kernel would be a crate the kernel could not use, which is the whole point of it.

[lints]
workspace = true
