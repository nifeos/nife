[package]
name = "machine_discovery"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[dependencies]
# The device tree is the RISC-V source of truth for what the machine is, because RISC-V has no
# CPUID, so the riscv64 half of this crate reads it. The aarch64 half needs nothing: its facts come
# from architected ID registers, which the kernel reads and hands here as raw words.
device_tree_blob = { version = "0.1.0", path = "../device_tree_blob" }
# The JH7110 device crates take plain values and read no tree; `jh7110` finds each block for them
# and fills in their types, so it names them.
designware_ethernet = { version = "0.1.0", path = "../designware_ethernet" }
designware_mobile_storage = { version = "0.1.0", path = "../designware_mobile_storage" }
jh7110_clock_and_reset = { version = "0.1.0", path = "../jh7110_clock_and_reset" }
jh7110_entropy = { version = "0.1.0", path = "../jh7110_entropy" }

[lints]
workspace = true
