# display: the compositor, the display drivers and the terminal drawn on a screen. The role of Debian's xserver-xorg.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "display"
kind = "optional"
home = { repo = "display", status = "provisional" }
# `extensible_host_controller_interface` is linked by the kernel, which finds and confines the xHCI
# controller, and by `usb_keyboard_driver`, which drives it, and by `driver_process_contract`
# (contracts), which draws the driver's register window from it. `usb_keyboard_report` is the
# bring-up report the kernel and the driver agree on. Both are interfaces for the reason `e1000e`
# is one in `drivers`.
interfaces = [
    "compositor",
    "video_terminal",
    "glyph_atlas",
    "extensible_host_controller_interface",
    "usb_keyboard_report",
]
crates = ["usb", "glyph_atlas_generator"]
# The fonts the terminal's atlas is drawn from (milestone 142 (a text display good enough that
# people use it instead of a GUI)).
paths = ["vendor/dejavu/"]
programs = [
    "compositor",
    "gpu_driver",
    "framebuffer_driver",
    "keyboard_driver",
    "usb_keyboard_driver",
    "display_terminal",
    "graphical_terminal",
]
