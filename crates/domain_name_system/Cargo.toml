[package]
name = "domain_name_system"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The DNS wire format a stub resolver needs: a query for one name's IPv4 addresses, the checks a reply must pass, and TCP framing"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["dns", "stub-resolver", "no-std", "rfc1035", "rfc7766"]
categories = ["no-std", "no-std::no-alloc", "network-programming", "parser-implementations"]
publish = false     # `false` until the release that publishes; that release deletes the line

# The DNS wire format for a stub resolver (RFC 1035, RFC 7766 for TCP): a query for one host name's
# IPv4 addresses, and the checks a reply must pass before an address in it is believed. Pure
# computation: no socket, no timer, no policy, so the parser that reads network input is
# host-tested, fuzzed and Kani-checked.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
