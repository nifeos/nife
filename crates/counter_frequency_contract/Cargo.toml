[package]
name = "counter_frequency_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The counter frequency page: how many counter ticks make a second, on the architectures with no register that says so, and the band of rates worth believing"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "timer", "shared-page"]
categories = ["no-std", "embedded", "date-and-time"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# The counter frequency page: one definition of the read-only page that carries the calibrated
# counter rate into every process on the architectures with no register that says it, so the
# kernel (which computes the number once, at boot) and the reader (which reads it, once per process)
# cannot drift on the page's layout or its fixed virtual address. A magic-prefixed page with one
# writer before the page has a second observer, so no seqlock is needed.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
