# The fuzz workspace (milestone 42's second leg).
#
# **Its own workspace, deliberately**, the same shape as vendor/redoxfs and redoxfs_server. A fuzz target
# links libFuzzer's `main`, is built with a sanitizer and `-Zbuild-std`, and is not something
# `cargo build --workspace` should ever try to produce. Keeping it out of the main workspace is what
# lets `script/test`, `script/lint` and `script/coverage` stay exactly as fast as they were.
#
# **Why cargo-fuzz** (DECISIONS §46 says a dev tool is a dependency decision too). Three candidates
# were real: cargo-fuzz/libFuzzer, cargo-afl, and honggfuzz-rs. cargo-fuzz wins here on one property
# the other two do not have: it is in-process and coverage-guided with no external harness process,
# so a fuzz target is a plain Rust function over `&[u8]` that the crates under test can be linked
# into directly. Our parsers are `no_std`, pure, and take a byte slice, which is exactly the shape
# libFuzzer wants; AFL's fork-server model buys robustness against a target that corrupts itself,
# which a safe-Rust parser cannot do. cargo-fuzz is also the tool rustc, regex and the rest of the
# ecosystem use, so a crash reproduces for anyone who reads this repository.
#
# The cost is honest and worth stating: it needs nightly (we already pin one), it needs `rust-src`
# for `-Zbuild-std` (already in rust-toolchain.toml for the kernel), and it adds three crates to a
# graph nothing ships. None of them enter the kernel, `user`, or any binary that boots.

# Name: ratified 2026-08-18 (calef). `fuzz`, matching the directory, because AGENTS.md's table says a
# directory holding a Rust package is named exactly as the package and the DIRECTORY is the fixed half
# here: cargo-fuzz finds it by convention. It was `nife_fuzz` until then; the prefix was retired on the
# evidence that of fifty-odd package names exactly three carried `nife`, two of which are the proper
# noun `nifefs`. Refused: `nife_fuzz` (a project prefix inside its own project), and renaming the
# directory to `nife_fuzz/` with `--fuzz-dir` (which works, and costs cargo-fuzz's default layout). The
# full argument, including why a generic word is right here where it was wrong for `compose` and
# `measure`, is in the `[package]` comment below.

[package]
# `fuzz`, matching the directory, because AGENTS.md's table says a directory holding a Rust package is
# named exactly as the package, and **the directory is the fixed half here**: `cargo-fuzz` finds it by
# convention (its own help calls it "the fuzz directory", `--fuzz-dir` defaults to `fuzz`, and
# `cargo fuzz init` creates it), and `script/fuzz` invokes the tool with no `--fuzz-dir`. So the name
# follows the directory rather than the other way round.
#
# It was `nife_fuzz` until 2026-08-18, minted by milestone 120's `cricker` sweep rather than chosen.
# calef retired the prefix on the evidence: of fifty-odd package names in this tree exactly three
# carry `nife`, and two of those are `nifefs` and `nifefs_roundtrip`, where `nifefs` is a proper noun
# (a filesystem format, like `redoxfs`) rather than a prefix. The root-level packages are `kernel`,
# `user`, `xtask` and `redoxfs_server`: inside a repository called nife, prefixing a package with `nife`
# is what the context already supplies.
#
# **Do not "improve" this to something more distinctive.** A generic word is right here for the reason
# `kernel` and `user` are right: this name appears in one file, and position supplies the meaning.
# The crates in `crates/` are the opposite case, which is why `compose`, `measure` and `dma_validate`
# were renamed away from generic words and this one is not.
name = "fuzz"
version = "0.0.0"
edition = "2024"
publish = false
# Spelled out rather than inherited: this is its own workspace root, so there is no
# `[workspace.package]` to inherit from. Same dual licence as the rest of the tree.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# The crates under test. Path dependencies with no version on purpose: they resolve to the bytes in
# this repository, which git pins harder than semver would (see deny.toml's `allow-wildcard-paths`).
nifefs = { path = "../crates/nifefs" }
device_tree_blob = { path = "../crates/device_tree_blob" }
domain_name_system = { path = "../crates/domain_name_system" }
elf = { path = "../crates/elf" }
file_allocation_table = { path = "../crates/file_allocation_table" }
globally_unique_identifier_partition_table = { path = "../crates/globally_unique_identifier_partition_table" }
http_response = { path = "../crates/http_response" }
package_archive = { path = "../crates/package_archive" }

# **The services' request handlers** (proposal #1592 part a, `lane/fuzz-service-handlers`). Path
# dependencies on servers rather than parsers: each target replays a session of requests against the
# server built on the host. `redoxfs_server`'s default feature is `hosttest`, which brings std RedoxFS
# (the format a target needs once) and nothing else; its `fuse` default stays off because
# `redoxfs_server` depends on the engine with `default-features = false`. `redoxfs` is named
# here only so a target can spell the `Disk` trait and format an image; the two
# resolve to the same vendored engine `redoxfs_server` already uses, so no crate enters this graph
# that `script/supply-chain` does not already check through `redoxfs_server`. The engine's error type
# comes through `redoxfs_server`'s re-export rather than a `redox_syscall` line here, so this manifest
# names no registry crate beyond `libfuzzer-sys`.
redoxfs_server = { path = "../redoxfs_server" }
redoxfs = { path = "../vendor/redoxfs", default-features = false, features = ["std"] }
filesystem_contract = { path = "../crates/filesystem_contract" }
system_log = { path = "../crates/system_log" }
system_log_contract = { path = "../crates/system_log_contract" }
byte_sink_contract = { path = "../crates/byte_sink_contract" }
compositor = { path = "../crates/compositor" }

# **Overflow checks and debug assertions ON in an optimised build**, which is not cargo-fuzz's
# default profile text but is what its CLI already does. Stated here so the profile is true whatever
# invokes it.
#
# It matters more than it looks. An unchecked `a + b` that wraps is silent in a release build and a
# panic in a dev build, and the kernel's own test builds are dev builds, so a wrapping add a
# release-profile fuzzer waved through would still halt the kernel under `script/test`. The bug class
# this leg exists to find (a hostile length field driving arithmetic) is exactly that class.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "device_tree_blob_walk"
path = "fuzz_targets/device_tree_blob_walk.rs"
test = false
doc = false
bench = false

