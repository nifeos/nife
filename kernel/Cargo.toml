# Name: ratified 2026-10-22 (calef, #2562). AGENTS.md's naming section keeps "standard terms a
# reader already knows from outside", which is why `elf`, `pci`, `paging` and `glob` were left alone
# by the same rule. `kernel` is the standard term for the thing this is.

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license.workspace = true

# A library plus a thin binary (milestone 609 (the system tests leave the kernel crate)), so the
# system-test image can link the same kernel. The library's `cargo test` build is the bootable image
# that runs the kernel's own unit tests; the binary has none, and doctests cannot run on bare metal.
[lib]
path = "src/lib.rs"
doctest = false
bench = false

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
# No register crate on any target: aarch64's system registers are `arch/aarch64/instructions.rs`
# and its device registers are named offsets in `drivers/`, as on riscv64 and x86_64, so a proof can
# stub every access (milestone 707 (aarch64 registers spelled the way riscv64 and x86_64
# spell them), §46).
abi = { version = "0.1.0", path = "../crates/abi" }
address_space_identifier = { version = "0.1.0", path = "../crates/address_space_identifier" }
# The corruption canary's arm/check/disarm serialization (2026-08-15), lifted out of `sched.rs`
# after its hand-written two-flag protocol raced: the kernel calls the loom-searched gate rather
# than keeping a copy of it, the third retrofit of work_steal_slot's move. See notes/interleaving.md.
#
# **BUGS: every `--features bench` build warns that this dependency is unused, on every
# architecture, and that is a deliberate exception and a foot gun** (calef, 2026-10-03 UTC, on PR
# #1477). nightly-2026-10-02's cargo added a warning-only `unused_dependencies` lint, and the only
# user of this crate is `sched.rs`'s `canary` module, which is `cfg(not(feature = "bench"))`: the
# bench build swaps in a no-op twin so the canary's tick load stays out of the floors. Cargo cannot
# drop a dependency when a feature is turned on, only add one. The fix that silences it was
# considered and refused: an optional dependency behind a default `corruption_canary` feature would
# be the kernel's first default feature, every bench and icount invocation would have to remember
# `--no-default-features`, and forgetting it would silently add the canary's tick load to the bench
# floors. A wrong number nobody notices costs more than a warning everybody can read. So this one
# warning is expected; any other `unused_dependencies` warning from the kernel is a real finding.
# Do not add an `allow` for it either, because that would hide a second, real one.
memory_corruption_canary_gate = { version = "0.1.0", path = "../crates/memory_corruption_canary_gate" }
capability = { version = "0.1.0", path = "../crates/capability" }
# The shell's grant-expression logic (milestone 47's `rm -r`). The kernel plans nothing; its `rm`
# test **starts the program the way the shell would**, so the option bits it packs come from the
# manifest the prompt checks against rather than from a second copy of an ordering. Same rule as
# `line_editor`, `video_terminal` and `calendar` below: no party has its own copy of a shared definition.
grant_plan = { version = "0.1.0", path = "../crates/grant_plan" }
# The wall-clock contract (milestone 51, DECISIONS §43). The kernel discovers the RTC by
# `compatible` and names the binding with these constants, and its clock tests read the shared page
# through the same seqlock the service publishes with, so no party has its own copy of the layout.
clock_contract = { version = "0.1.0", path = "../crates/clock_contract" }
# The inert-configuration contract (milestone 47's environment-variable fork, DECISIONS §111). The
# kernel-side std program wiring assembles the page (`PageBuilder`) and maps it read-only into a
# std program the same way it does the clock page, so no party has its own copy of the layout or
# the validated domains.
environment_contract = { version = "0.1.0", path = "../crates/environment_contract" }
# The std runtime contract (milestone 595 (provisional)): the slot numbers and page addresses the
# kernel-side std wiring (`user::std_service`, `user::fs_service`) builds a std program with. The
# progenitor builds std children from the same crate, and the std PAL has it generated in.
std_runtime_contract = { version = "0.1.0", path = "../crates/std_runtime_contract" }
# The x86_64 timebase page (milestone 161's `cntfrq` follow-up). The kernel writes the calibrated
# TSC rate into a frame once, at boot, and `kernel::user::load` maps it read-only into every
# x86_64 process; `user_mode_runtime::cntfrq` is the reader, through this same crate, so neither side keeps
# its own copy of the page's layout or its fixed address.
counter_frequency_contract = { version = "0.1.0", path = "../crates/counter_frequency_contract" }
# The block-device roster (milestone 57). The kernel writes the page and the surveyor reads it, and
# the kernel's own tests read it back through this crate rather than by trusting the count the
# program sent home, so no party has its own copy of the layout.
block_roster = { version = "0.1.0", path = "../crates/block_roster" }
# The boot ladder's console markers (milestone 268): the exact bytes each rung of the boot prints.
# The kernel prints them and `serial_console` matches them, so AGENTS.md rule 7 makes them a crate
# rather than two copies of a literal. That is not hypothetical here: the one marker that existed
# before this crate WAS two copies of a literal, one inside a single architecture's arm.
boot_ladder = { version = "0.1.0", path = "../crates/boot_ladder" }
# The per-test time record's grammar (milestone 807 (the kernel suite reports what each test cost), §254 (a gate prints what each item cost), Fork 1): the test runner prints it and
# `xtask` parses it, so rule 7 makes it a crate.
test_times = { version = "0.1.0", path = "../crates/test_times" }
# The soak workload's shared page (milestone 219): the kernel reads the progress counters the
# `soaker` program writes, through one definition of the layout rather than two copies.
soak_page = { version = "0.1.0", path = "../crates/soak_page", optional = true }
# The multi-tasking workload's definition (milestone 168). The kernel-side supervisor and the EL0
# task read one description of what a job is, rather than two copies that drift.
job_mix = { version = "0.1.0", path = "../crates/job_mix", optional = true }
# The compositor contract (milestone 33): the kernel wires the scene and its tests predict the
# composed screen from the same definition the compositor and its clients paint from.
compositor = { version = "0.1.0", path = "../crates/compositor" }
# The online-cpu set as mask arithmetic (the 2026-08-14 first-silicon sweep). The kernel's
# `smp::online_cpus`/`nth_online` add only the live mask; the non-contiguous {1,2,3} shape the QEMU
# suite cannot boot is host-proven in this crate instead.
cpu_set = { version = "0.1.0", path = "../crates/cpu_set" }
current_cpu_contract = { version = "0.1.0", path = "../crates/current_cpu_contract" }
# The user address-space map (milestone 206 (a program image has under 896 KiB), DECISIONS §171 (where a program image starts) option D): where the loader puts a
# program's image and stack, and the check that refuses an image that does not fit, shared with the
# userspace loader so the two cannot disagree about either.
address_space_map = { version = "0.1.0", path = "../crates/address_space_map" }
machine_statistics_contract = { version = "0.1.0", path = "../crates/machine_statistics_contract" }
# The credential contract (milestone 56, the credential half). The kernel wires the credential
# service and its provisioner, and its tests read the reply codes the userspace clients report, so
# no party has its own copy of what a verdict means.
credential_contract = { version = "0.1.0", path = "../crates/credential_contract" }
# The login contract (milestone 49). The kernel wires the login service and `login_test_client`'s
# roles, and the tests read the same reply and attribution codes the service sends, so no party has
# its own copy of what a verdict or an attribution record means.
login_contract = { version = "0.1.0", path = "../crates/login_contract" }
coremark = { version = "0.1.0", path = "../crates/coremark", optional = true }
# The byte-sink contract, for the release bench's walk (milestone 606 (a directory walk costs what it
# does on Linux)): the bench reads a std program's transcript through the same framing the PAL packs
# with. Only `bench` uses it; the system tests have their own copy of the dependency (milestone 609
# (the system tests leave the kernel crate)).
byte_sink_contract = { version = "0.1.0", path = "../crates/byte_sink_contract", optional = true }
# The kernel's ring layout and the F3 record (milestone 342 (the kernel and the `console` server
# drive one UART from two address spaces)): the kernel writes what the log service reads, so both
# link one definition. no_std, no dependencies.
system_log_contract = { version = "0.1.0", path = "../crates/system_log_contract" }
nifefs = { version = "0.1.0", path = "../crates/nifefs" }
direct_memory_access_validator = { version = "0.1.0", path = "../crates/direct_memory_access_validator" }
filesystem_contract = { version = "0.1.0", path = "../crates/filesystem_contract" }
# Optional, and only for the `bench` feature's filesystem benchmark (see the feature below):
# the throughput and walk shapes are test data since milestone 886 (the filesystem test fixture
# moves to its own crate), and nothing that boots links them.
filesystem_fixture = { version = "0.1.0", path = "../crates/filesystem_fixture", optional = true }
graphics_contract = { version = "0.1.0", path = "../crates/graphics_contract" }
# The entropy contract (milestone 56, DECISIONS §44). The kernel wires the entropy service and its
# tests are its clients, speaking the same request/reply the std PAL does, so no party has its own
# copy of the wire format.
entropy_contract = { version = "0.1.0", path = "../crates/entropy_contract" }
# The JH7110 TRNG's register logic and DTB discovery (milestone 159), the same
# pure-logic/volatile-shell split `pci` and `non_volatile_memory_express` below already use. The kernel takes it for one
# thing only: `discover`, the device-tree query that says whether this machine has a TRNG at all,
# so `entropy_service` can wire the userspace driver for it (`components/src/jh7110_entropy.rs`) instead of
# keeping a second copy of the `compatible` string and the `reg` decode.
jh7110_entropy = { version = "0.1.0", path = "../crates/jh7110_entropy" }

# The JH7110's clock and reset generator (milestone 220), for `drivers::jh7110_clock_and_reset` and for
# `memory::init`'s discovery of the controller's window. Pure logic; the volatile half is the
# kernel driver. On radon the TRNG's register file read as all zeros on 2026-09-04 because
# nothing had ungated its clocks, which is the whole reason this is a dependency.
jh7110_clock_and_reset = { version = "0.1.0", path = "../crates/jh7110_clock_and_reset" }
# The JH7110's SD/MMC controller (milestone 53 (the board's own peripherals: network and storage on
# real silicon)): the whole driver as pure logic behind one `Registers` trait, which
# `kernel/src/designware_mobile_storage.rs` implements over a mapped device window.
designware_mobile_storage = { version = "0.1.0", path = "../crates/designware_mobile_storage" }
device_tree_blob = { version = "0.1.0", path = "../crates/device_tree_blob" }
pci = { version = "0.1.0", path = "../crates/pci" }
# The NVMe queue mechanics (milestone 53's storage half): pure logic, host-tested and proved; the
# kernel's non_volatile_memory_express module is its volatile half, the same split as `pci` above.
non_volatile_memory_express = { version = "0.1.0", path = "../crates/non_volatile_memory_express" }
# The `e1000e` NIC family's register map, descriptors and ring logic (milestone 494 (a driver for the
# network card a PC actually has)): the kernel resets the device and programs the rings' bases from
# it, and hands `net_stack` its `Handoff`. Same split as the NVMe crate above.
e1000e = { version = "0.1.0", path = "../crates/e1000e" }
# The JH7110's Ethernet controller (milestone 53 (the board's own peripherals: network and storage
# on real silicon)): register map, descriptors, ring logic, the bring-up and PHY sequences and the
# coherence probe, all host-tested. `kernel/src/designware_ethernet.rs` is its volatile half, the
# same split as `e1000e` above.
designware_ethernet = { version = "0.1.0", path = "../crates/designware_ethernet" }
# The xHCI half of the USB keyboard (milestone 242 (USB host and HID)): the register window the
# driver is mapped and the handoff it is spawned with. The kernel's extensible_host_controller_interface
# module is its volatile half, the same split as `non_volatile_memory_express` above.
extensible_host_controller_interface = { version = "0.1.0", path = "../crates/extensible_host_controller_interface" }
elf = { version = "0.1.0", path = "../crates/elf" }
page_frames = { version = "0.1.0", path = "../crates/page_frames" }
intrusive_fifo = { version = "0.1.0", path = "../crates/intrusive_fifo" }
inter_process_communication = { version = "0.1.0", path = "../crates/inter_process_communication" }
# What machine is this (milestone 60). The kernel reads the device tree and the ID registers; every
# decoding of what it finds lives in the crate, host-tested against a real device tree and against
# words a real part reports, because a parser proved only inside a booting kernel is a parser proved
# by nothing that runs in milliseconds. The `fw_cfg` wire format, from milestone 243 (a machine with
# no serial port), so that the big-endian encoding QEMU's firmware interface wants is proved on the
# host and the kernel driver is a volatile write and a poll.
firmware_configuration = { version = "0.1.0", path = "../crates/firmware_configuration" }
machine_discovery = { version = "0.1.0", path = "../crates/machine_discovery" }

# The terminal contract's IPC framing (DECISIONS §21): the kernel's display-terminal tests play both
# an application (OPERATION_WRITE) and an input driver (OPERATION_BYTES), so they speak the same protocol the
# serial terminal's clients and drivers do rather than a second one invented for a test.
line_editor = { version = "0.1.0", path = "../crates/line_editor" }
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }
# The installed-programs table's names and line format (milestone 198 (a package manager)), which the harness
# writes when a test installs a program the way an installer would: milestone 152 (durable
# delegation) runs a scheduled job from it. Only the system tests do, so only their feature links it.
installed_programs = { version = "0.1.0", path = "../crates/installed_programs", optional = true }
# **Text on a screen for a machine with no serial port** (milestone 243). The painter and the cursor
# are pure logic over a `&mut [u8]`, so they are proved on the host in milliseconds rather than by
# looking at a monitor, which is the one thing nobody in this project can do from a lane. The kernel
# half is `console::attach_screen`: an address, a geometry and a lock it already holds.
screen_console = { version = "0.1.0", path = "../crates/screen_console" }
paging = { version = "0.1.0", path = "../crates/paging" }
memory_regions = { version = "0.1.0", path = "../crates/memory_regions" }
# The socket contract (milestone 30, and 107's inbound half). The kernel's spawn service is what
# *grants* a net server its listen ports, so it packs the grant with the same `listen_grant` the
# server checks against rather than open-coding the layout of a word two programs must agree on.
socket_contract = { version = "0.1.0", path = "../crates/socket_contract" }
generational_table = { version = "0.1.0", path = "../crates/generational_table" }
# The lock under `IrqSafeMutex`: an Acquire compare-exchange and a Release store, written in the
# tree so loom can check them, the fourth retrofit of work_steal_slot's move. Its `unsafe` and what
# checks it: notes/kernel-dependency-unsafe.md. See notes/interleaving.md.
spin_lock = { version = "0.1.0", path = "../crates/spin_lock" }
# The work-steal handshake (milestone 80): the one lock-free cross-core protocol in the scheduler,
# lifted out of `cpu.rs` so a model checker can reach it. The kernel calls the checked type rather
# than keeping a second copy of the compare-exchange, the same move `memory_regions`,
# `inter_process_communication` and `direct_memory_access_validator` made for Kani. See
# notes/interleaving.md.
work_steal_slot = { version = "0.1.0", path = "../crates/work_steal_slot" }
# The VT engine, and through it the font (milestone 29 (a display terminal: framebuffer, virtio-gpu,
# and a foreign component)'s text increment, milestone 142 (a text display good enough that people
# use it instead of a GUI)'s atlas). The kernel does not draw anything; it *predicts*. Its
# display-terminal tests run the same engine over the same script the terminal was sent and compare
# the framebuffer pixel for pixel, so no process grades its own homework and the picture is a value
# rather than a screenshot somebody eyeballed once.
video_terminal = { version = "0.1.0", path = "../crates/video_terminal" }
# The scheduler's block/wake handshake, so the kernel calls the loom-searched transitions rather
# than keeping a copy of them: the second retrofit of work_steal_slot's move, asked for by the
# fourth bench stop's audit. See notes/interleaving.md.
thread_wake_handshake = { version = "0.1.0", path = "../crates/thread_wake_handshake" }

[build-dependencies]
# The measured-boot digest parser, shared with the kernel proper so the manifest the build writes and
# the trust root the kernel checks have exactly one definition of the format (milestone 22 phase B.1).
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }

# **What only the kernel's own unit tests link.** A dev-dependency is built for `cargo test` and
# never for `cargo build`. The whole-system suite's crates moved with it to `system_tests/`
# (milestone 609 (the system tests leave the kernel crate)); `soak_page` stays for the
# `ipc_stack_depth` test that lives beside its module here.
[dev-dependencies]
soak_page = { version = "0.1.0", path = "../crates/soak_page" }

[features]
# **This kernel is the system-test image's** (milestone 609 (the system tests leave the kernel
# crate)). Only `system_tests/` turns it on. It makes the boot a test boot, the way `cfg(test)` does
# for `cargo test -p kernel`, exposes `system_test_access` (lib.rs), and calls the suite that crate
# defines. A kernel binary built with it fails to link, on purpose; lib.rs says why. Name provisional.
system_tests = [
    "dep:installed_programs",
    # The DMA-escape wiring writes `ESCAPE_MAGIC` (milestone 261); see that crate's feature.
    "non_volatile_memory_express/confinement_attackers",
]
# The board build (milestone 16a): the kernel targets the VisionFive 2 (JH7110) rather than
# QEMU's `virt` machine. A property of the target, not the build mode: the board has no
# sifive_test finisher, so the test exit prints a UART marker and calls SBI SRST shutdown
# instead of storing to a nonexistent MMIO word. See notes/visionfive2.md.
board = []
# The T-Head TH1520 (milestone 89 (Scaleway EM-RV1)): the board build, for Scaleway's Elastic Metal
# RV1 rather than radon. It moves the early console to UART0 at 0xff_e701_4000 (arch/riscv64/
# machine.rs) and selects the page-table format with T-Head's memory-type bits (XTheadMae,
# paging::Sv39Mae), which firmware turns on. A kernel built with it refuses to run on a hart
# without MAEE, and one built without it refuses a hart with it. riscv64 only. Name provisional.
board_th1520 = ["board"]
# The benchmark boot (milestone 21): run the microbenchmarks and halt. See script/bench.
# `filesystem_fixture` joins it optional (milestone 886 (the filesystem test fixture moves to its
# own crate)): the filesystem bench speaks the
# throughput benchmark's shape, which is test data, so the booting kernel never links it.
bench = ["dep:coremark", "dep:byte_sink_contract", "dep:filesystem_fixture"]
# The instruction-count instrument (milestone 78): boot under `-icount shift=0,sleep=off`, where
# virtual time is a deterministic function of instructions retired, and assert the two timing claims
# no wall-clock test can make. See script/icount and kernel/src/icount.rs. Name provisional.
#
# **It implies `bench`, and does not extend it.** The two boots park at the same point, before the
# tour and before userspace, so they make exactly the same set of functions unreferenced. `bench`
# already carries that set, spelled out one `cfg` at a time across `main.rs`, `sched.rs`, `user.rs`,
# `memory.rs` and `trust.rs`. Declaring this feature independent means duplicating every one of those
# conditions in files every lane touches, to describe a fact that is already described; a crate-level
# `allow(dead_code)` is the other way to avoid that and DECISIONS §38 refuses it, correctly.
#
# What it costs: the icount kernel carries the benchmark code, compiled and never run, because
# `icount::run` diverges first. Nothing measures this binary against a baseline, so the codegen drift
# that makes `bench --check` a coarse tripwire is not a cost here. `script/bench`'s own binary is
# untouched either way, which is the property that actually mattered: a baseline forced to be
# re-saved by an unrelated instrument is a tripwire that just lost its history.
icount = ["bench"]
# The TSC-vs-RTC measurement (the `tscdrift` lane, 2026-09-21): boot, measure the time-stamp
# counter against the CMOS RTC for half a minute, print the implied rate and halt. Off by default
# and in no gate. It is an instrument rather than a test, for the same reason `bench` is: the
# question it answers takes thirty-five seconds of wall clock and has no pass/fail. Its owner and
# its results are notes/tsc-under-tcg.md; the calibration fix that note proposes is what it exists
# to be measured against. Name provisional. See kernel/src/arch/x86_64/tsc_probe.rs.
tsc_probe = []
# The xHCI port probe (lane maintainer/xenon-usb-no-ports, 2026-10-21): print every root port's
# `PORTSC` before the firmware handoff, and on a five-second timeline after the USB keyboard
# driver's scan, as `xhci-probe:` lines. An instrument, off by default and in no gate, for the
# question of why a bench machine's scan finds no port connected. See kernel/src/xhci_port_probe.rs.
# Name provisional.
xhci_port_probe = []
# The soak boot (milestone 219): the tour does not halt, it builds a pool of user-mode IPC workers
# and watches them forever, so `design/fatal-risks/README.md` risk 5's decisive experiment has something to
# run. Off by default; every ordinary boot still halts. See kernel/src/soak.rs and script/soak-test.
#
# Spelled `soak_test` since milestone 297 (`soak` becomes `soak-test`), calef's ruling of
# 2026-09-14: it matches the command `script/soak-test` in the one domain a cargo feature has, a
# Rust identifier, so snake_case where the script is hyphenated. It was `soak` until then.
soak_test = ["dep:soak_page"]
# The multi-tasking workload benchmark (milestone 168): the tour does not halt, it sweeps a pool of
# EL0 tasks through a heterogeneous job mix and prints jobs-per-minute against task count, which is
# the instrument design/decisions/0096-process-kernel-or-event-kernel.md says it is missing. Off by
# default. A feature rather than a `bench.rs` row because the number has to be taken on a board, and
# the path a board takes is script/board-image plus script/board-console. See kernel/src/job_mix.rs
# and script/job-mix. Name provisional.
job_mix = ["dep:job_mix"]
# The job mix, plus a count of every kernel lock acquisition that found its lock held and how long it
# waited, printed as `job-mix-lock:` lines after each sweep point (2026-10-04, for fatal risk 4's
# `null_syscall` question). Its own feature so the plain job-mix image stays the kernel that ships:
# this one adds a flag and a counter to every `invoke`. See kernel/src/lock_wait.rs and
# notes/job-mix/null-syscall-under-load.md. Name provisional.
lock_wait = ["job_mix"]
# **Fatal risk 6's bench boot** (milestone 261 (the NVMe driver leaves the kernel)): after the tour, print two preflight verdicts (does
# the VT-d unit this kernel programs own the NVMe's requester id; does the namespace's LBA size give
# `blocks_per` in 1..=8), then time the confined EL0 NVMe server's reads and writes and halt with
# one verdict line. **It writes**: a window of blocks from 1 MiB into the namespace is overwritten
# and read back. Off by default and in no gate; `cargo xtask disk-throughput` rehearses it under
# OVMF and stages the stick image. See kernel/src/disk_throughput.rs and
# notes/risk-6-bench-evening.md. Name provisional.
disk_throughput = []
# **Milestone 494 (a driver for the network card a PC actually has)'s bench boot**: after the tour,
# bring up the `e1000e` NIC, print which IOMMU unit owns it, take a DHCP lease, drain a TCP stream
# from the peer named at build time (`NIFE_NETWORK_BENCH_PEER=a.b.c.d:port`) and halt with one
# verdict. Off by default and in no gate; `cargo xtask network-bench` rehearses it under OVMF and
# stages the stick. See kernel/src/network_bench.rs and notes/e1000e.md. Name provisional.
network_bench = []
# **Milestone 53 (the board's own peripherals: network and storage on real silicon)'s storage bench
# boot**, riscv64 only: after the tour, bring up radon's microSD controller, identify the card,
# read its partition table and time a sequential read, then the same read-only probe on the eMMC
# socket, and halt with one verdict. **Read-only** unless built with
# `NIFE_STORAGE_BENCH_WRITE=scratch`, which adds a write test confined to the sectors before the
# card's first partition and restores what it found there. Off by default and in no gate. See
# kernel/src/storage_bench.rs and notes/designware-mobile-storage.md. Name provisional.
storage_bench = []
# Milestone 53 (the board's own peripherals)'s multi-block read diagnosis: after the storage bench,
# read the same blocks at three card clocks, four lengths and two FIFO depths, print how full the
# FIFO got on each, then cold-reset the board so a netbooted bench can fetch its next image.
# Read-only. Name provisional.
storage_read_matrix = ["storage_bench"]
# The rebooting soak (milestone 249 (the boot lottery is sampled by a person walking to the board)): after a fixed window the soak asks the firmware for a **cold
# reboot** instead of beating forever, so the boot-time thread-placement lottery can be drawn fifty
# times unattended rather than nine times by a person walking to the board. All three
# architectures since 2026-09-24: SBI SRST on riscv64, PSCI SYSTEM_RESET on aarch64, and the FADT
# reset register then ports 0xcf9 and 0x64 on x86_64, each behind `arch::reboot`.
#
# **It implies `soak_test`, because without it there is no beat loop to hang the window off** and no
# workload whose rate is the thing being sampled. **It no longer implies `board`** (2026-09-24),
# which it did on the belief that a reset under QEMU was meaningless. It is not: QEMU resets the
# machine and loads `-kernel` again, which is exactly the second boot `script/soak-test --reboot`
# watches for as its proof. A card for radon still gets `board` because `script/board-image`
# passes it explicitly, as it always has.
#
# **The name carries the hazard on purpose.** `boot_lottery` was considered and refused: it names
# the phenomenon being measured, and the flag is met by an operator about to write a card that will
# make their board reset itself on a timer. The word that has to be in the name is the one that
# describes what the machine will do, not what the data will show.
#
# Name provisional (milestone 249): calef names what a reader meets.
#
# **Respelled `reboot_soak_test` by milestone 297**, 2026-09-14, following calef's ruling on
# `script/soak-test`. The head noun is `soak`, not `reboot`: this is a *soak that reboots*, so
# renaming the head gives `reboot_soak_test` and nothing else about the compound changes.
# `soak_test_reboot` was refused for making `reboot` the head, which would name a reboot test that
# happens to soak, and that is the wrong thing. The hazard the paragraph above insists the name
# carry is still carried: `reboot` is still the first word an operator reads.
reboot_soak_test = ["soak_test"]
# The watchdog soak (milestone 593 (a wedged kernel resets itself), provisional number): the soak
# arms the chipset's watchdog when it starts and pets it from its beat, so a kernel that wedges is
# reset by the hardware instead of waiting for a person. The Intel TCO on x86_64 and the JH7110's
# watchdog on riscv64; aarch64 has none, and `kernel/src/soak.rs` says so with a `compile_error!`.
# **On x86_64 and riscv64 every `soak_test` build has it without naming this feature**, on calef's
# ruling of 2026-09-26 (UTC), "A soak should reset itself when it freezes": `build.rs` sets the
# `soak_watchdog` cfg the code reads, and cargo features cannot differ by target. Naming it insists
# on the watchdog. Name provisional, and it follows `reboot_soak_test`'s shape on purpose: the
# hazard word first.
watchdog_soak_test = ["soak_test"]
# **The opt-out**: an x86_64 soak that does not arm the watchdog, so a wedge stays a wedge on the
# console instead of becoming a reset. `script/soak-test --no-watchdog` builds it on x86_64, and
# `script/board-image --soak --extra-features unwatched_soak_test` on riscv64. On aarch64 it changes
# nothing, since no aarch64 soak arms a watchdog. It refuses to combine with
# `watchdog_soak_test` (`kernel/src/soak.rs`). Name provisional: the hazard word first, like its
# siblings, and the hazard is that nothing recovers the machine.
unwatched_soak_test = ["soak_test"]
# **Test only**: the watchdog soak with a deliberate wedge. Thirty seconds in, the supervisor masks
# interrupts on its core and spins, so the beat stops and nothing pets the watchdog. Its only use is
# `script/soak-test --wedge`, the QEMU proof that the watchdog resets a wedged kernel, and the
# bench step that proves a board's watchdog with a person watching (radon's, in milestone 593's
# block). Never put it on a card left unattended. Name provisional.
wedge_soak_test = ["watchdog_soak_test"]
# Milestone 342's proofs (names provisional). `console_flood`: once a drainer attaches, the kernel
# prints a line every ten ticks, for `script/swish-check --flood`. `kernel_log_detached`: the kernel
# never treats its drainer as keeping up, the negative control (every line direct, as before 342).
# `kernel_log_panic_probe`: the flood panics on its thirtieth line, for `--panic-probe`.
console_flood = []
kernel_log_detached = []
kernel_log_panic_probe = ["console_flood"]
# **The boot self-test's fault injector** (milestone 268). `exceptions` reports failure, and the
# counter the `timer` and `scheduler` checks read stops, so the verdict line goes red on a kernel
# that is otherwise fine. The second fault is the one that used to hang the boot in `timer`; with
# it injected, every `--inject` run also proves those waits are bounded (a regression goes quiet
# instead of red, and the gate fails). Only the checks' copy of the counter stops; the scheduler's
# own clock is untouched.
#
# It exists because a verdict nobody has seen red is a verdict nobody has tested, and milestone
# 268's proof condition is exactly that: the same failure injected into any one architecture turns
# the verdict red there and fails CI. `cargo xtask boot-check --inject` builds each architecture
# with this on and asserts the gate goes red; without it the only way to exercise the red path
# would be to break the kernel for real, which is a thing nobody does on purpose twice.
#
# Off by default and never on in anything that ships. It changes one boolean and prints a different
# sentence; it breaks nothing, which is deliberate, because an injector that actually broke the
# machine would be untestable in the one configuration it is for.
#
# Name provisional (milestone 268): calef names what a reader meets.
self_test_injection = []
# Adds a test that deliberately livelocks while making IPC progress, to prove the per-test wall-clock
# ceiling catches what the no-progress heartbeat cannot see (testing.rs). It is EXPECTED TO FAIL the
# run, so it is not part of the normal suite; see notes/scheduler.md for the command that runs it.
watchdog_probe = []
# The cycle-counter instrument (milestone 237): builds milestone 229's per-thread cycle-counter
# grant, the mechanism DECISIONS 139 decided. Off by default, so a production kernel does not carry
# it; `script/bench`, `script/icount` and milestone 25's cross-OS comparison turn it on to take a
# cycle figure at user level.
#
# **What it costs when it is on**, measured rather than asserted: **136 bytes, all of them in
# `sched::schedule`**, on `script/fastpath-footprint`'s aarch64 `ipc_fastpath` closure (5852 with the
# feature off, 5988 with it on, byte for byte the two figures milestone 237's block was minted from).
# Every other symbol in the closure is identical either way. That is why it is a feature: the grant's
# only consumer is a benchmark, and no program can request it at all until 229's deferred ABI is
# minted. Milestone 237 also argued an ordinary boot paid for the switch read anyway; milestone 300
# found that true only of the release build, where the constant folds. In the debug build the icount
# gate measures, the fold does not happen: the read and the install were costing yield_switch +35.6
# and ctx_switch +36.0 ticks per switch on aarch64. They are now `#[cfg]`-gated at the switch site
# (see `sched::install_cycle_counter_grant`) rather than threaded through the switch tuple and trusted
# to fold, the same fix milestone 299 gave the port grant, so a feature-off boot pays nothing on any
# build. See design/roadmap/0237-the-cycle-grant-is-a-measurement-build.md.
#
# **The gate on every piece is `any(test, feature = "cycle_counter_grant")`, not the feature
# alone**, and that is deliberate. Milestone 229's proofs (the embryo refusal in `sched`, the EL0
# round trip in `user::tests`, the register-field assertions in each arch's `timer`) are the only
# things that exercise this path, and a gated path rots unless something builds it. Folding `test`
# in means `script/test` compiles and runs all of them on all three architectures on every run,
# which is a stronger keep-alive than a CI build-only job, and the release kernel
# `script/fastpath-footprint` measures has no `test` cfg so production still pays nothing.
#
# **It is not deletion, and the difference is the point.** Removing the code would make the
# published cycle number unreproducible and would quietly return DECISIONS 139's answer to
# "closed for everyone", which is not the answer that was given.
#
# Name provisional, like everything a lane mints: `cycle_counter_grant` is the field it builds
# (`Thread::cycle_counter_grant`) rather than a new word for it. Names are an architect's.
cycle_counter_grant = []
# E3's footprint-perturbation experiment (milestone 134,
# design/roadmap/0134-the-measurements-that-decide.md): adds a large, reachable-but-never-taken
# function to the IPC fastpath's call graph, roughly doubling `ipc_fastpath`'s measured footprint,
# so `script/fastpath-footprint --features fastpath_pad` and `cargo xtask bench --real
# --extra-features fastpath_pad` can compare the padded build against the un-padded baseline while
# the two run byte-identical IPC work. Off by default: an ordinary build never links the padding
# in. See kernel/src/fastpath_pad.rs. Name provisional.
#
# **Sized, and shiftable, by environment rather than by more features** (milestone 134's layout
# control, 2026-09-19). `NIFE_FASTPATH_PAD=<units>` sets the sled's length in units of what this
# feature has always linked (unset is 1, the sled the 2026-09-04 session booted),
# and `NIFE_FASTPATH_SHIFT=<bytes>` appends unreferenced zeros after it, which moves the same code
# the pad moves and adds nothing reachable. kernel/build.rs reads both, and only when this feature
# is on, so an ordinary build cannot see them. The linker scripts place the sled's section first in
# `.text`, so both numbers move the whole kernel text and a pad and a shift of equal displacement
# produce identical binaries apart from the sled's own bytes. Not features because a feature's
# *name* enters cargo's `-C metadata` hash, which reorders codegen units: seven sibling features
# were built and measured, and each reshuffled up to 11 KB of code ahead of the sled, drowning the
# shift it was meant to control. notes/footprint-perturbation.md has the procedure.
fastpath_pad = []
# Milestone 134's per-IPC kernel stack depth (kernel/src/ipc_stack_depth.rs): paints a thread's own
# kernel stack before each IPC operation and scans it after, so the deepest byte one SEND, RECEIVE,
# CALL, RECEIVE_CAP or REPLY reaches is a measurement rather than E1's estimate. `script/test` builds it
# unconditionally (every piece is `any(test, feature = "ipc_stack_depth")`, the `cycle_counter_grant`
# shape, so the path cannot rot); this feature exists so the **release** kernel, which is what radon
# boots and what E1 ran on, can be measured too, by a bench boot that prints the same lines. Off by
# default and in every build that measures time or footprint: it adds a call at the end of
# `syscall::dispatch`. See notes/stack-high-water.md. Name provisional.
ipc_stack_depth = ["dep:soak_page"]
# The single-hart boot (milestone 134's E1/E3/E4 on radon): `smp::bring_up_secondaries` marks the
# boot core online and starts nobody, so the kernel runs on one hart on a machine that seats four.
#
# **It exists because a precondition and a machine disagreed.** E1 and E4 require a single hart, so
# that every thread in the sweep contends for the SAME core's cache, which is the effect under test;
# under QEMU that is `-smp 1` on the runner's command line, and a board has no command line. radon
# seats four U74s, so a plain `board,bench` card satisfies E1's "real cache" half and fails its
# "one hart" half, and both benchmarks print a skip line on the exact machine they were designed
# for. This is the flag that closes that gap.
#
# **What it costs, and it is not free:** `smp_throughput` self-skips on a card built with it (it
# requires more than one core, for the opposite reason), and so do `fs_read` and `fs_throughput`.
# A bench session that wants both takes two cards. Off by default; nothing but a deliberate
# measurement build ever parks a core the machine paid for.
#
# Name provisional (2026-09-04): it says what the machine will do, the same test `reboot_soak`'s
# name was chosen by. (That feature is spelled `reboot_soak_test` since 2026-09-14; the account
# above keeps the name it was decided under, which is what `design/naming.md` asks for.) `bench_single_core` was refused as naming the caller rather than the effect.
# **Ratified by calef, 2026-09-04.** `one_core` and `no_secondaries` were the alternatives; `hart` is
# RISC-V's own word and the reader who knows the ISA knows it, which is the same argument that keeps
# `elf` and `pci` unrenamed. The feature is not riscv64-only and the name is, which is the cost taken.
single_hart = []

