[package]
name = "system_initializer"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The user address-space map (milestone 206 (a program image has under 896 KiB)): every fixed window here is checked against its band.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
abi = { version = "0.1.0", path = "../abi" }
# The machine statistics page's address in a child (milestone 126 (the `procps` package), DECISIONS §225 (`free` sees the machine and your share)): one constant
# the kernel's page and its readers agree on, so this progenitor maps it where they look.
machine_statistics_contract = { version = "0.1.0", path = "../machine_statistics_contract" }
nifefs = { version = "0.1.0", path = "../nifefs" }
elf = { version = "0.1.0", path = "../elf" }
# The grant expression and its wire form: what the shell resolved a typed line into, and the
# protocol init decodes on the other side of the spawn channel. This crate is that other side.
grant_plan = { version = "0.1.0", path = "../grant_plan" }
# The wire format of a manifest a program carries in its own bytes (milestone 597 (a program carries
# its manifest in an ELF note), provisional): the progenitor endows a file's bytes from the note
# they carry.
capability_manifest_note = { version = "0.1.0", path = "../capability_manifest_note" }
# The filesystem contract, for exactly one word: the readiness sentinel a `fs_subtree_caretaker`
# answers a directory grant's descent with (milestone 31 phase 3). An in-tree protocol crate rather
# than a constant copied here, which is rule 7: what two binaries agree on is a crate. It brings
# nothing with it (filesystem_contract has no non-dev dependencies of its own).
filesystem_contract = { version = "0.1.0", path = "../filesystem_contract" }
# The terminal contract's framing, for the one sentence init prints (`proto::OPERATION_WRITE`).
line_editor = { version = "0.1.0", path = "../line_editor" }
# The hash and the manifest format the kernel measures init with (milestone 104). This crate is the
# next link: it reads the same shape of table out of the archive and applies it to what IT loads.
measured_boot = { version = "0.1.0", path = "../measured_boot" }
# The installed-programs table (DECISIONS §208 (installing a package is granting it)), for where it lives and one question: is this executable's
# digest installed? §219 (how the shell names an installed program to the spawner) option D (milestone 198 (a package manager) rung 3a) looks every image request up in it. Pure
# logic, and it brings only `measured_boot`, which is already here.
installed_programs = { version = "0.1.0", path = "../installed_programs" }
# The package format and the installer's decision on bytes (`package_archive::installable`), for
# `package install` (milestone 198 rung 3a's installer): the progenitor checks a package against
# the image's catalogue and takes its program member out. Pure logic, bringing only `measured_boot`.
package_archive = { version = "0.1.0", path = "../package_archive" }
# The distribution's index (milestone 801 (packages over the internet)): the name of the image's
# index sources entry, and the reader of the index copy `jig` writes, which the installer consults
# when the image's catalog does not vouch for a package (ruling I2). Pure logic, `no_std`, bringing
# only the two crates above.
package_index = { version = "0.1.0", path = "../package_index" }
# The sink contract, for the end-of-stream init sends on a child's behalf when the child was never
# built and therefore cannot end its own second stream.
byte_sink_contract = { version = "0.1.0", path = "../byte_sink_contract" }
# The userspace ELF loader, and the fault slot that makes a child born supervised. One loader in the
# tree since milestone 96; this crate is one of its two callers.
supervision_protocol = { version = "0.1.0", path = "../supervision_protocol" }
# The std runtime contract (milestone 595 (provisional)): the slots and pages the spawn service
# places a `std` child's capabilities at. Constants only, no dependencies.
std_runtime_contract = { version = "0.1.0", path = "../std_runtime_contract" }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
# The two graphical programs' status words (milestone 600 (provisional)): `gpu_driver`'s `UP` and
# `FLUSHED`, `display_terminal`'s `TERM_UP` and mode, and `keyboard_driver`'s `KEYBOARD_UP`, which
# this crate receives now that it builds the graphical stack the kernel used to. Rule 7: what two
# binaries agree on is a crate. `graphics_contract` brings nothing; `video_terminal` brings
# `bitmap_font`.
graphics_contract = { version = "0.1.0", path = "../graphics_contract" }
video_terminal = { version = "0.1.0", path = "../video_terminal" }
# The login service's spawn contract (milestone 233), for exactly two constants: the addresses this
# crate maps `fs_subtree_caretaker`'s image and the measurement table at before starting `login`.
# Rule 7 (what two binaries agree on is a crate) leaves nowhere else to put them. Pure logic, and it
# brings only `credential_contract`, which this crate already depends on directly.
login_contract = { version = "0.1.0", path = "../login_contract" }
# The entropy contract (DECISIONS §120's 2026-08-26 amendment), for the one message this crate
# reads: the readiness sentinel an entropy service answers once it has drawn its first bufferful
# from a real device. Pure logic, no non-dev dependencies of its own.
entropy_contract = { version = "0.1.0", path = "../entropy_contract" }
# The socket contract (milestone 590 (the booted system starts its network stack)), for exactly one
# word: the inbound authority this
# crate hands the `net_stack` it builds (`NO_LISTEN_GRANT`). Pure logic, no dependencies of its own.
socket_contract = { version = "0.1.0", path = "../socket_contract" }
# The name resolver's contract (milestone 892 (a std program at the prompt holds the network and a
# resolver)): the start words this crate tells `domain_name_resolver`, and the grant and forget messages
# it sends for each job that may resolve. Pure logic over `domain_name_system`.
domain_name_resolution_contract = { version = "0.1.0", path = "../domain_name_resolution_contract" }
# The credential contract (milestone 49's boot-wiring update), for the request word `identity_provisioner`
# needs staged and the provision opcodes (`PUT`, `SEAL`) this crate sends directly. Pure logic, no
# non-dev dependencies of its own; `login_contract` itself re-exports the same functions rather than
# duplicating them, so this is the one crate both `login.rs` and this file ultimately share.
credential_contract = { version = "0.1.0", path = "../credential_contract" }
