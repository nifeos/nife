# Name: ratified 2026-08-30 (calef, in session, on milestone 87's lane report). `uefi_loader` is a noun, `snake_case` like
# every other Rust name in the tree, and `UEFI` is a standard term of art the naming tenet protects
# rather than an abbreviation a reader has to decode, the same class as `elf`, `pci` and `dtb`.
# Refused `efi_stub`, because "stub" says what it is small relative to rather than what it is, and
# this is a loader by any reading; refused `bootloader`, because it is generic enough to name almost
# anything in an operating system and says nothing about which firmware speaks to it.
#
# WHY IT IS A WORKSPACE MEMBER AND NOT AN EXCLUDED PACKAGE like `fuzz` or `vendor/redoxfs`. Its
# library half is ordinary `no_std` Rust that compiles and tests on the host, so it belongs in the
# workspace where `script/lint`, `script/fmt` and the host test suite already reach it. Only the
# BINARY half is target-specific, and `required-features` below is what keeps that out of every
# ordinary build: `cargo build --workspace` skips a `[[bin]]` whose required features are off, so
# nothing has to remember not to build a UEFI application for macOS.

[package]
name = "uefi_loader"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[lib]
name = "uefi_loader"
path = "src/lib.rs"

# The UEFI application itself. `required-features` is the mechanism described above, and the feature
# is the *only* thing that switches it on; `cargo xtask uefi-image` passes it along with
# `--target x86_64-unknown-uefi` and nothing else does.
[[bin]]
name = "uefi_loader"
path = "src/main.rs"
required-features = ["uefi"]

[features]
# Build the UEFI application. Meaningless without `--target x86_64-unknown-uefi`.
uefi = []

# **Write `screen-hold` on the kernel's boot command line**
# (milestone 445 (the screen check stops sampling and starts asking)), which asks the kernel
# to stop between painting its boot tour and clearing the screen, announce that on the serial line,
# and wait for a byte back before handing the screen to userspace.
#
# For one caller, `cargo xtask uefi-boot`, which is the gate that photographs that screen. The
# window it used to sample closes in guest time and no host-side deadline widens it; this replaces
# the sampling with a question and an answer. `machine_discovery::framebuffer::SCREEN_HOLD` is the
# token and `kernel::console::hold_screen_for_host` is what it turns on.
#
# **It must never reach a stick**, which is why the gate stages into `target/esp-screen` and
# `cargo xtask uefi-image` (the one command the bench procedure names) does not pass it. The cost
# of getting that wrong is small and real: a ten-second pause at every boot of that stick, waiting
# for a host that is not there. Same shape and same reason as the kernel's own
# `self_test_injection`, a feature that exists so a gate can assert something a shipped build must
# not do.
#
# Name provisional (milestone 445): calef names what a reader meets.
screen_hold = []

[dependencies]
# The tree's one ELF reader (milestone 208). This loader used to carry a second one because
# `elf::Segment` had no `p_paddr` and, once it did, because `Elf::parse` refused the kernel image
# for shipping an RWX segment. Both are fixed, so there is one reader again, and this loader
# validates the image it places instead of trusting it.
#
# It is not "in between" the two shapes §46 allows: `elf` is ours, in this workspace, with no
# dependencies of its own, and the alternative to depending on it is the duplicate this milestone
# deleted.
elf = { version = "0.1.0", path = "../crates/elf" }

# **The painter the kernel uses, so the loader's last word and the kernel's first are the same
# letters** (milestone 243's early-boot half). The loader paints one line into the framebuffer as
# its final act, after `ExitBootServices` has taken the firmware's console away and before the
# kernel exists, which is the only window on a serial-less machine that nothing else can cover.
# Ours, in this workspace, no external dependencies: not a decision under §46 (thin primitives or
# whole subsystems), and the alternative was a second glyph loop drawing the same font.
screen_console = { version = "0.1.0", path = "../crates/screen_console" }

# **The reader this loader is the writer for**, and since milestone 243 (a machine with no serial
# port) a build dependency rather than only a test one. It was always the crate that decoded this
# loader's `hvm_start_info` in the tests below; what changed is that the loader now WRITES something
# structured into the handoff (the screen the firmware was drawing on,
# `machine_discovery::framebuffer`) instead of only laying out somebody else's fields. Rule 7: what
# two binaries agree on is a crate, and the alternative is two spellings of one token with nothing
# keeping them in step.
#
# It is not a §46 decision: `machine_discovery` is ours, in this workspace, and its own single
# dependency (`device_tree_blob`) is ours and has none.
# Every encoder in `handoff` is tested by decoding its output with the crate the KERNEL decodes
# with, so the two cannot drift apart without a host test failing in milliseconds. This is the same
# rule `byte_sink_contract`, `grant_plan` and `clock_contract` are held to: no party keeps its own copy of
# a layout two programs agree on. It was a `[dev-dependencies]` entry until milestone 243 made it a
# real one; nothing about the test relationship changed.
machine_discovery = { version = "0.1.0", path = "../crates/machine_discovery" }

# **The two-slot boot state, and the policy over it** (rung 2b of milestone 198 (a package manager, and the trivial install that makes a second customer possible)). `src/chooser.rs`
# reads it out of a disk's GPT and `components/src/system_installer.rs` writes it, so rule 7 applies: what
# two binaries agree on is a crate. Ours, in this workspace; its own single dependency is the GPT
# crate below. Not a §46 decision.
boot_slot = { version = "0.1.0", path = "../crates/boot_slot" }

# **The partition table the boot slots are entries in.** The chooser reads a disk's GPT to find
# them and rewrites it to spend a try. Ours, no external dependencies; the alternative is a second
# GPT reader in the one place in the tree that must agree with the installer byte for byte.
globally_unique_identifier_partition_table = { version = "0.1.0", path = "../crates/globally_unique_identifier_partition_table" }
uuid = { version = "1.28.0", default-features = false }

# **The device-tree reader this loader's writers are tested against, and the riscv64 loader's own
# reader.** It was a dev-dependency until this milestone, which was a latent build break rather than
# a choice: `src/arch/riscv64/mod.rs` reads `/chosen/boot-hartid` with it in ordinary code, so
# `cargo xtask stick` could not build that payload at all. The aarch64 loader now names
# `device_tree_blob::Region` too, in the record `machine_discovery::gic` hands back. Ours, in this
# workspace, no dependencies of its own; not a §46 (thin primitives or whole subsystems) decision,
# and not a new edge in the graph either, since `machine_discovery` above already depends on it.
device_tree_blob = { version = "0.1.0", path = "../crates/device_tree_blob" }

# **The UEFI bindings: every table, protocol, GUID and constant this loader speaks** (milestone 784
# (reuse what the tree wrote), item (e)). A §46 (thin primitives or whole subsystems) decision,
# ruled by calef on 2026-10-20 (UTC): "Yes". `r-efi` is a thin primitive: the specification's
# structures in specification order, `no_std`, no dependencies of its own, and the binding Rust's
# own UEFI targets use. Licensed MIT OR Apache-2.0 OR LGPL-2.1-or-later; this tree takes it under
# MIT. What it does not define (RISC-V's boot protocol) is written beside its one caller, and where
# its declarations meet a firmware badly (`block_io::Media`'s `bool` flags) the caller says so.
r-efi = { version = "7.1.0", default-features = false }

[dev-dependencies]
# **A dependency on itself, with `screen_hold` on, so the package's own tests compile the code
# behind it.** `script/lint`'s mutation gate asks for exactly this, and the reason is cargo-mutants:
# it runs `cargo test -p uefi_loader` with the DEFAULT features, so anything behind a non-default
# feature is mutated and never rebuilt, and every mutant there is recorded MISSED. `documentation`
# does the same thing for the same reason. Tests get the feature; consumers and
# `cargo build -p uefi_loader` do not.
uefi_loader = { version = "0.1.0", path = ".", features = ["screen_hold"] }

[build-dependencies]
# **The seal check** (`build.rs`'s `refuse_an_unsealed_pair`): the loader's build reads the archive
# it embeds with the tree's one archive reader and hashes its measured entries with the tree's one
# SHA-256, so a kernel beside an archive it does not vouch for fails the build rather than the
# boot. Since milestone 223 (read a card and say whether its kernel and archive match, before the
# power cycle) that comparison is one crate rather than a copy here and a second copy in the card
# checker. Ours, in this workspace; its own two dependencies are `nifefs` and `measured_boot`, both
# ours and neither with dependencies of its own. Not a §46 (thin primitives or whole subsystems) decision.
sealed_pair = { version = "0.1.0", path = "../crates/sealed_pair" }
