# The in-guest half of milestone 501 (a TLS client that speaks to one pinned peer): a `std` program
# that runs `pinned_tls_client` against helpers/tls-peer through slirp, on all three architectures.
# Built by helpers/build-pinned-tls-exerciser.sh for the `*-unknown-nife` targets, which `cargo
# xtask test` runs for every leg it boots since milestone 855 (the TLS graph enters the gated
# build), packed into the archive, and run by system_tests/src/user/pinned_tls_tests.rs and
# package_index_tests.rs.
#
# Name: provisional, minted 2026-10-06 (UTC) by this milestone's lane, `cryptography_exerciser`'s
# shape: the thing exercised, then the role.

[package]
name = "pinned_tls_exerciser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
pinned_tls_client = { path = "../pinned_tls_client" }
# Named only to match on the refusal a test expects; already in the graph.
rustls = { version = "0.23", default-features = false, features = ["std"] }
# `force-soft` is a feature rather than a cfg, so a binary that links the provider has to name it:
# cargo unifies features across the graph and no crate below can ask for it.
# notes/cryptography-provider.md has the x86_64 finding this answers.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# `package_fetch_exerciser`'s index (milestone 801 (packages over the internet)). In-tree and
# `no_std`.
package_index = { path = "../crates/package_index" }
# `getrandom`'s two custom-backend hooks, over the entropy service. Linked by `use ... as _`.
entropy_backend = { path = "../entropy_backend" }

[profile.release]
overflow-checks = true
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"
