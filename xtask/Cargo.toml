# Name: recorded (AGENTS.md's naming section, the `bind` precedent about not asserting novelty).
# `xtask` is the established Rust pattern for a build-automation binary in its own package
# (matklad's, widely adopted), so this is the protected class: a stranger who has met `cargo
# xtask` anywhere else has met it here. Renaming it would assert novelty where there is none,
# which is the argument DECISIONS §50 (namespace composition (`bind`), not stored paths) records for
# keeping Plan 9's `bind`. no architect has ratified it.

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
nifefs = { version = "0.1.0", path = "../crates/nifefs" }
# The address-space map, milestone 206 (a program image has under 896 KiB): every archived program is checked against its image band.
address_space_map = { version = "0.1.0", path = "../crates/address_space_map" }
# The documentation store (milestone 40). The index is built HERE, on a host with a heap and no
# constraints, because the guest has neither: there is no directory iteration in this system, so
# "what pages exist" cannot be discovered at runtime and has to be computed at image time. Only the
# writer is behind the `builder` feature; the reader that runs confined allocates nothing.
documentation = { version = "0.1.0", path = "../crates/documentation", features = ["builder"] }
# The C programs' directory in the test image and their command lines (milestone 835 (a C library,
# stage 1: files, clock and memory)).
c_program_fixture = { path = "../crates/c_program_fixture" }
filesystem_protocol = { version = "0.1.0", path = "../crates/filesystem_protocol" }
# Milestone 121 (`ripgrep` on nife: enumeration as a capability)'s priced tree: the image builder stages it with the same function a host
# comparison stages it with, so the two cannot be walks over different shapes.
walk_pricing = { version = "0.1.0", path = "../crates/walk_pricing" }
# The partition table (milestone 57's write half): the post-run check reads the table the GUEST
# wrote, from outside the guest, with the same parser the guest used and the same one whose host
# tests run against tables `sgdisk` and macOS `diskutil` wrote. It also slices the data partition out
# of the image so the host tool can open the filesystem inside it.
globally_unique_identifier_partition_table = { version = "0.1.0", path = "../crates/globally_unique_identifier_partition_table" }
# **The boot state `cargo xtask rollback-boot` stages an upgrade with** (rung 2b of milestone 198 (a package manager, and the trivial install that makes a second customer possible)).
# The gate writes a slot's attribute bits through exactly the code the installer writes them with,
# so what it exercises is the format rather than a host-side second spelling of it.
boot_slot = { version = "0.1.0", path = "../crates/boot_slot" }
# The measured-boot hash (milestone 22 phase B.1): the build and the kernel measure the progenitor through the
# same implementation, so there is one definition of the digest.
measured_boot = { version = "0.1.0", path = "../crates/measured_boot" }
# The kernel-and-archive pair check of milestone 223 (read a card and say whether its kernel and archive match):
# `cargo xtask card-check` asks the same question of a
# mounted card that `uefi_loader/build.rs` asks of a pair it is about to embed, through the same
# crate, so a card checker and a build gate cannot come to different conclusions. Ours, in this
# workspace; its dependencies are `nifefs` and `measured_boot`, already here.
sealed_pair = { version = "0.1.0", path = "../crates/sealed_pair" }
# The riscv64 boot file's ELF-to-PE conversion (`cargo xtask stick`), since rustc has no riscv64
# UEFI target. Ours, no dependencies.
portable_executable = { version = "0.1.0", path = "../crates/portable_executable" }
# The framebuffer contract (milestone 29): the host-side scanout check compares QEMU's screendump
# against the same pattern the guest painted, from the same definition, so the two cannot drift.
graphics_protocol = { version = "0.1.0", path = "../crates/graphics_protocol" }
# The 7x8 font (milestone 29's text increment), used directly by milestone 177's graphical
# swish-check leg to decode a screendump's cells back into characters: the same glyph table the
# guest drew from, so a mismatch is the guest's picture being wrong rather than the host guessing.
bitmap_font = { version = "0.1.0", path = "../crates/bitmap_font" }
# The real board's serial console (milestone 216): the recogniser that says how far a boot got, and
# the loop that stops instead of hanging. A crate rather than code in here for the reason every
# host-logic crate in this tree gives: the interesting half is text, and text is worth a thousand
# tests in milliseconds. This file keeps the argument parsing and the report.
board_console = { version = "0.1.0", path = "../crates/board_console" }
# The rungs of the boot ladder (milestone 268), for the markers the UEFI boot waits on: the same
# constants the kernel prints and `board_console` matches, rather than a third copy of one line.
boot_ladder = { version = "0.1.0", path = "../crates/boot_ladder" }
# The per-test time record's grammar (milestone 807 (the kernel suite reports what each test cost), §254 (a gate prints what each item cost), Fork 1): the kernel's test runner prints
# it and `time_record.rs` parses it, so rule 7 makes it a crate rather than a second copy.
test_times = { version = "0.1.0", path = "../crates/test_times" }
# The compositor contract (milestone 33): the same scanout check also verifies the screen the
# compositor composed, against the same scene and the same per-pixel definition the guest used. A
# compositor's output is the thing a guest-side digest cannot confirm on its own.
compositor = { version = "0.1.0", path = "../crates/compositor" }
# The VT engine (milestone 29's text increment): the host-side scanout check runs the same engine
# over the same script the guest's terminal was sent, so "readable text reached the device" is a
# pixel-for-pixel claim rather than an impression. Text is the case where eyeballing is most
# tempting and least sufficient.
video_terminal = { version = "0.1.0", path = "../crates/video_terminal" }
# The programs the shell can spawn (milestone 150): the packer refuses to build an archive missing
# one, because a `Prog` whose binary is not packed compiles, passes every host test and cannot be
# spawned. `no_std` with one in-tree dependency (`glob`), so it costs the host build nothing.
grant_plan = { version = "0.1.0", path = "../crates/grant_plan" }
# To find a program's manifest note on the host and stage a copy of it that cannot be read
# (milestone 597 (a program carries its manifest in an ELF note), provisional), for
# `script/swish-check`'s malformed-note line.
manifest_note = { version = "0.1.0", path = "../crates/manifest_note" }
# The package format (milestone 198 (a package manager, and the trivial install that makes a second
# customer possible), rung 3a). `cargo xtask package` writes a package with the same crate a target
# reads one with, and reads its own output back before writing it to disk, so a producer that
# emitted a file its consumer refuses could not get past the gate.
package_archive = { version = "0.1.0", path = "../crates/package_archive" }
# Recipes and package declarations are TOML (calef, 2026-09-27; JSON refused for having no comments,
# YAML too). A §46 (thin primitives or whole subsystems) dependency, taken rather than written: it is
# host-only and never on the shipping graph, no target reads a recipe, it parses a format calef chose
# rather than one this tree defines, and a TOML parser's correctness is won by exposure, not by
# reading the spec. `serde` is only `serde_core` for `toml::Table`; no derive, no proc macro.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
