# The fuzz workspace for `domain_name_resolution_contract`: the grant table over arbitrary control
# messages.
#
# Its own workspace, the shape of the top-level `fuzz/` (see its Cargo.toml for why cargo-fuzz). It
# lives in the crate's directory so it leaves with the crate, and the root Cargo.toml excludes it.
#
# Name: provisional, 2026-11-20. `fuzz`, matching the directory cargo-fuzz finds by convention, as
# the top-level `fuzz` package and `crates/master_boot_record/fuzz` do.

[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
domain_name_resolution_contract = { path = ".." }
domain_name_system = { path = "../../domain_name_system" }

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "domain_name_resolution_grants_control"
path = "fuzz_targets/domain_name_resolution_grants_control.rs"
test = false
doc = false
bench = false

[workspace]
