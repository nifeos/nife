[package]
name = "machine_discovery"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[dependencies]
# The device tree is the RISC-V source of truth for what the machine is, because RISC-V has no
# CPUID, so the riscv64 half of this crate reads it. The aarch64 half needs nothing: its facts come
# from architected ID registers, which the kernel reads and hands here as raw words.
device_tree_blob = { version = "0.1.0", git = "https://github.com/partsfoundry/device_tree_blob", rev = "96ad52af96e38e38577f91a787f53b789dbdda4f" }
# The JH7110 device crates take plain values and read no tree; `jh7110` finds each block for them
# and fills in their types, so it names them. `designware_mobile_storage` has no type here: its
# slot is this crate's own `jh7110::designware_mobile_storage::Slot`, plain values.
designware_ethernet = { version = "0.1.0-pre.1", git = "https://github.com/partsfoundry/designware_ethernet", rev = "f518554c96f868e0fafcf245afea538a35bf7104" }
jh7110_clock_and_reset = { version = "0.1.0-pre.1", git = "https://github.com/partsfoundry/jh7110_clock_and_reset", rev = "29ef3bb8db37bbd7cfe86713b8270adc48b79323" }
# `pci_express` fills `jh7110_pci_express`'s `Port`, and reads `ranges` with
# `pci_configuration_space`'s decoder.
jh7110_pci_express = { version = "0.1.0", path = "../jh7110_pci_express" }
pci_configuration_space = { version = "0.1.0", path = "../pci_configuration_space" }
jh7110_entropy = { version = "0.3.0-pre.2", git = "https://github.com/partsfoundry/jh7110_entropy", rev = "eac91efd0381cc4cd7556a53e512bcfb2eeaaf17" }

[lints]
workspace = true
