# ext4-oracle: the read and write oracle of milestone 190 (ext4, read and write), a host tool that
# compares what `rsext4` reads from a generated image with what `debugfs` reads, and judges what
# `rsext4` writes with `e2fsck` and a `debugfs` readback. No Debian analogue; the
# closest is a test suite's differential harness, which is never installed.
#
# A test package so that the package-boundary rule refuses a link to it from anything that ships:
# its `rsext4` is ruled host-only (pull request #3639, 2026-11-16 UTC). That is not the adoption
# ruling under §46 (thin primitives, whole subsystems and everything in between), which stays open.
# The corpus recipe, the debugfs side and the write cases under tools/ext4_oracle/ come with the
# crate.
#
# `ext4_server` is the read-only server's contract side, with no ext4 code in it. It stays here,
# where nothing that ships can link it, until the adoption ruling decides what implements its
# `Volume` in an image; tools/ext4_oracle drives it over `rsext4` and judges it against `debugfs`.
# `ext4_oracle_fuzz` (tools/ext4_oracle_fuzz) fuzzes `rsext4` and that server over the same adapter,
# and links `rsext4`'s own fuzz targets, so it is host-only for the same reason and comes with it.
#
# Name: provisional, the lane's proposal; calef names packages. The home is undecided: it leaves
# with the ext4 server it judges, whose package is not yet named.

name = "ext4-oracle"
kind = "test"
home = { status = "undecided", reason = "it leaves with the ext4 server it judges, whose package is not yet named" }
crates = ["ext4_oracle", "ext4_oracle_fuzz", "ext4_server"]
