# xenon's netboot offer, for the house OpenWRT router's dnsmasq (milestone 260).
#
# **Name provisional** (calef names interfaces, AGENTS.md §75): a lane picked
# `bench/xenon-netboot/dnsmasq.conf`, sitting beside `bench/radon-*` where the other board's bench
# evidence lives, and it is expected to change.
#
# WHY THIS FILE EXISTS AT ALL, rather than four lines typed into a router once. A fact that lives
# only in one machine's configuration is the rung-four failure AGENTS.md names: nothing reads it,
# nothing checks it, and a reflashed router takes it with it. So the record is here, and it is not
# only a record. `script/netboot-rehearsal` PARSES THIS FILE and answers DHCP out of it under QEMU,
# so a wrong line here fails a gate on patagonia rather than at the bench with a camera in hand.
# That is the same move the multicast DNS responder's configuration document made (retired 2026-09-15,
# notes/mdns.md): one document, read by the thing and by the thing's test.
#
# WHAT IT DOES NOT DO. It is not applied by anything. It is copied by hand to a router no lane can
# reach: on the house router all four lines below sit verbatim in `/etc/dnsmasq.conf`, inside a
# marked block, because the `dhcp-match` lines have no UCI form. Repeat that after a reflash. The
# runbook is `notes/x86-uefi-boot/network-boot-xenon.md`. Nothing in this repository has ever
# talked to that router, and no gate can tell you the copy there still matches this one.
#
# WHY THIS IS NOT A SECOND DHCP SERVER, which is what milestone 257 refused for radon and refused
# correctly. This adds options to the offer the house router ALREADY makes. There is one DHCP
# server on this LAN, it stays the only one, and every line below is scoped so that a machine that
# is not xenon sees an offer byte-for-byte identical to today's.

# ---------------------------------------------------------------------------
# 1. Who xenon is.
# ---------------------------------------------------------------------------
# The MAC is the `LOM MAC Address` off the machine's own System Information page, IMG_4025 and IMG_4026 in
# `notes/xenon-firmware.md`. LOM is the motherboard's ethernet, which is the interface `Integrated
# NIC` switches and the only one that can PXE. The M.2 in Slot2 is the Intel wireless part and
# cannot boot anything.
#
# **No address is assigned here, deliberately.** `set:` with no IP is valid dnsmasq and tags the
# host without taking it out of the dynamic range, so this line cannot collide with a lease the
# router has already handed to somebody. Nothing needs to reach xenon at a known address: the
# transfer is xenon reaching patagonia, not the other way round.
dhcp-host=d8:9e:f3:74:b2:a2,set:xenon

# ---------------------------------------------------------------------------
# 2. What xenon is, which is the question option 93 exists to answer.
# ---------------------------------------------------------------------------
# DHCP option 93 (`client-arch`, RFC 4578) is how a PXE client says what binary it can execute.
# A configuration that answers the same way to every client hands a BIOS machine a UEFI image,
# which is a boot that fails in the most confusing available way: the transfer succeeds and the
# firmware then executes 9 MB of the wrong instruction set.
#
# Scoping by MAC would sidestep this on its own, and saying only that would leave a hole worth
# naming: **xenon itself is a BIOS client when `Boot List Option` is Legacy.** The photograph says
# UEFI today (IMG_4027) and one setup visit changes it. Matching the architecture as well as the
# MAC means the wrong-mode case gets NO boot filename and falls through to the next boot entry,
# rather than getting this one.
#
# 7 is `EFI x86-64` and 9 is `EFI x86-64` again through a second IANA registration that some
# firmware sends instead; both are matched because which one a given EDK2 build emits is not
# something this tree has checked on xenon.
dhcp-match=set:efi-x86-64,option:client-arch,7
dhcp-match=set:efi-x86-64,option:client-arch,9

# ---------------------------------------------------------------------------
# 3. The offer. Both tags, so both questions have to be answered right.
# ---------------------------------------------------------------------------
# `dhcp-boot=tag:a,tag:b,...` is an AND: dnsmasq applies it only to a client carrying both tags.
#
# The filename is the path INSIDE the served directory, and it is the ESP layout rather than a
# flattened name on purpose. `cargo xtask uefi-image` writes `target/esp/EFI/BOOT/BOOTX64.EFI`,
# `script/board-netboot --root target/esp` serves that directory, and the string below is the
# relative path between them. So the netboot path and the USB-stick path are THE SAME PATH, and
# `\EFI\BOOT\BOOTX64.EFI` on a stick and `EFI/BOOT/BOOTX64.EFI` over the wire name one file staged
# once. Nothing is copied and nothing can go stale relative to the other.
#
# The server address is patagonia. It is written as an address rather than a name because dnsmasq
# hands the name straight to the client and xenon's firmware would then have to resolve it, which
# is one more thing that can fail with no console to say so. See the BUGS note about this address
# moving.
dhcp-boot=tag:xenon,tag:efi-x86-64,EFI/BOOT/BOOTX64.EFI,patagonia,192.168.8.138

# ---------------------------------------------------------------------------
# 4. Pin patagonia so the address above stays true.
# ---------------------------------------------------------------------------
# CORRECTION, 2026-10-04 (UTC): this section used to say the pin was optional and speculated that
# it would be patagonia's ETHERNET MAC. Both were wrong. patagonia is on Wi-Fi `en0`, and its address
# had already drifted from `192.168.8.216` to `192.168.8.138`, so the `dhcp-boot` line was corrected.
#
# THE PIN IS NOW IN PLACE (calef's homelab agent, 2026-10-04): UCI host `patagonia-wifi` reserves
# `.138` for MAC `9e:1a:a1:57:40:a6`. That is macOS's private Wi-Fi address on this network, NOT the
# hardware MAC `10:9f:41:d4:8c:0e`, and it matches only while patagonia's Private Wi-Fi Address for
# the home network is Fixed or Off, never Rotating (calef confirmed Fixed, 2026-10-04 UTC). The four PXE lines above sit in the router's
# /etc/dnsmasq.conf inside a BEGIN/END xenon-pxe block. The reservation lives on the router, not in
# this file, and the rehearsal does not read it.
