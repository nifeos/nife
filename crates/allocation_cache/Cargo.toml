[package]
name = "allocation_cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A bounded per-owner stash of freed small blocks in front of a locked heap, so most allocations and frees never take the lock"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "allocator", "cache"]
categories = ["no-std", "memory-management"]
publish = false     # `false` until the release that publishes; that release deletes the line

# A bounded per-owner stash of freed small blocks in front of any locked heap. Pure logic,
# host-tested, no_std, no dependencies outside the host test's heap.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]

[dev-dependencies]
# The heap the host test and the README example put the cache in front of, so the cache is walked
# over a real allocator. `counters` only for the coalescing check.
talc = { version = "5.1.1", default-features = false, features = ["counters"] }
