[package]
name = "memory_region_heap"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# Bare-metal only, through user_mode_runtime's syscalls, so no host bench or doctest targets. The
# host unit tests drive the growth and wiring logic at a reached cap, which makes no syscall; a
# test that would map a page belongs behind a page-source seam (milestone 1100 item 8).
[lib]
bench = false
doctest = false

[lints]
workspace = true

[dependencies]
abi = { version = "0.1.0", path = "../abi" }
# The heap's default base is the address-space map's heap band.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
# The heap algorithm (milestone 784 (reuse what the tree wrote), item d), ruled by calef on
# 2026-10-21 (UTC) under §46 (thin primitives or whole subsystems): "A sounds right." Its core is
# also generated into std (`cargo xtask std-src`). No features: `counters` and the rest stay off.
# Every workspace's `[patch.crates-io]` builds it from vendor/talc, which carries upstream's fix
# SFBdragon/talc#57 until a release does (vendor/README.md).
talc = { version = "5.1.1", default-features = false }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
