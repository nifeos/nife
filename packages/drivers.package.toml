# drivers: the userspace device drivers. nife's own grouping: Linux ships these in the kernel.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "drivers"
kind = "base"
home = { repo = "drivers", status = "provisional" }
# `virtio-drivers` is upstream's crate, vendored with rcore-os/virtio-drivers#232 until a release
# carries it (milestone 784 (reuse what the tree wrote), item (c0)); the drivers move onto it one
# device at a time.
crates = ["virtio", "virtio-drivers", "non_volatile_memory_express", "jh7110_entropy"]
paths = ["vendor/virtio-drivers.divergence.patch", "vendor/virtio-drivers.pin"]
# `e1000e` is the contract between the kernel, which resets the NIC and packs `e1000e::Handoff`, and
# `net_stack` in the network package, which drives the rings (milestone 494 (a driver for the
# network card a PC actually has)). Both link it, so it is an interface rather than an internal crate.
# `designware_ethernet` is the same contract for the JH7110's Ethernet controller (milestone 53
# (the board's own peripherals: network and storage on real silicon)), for the same reason.
# `designware_mobile_storage` is the JH7110's SD/MMC driver (milestone 53 (the board's own
# peripherals: network and storage on real silicon)): the kernel links it for the bench boot, and
# the EL0 block server `designware_mobile_storage` links the same crate.
interfaces = ["e1000e", "designware_ethernet", "designware_mobile_storage"]
programs = ["block_driver", "serial_driver", "non_volatile_memory_express", "jh7110_entropy", "designware_mobile_storage"]
