[package]
name = "program_argument_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The argument page: a program's argv as length-prefixed bytes in one read-only 4 KiB page, with the builder that writes it and the parser that reads it"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "argv", "shared-page"]
categories = ["no-std", "embedded"]
publish = false     # stays false until the release that publishes this crate

# The argument page: one definition of the read-only page that carries a program's argv as plain
# bytes, so whoever assembles the page and whoever reads it share one layout and cannot drift. Pure
# logic, host-tested, no_std, dependency-free.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
