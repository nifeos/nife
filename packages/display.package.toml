# display: the compositor, the display drivers and the terminal drawn on a screen. The role of Debian's xserver-xorg.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "display"
kind = "optional"
home = { repo = "display", status = "provisional" }
# `nifeos/extensible_host_controller_interface` is the xHCI crate, which the kernel and
# `usb_keyboard_driver` link; it lives in a repository of its own and is no longer a package member.
interfaces = [
    "compositor",
    "video_terminal",
    "glyph_atlas",
]
crates = ["usb", "glyph_atlas_generator"]
# The fonts the terminal's atlas is drawn from (milestone 142 (a text display good enough that
# people use it instead of a GUI)).
paths = ["vendor/dejavu/"]
programs = [
    "compositor",
    "gpu_driver",
    "framebuffer_driver",
    "keyboard_driver",
    "usb_keyboard_driver",
    "display_terminal",
    "graphical_terminal",
]
