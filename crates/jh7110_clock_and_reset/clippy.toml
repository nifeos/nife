# `doc_markdown` asks for backticks around anything that looks like an identifier. These are
# proper nouns, the names of a board, a firmware project, a power chip, a clock generator and a card standard, so
# backticks would say "an identifier you could type" where the word names something in the world.
# `".."` extends clippy's defaults instead of replacing them.
doc-valid-idents = ["..", "VisionFive", "OpenSBI", "AXP15060", "PLL2", "MultiMediaCard"]
