# The crypto-provider workload of milestone 442 (a crypto provider `rustls` can use on all
# three bare-metal targets): an ordinary Rust `std` program that runs published
# test vectors through the crates a `rustls` provider is made of, built for the `*-unknown-nife`
# custom targets with `-Zbuild-std` against the patched rust-src (`cargo xtask std-src`).
#
# Deliberately NOT a member of the main workspace, for the two reasons `std_exerciser` and
# `entropy_backend` are not either, plus a third that is this package's own:
#
#   * it builds under the linked `nife-dev` toolchain with build-std flags the workspace crates
#     must never inherit, and its target directory is its own;
#   * it needs `--cfg getrandom_backend="custom"` and the four soft-implementation cfgs below,
#     which nothing else in this tree wants; and
#   * **its dependencies are not this repository's to take.** DECISIONS §46 (thin primitives or
#     whole subsystems; we write everything in between) makes adding one a decision an architect
#     owns, and
#     §196 (nife carries TLS: `rustls` for the protocol, and a crypto provider we make work)
#     ruled on `rustls` and explicitly not on a provider. Keeping this package out of the
#     workspace keeps every crate below out of the shipping graph, out of `Cargo.lock`, and out of
#     CI, as ripgrep's forty crates stay out by being basalt's to build. Nothing in
#     `script/test` builds this and no gate needs it; the kernel test skips when the archive has no
#     `cryptography_exerciser`.
#
# Name: provisional, minted on 2026-09-19 by this milestone's lane. Names are an architect's. The
# `_exerciser` half is not this package's coinage: milestone 63 (directory and package names:
# one spelling per thing) ratified it as this tree's word for
# a program that puts a subsystem under load and sees whether it holds, against `demo`, which that
# milestone turned down. `cryptography` rather than `crypto` because this tree spells names out
# (`inter_process_communication`, `globally_unique_identifier_partition_table`) and because `crypto`
# now has a second meaning in the world that this one does not want. `provider_exerciser` was
# considered and set aside: it exercises the primitives under a provider as much as any provider.

[package]
name = "cryptography_exerciser"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Never goes to crates.io, and saying so is load-bearing rather than tidy: this package depends on
# its neighbours by path, and `cargo-deny`'s `allow-wildcard-paths` only forgives a path dependency
# in a package that is not publishable, because crates.io would reject one.
publish = false

[workspace]

[dependencies]
# The protocol crate DECISIONS §196 ruled on, with default features off plus `tls12`, which is the
# seven-crate shape that ruling measured.
rustls = { version = "0.23", default-features = false, features = ["std"] }

# **The provider this tree assembled**, after calef refused `rustls-rustcrypto` on 2026-09-20
# ("rustls-rustcrypto doesn't seem like a high quality dependency"). It is glue over the same
# primitives named below, which is why they are still named here: the vectors run against the
# crates directly, and the provider is exercised as the object it is.
cryptography_provider = { path = "../cryptography_provider" }

# The certificate path builder, named here so this program can walk a real chain from a real host
# rather than only assert what the provider says it supports. `rustls` already pulls both.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
pki_types = { package = "rustls-pki-types", version = "1", default-features = false, features = ["alloc"] }

# The primitives, named directly so the vectors can be run against them rather than only through
# the provider's own tables. `sha2` also has to be named here even though the provider already
# pulls it, because `force-soft` is a feature and cargo unifies features across the graph: the
# crate that actually depends on `sha2` has no way to ask for the soft implementation, and on
# `x86_64-unknown-nife` the SIMD one does not compile at all.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
poly1305 = { version = "0.9", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }

# The same `rand_core` major the provider reaches (0.6), named so this program can draw through it
# on purpose. That is not decoration: `rand_core` 0.6 is what pulls `getrandom` **0.2**, whose
# custom-backend hook `entropy_backend` only learned to answer at this milestone, and a link is not
# a draw. Without this the transcript would prove the symbol resolves and nothing about whether the
# bytes come from the entropy service.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

# The randomness itself. See entropy_backend/src/lib.rs: this supplies `getrandom`'s backend for
# both the 0.3/0.4 symbol and the 0.2 one, over `std::random::SystemRng`, which reaches the entropy
# service through one endpoint that names no device.
entropy_backend = { path = "../entropy_backend" }

# The kernel's ELF loader maps whole pages per segment and the initial ramdisk carries the file;
# keep the binary small and the build deterministic. Same reasoning as `std_exerciser`'s.
# Overflow checks in release, ruled by calef 2026-10-04 (UTC) (notes/overflow-checks.md, option A).
# The shipped build now means by `a + b` what every tested build means: an overflow halts rather
# than wraps into a quiet wrong answer. Where a hot path wants a wrap, it says so at the site with
# `wrapping_*` and a reason.
# This profile also builds the `std` under the program (`-Zbuild-std`), so the checks cover it.
[profile.release]
overflow-checks = true
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"
