name: toolchain bump

# Observed failing: 2026-10-02, run 37019399265: the restamp job went red because a floor could not
#   be proven unmoved on the new nightly and needs a person (`script/bench --save --why`). See
#   notes/observed-failing.md.

# **Propose a toolchain bump daily; never apply one.** The three steps that want to stay separate:
#
#   1. PROPOSE (here): raise the pin, rebuild the std overlay as a fast sanity check, open a PR.
#   2. VERIFY (the CI workflow, on that PR): both ISAs, the proofs, the benchmarks. The real gate
#      stays the real gate; this job deliberately does not try to be it.
#   3. ACCEPT: the `restamp` job below carries the icount floors across the bump when it can prove
#      the compiler did not move them; when it cannot, a person re-records them on this branch,
#      having read what moved. Either way the auto-merge this job armed takes it into the queue.
#
# **The default is to merge** (calef, 2026-09-24: "Our default should be to merge and we should only
# block it if there is a compelling reason to."). Once the floors are re-recorded and CI is green, the
# bump is not labelled `needs-architect` and enters the queue on the auto-merge this job arms when
# it opens or readies the pull request (the merge drain stopped arming on 2026-10-03). Hold it
# (the label, plus a `## What I need from you` comment carrying the evidence) only for a compelling
# reason, which is one of:
#
#   - a Kani proof or falsification result that changed;
#   - a bench tripwire that moved beyond tolerance;
#   - a new lint that could only be silenced with a crate- or workspace-level allow;
#   - a behaviour change in a test's output;
#   - a compile break that could not be fixed small.
#
# Before 2026-09-24 this step read "ACCEPT (a human)", and the pull request said "it wants a human".
# The ruling keeps the part of that which was load-bearing (somebody reads the delta and writes a
# `--why`) and drops the rest (that the somebody had to be calef).
#
# **The floors: restamped when proven unmoved, never re-saved** (calef, 2026-09-26, overturning part
# of his 2026-09-21 refusal; milestone 598 (a nightly bump restamps the floors it proves it did not
# move)). A new compiler emits different instruction sequences, so a bump can revalue
# `bench/baseline-*.txt` without any commit being responsible, and `script/lint` fails on this
# branch until the floors name the new pin. Re-saving them here stays refused: floors that track the
# compiler would hide a nightly that made this kernel slower. What changed is that the `restamp` job
# builds the same tree under the old and the new nightly on one runner, and when every row moved
# under 0.5% and under 2% cumulatively since the last person-made save, it rewrites only the
# `# toolchain:` line and adds a `# why:` line with what it measured. The numbers never change, so a
# slower nightly still spends tripwire headroom against numbers a person read. When the proof
# fails, the branch stays red and the pull request body carries the table. From 2026-09-21 to
# 2026-09-26 a person did this by hand on every bump (#1112, #1250, #1308, #1335).
#
# This job must never push to `main`. An unattended job that can change the toolchain every build in
# the project uses is exactly the authority it should not have, and the 2026-07-30 incident is the
# argument: an unpinned nightly reddened CI for two days on commits that had touched only markdown,
# and it only became visible because a human ran a clean build and read the error.
#
# One PR, updated in place on a fixed branch, rather than one per day. Silent when there is nothing to
# do, and **loud when the overlay does not build**: that case opens a draft PR titled for the
# breakage. It used to be silent there too, which is the bug fixed on 2026-08-01; see the long comment
# on the "Open or update the pull request" step for the incident that made the reasoning visible.

on:
  schedule:
    # 08:00 UTC, an hour after the drift check, so a red drift result is already visible when this runs.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        # For proving the restamp on a branch: a dispatch on a branch other than `main` runs only
        # the `restamp` job, against whatever nightly this names, and proposes nothing.
        description: "Nightly to propose instead of today's (e.g. nightly-2026-09-25)"
        required: false
        default: ""

# Per ref, so a proof dispatched on a branch cannot cancel the scheduled run on `main`, or the
# other way round.
concurrency:
  group: toolchain-bump-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # **Prove the floors survive the bump, or say which do not** (milestone 598 (a nightly bump
  # restamps the floors it proves it did not move), calef 2026-09-26). Its own job, and not steps in
  # `propose`, for two reasons. It needs the pinned QEMU, and CI's `bench` job already caches one
  # for this runner under the same key, where the arm runner `propose` uses has none. And it names
  # no environment, so it can be dispatched on a branch to prove it (the `automation` environment
  # only deploys to `main`), which `propose` cannot.
  #
  # It fails, loudly, when any floor could not be restamped: that is the bump staying red, and the
  # summary carries the table a person starts from. `propose` runs either way.
  restamp:
    name: restamp the icount floors (old vs new nightly, one runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.measure.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Work out the two nightlies
        id: plan
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          target="${INPUT_TARGET:-nightly-$(date -u +%Y-%m-%d)}"
          current="$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)"
          # The nightlies the floors were last proven for. Normally all three equal the pin.
          stamped="$(sed -n 's/^# toolchain: *//p' bench/baseline-*.txt | sort -u | tr '\n' ' ')"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "stamped=$stamped" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$target" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already pinned to $target; nothing to restamp."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Restamping floors stamped [$stamped] for $target"
          fi

      # Both compilers, because the A/B builds the same tree under each. A missing nightly is
      # `propose`'s "nothing to propose today", so it is not a failure here either.
      - name: Install both nightlies
        id: install
        if: steps.plan.outputs.skip == 'false'
        continue-on-error: true  # outcome: exception, a missing nightly is upstream's; the pull request says no restamp ran
        run: |
          targets="$(awk -F'"' '/^targets *=/ {for (i = 2; i < NF; i += 2) printf "%s ", $i}' rust-toolchain.toml)"
          for tc in ${{ steps.plan.outputs.stamped }} ${{ steps.plan.outputs.target }}; do
            rustup toolchain install "$tc" --profile minimal --component rust-src,llvm-tools
            # shellcheck disable=SC2086 # $targets is a deliberate word-split list.
            rustup target add --toolchain "$tc" $targets
          done

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.install.outcome == 'success'
      # The same pinned QEMU, under the same cache key, as ci.yml's `bench` job; see the comment
      # there for why the runner's packaged QEMU will not do.
      - name: Cache QEMU
        if: steps.install.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        if: steps.install.outcome == 'success'
        run: script/ci-qemu
      - name: Put it on PATH
        if: steps.install.outcome == 'success'
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap
        if: steps.install.outcome == 'success'

      # `--restamp` writes no floor number. Each leg either rewrites its file's `# toolchain:` line
      # and adds one `# why:` line, or leaves the file alone and exits non-zero; its report says
      # which, with the table. See xtask/src/restamp.rs.
      - name: Raise the pin and restamp each floor
        id: measure
        if: steps.install.outcome == 'success'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          sed -i "s|^channel = \".*\"|channel = \"$TARGET\"|" rust-toolchain.toml
          out="$RUNNER_TEMP/restamp"
          mkdir -p "$out"
          : > "$out/report.md"
          for leg in aarch64 riscv64 x86_64; do
            case "$leg" in aarch64) flag="" ;; riscv64) flag="--riscv" ;; x86_64) flag="--x86" ;; esac
            # shellcheck disable=SC2086 # $flag is empty for aarch64.
            script/bench $flag --restamp --report "$out/$leg.md" || true
            cat "$out/$leg.md" >> "$out/report.md" 2>/dev/null \
              || echo "**$leg**: the restamp wrote no report; see this job's log." >> "$out/report.md"
            printf '\n\n' >> "$out/report.md"
          done
          cp bench/baseline-*.txt "$out/"
          # The same question `script/lint` asks, asked here so this job's colour is the answer.
          red="$(grep -L "^# toolchain: $TARGET\$" bench/baseline-*.txt || true)"
          if [ -z "$red" ]; then verdict=restamped; else verdict=refused; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          { echo "## Restamp: $verdict"; echo; cat "$out/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          echo "verdict: $verdict"
          [ -z "$red" ] || { echo "Still naming the old nightly, so the bump stays red:"; echo "$red"; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.measure.outcome == 'success'
        with:
          name: restamp
          path: ${{ runner.temp }}/restamp/

      - name: Fail if any floor still needs a person
        if: steps.measure.outputs.verdict == 'refused'
        run: |
          echo "At least one floor could not be proven unmoved; the bump stays red until a person"
          echo "re-records it with script/bench --save --why. The table is in this job's summary."
          exit 1

  propose:
    name: propose a pin bump
    # After `restamp`, whatever it concluded: a refused or broken restamp is exactly the case where
    # the pull request most needs to exist. Never on a branch dispatch, which is a proof of the
    # restamp and must not touch the real bump branch.
    needs: restamp
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    # The App's secrets live in the `automation` environment (name provisional), whose deployment
    # branches are `main` only. A merge-group build runs on a `gh-readonly-queue/main/...` ref, which
    # is not `main`, so it cannot read them even if a pull request edits this workflow to name the
    # environment. Adopted by calef 2026-09-24 (options 2 and 3 of
    # design/roadmap/0588-a-merge-needs-a-review-no-fork-can-supply.md; the finding is 1 in
    # design/audit-reports/2026-09-24-new-trust-boundaries.md). The protection holds
    # since calef deleted the organisation-level copies of the two secrets on 2026-10-03 (UTC); an
    # org secret would have been visible to every job whatever its environment. Only jobs that mint the App token name it,
    # because each run of a job that does records a deployment.
    environment: automation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      # Lifted to job level so the App step below can test it in an `if`. The `secrets` context is
      # NOT available in a step-level `if` (GitHub's context-availability table); `env` is. Only the
      # App ID is lifted, and only so its PRESENCE can be tested: the private key never appears
      # outside the `with:` block that consumes it.
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
    steps:
      # **Why a token other than the default `GITHUB_TOKEN`.** A push or a PR made with the
      # workflow's own `GITHUB_TOKEN` deliberately does NOT trigger further workflow runs (GitHub's
      # anti-recursion rule, which names `push` and `pull_request` explicitly). So when this job
      # force-pushed the bump branch and opened the PR with `github.token`, the CI workflow never
      # ran on it: the PR sat with only CodeQL reported and every required check stuck on "Expected",
      # permanently unmergeable. That is the whole point of proposing a bump, defeated, and it recurred
      # silently every day.
      #
      # The fix is to act as an identity that is not the ephemeral `GITHUB_TOKEN`. Two such
      # identities are tried, in this order, per milestone 128 (the automation gets its own identity):
      #
      #   1. **An installation token from the `nifeos`-owned GitHub App**, minted fresh by the
      #      step below on every run. Nothing about it is stored, so nothing about it expires, and
      #      it belongs to the organization rather than to a person. This is the intended identity.
      #   2. **`github.token`**, the ephemeral default, which opens the PR but triggers no CI. A
      #      fork without the App secrets lands here and still gets a pull request; the checks on
      #      it have to be kicked by hand (close and reopen it). This fallback is deliberate.
      #
      # **`TOOLCHAIN_BUMP_PAT`, a personal access token on calef's account that used to sit between
      # these two, was retired 2026-10-03 UTC and then deleted, secret and token both.** Nothing reads
      # it any more.
      #
      # The "Say which identity" step below prints which rung this run took, because the two are
      # otherwise indistinguishable in the log.
      #
      # **Milestone 128: mint the identity per run instead of storing one.** With the App
      # secrets absent (a fork), the `if` skips the step, `steps.app-token.outputs.token` is the
      # empty string, and every expression below falls through to `github.token`.
      #
      # **Dependency: `actions/create-github-app-token`. Approved by calef, 2026-09-23 UTC.**
      # §46 (thin primitives or whole subsystems) makes taking a dependency a decision rather than a
      # convenience, so the decision is recorded here, where the next reader meets the `uses:` line.
      # Four reasons it was taken:
      #
      #   - **Maintained by GitHub**, and it does exactly one thing: mint an installation token per
      #     run.
      #   - **Outside the shipping graph.** It runs in CI and no part of the OS depends on it, which
      #     is the distinction §46 draws.
      #   - **The alternative was worse**, and this is the case where §46's "write it yourself"
      #     guidance does not apply. Minting the token by hand means signing a JWT with the private
      #     key and exchanging it, in shell, inside a workflow: more code, in the least testable
      #     place this project has, handling a signing key.
      #   - **The fallback chain survives its absence.** With the App secrets unset the step is
      #     skipped entirely, so this action is not load-bearing for the `github.token` path.
      #
      # It is covered by the `github-actions` ecosystem in `.github/dependabot.yml`, so its version
      # is kept current the same way every other action here is.
      - name: Mint an installation token for the automation App
        id: app-token
        if: env.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      # **Which identity this run is using, printed before anything depends on it.** The fallback
      # below is otherwise unobservable: a run using the App and a run using the ephemeral token look
      # identical in the log. This step is what makes the difference visible.
      #
      # It cannot itself fail the job. Reporting the wrong identity is bad; refusing to propose a
      # toolchain bump because an identity probe hit a transient API error is worse.
      - name: Say which identity this run is authenticating as
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "identity: the nifeos automation App (installation token, minted this run)"
          else
            echo "identity: the ephemeral github.token"
            echo "  WARNING: pull requests opened by this identity do NOT trigger CI (GitHub's"
            echo "  anti-recursion rule). Any PR this run opens will need its checks kicked by hand."
          fi
          # Proves the selected token is live.
          # An installation token has no user, so /user 404s for the App path; ask for something
          # both identities can answer instead.
          if login="$(gh api /repos/${{ github.repository }} --jq .full_name 2>&1)"; then
            echo "token check: OK, can read $login"
          else
            echo "token check: FAILED. gh said: $login" >&2
          fi
          exit 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Work out whether there is anything to do
        id: plan
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          current="$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)"
          target="${INPUT_TARGET:-nightly-$(date -u +%Y-%m-%d)}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=$target"   >> "$GITHUB_OUTPUT"
          if [ "$current" = "$target" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already pinned to $target; nothing to propose."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Proposing $current -> $target"
          fi

      # A nightly for a given date can be missing or incomplete (a component fails to build upstream).
      # That is not our problem to report, so treat it as "nothing to propose today" rather than a
      # failure: the drift check is what tells us when upstream has actually broken us.
      - name: Install the target nightly
        id: install
        if: steps.plan.outputs.skip == 'false'
        continue-on-error: true  # outcome: exception, a missing nightly is upstream's, so nothing to propose today
        run: |
          rustup toolchain install "${{ steps.plan.outputs.target }}" --profile minimal \
            --component rust-src,llvm-tools,rustfmt,clippy
          # Every target the pin declares, read from the file rather than spelled here, matching
          # `script/toolchain-bump`. This installs against the NEW toolchain, which rustup does not
          # apply the pin's `targets` array to, so an omission here is not covered the way it is
          # elsewhere: the hand-written list named two and left out `x86_64-unknown-none`, and the
          # first x86_64 build after a bump was what discovered it.
          rustup target add --toolchain "${{ steps.plan.outputs.target }}" \
            $(awk -F'"' '/^targets *=/ {for (i = 2; i < NF; i += 2) printf "%s ", $i}' rust-toolchain.toml)

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.install.outcome == 'success'

      - name: Install clang (the C component's compiler, milestone 36)
        if: steps.install.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y clang

      # The sanity check, and only the sanity check. The std overlay patches std's own source, so it
      # tracks upstream internals rather than a stable API and is where a bump bites first. A clean
      # farm is mandatory: a cached one hides exactly the breakage being tested for, which is how the
      # 2026-07-30 drift stayed invisible on a developer machine while CI was red.
      - name: Raise the pin and rebuild the std overlay
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true  # outcome: reported
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.plan.outputs.target }}
        run: |
          set -o pipefail
          sed -i "s|^channel = \".*\"|channel = \"${{ steps.plan.outputs.target }}\"|" rust-toolchain.toml
          rm -rf target/nife-farm
          # Captured because the failure text IS the deliverable when this step fails: the PR body
          # below quotes it, so the reader gets the compiler's own words rather than a link to a log
          # that expires.
          cargo xtask std-exerciser 2>&1 | tee /tmp/overlay-build.log

      # Runs whether or not the overlay built, and that is the whole point of this step.
      #
      # It used to be gated on `steps.build.outcome == 'success'`, so a broken overlay produced NO
      # pull request, on the reasoning that the `toolchain drift` workflow already reports that case
      # and two notifications for one fact is noise. The reasoning was wrong in a way that took a
      # live incident to see: drift has no badge and posts no notification, so its report is a red
      # entry in the Actions tab that nobody is prompted to look at. The PR was the only part of this
      # mechanism that surfaces where a human already looks, and it suppressed itself in exactly the
      # case that needed a human.
      #
      # On 2026-07-31 that happened for real. Drift went red on `set_perm_nofollow` at 09:38, this
      # job ran at 10:31, reported SUCCESS, opened nothing, and the breakage stayed invisible until
      # someone went looking for an unrelated reason. "Silent when there is nothing to do" and
      # "silent when it is broken" had collapsed into the same behaviour, and those should be
      # opposites.
      #
      # So a failed overlay build now proposes a DRAFT PR instead: the pin is raised, the overlay is
      # untouched and broken, and this PR's own CI will be red. That red is not a defect in the PR,
      # it is the evidence. Draft, because it must not be merged as-is, and titled for the breakage
      # rather than for the bump.
      # The `restamp` job's floors and report. Absent when it did not get as far as measuring (a
      # missing nightly, an infrastructure failure), and the pull request body then says so.
      - name: Fetch the restamp job's floors and report
        if: steps.install.outcome == 'success' && steps.plan.outputs.skip == 'false' && needs.restamp.outputs.verdict != ''
        continue-on-error: true  # outcome: exception, a missing report is stated in the pull request body
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: restamp
          path: ${{ runner.temp }}/restamp

      - name: Open or update the pull request
        if: steps.install.outcome == 'success' && steps.plan.outputs.skip == 'false'
        env:
          # Same identity, and the same two rungs, as the checkout above: the App's installation
          # token when the App exists, else the default token. The first makes the PR events this
          # step creates trigger CI; the second does not.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET: ${{ steps.plan.outputs.target }}
          CURRENT: ${{ steps.plan.outputs.current }}
          BUILD: ${{ steps.build.outcome }}
          VERDICT: ${{ needs.restamp.outputs.verdict }}
          RESTAMP: ${{ runner.temp }}/restamp
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # AGENTS.md requires every agent-written pull request to open by saying whose voice it is
          # in. The App's byline is `<app>[bot]` rather than the person whose token runs the
          # workflow otherwise. So the sentence is computed rather than spelled, and
          # this is the one place in the tree where the attribution line has to track the identity.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          branch="toolchain/nightly-bump"
          if [ -n "$APP_TOKEN" ]; then
            lane="**Lane:** $branch, opened by a scheduled workflow under the project's own automation identity."
          else
            lane="**Lane:** $branch, opened by a scheduled workflow; the author GitHub shows is the person running it."
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add rust-toolchain.toml
          # The overlay may have needed new re-exports; include them if the build produced any.
          git add -A patches/std-nife || true

          if [ "$BUILD" = "success" ]; then
            title="toolchain: bump the pinned nightly to $TARGET"
            draft=""
            git commit -m "toolchain: bump the pin to $TARGET

          Proposed automatically. The std overlay builds clean against this nightly, which is the
          check that actually catches drift; everything else is this PR's own CI, which is the point
          of proposing rather than applying. The icount floors are the next commit on this branch
          when the restamp job proved them unmoved, and a person's job when it did not."

            # **The floors, from the `restamp` job** (milestone 598 (a nightly bump restamps the
            # floors it proves it did not move)). Copied whatever the verdict: a refused leg's file
            # is byte-identical to the one on `main`, so only restamped legs make a diff.
            report="(the restamp job produced no report; see $RUN_URL)"
            if [ -f "$RESTAMP/report.md" ]; then
              report="$(cat "$RESTAMP/report.md")"
              cp "$RESTAMP"/baseline-*.txt bench/
              git add bench/baseline-*.txt
              if ! git diff --cached --quiet; then
                git commit -m "bench: restamp the icount floors for $TARGET, rows unchanged

          The restamp job built this tree under the old and the new nightly on one runner and
          found every row of these floors moved less than 0.5%, and less than 2% since the last
          person-made save (calef, 2026-09-26). It rewrote each file's # toolchain: line and added
          a # why: line with the measured moves. No floor number changed. Run: $RUN_URL"
              fi
            fi

            if [ "$VERDICT" = "restamped" ]; then
              floors="**The icount floors were restamped, not re-saved.** The \`restamp\` job built this
          tree under \`$CURRENT\` and \`$TARGET\` on one runner, and every row moved less than 0.5%, and
          less than 2% since the last person-made save (calef, 2026-09-26; milestone 598 (a nightly
          bump restamps the floors it proves it did not move)). It rewrote only each floor's
          \`# toolchain:\` line and added a \`# why:\` line with what it measured. No number moved, so
          a slower nightly still spends the tripwire's headroom against numbers a person read.
          Nothing is left for a person to do here unless CI says otherwise.

          <details><summary>What the restamp measured</summary>

          $report

          </details>"
            else
              floors="**\`script/lint\` on this branch WILL fail until a person re-records the floors the
          restamp job could not carry.** It builds this tree under \`$CURRENT\` and \`$TARGET\` on one
          runner and restamps a floor only when every row moved less than 0.5%, and less than 2%
          since the last person-made save (calef, 2026-09-26). What it found, per floor:

          $report

          For each floor still naming \`$CURRENT\`, read the table above, then on this branch:

          \`\`\`
          script/bench --check                                  # or --riscv / --x86
          script/bench --save --why \"$TARGET: <what moved>\"   # --why is required
          \`\`\`

          The table is the compiler's term alone, measured on one tree; \`--check\` also carries any
          drift already on \`main\`. \`--why\` writes the account into the floor, beside the numbers
          (milestone 302 (a baseline records what it was saved against)). Merge before the next
          scheduled run: this branch is force-pushed daily, and a re-recorded floor on it does not
          survive that."
            fi

            body="$lane

          Raises \`rust-toolchain.toml\` from \`$CURRENT\` to \`$TARGET\`.

          The std overlay was rebuilt from a clean farm against this nightly and compiles, which is the
          check that catches upstream drift. Everything else is this PR's own CI: both ISAs, the Kani
          proofs, and the benchmark tripwire. That split is deliberate, so the proposing job never has
          to be trusted as the gate.

          $floors

          **The default is to merge** (calef, 2026-09-24). Once the floors name \`$TARGET\` and CI is
          green, this pull request enters the queue on the auto-merge this workflow armed. Hold it with
          \`needs-architect\` and a \`## What I need from you\` comment only for a compelling reason:
          a changed proof or falsification result, a bench move beyond tolerance, a lint silenced
          only by a crate- or workspace-level allow, a changed test output, or a compile break too
          large to fix small.

          If CI here is red, upstream has moved away from us. Do not merge; the fix is a commit to this
          branch adding whatever the overlay now needs (usually a name in the \`pub use
          unsupported_fs::{...}\` list in \`sys/fs/nife.rs\`).

          This branch is force-pushed daily, so it always proposes the newest nightly rather than
          accumulating one PR per day."
          else
            # The overlay did NOT build. Propose it anyway, as a draft, titled for the breakage.
            title="toolchain: $TARGET BREAKS the std overlay (needs a fix, do not merge)"
            draft="--draft"
            git commit -m "toolchain: $TARGET breaks the std overlay

          NOT a proposal to merge. The pin is raised and the overlay is deliberately left broken so
          that this branch's CI reproduces the breakage, which is the evidence.

          Opened because the alternative was silence: the drift workflow reports this in the Actions
          tab, which has no badge and sends no notification."
            # The compiler's own words, trimmed to the errors. A log link expires; this does not.
            errors="$(grep -E '^(error|warning: unused)' /tmp/overlay-build.log 2>/dev/null | head -20 || true)"
            [ -n "$errors" ] || errors="(no error lines matched; see the job log)"
            body="$lane

          **Upstream has moved away from us.** \`$TARGET\` does not build the \`std\` overlay.

          This is a **draft on purpose and must not be merged as-is.** The pin is raised and the
          overlay is untouched, so this branch's CI will be red. That red is the evidence, not a
          defect in the PR.

          \`\`\`
          $errors
          \`\`\`

          The fix goes on a lane branch of its own, never this one: every daily run rebuilds this
          branch from main and force-pushes it, so a commit here is wiped. On that branch, raise the
          pin as this diff does and teach \`patches/std-nife\` whatever std now wants. Often that is
          one name in the \`pub use unsupported_fs::{...}\` list in \`sys/fs/nife.rs\`, because the
          overlay patches std's own source and therefore tracks upstream *internals* rather than any
          stable API. Once that lands on main, the daily run has nothing left to propose and this PR
          can be closed with a pointer to it.

          You are reading this instead of nothing because the \`toolchain drift\` workflow has no
          badge and posts no notification, so a red run there reaches nobody. A pull request is the
          part of this mechanism that shows up where a human already looks."
          fi

          git push --force origin "$branch"
          # One PR, updated in place. Force-pushing the branch updates an existing one's diff, but
          # not its title or body, so those are refreshed explicitly: a PR that still says "breaks the
          # overlay" after the overlay was fixed is worse than no PR at all.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            # shellcheck disable=SC2086 # $draft is a deliberate word-split: either --draft or empty.
            gh pr create --head "$branch" --base main --title "$title" --body "$body" $draft
          else
            gh pr edit "$existing" --title "$title" --body "$body"
            # Draft state has to move BOTH ways. Yesterday's build may have succeeded (leaving the PR
            # ready to merge) while today's fails; retitling it "do not merge" while leaving the merge
            # button live is the worst of both, so undo the ready state as well.
            if [ "$BUILD" = "success" ]; then
              gh pr ready "$existing" || true
            else
              gh pr ready "$existing" --undo || true
            fi
            echo "Updated PR #$existing in place."
          fi
          # **Arms its own pull request** (milestone 727 (a queue eviction goes to a maintainer session), provisional): since 2026-10-03 the merge drain
          # arms nothing, and a lane arms in the same command as `gh pr ready`. This workflow is the
          # lane here. If arming fails the pull request is labelled needs-maintainer after 30 minutes.
          if [ "$BUILD" = "success" ]; then
            gh pr merge "$branch" --auto --merge || echo "::warning::could not arm the pull request"
          fi

  # **Propose a Kani pin bump daily; never apply one** (milestone 795 (pin stock Kani to a version, bumped deliberately like the nightly)). The same three steps as the
  # nightly, for the other input to the proofs that used to move by itself: this job runs
  # `script/kani-bump`, which changes `.kani-version` and nothing else, and opens the pull request;
  # `verify` on that pull request is the proof run on the new Kani; the default is to merge
  # (calef, 2026-09-24), held with `needs-architect` and a `## What I need from you` comment only
  # when a proof or falsification result changed, which is a red `verify`. Its own branch and
  # pull request, so a Kani bump and a nightly bump never wait on each other. The riscv64 row builds
  # its own patched 0.67.0 and is not part of this pin.
  propose-kani:
    name: propose a Kani pin bump
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
    steps:
      # Same identity ladder as `propose` (its comments say why): the App's installation token so the
      # pull request triggers CI, else the ephemeral `github.token`, which does not.
      - name: Mint an installation token for the automation App
        id: app-token
        if: env.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - name: Raise .kani-version and open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          result="$(script/kani-bump)"
          if [ "$result" = unchanged ]; then
            echo "Kani is already at the newest stable version; nothing to propose."
            exit 0
          fi
          set -- $result
          old="$2"; new="$3"
          branch="toolchain/kani-bump"
          if [ -n "$APP_TOKEN" ]; then
            lane="**Lane:** $branch, opened by a scheduled workflow under the project's own automation identity."
          else
            lane="**Lane:** $branch, opened by a scheduled workflow; the author GitHub shows is the person running it."
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .kani-version
          git commit -m "toolchain: bump the pinned Kani to $new

          Proposed automatically by script/kani-bump. Only .kani-version changes; this pull
          request's own verify run is the proof on the new version."
          title="toolchain: bump the pinned Kani to $new"
          body="$lane

          Raises \`.kani-version\` from \`$old\` to \`$new\` and changes nothing else (milestone 795,
          pin stock Kani to a version bumped deliberately). The proof is this pull request's own
          \`verify\` run on the new Kani; the proposing job proves nothing.

          **The default is to merge** (calef, 2026-09-24). Hold it with \`needs-architect\` and a
          \`## What I need from you\` comment only when a Kani proof or falsification result changed
          (a red \`verify\` or \`falsifications\`), and record any harness whose result or time moved.

          The riscv64 row is not on this pin: it builds a patched 0.67.0 until upstream kani#4913
          ships (notes/kernel-proofs/riscv64-with-a-patched-kani.md).

          This branch is force-pushed daily, so it always proposes the newest stable release."
          git push --force origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
          else
            gh pr edit "$existing" --title "$title" --body "$body"
          fi
          gh pr merge "$branch" --auto --merge || echo "::warning::could not arm the pull request"
