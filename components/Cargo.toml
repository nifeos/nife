# smoltcp (milestone 30, piece 3): the userspace TCP/IP stack. no_std, heap over user_mode_runtime's
# UntypedHeap. Pinned at 0.13.1; divergence policy is the vendored-engine discipline (DECISIONS §18).
smoltcp = { version = "0.14.0", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    # No "multicast". Milestone 55's mDNS stack half enabled it (group membership, IGMP, and RX
    # acceptance of datagrams addressed to a joined group) and milestone 298 took it out again on
    # 2026-09-15 with the only thing that joined a group. Without it the IPv4 input path accepts
    # multicast only to 224.0.0.1, so a future multicast client must put it back; notes/mdns.md
    # records what it took and what QEMU could and could not prove.
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "socket-dhcpv4",
] }
