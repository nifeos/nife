[package]
name = "globally_unique_identifier_partition_table"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The GUID Partition Table (UEFI 2.10 §5.3), as pure computation: parse a table, validate one,
# build one. No I/O of any kind, so it compiles for the host and its tests run in milliseconds
# against disks made by real tools (`sgdisk` and macOS's `diskutil`, both committed as fixtures),
# the same split `device_tree_blob` makes for the device tree. Milestone 57's mandatory half: you cannot find a
# partition on a real disk without reading the table. See
# notes/globally-unique-identifier-partition-table.md.

[lints]
workspace = true

[dependencies]
# The identifier every entry and the header carry. This crate owns only how a GPT stores one
# (mixed-endian, `guid::from_disk`/`to_disk`); the type and its text form are RFC 9562's, taken
# from `uuid` with default features off (calef's "A" on #2548, §46).
uuid = { version = "1.28.0", default-features = false }
