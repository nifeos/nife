name: ready status

# Observed failing: 2026-10-03, run 37159344697: red on milestone/637-survivor-triage-4, a ready
#   pull request whose own roadmap block still read IN-PROGRESS. See notes/observed-failing.md.

# **The roadmap blocks left for nifeos/record** (milestone 1018 (the design record moves to
# nifeos/record and is published as a website)). The two checks below the next paragraphs, the
# IN-PROGRESS test and the moved block, read a branch's own diff of design/roadmap/, and that diff is
# now in the lane's pull request in nifeos/record, which runs them. Here the job keeps its name,
# because the ruleset requires it by name, and checks the half this tree can see: a ready
# `milestone/N-*` branch names a milestone that has a block at the record commit basalt pins
# (helpers/milestone-branch-block.sh, the same check as script/lint-fleet's 4b). The paragraphs
# below are why the checks exist.
#
# **A ready pull request's roadmap block already says how the work ended** (milestone 630
# (a merge-queue ejection is caught before the queue, and recovered after it); name provisional).
#
# `script/roadmap --check` fails a block that reads IN-PROGRESS on a branch this history has already
# merged. That check can only fire inside a merge group, because only there does the branch's merge
# commit exist, and swish-check makes every group attempt cost 20 to 38 minutes. On 2026-10-03 at
# 01:45 UTC #1473 (the x86_64 paint path) was ejected for exactly this, and the ejection cancelled its
# auto-merge and told nobody (notes/coes/2026-09-30-lane-follow-through.md, the sixth class).
#
# The same fact is knowable the moment the pull request stops being a draft, because a ready pull
# request is a merge request. So this asks it then: `script/roadmap --ready-branch <head branch>`,
# which reads frontmatter and nothing else and answers in about a second. Shaped like
# architect-hold.yml on purpose: one job, no build, nothing slow enough to jam the queue if it is
# made required.
#
# **A `milestone/N-*` branch must move its own block** (2026-11-11 UTC, after #3437). `--check` and
# `script/lint-fleet` 4b did not stop #3437, which merged on 2026-11-10 without touching
# design/roadmap/: 4b skips on the detached HEAD of every CI run and only warns when it does run,
# and the IN-PROGRESS test above passes a block that never left NOT-STARTED. So the same job now
# also fails a ready milestone branch whose block is unchanged against the base, or still reads
# NOT-STARTED (unless the branch adds the block) or IN-PROGRESS. The job keeps its name because the
# ruleset requires it by name.
#
# **Drafts pass.** A lane's block reads IN-PROGRESS for its whole life as a draft, which is correct,
# so the job reads the LIVE draft state (the event payload's copy has been wrong; see ci.yml's
# `draft gate`) and passes when it is a draft. `converted_to_draft` is in `types:` so that a lane
# answering this failure with `gh pr ready --undo` turns the check green again rather than leaving
# a stale red beside a draft.
#
# **It runs on `merge_group` too**, so that it can be a required check: a required check that never
# reports on a merge group holds the group forever. In a group it agrees with `--check`'s
# merged-branch half by construction, and costs a second.
#
# **The group leg reads no API** (milestone 727 (a queue eviction goes to a maintainer session), provisional; calef's rulings on #1564). It used to
# ask GitHub for the pull request's branch and draft state, and on 2026-10-03 that call met an HTTP
# 503 and ejected #1557, the leg's one failure in 131 group runs: an outage outside the change cost
# a 20-to-38-minute group. A group is never a draft, and the branch is in the commit the group
# checks out, whose subject is `Merge pull request #N from <owner>/<branch>`.
#
# BUGS
#
#   - **It matches the branch by name only.** A lane whose block names a different branch than the
#     one it pushed (a typo, or a branch renamed mid-lane) passes here and still fails in the group.
#     `--check`'s `BRANCH` pattern catches a malformed name, not a wrong one.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ready-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ready:
    name: ready status (no IN-PROGRESS block on a ready branch)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout_first_1
        timeout-minutes: 2
        continue-on-error: true  # outcome: re-raised
        with:
          # Two commits, so that the group leg can read the subject of the merge commit under test.
          fetch-depth: 2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 3
        if: steps.checkout_first_1.outcome != 'success'
        with:
          fetch-depth: 2

      - name: Resolve the branch, and whether it is asking to merge
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$PR_EVENT_NUMBER" ]; then
            number="$PR_EVENT_NUMBER"
            view="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefName,isDraft)"
            branch="$(printf '%s' "$view" | jq -r .headRefName)"
            draft="$(printf '%s' "$view" | jq -r .isDraft)"
          else
            # No API in a group (see the header): the subject of the commit under test names it.
            subject="$(git log -1 --format=%s)"
            number="$(printf '%s\n' "$GROUP_HEAD_REF" | grep -oE 'pr-[0-9]+-' | head -1 | grep -oE '[0-9]+' || true)"
            branch="$(printf '%s\n' "$subject" | sed -n "s|^Merge pull request #$number from [^/]*/||p")"
            draft=false
            if [ -z "$number" ] || [ -z "$branch" ]; then
              echo "could not resolve the branch from head_ref '$GROUP_HEAD_REF' and subject '$subject'" >&2
              exit 1
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "==> #$number, branch '$branch', draft '$draft' (live)"

      # The blocks are in nifeos/record (milestone 1018 (the design record moves to nifeos/record
      # and is published as a website)), so a branch here cannot change one, and the status flip
      # and its IN-PROGRESS test run on the lane's pull request there. What this tree can still
      # check is that a ready milestone branch names a milestone with a block, read at the commit
      # basalt pins. That read fetches the record, so it runs on the pull request only: the group
      # leg reads no network, for the reason the header gives.
      - name: A ready milestone branch names a milestone that has a block in the record
        if: steps.pr.outputs.draft != 'true' && github.event_name == 'pull_request'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: helpers/milestone-branch-block.sh "$PWD" "$BRANCH"

      - name: In a group, the record's pull request carries the status flip
        if: github.event_name == 'merge_group'
        run: echo "==> merge group; the block and its status are checked in nifeos/record"

      - name: A draft is still work in progress, and its block may say so
        if: steps.pr.outputs.draft == 'true'
        run: echo "==> draft; IN-PROGRESS is the honest status for a draft, nothing to check"
