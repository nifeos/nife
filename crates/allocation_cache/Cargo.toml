[package]
name = "allocation_cache"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
# The heap std puts this cache in front of (milestone 784 (reuse what the tree wrote), item d), so the
# host test walks the cache over the real thing. `counters` only here, for the coalescing check; the
# std copy and `user_mode_runtime` build without it.
talc = { version = "5.1.1", default-features = false, features = ["counters"] }
