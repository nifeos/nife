# binary (milestone 291). AGENTS.md rule 7: what two binaries must agree on is a crate.
capability_witness_contract = { version = "0.1.0", path = "../crates/capability_witness_contract" }
# The slots, the conductor's words and the report page `confined_syscall_fuzzer` shares with its
# conductor in `system_tests` (milestone 779, provisional).
confined_syscall_fuzzer_contract = { version = "0.1.0", path = "../crates/confined_syscall_fuzzer_contract" }
# A program's check that its own ELF image was loaded correctly (milestone 291). Two fixtures
# need it, so it is a crate rather than a second copy.
