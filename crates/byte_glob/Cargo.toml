[package]
name = "byte_glob"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An fnmatch-style glob matcher over bytes for one file name: total, allocation-free, with a cost bound and Kani proofs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "glob", "fnmatch", "pattern-matching"]
categories = ["no-std", "algorithms", "filesystem"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
include = ["src/**", "falsifications/**", "README.md", "LICENSE-*"]

# A pattern matcher, and only the matcher: a pattern and a name in, a yes or no out. No filesystem
# access, no enumeration, no allocation and no dependency. The part of globbing that is pure
# computation, so that it can be proved.

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
