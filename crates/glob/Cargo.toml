[package]
name = "glob"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# Milestone 47's pattern matcher, and only the matcher: a pattern and a name in, a yes or no out.
# No filesystem access, no enumeration, no allocation, no dependency on filesystem_contract or grant_plan. The
# milestone's finding is that the interesting question is what a match *grants* (a caretaker
# attenuated to a name set), and that is a separate lane; this is the part that is pure computation
# and can be proved. DECISIONS §46 rule 1: it is on the verification path, so we write it.
# See notes/glob.md.

[dependencies]

[lints]
workspace = true

# The staged glob fixtures are checked against the matcher in `tests/fixture_agreement.rs`. The
# fixture and the filesystem contract do not depend on the matcher, so the test lives here.
[dev-dependencies]
filesystem_contract = { version = "0.1.0", path = "../filesystem_contract" }
filesystem_fixture = { version = "0.1.0", path = "../filesystem_fixture" }
