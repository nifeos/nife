[package]
name = "confined_virtio"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# `vendor/virtio-drivers` over the kernel's confined transport (milestone 947 (the virtio input
# device runs on `virtio-drivers`)): the crate's `Transport` over a `Virtio` capability and its `Hal`
# over the driver's one DMA window. A crate of its own so that only a program driving a device links
# `virtio-drivers`. Bare metal only, through `user_mode_runtime`, so no host test, bench or doctest
# targets.
[lib]
test = false
bench = false
doctest = false

[lints]
workspace = true

[dependencies]
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
# The vendored crate is 0.13.0 plus rcore-os/virtio-drivers#232 (vendor/virtio-drivers.pin). Default
# features off, so no `alloc` and no `embedded-io`.
virtio-drivers = { version = "0.13.0", path = "../../vendor/virtio-drivers", default-features = false }
# The traits the crate's `Transport::read_config_space` is bounded on; the same 0.8 the crate takes.
zerocopy = { version = "0.8.40", default-features = false }
# The kernel's fixed ring layout, which `WindowHal` must hand out exactly.
direct_memory_access_validator = { version = "0.1.0", path = "../direct_memory_access_validator" }
