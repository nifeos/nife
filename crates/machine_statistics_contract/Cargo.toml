[package]
name = "machine_statistics_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The machine statistics page: where a kernel keeps its machine-wide counters, and the one reader that agrees with its writer on the layout"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "statistics", "shared-page"]
categories = ["no-std", "embedded", "os"]
publish = false     # stays false until the release that publishes this crate

# The machine statistics page: one definition of the read-only page a kernel keeps its machine-wide
# counters in, so the one writer and its readers cannot drift on the layout or the virtual address.

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "riscv64imac-unknown-none-elf",
]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
# The page's line count must equal the CPU id bound; a compile-time assertion holds the two together.
current_cpu_contract = { version = "0.1.0", path = "../current_cpu_contract" }
# Where the page goes: `PAGE_VIRTUAL_ADDRESS` is a pair page on the address-space map.
address_space_layout = { version = "0.1.0", path = "../address_space_layout" }
