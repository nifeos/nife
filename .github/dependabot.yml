# Dependabot keeps dependencies current by opening PRs, which CI then checks. Two ecosystems:
# the Rust crates (Cargo) and the GitHub Actions the workflow pins. See
# https://docs.github.com/code-security/dependabot.
#
# No entry sets `cooldown`, on purpose (decided 2026-10-25 UTC): Dependabot's default waits 3 days
# after a release before proposing a version update, and a security update skips the wait. Never
# close one of these pull requests to block a version, since Dependabot then stops proposing it
# without any trace in this file; label it `bump-blocked` beside a `BUGS` entry instead.
# notes/dependency-updates.md has the whole practice, and who merges which bump.
version: 2
updates:
  # --- Rust dependencies (the workspace root Cargo.toml / Cargo.lock) --------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Fold routine minor/patch bumps into a single PR so the queue stays quiet; a major bump
    # (which can break the build) still gets its own PR to review on its own.
    #
    # **The exception is a set of crates that only builds as a set.** `digest`, `hmac`, `md-5` and
    # `md4` (crates/ntlm's NTLMv2 primitives) ship as one coordinated RustCrypto release: `digest`
    # 0.11 pulls `hmac` 0.13, `md-5` 0.11 and `md4` 0.11 with it. So the default one-PR-per-major
    # rule proposes four pull requests that are each **unbuildable by construction**, because no
    # single one of them can produce a consistent graph. That is exactly what happened on
    # 2026-08-10: PRs #144-147 each went red on `build + test`, `clippy` and the supply-chain job,
    # and were re-proposed every week.
    #
    # Grouping the majors is the fix rather than ignoring them, and the difference matters. An
    # `ignore` here would suppress the churn by **foreclosing the upgrade**, freezing the crypto
    # stack until somebody hand-edited this file; that is a standing policy decision and it belongs
    # to an architect, not to a CI cleanup. A group suppresses the same churn and keeps the door
    # open: one
    # pull request bumping all four together, which builds once `crates/ntlm` is migrated to the new
    # `Digest`/`Mac` APIs, on whatever schedule that migration is worth.
    #
    # The algorithms themselves are frozen and always will be (NTLMv2 mandates MD4 and MD5, so
    # nothing here *chooses* them; see crates/ntlm/Cargo.toml). That is an argument about `md-5` and
    # `md4`, not about `digest` and `hmac`, which are generic trait crates that legitimately evolve
    # and are pinned here only by their coupling to the other two.
    groups:
      # Ordered before the catch-all: a dependency lands in the first group it matches, and the
      # update-types are disjoint, so minor/patch bumps of these four still ride the group below.
      ntlm-crypto:
        patterns: ["digest", "hmac", "md-5", "md4"]
        update-types: ["major"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Rust dependencies of every other workspace with a committed Cargo.lock ------------------
  #
  # Each directory below is its own workspace with its own lockfile, so the root entry above never
  # sees it. The test of §81 (a dependency stays upgradable) is "if a newer version exists, does
  # anything here ever tell us?", and for these thirteen graphs this entry is what tells us.
  # `script/lint` keeps this list complete: every committed Cargo.lock that `script/supply-chain`
  # checks must appear here or in the root entry, so a new workspace cannot join the tree unwatched.
  #
  # Two lockfiles are left out, for the same reasons `script/supply-chain` skips them, and this is
  # not an `ignore`: no upgrade is foreclosed, because neither lockfile is ours to move.
  #   - vendor/redoxfs and vendor/talc carry upstream's own Cargo.lock byte for byte, and
  #     `script/vendor-verify` fails on any change to it. `script/vendor-watch` watches those
  #     upstreams instead, and the workspaces that build them (redoxfs_server, tools/redoxfs_host
  #     and the rest) resolve their own graphs, which are watched here.
  #   - notes/packages/container-format-measurements/fuzz is a measuring harness kept as
  #     `Cargo.toml.in`, so nothing can parse it, and it pins exact versions because they are what
  #     its note measured.
  #
  # A separate entry from the root rather than more directories on it, so that a red bump in one of
  # these workspaces does not hold back the root workspace's weekly group, which carries the kernel.
  - package-ecosystem: cargo
    directories:
      - "/c_library"
      - "/cryptography_exerciser"
      - "/cryptography_provider"
      - "/fuzz"
      - "/jig"
      - "/mdr"
      - "/pinned_tls_client"
      - "/pinned_tls_exerciser"
      - "/redoxfs_server"
      - "/std_exerciser"
      - "/tools/glyph_atlas_generator"
      - "/tools/host_reordering_litmus"
      - "/tools/redoxfs_host"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch bumps across all thirteen workspaces, one pull request a week.
      workspaces-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # A major bump is one pull request per dependency across every workspace that holds it,
      # rather than one per workspace. `rustls` sits in four of these graphs, and the provider
      # those four share implements its traits, so moving it one workspace at a time would be the
      # ntlm-crypto failure above in a new shape (§81 (a dependency stays upgradable) records
      # that incident).
      workspaces-major:
        patterns: ["*"]
        update-types: ["major"]
        group-by: dependency-name

  # --- GitHub Actions used by .github/workflows/ci.yml ----------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
