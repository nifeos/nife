# Dependabot keeps dependencies current by opening PRs, which CI then checks. Two ecosystems:
# the Rust crates (Cargo) and the GitHub Actions the workflow pins. See
# https://docs.github.com/code-security/dependabot.
#
# No entry sets `cooldown`, on purpose (decided 2026-10-25 UTC): Dependabot's default waits 3 days
# after a release before proposing a version update, and a security update skips the wait. Never
# close one of these pull requests to block a version, since Dependabot then stops proposing it
# without any trace in this file; label it `bump-blocked` beside a `BUGS` entry instead.
# notes/dependency-updates.md has the whole practice, and who merges which bump.
version: 2
updates:
  # --- Rust dependencies (the workspace root Cargo.toml / Cargo.lock) --------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Fold routine minor/patch bumps into a single PR so the queue stays quiet; a major bump
    # (which can break the build) still gets its own PR to review on its own.
    #
    # **The exception is a set of crates that only builds as a set.** `digest`, `hmac`, `md-5` and
    # `md4` (crates/ntlm's NTLMv2 primitives) ship as one coordinated RustCrypto release: `digest`
    # 0.11 pulls `hmac` 0.13, `md-5` 0.11 and `md4` 0.11 with it. So the default one-PR-per-major
    # rule proposes four pull requests that are each **unbuildable by construction**, because no
    # single one of them can produce a consistent graph. That is exactly what happened on
    # 2026-08-10: PRs #144-147 each went red on `build + test`, `clippy` and the supply-chain job,
    # and were re-proposed every week.
    #
    # Grouping the majors is the fix rather than ignoring them, and the difference matters. An
    # `ignore` here would suppress the churn by **foreclosing the upgrade**, freezing the crypto
    # stack until somebody hand-edited this file; that is a standing policy decision and it belongs
    # to an architect, not to a CI cleanup. A group suppresses the same churn and keeps the door
    # open: one
    # pull request bumping all four together, which builds once `crates/ntlm` is migrated to the new
    # `Digest`/`Mac` APIs, on whatever schedule that migration is worth.
    #
    # The algorithms themselves are frozen and always will be (NTLMv2 mandates MD4 and MD5, so
    # nothing here *chooses* them; see crates/ntlm/Cargo.toml). That is an argument about `md-5` and
    # `md4`, not about `digest` and `hmac`, which are generic trait crates that legitimately evolve
    # and are pinned here only by their coupling to the other two.
    # EXCEPTION (§81): `lock_api` semver-major is ignored here, held because vendor/talc asks for
    # `^0.4` and is upstream's published manifest plus one divergence patch, which
    # `script/vendor-verify` enforces. Dependabot follows the path dependency into that manifest and
    # rewrites it, so a `lock_api` 0.5 bump (#2958) fails supply-chain and verify scope by
    # construction. We adopt the vendored upstream as it stands and take the upgrade when upstream
    # makes it, so the ignore lifts when `script/vendor-watch` reports that a talc release allows
    # `lock_api` 0.5 (vendor/README.md, "Taking a held bump"). The same hold is in the entries below
    # for the workspaces whose graph holds talc.
    ignore:
      - dependency-name: "lock_api"
        update-types: ["version-update:semver-major"]
    groups:
      # Ordered before the catch-all: a dependency lands in the first group it matches, and the
      # update-types are disjoint, so minor/patch bumps of these four still ride the group below.
      ntlm-crypto:
        patterns: ["digest", "hmac", "md-5", "md4"]
        update-types: ["major"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Rust dependencies of every other workspace with a committed Cargo.lock ------------------
  #
  # Each directory below is its own workspace with its own lockfile, so the root entry above never
  # sees it. The test of §81 (a dependency stays upgradable) is "if a newer version exists, does
  # anything here ever tell us?", and for these ten graphs this entry is what tells us (the three
  # that build vendored RedoxFS have the entry after this one).
  # `script/lint` keeps this list complete: every committed Cargo.lock that `script/supply-chain`
  # checks must appear here or in the root entry, so a new workspace cannot join the tree unwatched.
  #
  # Two lockfiles are left out, for the same reasons `script/supply-chain` skips them, and this is
  # not an `ignore`: no upgrade is foreclosed, because neither lockfile is ours to move.
  #   - vendor/redoxfs and vendor/talc carry upstream's own Cargo.lock byte for byte, and
  #     `script/vendor-verify` fails on any change to it. `script/vendor-watch` watches those
  #     upstreams instead, and the workspaces that build them (redoxfs_server, tools/redoxfs_host
  #     and the rest) resolve their own graphs, which are watched here and in the entry below.
  #   - notes/packages/container-format-measurements/fuzz is a measuring harness kept as
  #     `Cargo.toml.in`, so nothing can parse it, and it pins exact versions because they are what
  #     its note measured.
  #
  # A separate entry from the root rather than more directories on it, so that a red bump in one of
  # these workspaces does not hold back the root workspace's weekly group, which carries the kernel.
  - package-ecosystem: cargo
    directories:
      - "/c_library"
      - "/cryptography_exerciser"
      - "/cryptography_provider"
      - "/jig"
      - "/mdr"
      - "/pinned_tls_client"
      - "/pinned_tls_exerciser"
      - "/std_exerciser"
      - "/tools/glyph_atlas_generator"
      - "/tools/host_reordering_litmus"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # EXCEPTION (§81): `lock_api` semver-major is ignored here, held because vendor/talc asks for
    # `^0.4` and is upstream's published manifest plus one divergence patch, which
    # `script/vendor-verify` enforces. Dependabot follows the path dependency into that manifest and
    # rewrites it, so a `lock_api` 0.5 bump (#2958) fails supply-chain and verify scope by
    # construction. We adopt the vendored upstream as it stands and take the upgrade when upstream
    # makes it, so the ignore lifts when `script/vendor-watch` reports that a talc release allows
    # `lock_api` 0.5 (vendor/README.md, "Taking a held bump"). The same hold is in the entries below
    # for the workspaces whose graph holds talc.
    ignore:
      - dependency-name: "lock_api"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch bumps across all ten workspaces, one pull request a week.
      workspaces-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # A major bump is one pull request per dependency across every workspace that holds it,
      # rather than one per workspace. `rustls` sits in four of these graphs, and the provider
      # those four share implements its traits, so moving it one workspace at a time would be the
      # ntlm-crypto failure above in a new shape (§81 (a dependency stays upgradable) records
      # that incident).
      workspaces-major:
        patterns: ["*"]
        update-types: ["major"]
        group-by: dependency-name

  # --- The three workspaces that build vendored RedoxFS -----------------------------------------
  #
  # fuzz, redoxfs_server and tools/redoxfs_host each take vendor/redoxfs as a path dependency, and
  # Dependabot follows a path dependency into its manifest. A bump past the range that manifest asks
  # for therefore rewrites vendor/redoxfs/Cargo.toml, which is upstream's published file, and
  # `script/vendor-verify` fails it by construction. That is what happened to #2756-#2759
  # (getrandom 0.4, aes 0.9, argon2 0.6, endian-num 0.2), declined and closed under Decision 39
  # (ruled 2026-10-26 UTC). A bump inside the range only refreshes the lockfiles (#2725 and #2755
  # touched nothing else), so only the out-of-range one is ignored below: for Cargo, Dependabot's
  # `semver-major` is the caret boundary, so a 0.y crate's next minor counts as major.
  #
  # EXCEPTION (§81): the semver-major updates of every direct dependency vendor/redoxfs/Cargo.toml
  # declares (normal, dev and per-target) are ignored in these three directories. The upgrade stays
  # reachable: these crates reach the three workspaces only through the vendored engine, so moving
  # them past its range means moving the redoxfs pin, and `script/vendor-watch` is what reports a
  # newer upstream for that (vendor/README.md, "Bumping a pin"). The ignores lift when the redoxfs
  # pin moves: re-read the new vendor/redoxfs/Cargo.toml and make this list match it, dropping a
  # crate it no longer declares. A name here also covers that crate in these three directories when
  # another of their dependencies holds it (redox_syscall, uuid and libc are also direct
  # dependencies of redoxfs_server or tools/redoxfs_host, which must agree with the engine on them
  # anyway); the root entry still proposes majors for the kernel crates' own copies.
  #
  # Its own entry rather than three more directories on the one above, because an `ignore` applies
  # to every directory of its entry and these holds are true only of these three.
  - package-ecosystem: cargo
    directories:
      - "/fuzz"
      - "/redoxfs_server"
      - "/tools/redoxfs_host"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # The same two groups as the entry above, for the same reasons.
      redoxfs-workspaces-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      redoxfs-workspaces-major:
        patterns: ["*"]
        update-types: ["major"]
        group-by: dependency-name
    # `lock_api` is held for vendor/talc as in the root entry above (EXCEPTION (§81), same
    # condition: `script/vendor-watch` says when a talc release allows 0.5).
    ignore:
      - dependency-name: "lock_api"
        update-types: ["version-update:semver-major"]
      - dependency-name: "aes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "argon2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "base64ct"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bitflags"
        update-types: ["version-update:semver-major"]
      - dependency-name: "endian-num"
        update-types: ["version-update:semver-major"]
      - dependency-name: "env_logger"
        update-types: ["version-update:semver-major"]
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "humansize"
        update-types: ["version-update:semver-major"]
      - dependency-name: "libc"
        update-types: ["version-update:semver-major"]
      - dependency-name: "log"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lz4_flex"
        update-types: ["version-update:semver-major"]
      - dependency-name: "parse-size"
        update-types: ["version-update:semver-major"]
      - dependency-name: "range-tree"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redox_syscall"
        update-types: ["version-update:semver-major"]
      - dependency-name: "seahash"
        update-types: ["version-update:semver-major"]
      - dependency-name: "smallvec"
        update-types: ["version-update:semver-major"]
      - dependency-name: "termion"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xts-mode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zerocopy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "assert_cmd"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fuser"
        update-types: ["version-update:semver-major"]
      - dependency-name: "libredox"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redox-path"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redox-scheme"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions used by .github/workflows/ci.yml ----------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
