[package]
name = "program_table"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# nife's own side of the grant vocabulary: the programs the shell can spawn and what each declares,
# the spawn protocol's word layout, the shell's window pool and the region budgets both the shell and
# the progenitor count. The planner it feeds is `grant_plan`, which knows only manifests; this crate
# is what names nife's programs. Name: provisional.

[lints]
workspace = true

[dependencies]
# The manifest types and slot numbers every row is written in.
grant_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/grant_contract", rev = "f84cd7e6ff2efccbaf18988c584ff9bb7b32e4e7" }
# The planner: `plan` and `plan_stage` resolve a name here and plan against its manifest there.
grant_plan = { version = "0.1.0", git = "https://github.com/partsfoundry/grant_plan", rev = "69aedfbc9adb70d877435c6a62dc4983ef035e0d" }

# Dev dependencies only: host tests pin `spawn_protocol`'s rights words to the filesystem contract's bits
# and `map_el0`'s budget to the one the primitive benchmark measured, without linking either, and
# read a verb back off an argument page the way the progenitor does.
[dev-dependencies]
capability_manifest_note = { version = "0.1.0", path = "../capability_manifest_note" }
program_argument_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/program_argument_contract", rev = "b097970b8650ca8a370018f18ce533c1f22db3e4" }
file_system_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/file_system_contract", rev = "7577a7d0df339107f75747c3681f5990f116cf61" }
# The planner's glob fixtures are checked against its matcher, at the revision the planner pins.
file_system_fixture = { version = "0.1.0", git = "https://github.com/partsfoundry/file_system_contract", rev = "7577a7d0df339107f75747c3681f5990f116cf61" }
byte_glob = { version = "0.1.0", git = "https://github.com/partsfoundry/byte_glob", rev = "a095cd860ae8b6aa678913bdd7b2b32db24cc596" }
primitive_benchmark_contract = { version = "0.1.0", path = "../primitive_benchmark_contract" }
