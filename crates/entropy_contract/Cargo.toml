[package]
name = "entropy_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Request and reply words for a service that hands out random bytes, and the rules for reading a reply that is not one"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "entropy", "random"]
categories = ["no-std", "embedded", "cryptography"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# The entropy contract: the tiny request/reply shape a client uses to obtain random bytes from an
# entropy service, and the rule for reading a reply that is not one. Pure logic, host-tested,
# no_std, dependency-free, so the service, its clients and their tests share ONE definition and
# cannot drift.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
