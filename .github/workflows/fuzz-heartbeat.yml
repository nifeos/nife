name: fuzz heartbeat

# Observed failing: 2026-11-21, run 44954174201: the scheduled run found no fuzz-YYYY-MM-DD release
#   for 2026-11-21 or 2026-11-20 (the newest was fuzz-2026-11-19) and opened #3912 with the label
#   fuzz-loop-broken. The run itself ends green by design; the issue is the alarm.
#   helpers/fuzz-heartbeat.py --selftest still drives the other arms (no ok window, infrastructure
#   share above the bound, an open issue stopping a second) over fixture reports, and the parked
#   notice (first issue, growth, no growth, an issue already open) the same way.

# **Is the continuous fuzz loop still producing?** Asked daily, answered by an issue.
#
# The continuous fuzzing host publishes one release per day (tag fuzz-YYYY-MM-DD). This is the dead-man's
# switch: it looks at the releases of the last two UTC days and opens one issue, labeled
# fuzz-loop-broken, when none exists, when the report shows no ok window, or when infrastructure
# windows are too large a share. The checks and their bound are in helpers/fuzz-heartbeat.py. It
# repairs nothing; a person turns the issue into an action (partsfoundry/record:notes/fuzzing/continuous-host.md).
#
# Ruled 2026-11-01 (UTC): a scheduled workflow on a GitHub-hosted runner, never a self-hosted one.
# While no fuzz-* release has ever existed it passes quietly, so it switches on by itself at the first
# release. It takes no secret (GITHUB_TOKEN is the runner's own), runs only on schedule and by hand,
# and fetches the release list and report.md, nothing else.
#
# **A parked fuzz finding notifies a person** (ruled 2026-11-22 UTC). The fuzz filer parks budget and
# hang causes and never files them; each waits for a person to write a `file` or `suppress` rule in
# partsfoundry/fuzz-host etc/fuzz-filer/rules.tsv. When the report's Filer line shows more parked causes
# than the count already noticed, the heartbeat opens one issue labeled fuzz-findings-parked (label
# provisional), or comments on the one already open; it never opens a second. The count already
# noticed is read back from a marker in that issue's body, so the workflow keeps no state and takes
# no secret. **Privacy:** the issue and its comments carry the parked count and the release day only,
# never a signature, an ID, an input or a log line. Issues are public; the findings stay private on
# the fuzz host.

on:
  schedule:
    # 17:00 UTC daily, three hours after the host's 14:00 UTC publish timer.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: check the fuzz loop
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout_first_1
        timeout-minutes: 2
        continue-on-error: true  # outcome: re-raised
        with:
          persist-credentials: false
          sparse-checkout: helpers/fuzz-heartbeat.py
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 3
        if: steps.checkout_first_1.outcome != 'success'
        with:
          persist-credentials: false
          sparse-checkout: helpers/fuzz-heartbeat.py
          sparse-checkout-cone-mode: false
      - name: heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 helpers/fuzz-heartbeat.py
