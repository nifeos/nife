[package]
name = "domain_name_resolution_fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Test data for a name resolver: the zone, the name server peer and the cases of the QEMU runners' resolver tests"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "dns", "testing"]
categories = ["no-std", "embedded", "network-programming"]
publish = false     # this crate stays in nife and is never published

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
# The reply statuses and the reject codes each case expects.
domain_name_resolution_contract = { version = "0.1.0", path = "../domain_name_resolution_contract" }
# The reject reasons the refused cases name.
domain_name_system = { version = "0.1.0-pre.1", git = "https://github.com/nifeos/domain_name_system", rev = "c656cdd9206149dd147d6550c339f1cc520aadd0" }
