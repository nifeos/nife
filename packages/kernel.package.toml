# kernel: the kernel and the crates only it links. Debian's linux-image.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and nifeos/record:notes/package-boundaries.md has the table and the reasons.

name = "kernel"
kind = "base"
home = { repo = "kernel", status = "provisional" }
crates = [
    "kernel",
    # `capability_table` lives in the repository `partsfoundry/capability_table` and is not listed here;
    # the kernel links it by revision.
    "page_tables",
    "page_frames",
    "address_space_identifier",
    "cpu_set",
    "inter_process_communication",
    "memory_corruption_canary_gate",
    "memory_regions",
    "thread_wake_handshake",
    "work_steal_slot",
    "direct_memory_access_validator",
    "firmware_configuration",
    "jh7110_watchdog",
]
# `jh7110_clock_and_reset` names the JH7110 clock controllers' spellings and decodes their
# properties; the device-tree walk in `machine_discovery` (contracts) reads the tree with them and
# fills in its types. Two packages link it, so it is an interface.
# `test_and_set_lock` is the kernel's lock; `host_reordering_litmus` (host-tools) runs it in a bare-metal
# guest to measure it, so two packages link it and it is an interface.
# `pci_configuration_space` walks a function's capability list; `driver_process_contract::virtual_io`
# (contracts) reads a virtio function's structures and MSI-X ranges with it, so a direct grant's
# window and the kernel's mediated transport read the list one way. Two packages link it, so it is
# an interface.
# `jh7110_pci_express` holds the JH7110 root complex's bring-up; `machine_discovery::jh7110`
# (contracts) fills its `Port` from the tree, as it fills the clock and reset types. Two packages
# link it, so it is an interface.
interfaces = ["jh7110_clock_and_reset", "jh7110_pci_express", "pci_configuration_space", "test_and_set_lock"]

