[package]
name = "filesystem_fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Test data for a filesystem stack: the names and contents of the files a test image ships, the verdict words of the witnesses that probe it, and the shapes of the walk and throughput benchmarks"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "filesystem", "testing"]
categories = ["no-std", "embedded", "filesystem"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# The filesystem test fixture: the names and contents of the files the test image ships, the
# witnesses' verdict words, and the shapes of the walk and throughput benchmarks. It is test data
# rather than wire contract, and nothing that boots depends on it. The protocol words (`READY`,
# `DESCENT_REFUSED`, and the `rm` status convention) are in `filesystem_contract`.
#
# Name: provisional (proposed by block 886); calef names crates.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
filesystem_contract = { version = "0.1.0", path = "../filesystem_contract" }
