# Name: recorded (design/roadmap/0039-repository-structure.md's naming section, performed by milestone
# 175). A **component** is this project's word for the shippable unit, a binary plus its manifest,
# and a **service** is what one offers over a contract. 39 refused the Unix word for a long-running
# background process on a technical rather than an aesthetic argument, and that argument is written
# there rather than repeated here, because `script/lint` keeps the rejected word inside `design/`
# and design/naming.md where the case for rejecting it lives.
#
# The package holds every EL0 program a distribution would ship because somebody wants its function:
# the services and drivers, the progenitor and supervision spine, and the tools a person invokes at the
# prompt. What it is not is in `fixtures/`, and the dividing question is what a program IS rather
# than who runs it, since nearly everything here is reached only from a kernel test. Nobody has put
# either name to an architect, which is what `recorded` claims and all it claims.
[package]
name = "components"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
# **The attacker roles the confinement tests spawn, compiled in only for a test boot** (milestone 261
# (the NVMe driver leaves the kernel)'s DMA-escape test). Off in every shipped image: a production
# `non_volatile_memory_express` server carries no code that aims a PRP outside its region, so no
# value planted in its transfer buffer can select one. `cargo xtask test` turns it on for each
# leg's userspace build (`xtask/src/main.rs`'s `CONFINEMENT_ATTACKERS`); nothing else does. A test
# boot against an initial ramdisk built without it fails by name rather than as a missing IOMMU
# fault. `block_driver`'s two virtio attacker roles predate this and still ship ungated.
# The feature name was ratified by calef, 2026-10-05 (#1647).
confinement_attackers = ["non_volatile_memory_express/confinement_attackers"]
# **The input driver holds 200 ms after every drain**, for `script/swish-check --input-race`: the
# window in which a receive interrupt cleared after the drain would strand typed bytes in the
# PL011's FIFO (components/src/input.rs). Off in every shipped image. Name provisional (2026-10-13 UTC).
input_race_probe = []

# The console server (milestone 19f (run a real workload).3): the second program lifted out of
# `hello`. `initial_ramdisk_aarch64` packs it under "console"; the progenitor loads it by name.
[[bin]]
name = "console"
path = "src/console.rs"
test = false
bench = false

# The input driver (milestone 19f.4): the receive half of the terminal, lifted out of hello.
# Since milestone 28 it is a raw byte forwarder; the editing lives in line_editor.
[[bin]]
name = "input"
path = "src/input.rs"
test = false
bench = false

# The line discipline (milestone 28): the tty layer as a swappable userspace component between
# the input/console drivers and applications. Serves the terminal contract
# (notes/terminal-contract.md); the editing engine is the host-tested `line_editor` crate.
[[bin]]
name = "line_editor"
path = "src/line_editor.rs"
test = false
bench = false

# `terminal_sink_caretaker` (milestone 50's last remainder): the terminal as a destination for the sink
# contract. A caretaker in `fs_file_caretaker`'s shape, and a separate process for a capability
# reason rather than a scheduling one: the terminal endpoint also carries OPERATION_READLINE, so a child
# handed it as its output slot would hold the keyboard. **Provisional name.**
[[bin]]
name = "terminal_sink_caretaker"
path = "src/terminal_sink_caretaker.rs"
test = false
bench = false

# `swish` (milestone 19f.5): the shell, the last program lifted out of hello, and the most wired.
# A swish is the shot that goes through the net touching nothing, which is least authority in one
# word. `initial_ramdisk_aarch64` packs it as "swish"; `system_initializer` loads it by that name.
[[bin]]
name = "swish"
path = "src/swish/main.rs"
test = false
bench = false


# The interrupt-driven console input driver (milestone 20): an unprivileged userspace device driver.
# It holds an Irq capability, a report endpoint, and a device mapping of the UART, and services the
# receive interrupt with the seL4 WAIT/read/report/ACK loop. Portable; the riscv initial ramdisk
# packs it as "serial_driver". The aarch64 input driver is the PL011-wired role of `hello`; this is
# its portable analog.
[[bin]]
name = "serial_driver"
path = "src/serial_driver.rs"
test = false
bench = false

# **The progenitor** (milestone 266): the first process, on all three architectures. The kernel
# loads it as the boot process and it builds the interactive system (console, input, line
# discipline, shell) out of its own budget, then stays alive as the spawn service. Until 266 this
# was riscv64's only and aarch64 booted a role of `hello` instead; the archive entry is now
# `progenitor` on every board and the alias layer that hid the difference is gone.
[[bin]]
name = "progenitor"
path = "src/progenitor.rs"
test = false
bench = false

# The virtio-blk driver as its own binary (parity C): the shared `virtio` module (the same file
# hello's aarch64 roles compile) behind a dedicated-binary skeleton, so riscv runs the identical
# driver, attacker included, without porting the PL011-wired hello multiplexer.
[[bin]]
name = "block_driver"
path = "src/block_driver.rs"
test = false
bench = false

# The file caretaker (milestone 31 phase 2): a directory capability attenuated to one file, in one
# direction. It is the caretaker that stands between the FS server and a program the command line
# granted a single file, and it is a separate process so the narrowing is an address-space boundary
# rather than a branch. initial_ramdisk_aarch64 packs it as "fs_file_caretaker".
[[bin]]
name = "fs_file_caretaker"
path = "src/fs_file_caretaker.rs"
test = false
bench = false

# The subtree caretaker (milestone 47): the same caretaker one rung up, narrowing a directory
# capability to one SUBTREE with an explicit rights ladder. It is what `cd` and a per-process
# namespace resolve to, and it is a separate process for fs_file_caretaker's reason: the FS
# server's handle table is per server, so only an address-space boundary keeps a program off the
# parent directory. initial_ramdisk_aarch64 packs it as "fs_subtree_caretaker".
[[bin]]
name = "fs_subtree_caretaker"
path = "src/fs_subtree_caretaker.rs"
test = false
bench = false

# The nameset caretaker (milestone 47's globbing lane): the same caretaker over a namespace of the
# names a pattern matched. A third caretaker rather than a mode on `fs_subtree_caretaker`, because
# that program's design property is that it performs no checks at all, and a name filter is a check
# on every name-taking verb. initial_ramdisk_aarch64 packs it as "fs_nameset_caretaker".
[[bin]]
name = "fs_nameset_caretaker"
path = "src/fs_nameset_caretaker.rs"
test = false
bench = false

