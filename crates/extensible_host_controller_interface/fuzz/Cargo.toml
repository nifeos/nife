# The fuzz targets for extensible_host_controller_interface, run with cargo-fuzz.
#
# A workspace of its own: a target links libFuzzer's `main` and is built with a sanitizer, so no
# ordinary build of the crate should try to produce it. Each target feeds the crate the bytes a
# controller writes (the event ring, the capability registers, the extended capability list, the
# port status registers and the slot context) and holds what the decoders return to the bits the
# specification gives each field.

[package]
name = "extensible_host_controller_interface_fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.extensible_host_controller_interface]
path = ".."

[[bin]]
name = "event_ring"
path = "fuzz_targets/event_ring.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capability_registers"
path = "fuzz_targets/capability_registers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "port_status"
path = "fuzz_targets/port_status.rs"
test = false
doc = false
bench = false

[workspace]
