[package]
name = "extensible_host_controller_interface_contract"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# What the kernel and nife's USB keyboard driver agree on about the xHCI controller between them:
# which register pages the driver is mapped, the three spawn words, and how many pages of the DMA
# region are the driver's. It left `extensible_host_controller_interface` on the 2026-10-25 names
# ruling, because it is nife's process plan and not the xHCI specification; it is a crate because two
# binaries agree on it (rule 7). no_std, host-tested, and proven with Kani.

[lints]
workspace = true

[dependencies]
extensible_host_controller_interface = { version = "0.1.0", path = "../extensible_host_controller_interface" }
