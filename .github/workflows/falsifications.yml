name: falsification sweep

# Observed failing: 2026-09-28, run 36419492753: the scheduled sweep reported `165 swept, 0
#   survivors, 1 stale or broken` (system_tests::port_holder_transmits_then_a_non_holder_faults).
#   Green by design, since a finding is a worklist entry and not a red check; the stale line is the
#   arm that fired. No run has shown a survivor yet. See notes/observed-failing.md.

# **Does each harness's own recorded falsification still turn it red?** Asked weekly, of every Kani
# harness carrying a `replayable` record (DECISIONS §134, milestone 194).
#
# The mutation job next door asks "would any TEST notice if this line were wrong". This asks the
# same question of the PROOFS, and it is not the same question: a proof that cannot be made to fail
# is not evidence, and nothing in this tree could detect one until this ran. A **survivor** here is
# a harness that stayed green with its own falsification applied. A **stale** one is a patch that no
# longer applies, which §134 argues is the mechanism working rather than a nuisance: the covered
# code moved, so the falsification must be redone rather than trusted.
#
# **A report, not a gate**, deliberately copying `script/mutation`'s posture for the reason §134
# gives: a survivor is a worklist entry rather than a defect in whatever commit happened to precede
# the cron. The per-pull-request half is `script/falsifications --affected-since`, which re-falsifies
# only the harnesses a diff can reach and costs seconds; it lives in verify.yml, not here, and it
# covers Kani and host-test records only. **This run is the only thing that replays a kernel-test or a
# swish-check record at all.**
#
# **But the run goes red when the report has a finding, since milestone 742 (provisional).** Until
# then the sweep step was `continue-on-error` and the job reported success whatever it found. The
# scheduled run of 2026-09-28 swept 165 records, found one stale
# (`system_tests::port_holder_transmits_then_a_non_holder_faults`), and reported success; the
# finding was in a step summary nobody had a reason to open. trunk-health.yml draws the line this
# follows: a printed line in a green run is a line nobody sees, and a red scheduled run is one
# GitHub notifies on. It is still a report and not a gate, because nothing requires it and no pull
# request waits on it.
#
# **Unsharded, and that is a measurement rather than an oversight.** A falsification runs ONE
# harness, so the sweep costs one harness-run per record and not one `script/verify` per record.
# Today's six take under three seconds of solving on top of the builds. Shard this when the record
# count makes it worth the machinery, not before, and re-measure rather than guessing: the cost is
# dominated by the rebuild each patch forces, so it scales with patches touching distinct crates.

on:
  schedule:
    # 06:00 UTC Monday, an hour behind the mutation cron so the two weekly reports do not contend
    # for runners, and still ahead of the toolchain-drift daily at 07:00.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege, the same decision every workflow here makes: this reads the source, applies and
# reverts patches in its own checkout, and writes nothing but its own summary.
permissions:
  contents: read

# A queued weekly run has nothing to say that the newer one will not say better.
concurrency:
  group: falsifications
  cancel-in-progress: true

jobs:
  sweep:
    name: replay every recorded falsification
    runs-on: ubuntu-24.04-arm
    # Generous enough that growth in the record count does not need this touched every month, and
    # low enough that a hang fails loudly. (This said Kani's install was the long pole. It takes 11
    # to 17 s here, runs 37368707083 and 37311742614; verify.yml's `prove` job has the measurement.)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # **QEMU, and the bootstrap that provisions the kernel build**, the same four steps ci.yml's
      # test job takes and for its reasons (the runner's packaged QEMU is 8.2; the pinned build is
      # cached by `.qemu-version`). Added 2026-09-25: a kernel-test record boots under QEMU, and
      # this job had never installed one, so every kernel record since milestone 305 (the six
      # kernel confinement rows get a falsification a machine can replay) reported `ERROR the
      # kernel never reached its test runner` here, twelve of them on 2026-09-24, inside a job that
      # reports success. The Kani records were the only ones this sweep ever replayed.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap

      # script/verify installs Kani on first run; do it here as its own step so an install failure
      # is not reported as a sweep failure.
      - name: Install Kani
        run: script/kani-install

      # Not `continue-on-error` any more (milestone 742, provisional): the step fails when the
      # sweep has a survivor, a stale record or no verdict, the report below still publishes
      # (`if: always()`), and the run goes red so the finding reaches someone. It used to be
      # `continue-on-error`, on the argument that a survivor is a finding to publish rather than
      # a red check somebody has to silence, and the 2026-09-28 run showed what that cost: a stale
      # record inside a green run.
      #
      # **The transcript is written to `RUNNER_TEMP`, never into the checkout**, and this is a
      # correction rather than a preference: `tee sweep.txt` put an untracked file in the work tree
      # BEFORE the sweep read it, so the sweep's own dirty-tree guard refused every run. It printed
      # the refusal, exited non-zero into `continue-on-error`, and the job reported success, so the
      # weekly report said nothing was wrong by never replaying anything. Three scheduled runs
      # (2026-09-07, -14 and -21) swept zero records that way, and the summary they published was a
      # copy of the refusal. Found 2026-09-23 by dispatching this workflow on a lane branch.
      - name: Sweep
        id: sweep
        shell: bash
        run: |
          set -o pipefail
          script/falsifications --sweep 2>&1 | tee "$RUNNER_TEMP/sweep.txt"

      - name: Publish the report
        if: always()
        run: |
          {
            echo '### Falsification sweep'
            echo
            echo '```'
            cat "$RUNNER_TEMP/sweep.txt" || echo '(the sweep produced no output)'
            echo '```'
            echo
            echo '```'
            script/falsifications | tail -20
            echo '```'
            echo
            echo 'A **survivor** stayed green with its own falsification applied; a **stale** patch'
            echo 'no longer applies, which means the covered code moved and the falsification wants'
            echo 'redoing. Both are worklist entries, not failures of this commit. The convention is'
            echo 'DECISIONS §134; the worklist is `script/falsifications --unfalsified`.'
          } >> "$GITHUB_STEP_SUMMARY"

      # The transcript carries every record's replay time, which is what verify.yml's re-falsify
      # shards are packed by. `record-times` below writes it back into the tree.
      - name: Keep the transcript for the times file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: falsification-sweep
          path: ${{ runner.temp }}/sweep.txt
          if-no-files-found: warn

  # **The measured times verify.yml packs its re-falsify shards by** (calef, 2026-10-06 UTC, a
  # 20-minute target per shard, 17 since #1802 on 2026-10-07). `script/falsifications --record-times` merges this sweep's
  # per-record times into notes/project-metrics/falsification-times.tsv and a pull request carries
  # them, in the shape mutation.yml's `record` job uses. It runs whatever the sweep found, since a
  # survivor's time is as good a weight as a red one's; a stale number only unbalances the shards
  # and never drops a record from them. `main` only, through the `automation` environment.
  record-times:
    name: record the replay times
    needs: sweep
    if: always() && needs.sweep.result != 'cancelled' && github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # **The App is optional** (milestone 889 (the tree's gates stop depending on the fleet tooling),
    # provisional), as in toolchain-bump.yml, which has the full argument. With the App's secrets
    # absent (a fork, or a repository the App is not installed on) the token step is skipped and
    # every `steps.app-token.outputs.token || github.token` below falls through to the ephemeral
    # token. That token pushes the branch but may not open a pull request, so the run ends green
    # with the compare link in its summary (helpers/pull-request-by-hand.sh). The secrets context is not readable in a step's
    # `if`, so only the App ID is lifted here, and only so its presence can be tested.
    env:
      AUTOMATION_APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
    steps:
      - name: Mint an installation token for the automation App, when it is installed
        id: app-token
        if: env.AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: falsification-sweep
          path: sweep

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # Who the pull request's opening line names: the App, or the fallback above.
          PR_AUTHOR: ${{ steps.app-token.outputs.token && 'nife-smelter[bot]' || 'github-actions[bot]' }}
          # Non-empty only when the App's token was minted; see the push-only branch below.
          USING_APP: ${{ steps.app-token.outputs.token && 'yes' || '' }}
        run: |
          set -e
          script/falsifications --record-times sweep/sweep.txt
          if git diff --quiet -- notes/project-metrics/falsification-times.tsv; then
            echo "Nothing to record."
            exit 0
          fi
          branch="falsification/times"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add notes/project-metrics/falsification-times.tsv
          git commit -m "falsification times: record run $GITHUB_RUN_ID

          Per-record replay times from the weekly sweep, which verify.yml's re-falsify shards are
          packed by."
          git push --force origin "$branch"
          body="**Lane:** $branch, opened by a scheduled workflow; $PR_AUTHOR is the author GitHub shows.

          Per-record replay times from [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), the weights \`script/falsifications --plan-since\` packs verify.yml's re-falsify shards by."
          # No App token: push only, and leave the pull request to a person (calef's ruling on
          # #2442, 2026-10-20 UTC). `github.token` may not open one, and the repository setting
          # that would let it stays off. The summary carries the compare link, title and body.
          if [ -z "$USING_APP" ]; then
            helpers/pull-request-by-hand.sh "$branch" "falsification times: record run $GITHUB_RUN_ID" "$body"
            exit 0
          fi
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title "falsification times: record run $GITHUB_RUN_ID" --body "$body"
          else
            gh pr edit "$existing" --title "falsification times: record run $GITHUB_RUN_ID" --body "$body"
          fi

  # **The Kani records no arm64 host can replay** (milestone 323 (the falsification record is incomplete in five ways), batch 3). A `#[kani::proof]`
  # compiles for the HOST, and `kernel/src/arch/mod.rs` selects `arch/x86_64/` by `#[cfg(target_arch)]`,
  # so `sweep` above (arm64) and verify.yml's `falsify` job (arm64) cannot make an x86_64 harness
  # red, and the only x86_64 Kani leg in CI is the proving shards, which prove and never mutate.
  # Such a record is `attested`, names its patch in backticks, and is replayed here. This job runs
  # on `ubuntu-24.04` (x86_64) and goes red on a survivor, a stale patch or an empty selection.
  # Dispatchable on its own, so a lane can get a record replayed without waiting for the cron.
  sweep-x86_64:
    name: replay the attested records an arm64 host cannot
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Kani
        run: script/kani-install

      - name: Sweep the attested records
        shell: bash
        run: |
          set -o pipefail
          uname -m
          script/falsifications --sweep-attested 2>&1 | tee "$RUNNER_TEMP/sweep-x86.txt"

      - name: Publish the report
        if: always()
        run: |
          {
            echo '### Attested records replayed on x86_64'
            echo
            echo '```'
            cat "$RUNNER_TEMP/sweep-x86.txt" || echo '(the sweep produced no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # **The long sweep of the seeded syscall driver** (milestone 752 (a seeded syscall driver with a
  # shadow model), provisional). The suite runs a short committed seed list on every merge; this
  # runs many fresh seeds once a week on the cadence milestone 616 (constrained hardware fuzzing for
  # the boot path) chose for breadth, so a finding is a red scheduled run and never a red trunk.
  #
  # **The seeds move every week and every one is printed.** The first seed is the ISO week times
  # one million, so no two weeks repeat and any run can be reconstructed from its date. A mismatch
  # names its seed and the one-line replay (`NIFE_SYSCALL_FUZZ_SEEDS=<seed>:1 cargo xtask test
  # --arch aarch64 --test seeded_syscalls`). The count asked for is more than fits: the driver stops
  # between seeds after 60 s of guest time, under the suite's 90 s per-test budget, and prints how
  # far it got. At the 2026-10-04 (UTC) rate on a developer machine (about 120 seeds a second on
  # aarch64 under QEMU) that is several thousand seeds a week, against 34 per merge.
  #
  # aarch64 only, for `script/falsifications`' reason: the suite already runs the committed seeds on
  # all three ISAs on every merge, and the weekly breadth is about the seed space, not the ISA.
  syscall-fuzz:
    name: seeded syscall driver, long sweep
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap

      - name: Sweep
        shell: bash
        run: |
          set -o pipefail
          first=$(( $(date -u +%G%V) * 1000000 ))
          echo "seeds from ${first}"
          NIFE_SYSCALL_FUZZ_SEEDS="${first}:1000000" \
            cargo xtask test --arch aarch64 --test seeded_syscalls 2>&1 | tee "$RUNNER_TEMP/fuzz.txt"

      - name: Publish the report
        if: always()
        run: |
          {
            echo '### Seeded syscall driver, long sweep'
            echo
            echo '```'
            grep -E 'syscall fuzzer|panicked|test result' "$RUNNER_TEMP/fuzz.txt" || echo '(no verdict line)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Milestone 779 (fuzz the surface a confined process can reach), part (b): the confined EL0
  # fuzzer's weekly long sweep, the same cadence and cap as the seeded syscall driver above. The
  # committed suite seeds (33, `0..32` plus the corpus) run on every merge on all three ISAs; this
  # is the breadth pass, fresh seeds each week (ISO week times a million, so a finding's seed is
  # reconstructible from the date), aarch64 only for the syscall-fuzz job's reason: the suite
  # already runs the committed seeds on all three ISAs on every merge, and the weekly breadth is
  # about the seed space, not the ISA. The driver stops between seeds after 60 s of guest time and
  # prints how far it got; a confinement escape names its seed and the one-line replay
  # (`NIFE_CONFINED_FUZZ_SEEDS=<seed>:1 cargo xtask test --arch aarch64 --test a_confined_fuzzer`).
  confined-fuzz:
    name: confined fuzzer, long sweep
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap

      - name: Sweep
        shell: bash
        run: |
          set -o pipefail
          first=$(( $(date -u +%G%V) * 1000000 + 52 ))
          echo "seeds from ${first}"
          NIFE_CONFINED_FUZZ_SEEDS="${first}:1000000" cargo xtask test --arch aarch64 --test a_confined_fuzzer 2>&1 | tee "$RUNNER_TEMP/confined.txt"

      - name: Publish the report
        if: always()
        run: |
          {
            echo '### Confined fuzzer, long sweep'
            echo
            echo '```'
            grep -E 'confined fuzzer|panicked|test result' "$RUNNER_TEMP/confined.txt" || echo '(no verdict line)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
