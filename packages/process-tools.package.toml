# process-tools: who else is running. The programs of Debian's procps, after milestone 126 (the
# `procps` package).
#
# Milestone 611 (every program and crate belongs to a package). The package's kind, home and
# membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.
#
# Name: ratified 2026-10-06 (calef, relayed to lane/disk-tools-rename). He answered
# "process-tools". Refused `procps` (the GNU/Linux term of art, given up on purpose so package
# names follow one rule, spelled out, with `core-tools` and `disk-tools`). The programs and crates
# inside keep their names: `ps`, `pgrep`, `top`, `free` and the rest. Ratified 2026-10-28 as the
# repository's name too (calef, relayed by the maintainer on the naming review, pull request
# #2870): `nifeos/process-tools`, the
# repository its programs leave as (§316 (a package's programs leave as one repository, after their
# crates)). The `home` line stays provisional until the repository exists (§316).

name = "process-tools"
kind = "base"
home = { repo = "process-tools", status = "provisional" }
crates = ["ps", "pgrep", "pmap", "top", "uptime", "free", "vmstat", "slabtop", "number_writer"]
programs = ["ps", "pgrep", "pmap", "top", "uptime", "free", "vmstat", "slabtop"]
paths = [
    "packages/uptime.recipe.toml",
    "packages/uptime-riscv64.recipe.toml",
    "packages/uptime-x86_64.recipe.toml",
]
