name: project metrics

# Observed failing: never. Three runs went red from 2026-10-01 to 10-03 (37119405627 is the last)
#   on `metrics: unknown argument --flags`, a defect in the job rather than a finding, and later runs
#   are green. It publishes rather than judges, and what a red run for its own reason would be is not
#   written down; milestone 641 (a mechanism that reports clean says over how many units, and zero is
#   loud) is labelling its suppressions. See notes/observed-failing.md.

# **Append this week's row; never change what a past week said.** The dashboard is
# notes/project-metrics.md and the data behind it is one CSV per measure in
# notes/project-metrics/, in the tree, versioned with the code it describes.
#
# The same three-step split `toolchain-bump.yml` uses, and for the same reason:
#
#   1. PROPOSE (here): recompute this week's row, redraw the charts, open a PR.
#   2. VERIFY (the CI workflow, on that PR): the ordinary gates.
#   3. ACCEPT (a human): merge.
#
# This job must never push to `main`. What it writes is a record other people will quote, and
# `AGENTS.md` puts "facts that leave the machine" in the irreversible category on purpose. A number
# that lands unreviewed is exactly the shape of the three instrument failures the page's own honesty
# section lists.
#
# **Daily recompute, weekly coverage.** calef asked for this on 2026-09-23: he is using the numbers
# to drive decisions more often than once a week. The row is still keyed by ISO week, so a daily run
# does not add a row; it rewrites the current week's row in place with whatever HEAD looks like that
# morning, which is the point (a current number between Mondays) rather than a series with more
# points in it.
#
# **Coverage stays on Monday, and every other day carries whatever cell the week already has.**
# `script/metrics` never recomputes `coverage_lines_pct` itself (CARRIED_FIELDS, script/metrics's own
# comment); it only ever writes that cell from an lcov file this workflow hands it. A day with no
# coverage build hands it nothing, so `--update` leaves the current week's cell exactly as Monday
# left it. Verified 2026-09-23 by forcing a sentinel value into the current week's row and running
# `--update` with no `--coverage-from`: the sentinel survived. A daily coverage build would multiply
# `script/coverage`'s cost by seven for a column nobody reads more than weekly, which is what made
# Monday-only the right split rather than a compromise.
#
# **The Monday/daily split does not, on its own, protect the columns a schema change adds.** On
# 2026-09-20 a merge conflict in the data, then one wide `weekly.csv` and since split per measure
# by milestone 581 (one metrics file per measure), was resolved by restoring an older copy (one still
# missing that week's newly merged `unsafe_trust_*` columns) and then running `--update`, which
# rewrites the current week and any past week whose row is missing or not at that week's last
# commit; every other existing row is left exactly as read. So the restored columns stayed blank on
# every past row for three days, until someone ran `--backfill`, which recomputes every row from
# git history rather than trusting what is already there. That is `--update`'s documented contract,
# not a bug in it: `--update` doing this more often (daily instead of weekly) does not add new
# exposure to that failure, because the trigger
# was the wrong command after a merge conflict, not the run frequency. The narrower claim two
# paragraphs below (`--update` heals a week that is entirely missing) is real and unrelated: verified
# 2026-09-23 by deleting a past week's row outright and re-running `--update`, which restored it.
#
# **Monday does not close the week that just ended**, which this header used to claim. `--update`
# writes the week HEAD's commit falls in, and on 2026-09-14 nine pull requests merged between 00:40
# and 05:49 UTC, so HEAD was already in 2026W38 when this fired and 2026W37 was never written. The
# fix is in `script/metrics`, not in the schedule: `--update` also writes every week history has
# and the CSV lacks, restates every closed week whose row stopped before the week's last commit,
# and `--check` fails on either. No hour would have been safe, because lanes merge around the clock.
#
# **Nothing here builds the kernel.** `script/metrics` is ls-tree, cat-file and regular expressions,
# which is what lets it walk the whole history in seconds, and it is why coverage is the one column
# this workflow fills from a build rather than from git. That build is the ordinary host-crate
# coverage run, so its cost is `script/coverage`'s and not a second one.

on:
  schedule:
    # 06:00 UTC daily. Before the toolchain jobs, so a bump PR opened later that morning is not
    # competing with this one for a reviewer's attention on the same branch listing. The coverage
    # build inside the job still only runs on Mondays (see the "Is this the coverage day" step);
    # the header above says why.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: project-metrics
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # verify's run and job records, for helpers/verify_times.py update.
  actions: read
  # The near-budget tracking issues helpers/ci_job_times.py sync opens and closes (milestone 808
  # (every gate accounts for its time)), and the label they carry.
  issues: write

jobs:
  record:
    name: record this week
    # The App's secrets live in the `automation` environment, whose deployment branches are `main`
    # only (see trunk-health.yml's comment for why). Scheduled runs and dispatches from `main`
    # qualify. Only jobs that mint the App token name it.
    environment: automation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # The same identity argument `toolchain-bump.yml` makes at length: a PR opened with the
      # workflow's own `GITHUB_TOKEN` does not trigger further workflow runs, so its CI never starts
      # and the PR is permanently unmergeable. The identity is the nifeos automation App's
      # installation token, minted fresh each run (milestone 128 (the automation gets its own
      # identity)). The personal access token this job used before was retired 2026-10-03 UTC
      # and then deleted, secret and token both.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The backfill walks first-parent history, so a shallow clone would silently produce a
          # shorter series rather than an error. This is the failure mode worth spending a full
          # clone on: a suite whose scope is too small goes green faster.
          fetch-depth: 0

      # Runs every day; the build below does not. `coverage_lines_pct` is a CARRIED_FIELDS column
      # in `script/metrics` (its own comment), so a day that skips the build leaves the current
      # week's cell exactly as the last build left it rather than blanking it.
      - name: Is this the coverage day?
        id: day
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage=false" >> "$GITHUB_OUTPUT"
          fi

      # Coverage is the one metric `script/metrics` cannot re-derive, because it needs a build. It
      # is taken here on Mondays only, or any day by hand with `script/metrics --coverage-for` from
      # a checkout of the week's commit, which costs a worktree and a toolchain. `continue-on-error`
      # because a coverage failure is a coverage problem and the other twenty-odd columns should
      # still be recorded: the alternative is a week missing from the series for a reason unrelated
      # to anything the series measures.
      - name: Install cargo-llvm-cov
        id: covtool
        if: steps.day.outputs.coverage == 'true'
        continue-on-error: true  # outcome: re-raised
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # cargo-llvm-cov

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.day.outputs.coverage == 'true' && steps.covtool.outcome == 'success'

      - name: Measure host-crate coverage
        id: coverage
        if: steps.day.outputs.coverage == 'true' && steps.covtool.outcome == 'success'
        continue-on-error: true  # outcome: re-raised
        run: script/coverage

      # Milestone 610 (provisional): the interface's stability. The one step here besides coverage
      # that builds, because the public API is read from rustdoc's JSON and rustdoc needs a crate
      # that compiles. It writes only the interface cells, which `script/metrics` carries rather
      # than recomputes, so it must run BEFORE the step below for today's cells to reach the charts.
      # Measured 2026-09-26 on the dev machine: ten seconds for the whole eleven-week backfill, so a
      # daily `--update` (two week-end trees) costs the toolchain install and little else.
      # `continue-on-error` for coverage's reason: a rustdoc failure is an instrument problem, and
      # every other column should still be recorded.
      - name: Install the target the interface is read for
        id: interfacetool
        continue-on-error: true  # outcome: re-raised
        run: rustup target add aarch64-unknown-none-softfloat

      - name: Measure the interface's stability
        id: interface
        if: steps.interfacetool.outcome == 'success'
        continue-on-error: true  # outcome: re-raised
        run: python3 helpers/interface_stability.py --update

      # The merge queue's daily record and the debt-paydown labels are fetched by fleet-metrics.yml
      # since milestone 889 (the tree's gates stop depending on the fleet tooling), provisional: they
      # measure the fleet, and calef's Fork 3 ruling on #1976 sends their collectors with the fleet
      # tooling. They write the same two CSV files, which `script/metrics` below still charts.

      # How long verify's shards took (lane/verify-shard-refresh, provisional): one row per sampled
      # green run, from GitHub's job records, committed as `verify-runs.csv` for `script/metrics`
      # to take weekly medians of. The record is not in git, a fetch failure is an instrument
      # problem (`continue-on-error`, so the other columns are still recorded; the last step
      # re-raises), and the last eight days are rewritten so a missed run heals on the next.
      - name: Fetch verify's per-shard times
        id: verifytimes
        continue-on-error: true  # outcome: re-raised
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 helpers/verify_times.py update

      # What `main` measured, per week (calef's ruling on #2554, 2026-10-22 UTC): the bench job's
      # `bench-readings` artifact at each week's newest merge, committed as `bench-on-main.csv` for
      # `script/metrics`' unexplained-drift chart. Artifacts live 90 days and the readings are the
      # one input git cannot restate, so a week once read is kept, and rewritten only by a newer
      # merge of the same week.
      - name: Fetch the bench readings of main
        id: benchreadings
        continue-on-error: true  # outcome: re-raised
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 helpers/baseline_drift.py --update

      # Where each merge-group job's time went, per day, per job and per step (milestone 808 (every
      # gate accounts for its time), §254 (a gate prints what each item cost) Fork 4), from the jobs
      # API, committed as `ci-job-times.csv`, and each green build's timeline as `ci-builds.csv` for
      # `script/metrics`' `ci-jobs.svg` and `ci-critical-path.svg`. The last two days are
      # rewritten, so yesterday's partial day heals on the next pass.
      - name: Fetch the CI jobs' daily times
        id: jobtimes
        continue-on-error: true  # outcome: re-raised
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 helpers/ci_job_times.py update

      # Each crate repository's own job times, one per-repository CSV beside the others (milestone
      # 887), so a slow template job shows up in this tree's metrics rather than in nine places
      # nobody watches. The list is the publish allowlist: a crate is a repository when it is on
      # `crates/publish-allowlist.txt`. EXCEPTION, marked: a repository the allowlist names that
      # does not exist yet (the split has not landed it) prints a warning and the step stays green.
      # A red daily-metrics run for an empty list teaches nobody anything; when a live repository's
      # read fails twice running, this step is where it shows.
      - name: Fetch the crate repositories' daily times
        continue-on-error: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One crate per word is the point: crate names carry no spaces (script/names refuses them).
          # shellcheck disable=SC2013
          for crate in $(grep -v '^#' crates/publish-allowlist.txt | grep -v '^[[:space:]]*$'); do
            if python3 helpers/ci_job_times.py update --repo "nifeos/$crate"; then
              echo "crate repository nifeos/$crate: recorded"
            else
              echo "crate repository nifeos/$crate: no record yet (does the repository exist?)"
            fi
          done

      # A job whose newest merge-group run passed 85% of its budget gets one tracking issue,
      # rewritten each day and closed after three runs under the line (§254, Fork 2). Opened as the
      # App so the issue's author is nife-smelter[bot]; the label is created with the workflow's
      # own token first, because the App's may not create labels (helpers/merge-drain.sh says the
      # same). It also appends this week's bullet for an open issue to week-notes.csv, which the
      # step below draws and the pull request commits.
      - name: Open, update or close the near-budget issues
        id: budgetissues
        continue-on-error: true  # outcome: re-raised
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GH_TOKEN="${{ github.token }}" gh label create near-budget --repo "${{ github.repository }}" \
            --color FBCA04 --description "A CI job near its budget (helpers/ci_job_times.py)" 2>/dev/null || true
          python3 helpers/ci_job_times.py sync

      - name: Recompute this week's row and redraw the charts
        run: |
          set -e
          if [ "${{ steps.coverage.outcome }}" = "success" ] && [ -f target/llvm-cov/lcov.info ]; then
            # Two files, two cells. The lcov gives the aggregate the trend chart plots; floor.txt
            # gives the minimum per file, which is the number that can actually fail this build.
            # Only `script/coverage` can produce the second, because the exemptions that decide
            # which files the floor acts on live there.
            script/metrics --update --coverage-from target/llvm-cov/lcov.info \
              --coverage-min-from target/llvm-cov/floor.txt
          else
            echo "No lcov file; recording every column but coverage, which leaves the cell as it was."
            script/metrics --update
          fi

      # `script/metrics --update` is idempotent by construction (the CSV is rewritten from a dict
      # keyed by week, never appended to), so "no diff" is the normal outcome on a quiet day and
      # must be silent rather than an empty PR.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          # The page too, not only the directory: `script/metrics` writes generated lines onto
          # notes/project-metrics.md (the table of contents, the drift line), and the pathspec
          # `notes/project-metrics` does not match that file. Until 2026-09-26 those lines were
          # rewritten here and then dropped.
          if git diff --quiet -- notes/project-metrics notes/project-metrics.md; then
            echo "Nothing moved this week; no pull request."
            exit 0
          fi
          branch="metrics/weekly"
          week="$(date -u +%GW%V)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add notes/project-metrics notes/project-metrics.md
          git commit -m "metrics: record $week

          Recomputed by the scheduled workflow. Every column but coverage is a restatement: the row
          applies today's definitions to this week's tree, which is what makes the series comparable
          and is not what any of these numbers were reported as at the time.

          notes/project-metrics.md says so on its face; this commit changes only its generated lines."
          git push --force origin "$branch"
          # Milestone 623 (provisional): the week flag and its digest. The flag output is machine
          # facing (week, series, move, note state) and the digest is log archaeology by a helper
          # `script/metrics` itself never runs (it is a reader of blobs and series, not of diffs).
          # Both land in the body so an annotator starts from data rather than from a hunch. A
          # flag never blocks and never edits; the digest digests only the current week's biggest
          # mover, because the threshold fires on most weeks (see 623's BUGS) and a body carrying
          # ten weeks of digests would be noise no annotator reads.
          flags="$(script/metrics --flags)"
          week="$(date -u +%GW%V)"
          digest=""
          flagged="$(printf '%s\n' "$flags" | grep "^$week " || true)"
          if [ -n "$flagged" ]; then
            series="$(printf '%s\n' "$flagged" | awk '{print $2}')"
            old="$(awk -F, -v w="$week" 'p && $1==w {print p; exit} {p=$2}' notes/project-metrics/weeks.csv)"
            new="$(awk -F, -v w="$week" '$1==w {print $2; exit}' notes/project-metrics/weeks.csv)"
            digest="$(python3 helpers/week_digest.py "$old" "$new" "$series" || true)"
          fi
          title="metrics: record $week"
          body="**Lane:** $branch, opened by a scheduled workflow; nife-smelter[bot] is the author GitHub shows.

          Adds or refreshes the \`$week\` row in each measure's CSV under
          \`notes/project-metrics/\` and redraws the SVGs beside them. The page is
          [\`notes/project-metrics.md\`](../blob/main/notes/project-metrics.md).

          **Read the diff, not just the charts.** Every column is a restatement under today's
          definitions, and this project found three of its own instruments wrong in a single day
          (2026-09-02). A row that jumps for a reason nobody can name is a defect in an instrument
          until somebody says otherwise.

          This branch is force-pushed on every run that changed something (daily, coverage refreshed
          Mondays), so it proposes the newest row rather than accumulating one pull request per run.

          **Week flags (milestone 623, provisional).** Every charted week whose move in any series
          exceeded a tenth of the prior week's value, biggest mover first. A flag never blocks and
          never edits; a flagged week worth explaining gets a row in
          \`notes/project-metrics/week-notes.csv\`, which \`script/metrics\` renders as a bullet
          under the chart and drops when the week ages out of the window.

          \`\`\`
          $flags
          \`\`\`"
          if [ -n "$digest" ]; then
            body="$body

          **Digest, $week's biggest mover** (\`helpers/week_digest.py\`: the five files that moved
          the series most, with the commits that moved them; churn, not net):

          \`\`\`
          $digest
          \`\`\`"
          fi
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
          else
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated PR #$existing in place."
          fi
          # **Arms its own pull request** (milestone 727 (a queue eviction goes to a maintainer session), provisional): since 2026-10-03 the merge drain
          # arms nothing, and a lane arms in the same command as `gh pr ready`. This workflow is the
          # lane here. If arming fails the pull request is labelled needs-maintainer after 30 minutes.
          gh pr merge "$branch" --auto --merge || echo "::warning::could not arm the metrics pull request"

      # **Where the instruments above go red** (milestone 641 (a mechanism that reports clean says
      # over how many units, and zero is loud), provisional). Each swallows its own failure so that
      # every other column is still recorded and the pull request still opens, and that half is
      # right. Until this step nothing surfaced the failure, and a reading not taken looked like a
      # quiet day: coverage is a carried cell, so a coverage step that failed every Monday would
      # have left the last measured number standing on the page indefinitely. It runs last, after
      # the record is written, so going red costs no column. See notes/denominators.md.
      - name: Fail if an instrument did not take its reading
        if: >-
          steps.covtool.outcome == 'failure' || steps.coverage.outcome == 'failure' ||
          steps.interfacetool.outcome == 'failure' || steps.interface.outcome == 'failure' ||
          steps.verifytimes.outcome == 'failure' || steps.benchreadings.outcome == 'failure' ||
          steps.jobtimes.outcome == 'failure' || steps.budgetissues.outcome == 'failure'
        run: |
          echo "::error::an instrument failed, so its cells were carried rather than measured:" \
            "cargo-llvm-cov install '${{ steps.covtool.outcome }}'," \
            "coverage '${{ steps.coverage.outcome }}'," \
            "interface target '${{ steps.interfacetool.outcome }}'," \
            "interface '${{ steps.interface.outcome }}'," \
            "verify shard times '${{ steps.verifytimes.outcome }}'," \
            "bench readings '${{ steps.benchreadings.outcome }}'," \
            "CI job times '${{ steps.jobtimes.outcome }}'," \
            "near-budget issues '${{ steps.budgetissues.outcome }}'"
          exit 1
