# The terminal replay harness's sessions, one row each, for milestone 705 (the graphical
# terminal runs full-screen programs)'s step 0a.
#
# `matches` is the count the gate holds: a run that matches fewer fails the gate, a run that
# matches more fails until this row is raised, so the tripwire always stands at the newest
# high-water mark. A session's recording (`<name>.rec`), its oracle screens
# (`<name>.expected.txt`) and its row here move together; the provenance of the screens is in
# README.md beside them.
#
# For a vttest session, `screens` names the screen each checkpoint shows, as conformance.md
# numbers them, 132-column screens included. An entry that names a screen is graded; `skip`
# marks the 132-column screens the census excludes and `menu` marks vttest's own menu screens.

[sessions.vim]
kind = "census"
program = "vim 9.1, macOS"
term = "xterm-256color"
captured = "2026-10-28"
session = "scroll, split, vertical split, delete, search, insert CJK, quit"
checkpoints = 14
matches = 11

