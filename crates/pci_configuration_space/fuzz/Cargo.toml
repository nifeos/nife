# The fuzz workspace for `pci_configuration_space`: the host bridge window parse over arbitrary
# `ranges` bytes, and the bus walk, BAR sizing and capability walks over an arbitrary configuration
# space.
#
# Its own workspace, the shape of the top-level `fuzz/` (see its Cargo.toml for why cargo-fuzz). It
# lives in the crate's directory so it leaves with the crate, and the root Cargo.toml excludes it.
#
# Name: provisional, 2026-11-22. `fuzz`, matching the directory cargo-fuzz finds by convention, as
# the top-level `fuzz` package and `crates/master_boot_record/fuzz` do.

[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pci_configuration_space = { path = ".." }

[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

[[bin]]
name = "pci_configuration_space_memory_window"
path = "fuzz_targets/pci_configuration_space_memory_window.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pci_configuration_space_walks"
path = "fuzz_targets/pci_configuration_space_walks.rs"
test = false
doc = false
bench = false

[workspace]
