# (kernel/src/arch/*/timer.rs's documented exception to DECISIONS §10), so this program's manifest
# is `least_authority_demo`'s, not `date`'s. The formatting is crates/uptime, host-tested. Portable, so both
# ISAs' archives carry it. **Provisional name**: the same word upstream `procps` uses; see the
# crate's module docs for why it is flagged anyway.
[[bin]]
name = "uptime"
path = "src/uptime.rs"
test = false
bench = false

# `uuid` (milestone 111): a version-4 UUID drawn from the entropy service. The first program a
# person can type that needs randomness: before it, the entropy grant reached only what the system
# spawned (`credentialer` at boot, `disk_partitioner` under the kernel's test harness), so a
# program's dependence on unpredictable bytes was real and unreachable from a prompt. Its whole
# authority is `grant_plan::Manifest::entropy`, which the progenitor endows and no token on the command line
# can name. Portable, so both ISAs' archives carry it. **Provisional name.**
[[bin]]
name = "uuid"
path = "src/uuid.rs"
test = false
bench = false

# `reboot` (milestone 805 (`reboot` at the prompt), DECISIONS §251 (restarting the machine is a
# kernel object the progenitor hands out)): restart the machine. Its authority is the reboot object
# and a sync-only capability to the file server, both endowed only to this program. **Provisional
# name.**
[[bin]]
name = "reboot"
path = "src/reboot.rs"
test = false
bench = false

# The least-authority demo (milestone 19f.2): the first program that is its own binary rather than
# a role of `hello`. It shares this package's `build.rs` link.ld (linked at the address-space map's image base) but no code.
# Same test/bench reasoning as `hello`'s block. `initial_ramdisk_aarch64` packs it into the archive
# under the name "least_authority_demo".
[[bin]]
name = "least_authority_demo"
path = "src/least_authority_demo.rs"
test = false
bench = false

# `graphical_terminal` (milestone 632 (provisional)): the program a person launches from the swish prompt to
# get graphics, calef's 2026-09-30 ruling. Takes the screen and the keyboard through capabilities
# the shell delegates at spawn; the display stack is built by the progenitor from those, the way a
# directory grant's caretaker is. Name: ratified 2026-10-03 (calef, #1493); `Prog::GraphicalTerminal`
# records the refused alternatives.
[[bin]]
name = "graphical_terminal"
path = "src/graphical_terminal.rs"
test = false
bench = false

[lints]
workspace = true

