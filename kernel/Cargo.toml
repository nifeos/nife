# **The two-slot boot state, and the one token of it that crosses the handoff** (rung 2b of
# milestone 198 (a package manager, and the trivial install that makes a second customer possible)). `uefi_loader`'s chooser writes `boot_slot::cmdline::KEY` onto the kernel's
# command line and `arch::x86_64::machine` reads it back, so rule 7 applies: what two binaries
# agree on is a crate, not a constant spelled twice. `user::install_service` then hands the number
# to the program that writes the bit.
#
# Ours, in this workspace; its own single dependency
# (`globally_unique_identifier_partition_table`) is ours and has no external ones. Not a
# §46 (thin primitives or whole subsystems; we write everything in between) decision, and the alternative was a second spelling of a token with nothing keeping the two in
# step.
boot_slot = { version = "0.1.0", path = "../crates/boot_slot" }

# The calendar (milestone 51 (wall-clock time, the `date` command, and an NTP service)). The kernel does no date arithmetic of its own; the one caller is
# `arch::x86_64::rtc`, which refuses a reading that is not a real civil date (`calendar::Civil::new`).
# Target-gated to match, because aarch64 and riscv64 never name the crate and cargo's unused-dependency
# lint warned on every one of those builds (the lane for milestone 129 (scheduled execution: a cron whose every entry is a grant), 2026-10-02).
calendar = { version = "0.1.0", path = "../crates/calendar" }

