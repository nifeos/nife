# network: the TCP/IP server over the confined NIC. The role of Debian's netbase and iproute2 together.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "network"
kind = "base"
home = { repo = "network", status = "provisional" }
crates = ["domain_name_system", "http_response", "network_stack"]
# The resolver's contract, which the progenitor speaks to grant and forget a job's zone (milestone
# 892 (a std program at the prompt holds the network and a resolver)) and std's PAL speaks to
# resolve. Interface rather than internal for the reason every *_protocol is.
interfaces = ["domain_name_resolution_contract"]
programs = ["net_stack", "domain_name_resolver"]
paths = ["components/src/virtio_net_transport.rs", "components/src/socket_test_client.rs"]
