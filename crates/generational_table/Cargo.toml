[package]
name = "generational_table"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fixed-capacity, allocation-free generational table (a slotmap) with Kani-proven stale-name safety"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "slotmap", "generational-index", "arena", "kani"]
categories = ["no-std", "data-structures"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
