# machine with an installed disk, which is the only place rung 2b's slots exist. A scope note
# (DECISIONS §19 (architectural parity is a tenet; the targets are aarch64, riscv64, and x86_64)), not a portability claim; the device-tree architectures gain this when they gain
# an install.
