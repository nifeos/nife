name: CI

# Observed failing: 2026-10-04, run 37219588901: the `clippy` job's `script/lint` went red on
#   `roadmap status` for lane/split-order-proposal (a `promoted_from` proposal the branch never
#   held). That is one job of many, and the others carry no record of their own
#   (notes/observed-failing.md, BUGS). See notes/observed-failing.md.

on:
  push:
    branches: [main]
  pull_request:
    # **`ready_for_review` is not a default activity type, and without it the draft guard below
    # fails open.** A bare `pull_request:` fires on `opened`, `synchronize` and `reopened` only.
    # §90 opens every lane as a draft and work is pushed while it is still one, so those pushes
    # raise `synchronize` with `draft: true` and every job correctly skips. Marking the pull
    # request ready then raises `ready_for_review`, which this workflow did not listen for, so no
    # run followed and the skipped jobs stayed the last word: the required checks were satisfied
    # by jobs that never ran, `mergeStateStatus` read `CLEAN`, and nothing had been verified.
    # Found 2026-08-28 on #567, which sat mergeable with all thirteen checks skipped. The comment
    # on the draft guard asserted this already worked, which is why it went unnoticed for five
    # days: it described the event GitHub raises rather than the events this trigger subscribes to.
    # `architect-hold.yml` had the correct list from the day it was written; these two did not.
    # Adding a type can only cause more runs, never fewer, so this fails safe in the direction the
    # rest of this file argues for.
    types: [opened, reopened, synchronize, ready_for_review]
  # **Required by the merge queue, and the queue jams silently without it.** A queued pull request
  # is tested on a `gh-readonly-queue/...` branch that GitHub creates, and that raises a
  # `merge_group` event rather than a `pull_request` one. A workflow that does not listen for it
  # never runs there, so every required check sits on "Expected" forever and nothing ever merges.
  # The failure looks like the queue hanging rather than like a missing trigger, which is why this
  # is here before the queue is switched on rather than after.
  merge_group:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN, set once for every job below. CodeQL flagged its absence
# (actions/missing-workflow-permissions, 7 alerts) and it is the right call for this repo in
# particular: a project whose entire thesis is that components should hold the authority their job
# needs and nothing more has no business letting its CI token default to write access it never uses.
# Jobs that genuinely need more say so themselves (see toolchain-bump.yml, which needs to open a PR).
permissions:
  contents: read

# On a branch or a PR, a follow-up push supersedes the in-flight run: only the tip is interesting.
#
# **On `main` it must not**, and the reason is a real failure rather than a preference. A full run
# takes around forty minutes; pushes to `main` during a working session land every fifteen. With
# `cancel-in-progress` unconditional, every run was killed by the next push before it finished --
# ten of twelve consecutive runs ended `cancelled`, so **CI verified nothing on `main` for ten
# pushes** while the badge reported the newest completed run, which was a cancellation.
#
# That is the bad kind of failure: it looks like a red badge (cosmetic, ignorable) and it is
# actually the absence of the signal the badge exists to carry. Every commit that reaches `main`
# gets a complete run, even if several queue up behind each other. **Since 2026-09-24 that run may be
# a cited one rather than a repeated one**: a commit a merge group already tested whole skips here
# and names the merge-group run it relies on (see A′ on the `gate` job). The run is still never
# cancelled; what changed is only whether it repeats work the queue just did.
# The mechanism is the GROUP, not the flag, and getting that wrong cost a second attempt.
# `cancel-in-progress: false` protects only the run that is already executing; GitHub still cancels
# any *pending* run in the group when a newer one queues. With ~40-minute runs and pushes every few
# minutes, that left the in-progress run and the newest queued one alive and killed everything
# between, which is most of them. Ten consecutive cancellations survived the first fix unchanged.
#
# So `main` commits are not grouped with each other at all: the SHA is in the group name, making each
# one unique and therefore uncancellable. Branches and PRs keep the shared group, where superseding
# is right because only the tip matters.
#
# **A merge-queue entry needs the same exemption as `main`, for the same reason, and did not have
# it.** Found 2026-08-27: PR #546 sat `AWAITING_CHECKS` in the queue for over two hours, its
# `gh-readonly-queue/main/pr-546-...` ref cycling pending -> in_progress -> cancelled roughly every
# ten minutes, forever. The ref does not change between GitHub's retries of one queue entry, so the
# old `'tip'` fallback put every retry in the same concurrency group as the last, and
# `cancel-in-progress` killed each attempt before it could report a conclusion -- a required check
# that can structurally never complete. Exempting `gh-readonly-queue/` refs the same way `main` is
# exempted is the fix: a queue entry's checks run to completion undisturbed, exactly like a push to
# `main` already does.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}

# **Each job's real work is one named check out of `script/ci-build`'s table** (milestone 286), so
# CI runs exactly what a developer runs locally and the two cannot drift. That table is the single
# enumeration of the checks a pull request must pass: it carries a tier saying whether a developer
# waits for a check before pushing, and `script/ci-build` with no arguments runs that tier, cheapest
# first. Until 2026-09-13 the local set lived in a second script and this file explained in three
# separate comments why a given check was not in it; one of those three had been false since
# milestone 62. Adding a job here without adding its row there is the defect the table exists to
# prevent. `script/ci-build --list` prints it. See notes/scripts.md.
#
# **The `swish-check-graphical` job was folded into `swish-check` on 2026-10-03** (calef's ruling,
# milestone 632 (graphics on demand) being what made it possible): since 632 the graphical legs
# boot the same plain serial system as swish-check, and differ only by a virtio-gpu, typing
# `graphical_terminal` and reading the screen. A job of its own cost a runner and about ten minutes
# of build on every pull request and merge group for about a minute of boots. Its required-check
# name must leave the ruleset when this lands; calef's.
#
# **Until 2026-09-30 one job stood against that rule by naming four checks** in one runner: `test`,
# `swish-check`, `swish-check-graphical` and `boot-check` chained behind a single build (#1468,
# approved by calef the same day). The chaining was measured arithmetic before it was a defect:
# swish-check cost 30 seconds against a ten-minute build on 2026-09-02, so a separate job would
# have paid ten minutes to do thirty seconds of work. Milestone 182 (x86_64's own interactive-boot
# entry point) then added an OVMF leg that grew to about 17 minutes alone. In group run 36742613581
# (2026-09-30) the chained job was past 33 minutes while every other job in the run had finished in
# 14m8s. Four jobs, one check each, in parallel: a red check now reruns alone instead of
# dragging the other three, and when two would fail both say so rather than the first hiding the
# rest behind its exit. The costs are deliberate and recorded beside the jobs that pay them: four
# builds where there was one, and four arm64 slots against a pool that has starved before.
#
# **Renaming a required check is a ruleset edit, not a wording change** (the stack frames job's own
# comment records the same constraint on its name): `build + test (host + QEMU)` must come out of
# the merge queue ruleset's required checks and these four names must go in, once a run has posted
# them. Until that lands, every pull request waits on a name nothing posts. It is calef's, an admin
# act outside this tree, queued in #1468.
#
# **Every job skips while the pull request is a draft** (2026-08-23), checked with
# `github.event_name != 'pull_request' || github.event.pull_request.draft == false`. §90's
# claim-commit convention opens a lane with an empty commit specifically so the claim is visible
# before any code exists, and until this guard nothing distinguished that commit from a finished
# one: the full ~40-minute suite, both Kani prove shards included, ran against a diff that could not
# possibly differ from what `main` already passed. The condition is written the way it is, not as
# `== true` negated, so it fails safe: `merge_group` and `workflow_dispatch` events have no
# `pull_request` field at all, and the first clause admits them without ever evaluating the second.
# A push to `main` is a `push` event for the same reason. Marking a pull request "ready for review"
# is what raises `pull_request` with `draft: false`, so CI first runs in full exactly when a lane
# says the work is actually done, the same point every lane already runs `script/lint`/`script/test`
# locally before doing. **That last sentence was false for five days**, and the trigger's own
# `types:` above now carries why: GitHub raises the event, but a bare `pull_request:` does not
# subscribe to it, so the guard failed open instead of closed. The lesson is narrower than "check
# your triggers": this comment described what the platform does and not what this file asked for,
# and those are two different claims that read identically.
#
# **And subscribing was not sufficient either, which is why the guard no longer reads the payload
# at all.** With `ready_for_review` in `types:` on the head commit, PR #577 still went from draft
# to ready without raising a run: the API reports three runs on that SHA, none cancelled, none from
# that event. That remains unexplained. The `gate` job below sidesteps it by asking what the pull
# request *is* rather than what an event once said it was, and by failing toward running. Treat the
# paragraph above as history: no job now tests `github.event.pull_request.draft`.
#
# **The draft gate is not a fleet dependency, and stays** (milestone 889 (the tree's gates stop
# depending on the fleet tooling) kept this edge on purpose). It came from §90 (the claim is a draft
# pull request), but what it does is general: a contributor who opens a draft loses nothing by CI
# waiting for ready, and the runner time is saved in any repository. It reads only GitHub's own
# draft flag, no fleet file.
#
# **Six jobs run on ubuntu-24.04-arm and the rest on ubuntu-24.04 (x86_64)** (milestone 587 (most CI
# jobs do not need an arm64 host), calef's ruling of 2026-09-24). The count was two when that
# milestone landed; the watchdog job joined them, and the 2026-09-30 split turned the one build job
# into four. Until 2026-09-24 every job ran on arm64,
# and the reason given here was that aarch64 is weakly ordered where x86_64 is TSO, so "testing on
# aarch64 is the one place CI catches" a missing Acquire/Release. **For the host tests that sentence
# was false, and it was measured rather than argued**: across the host crates exactly one test outside
# loom spawns a real thread (`memory_corruption_canary_gate`'s `bounded`, which checks liveness through
# a channel, not ordering), and the protocols that do depend on ordering (`work_steal_slot`,
# `thread_wake_handshake`, `memory_regions`, `clock_contract`, `memory_corruption_canary_gate`) are
# checked by loom, which models C11 on any host and runs as the `interleavings` job below. A host
# test that races no threads cannot observe a reordering on any host.
#
# **Where the claim does hold is the guest, and that is why the four build jobs and the
# `cpu-matrix-shard` jobs stay on arm64** (the watchdog job runs there too, a placement it inherited
# rather than one this argument carries). They boot kernels under multi-threaded TCG, where each
# guest core is a host thread. An aarch64 or riscv64 guest on an aarch64 host can therefore be shown
# reorderings the host permits, where an x86_64 host sees only what TSO allows. That is the one
# place CI puts kernel code in front of a weakly ordered machine, which is the discipline DECISIONS
# §4 (kernel shape: monolithic, deferred, with two cheap rules) rule 4 commits us to. Measured on
# 2026-10-24, the host half holds and the suite half does not
# (notes/benchmarks/host-reordering-under-tcg.md): an aarch64 host shows these guests
# message-passing reorderings and an x86_64 host shows none, but with every kernel spinlock
# weakened to order nothing these legs passed on both hosts. The placement buys exposure that no
# test here turns into a failure for a weakened lock. The split took the build jobs' draw on that
# pool from one runner to four, which is the price of removing the 33-minute serial pole and is
# paid knowingly.
#
# Everything else moved because the arm64 hosted pool, not the 60-job cap, was the constraint: on
# 2026-09-24 about 20 jobs ran while 128 to 173 waited, arm64 jobs waited a median 15 to 24 minutes
# per busy hour against x86_64's 0 to 8, and one x86_64 run of every job reproduced arm64's results
# (instruction counts to one tick, identical footprint and frame output, the same 3,067 host tests).
# Caches cannot cross: `Swatinem/rust-cache` keys on the host, and the QEMU cache key carries
# `runner.arch`.
# **Every job below has a wall-time budget of 20 minutes** (milestone 721 (each merge-group CI job
# has a 20-minute budget), provisional; calef ruled
# the number 2026-10-03 UTC). The first step records the start and the last, `if: always()`, runs
# `helpers/job-budget.py check`, which warns at 15 minutes and fails above 20 unless
# `.github/ci-job-budgets` raises that job's budget with a reason. `timeout-minutes` is at most the
# budget plus five. The reason is 2026-09-30: the long job sat at its 45-minute bound 29 times and
# only notes landed for 18 hours, because raising a bound was one line that cost nothing.
# `script/lint` fails a job added without the two steps.
#
# **A hung step leaves evidence before `timeout-minutes` ends the job** (lane
# ci/hung-shard-leaves-evidence, provisional). A job killed by its timeout kept no log at all on
# #2413, so its hang could not be run down. Every `script/ci-build` step therefore runs under
# `helpers/hang_evidence.py run`, which gives it until four minutes before the job's own timeout,
# then dumps the running test, the process tree, thread stacks and the output's tail into
# `target/hang-evidence/`, kills the step and lets the `if: always()` upload below it run. The
# helper's docstring has the rule and its BUGS; `script/lint` fails a step added without it.
jobs:
  # **The live draft state, read once, because the event payload's copy is a snapshot that has been
  # wrong.** Every job below used to test `github.event.pull_request.draft` straight out of the
  # webhook payload. That value is captured when the event is created, so a `synchronize` raised
  # while a lane was still a draft carries `draft: true` for ever, even if the lane marks the pull
  # request ready a second later. #569 added `ready_for_review` to this workflow's `types:` so that
  # transition would raise its own run and correct the record. On PR #577 it did not: the `types:`
  # line was present on the head commit (verified), the pull request went from draft to ready, and
  # the GitHub API reports exactly three runs on that SHA, none cancelled and none from
  # `ready_for_review`. **Why that event produced no run is still unexplained.**
  #
  # So this does not depend on knowing. It asks the API what the pull request *is right now*,
  # once, and every job consumes the answer. Event ordering, coalescing and stale payloads stop
  # mattering because none of them are consulted.
  #
  # **It fails safe in the direction that costs minutes rather than correctness.** A job whose
  # dependency failed reports an empty output, and `!= 'false'` admits that, so a broken or
  # cancelled gate runs the whole suite instead of skipping it. `!cancelled()` is what lets the
  # condition be evaluated at all when a dependency did not succeed. The failure this whole file
  # keeps relearning is that **a skipped job still posts a conclusion and still satisfies a
  # required check**, so skipping is never the safe default.
  #
  # **`!cancelled()`, not `always()`, and the difference is a superseded run that will not die.**
  # `always()` makes a job immune to cancelling its own run. Found 2026-09-24 on #1202 and #1206:
  # a lane opens as a draft and is marked ready seconds later, so `opened` and `ready_for_review`
  # raise two runs in one concurrency group. The newer one cancels the older, which cancels this
  # gate mid-step; its output is then empty, `!= 'false'` admits that, and `always()` let every job
  # below run the full suite anyway. The newer run sat `pending` behind it for the whole time: on
  # #1202 the fresh jobs started at 15:46:16, thirty-three seconds after the zombie finished, 21
  # minutes after the ready event. `!cancelled()` still reaches the condition when the gate
  # *failed*, which is the fail-safe above; it only stops the jobs when the *run* was cancelled,
  # and a cancelled run is by construction one a newer run on the same ref replaced. A merge-queue
  # ref and `main` are never cancelled (see the concurrency block), so nothing there changes.
  #
  # **A′: a push to `main` skips the suite when a merge group already tested that exact commit**
  # (calef approved 2026-09-24, "Proceed with A′"). The reason is runner starvation, measured the
  # same day: 31 runs queued at 16:40 UTC, and #1213 evicted from the queue with `checks_timed_out`
  # at 17:54:14, 60.5 minutes after it was enqueued, because its required `verify (Kani proofs)`
  # aggregate waited for a runner and reported at 17:58:53. Every landed batch was paying for its
  # suite twice: once on the `gh-readonly-queue/` ref and again, identically, on the push to
  # `main`.
  #
  # **The premise, checked against history before this was written.** Across the twelve
  # first-parent commits on `main` from aee5b141 to 47c3a3c9, every one has a successful
  # `merge_group` CI run whose `head_sha` IS that commit: the queue builds each entry's merge commit
  # on its own ref, and the commit that lands is that very object. Inside a batch only the tip gets
  # a `push` run (#1179's ac04fb01 and #1202's b9b0d4bb got none; the batch tips 0b72f673 and
  # 47c3a3c9 did), and the tip's merge-group run tested the tip with every earlier entry of the
  # batch beneath it. So looking up `head_sha == github.sha` answers exactly "was this tree
  # tested", with nothing inferred about neighbours.
  #
  # **It fails toward running, like everything else on this job.** No matching run, a run that did
  # not conclude `success`, an API error, or a missing `actions: read` all leave `run=true`. A
  # commit that reached `main` outside the queue has no merge-group run and gets the full suite, as
  # does `workflow_dispatch`. A merge-group run that concluded anything but `success` is not
  # evidence either, even when the queue landed it on the strength of its required checks alone:
  # 0b72f673 (#1156) landed with verify's run `cancelled` by a non-required falsify job's timeout,
  # and under this rule its push re-proves in full.
  #
  # **Prose-only: a change that is only Markdown nobody reads skips every job but `lint`**
  # (lane/docs-only-ci, calef approved the lane 2026-10-05 UTC). On 2026-10-05 twelve bold-backlog
  # pull requests took the hosted pool and required jobs on #1708 and #1712 were cancelled with
  # "not acquired by Runner of type hosted". Until then each heavy job ran a step-level "documentation
  # only" regex, so every one of them still took a runner to learn it had nothing to do, and the regex
  # was wrong about notes/pipes.md, which xtask installs in the disk image and swish-check searches.
  # `helpers/prose_only.py` decides once: a changed file is prose when it is `.md` under `notes/`,
  # `design/`, `briefs/` or the root and no code names it as a path, and the change is prose-only
  # when every file is. Its header has the whole rule and its BUGS.
  #
  # **There is no list of the files that are build inputs, on purpose.** A list someone must extend
  # when they add an `include_str!` is rung three and rots; the classifier derives the readers from
  # the tree under test on every run, so a reference added in the same diff is seen. It prints the
  # rule that kept or skipped each file, which is where to look after a wrong skip.
  #
  # **Why the job-level `if:` satisfies the required checks.** GitHub's "Troubleshooting required
  # status checks" (read 2026-10-05): a job skipped by a conditional reports Success; a workflow
  # skipped by a path filter leaves its checks Pending and blocks the merge. So the skip is a job
  # condition, never `paths-ignore:`, and #567 (2026-08-28, mergeable with thirteen skipped checks)
  # is this tree's own record of the first half. In a merge group the diff is the group head against
  # `merge_group.base_sha`, which spans every queued pull request, so one code change anywhere in the
  # group runs everything. `lint` (script/lint: roadmap, citations, decisions, prose ratchet) never
  # skips, and runs the tests of any package whose Rust walks a directory the change touched.
  #
  # **Host-only report tools ride the same skip** (2026-10-07 UTC, after #1831 changed only
  # `script/metrics` and a page it writes and ran the whole kernel suite). `helpers/prose_only.py`
  # lists four tools that only `metrics.yml` runs, treats a named caller outside `script/` and
  # `helpers/` as disqualifying, and leaves every other script running everything. Their generated
  # records ride it too (2026-10-09 UTC, after #1878's weekly update ran the kernel suite for
  # fourteen generated files): a changed file under `notes/project-metrics/` skips only when no
  # gated file names it, so the `falsification-times.tsv` `script/verify` shards by still runs.
  #
  # **Comment-only Rust rides the same skip** (milestone 929 (comments in the Linux style across
  # first-party Rust)). A `.rs` file whose tokens are unchanged once comments are removed counts as
  # skippable, unless a patch or a gated reader could notice; `helpers/prose_only.py`'s
  # COMMENT-ONLY RUST has the rule. It also sets `comments`, which
  # keeps `rustfmt` running, and `comment_tests`, which `lint` tests on the host.
  #
  # **Fails toward running.** A classifier error leaves `prose` empty and `!= 'true'` admits it.
  gate:
    name: draft gate
    runs-on: ubuntu-24.04
    # `actions: read` is for the push branch below: listing this workflow's merge_group runs. The
    # job-level block replaces the workflow's, so the reads the draft half already relied on are
    # restated rather than inherited.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.state.outputs.run }}
      prose: ${{ steps.prose.outputs.prose }}
      prose_tests: ${{ steps.prose.outputs.prose_tests }}
      comments: ${{ steps.prose.outputs.comments }}
      comment_tests: ${{ steps.prose.outputs.comment_tests }}
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - id: state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A′: a push to `main` whose exact commit a merge group already tested. See the comment
          # above this job. Any answer but a run ID (no run, an API error, a missing permission)
          # leaves `tested` empty and falls through to running everything.
          if [ "${{ github.event_name }}" = "push" ]; then
            tested="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=${{ github.sha }}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
            if [ -n "$tested" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "==> ${{ github.sha }} was tested by merge group run $tested; skipping the suite"
              echo "==> https://github.com/$GITHUB_REPOSITORY/actions/runs/$tested"
              exit 0
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> no successful merge_group run of ci.yml at ${{ github.sha }}; running everything"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> ${{ github.event_name }} is not a pull request; running everything"
            exit 0
          fi
          draft="$(gh pr view "$PR_NUMBER" \
                     --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ "$draft" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "==> pull request is a draft right now; skipping the suite"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> live draft state is '${draft:-unreadable}'; running everything"
          fi
          exit 0
      # The prose-only rule: see the comment above this job. Only asked when something would run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Is this change prose that no build or test reads?
        id: prose
        if: steps.state.outputs.run != 'false'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # The base, resolved exactly as the scope checks this replaced resolved it.
          # `helpers/scope-merge-base.sh` (its header has #1416) takes the merge base against the
          # base branch's current tip rather than the payload's possibly stale base.sha. In a merge
          # group the payload's `merge_group.base_sha` is the base branch under the whole group, so
          # the diff is every queued pull request's changes at once: the group is prose-only only if
          # every pull request in it is.
          base="$(helpers/scope-merge-base.sh \
              "$BASE_REF" \
              "$BASE_SHA" 2>/dev/null || true)"
          # A dispatched run has no event base, and `HEAD~1` alone scoped it to the newest commit:
          # a lane whose last commit was documentation skipped the build its earlier commits needed
          # (#1347, 2026-09-26). Off `main`, the merge base is the whole branch; on `main` it is
          # HEAD itself, so the newest commit stays the scope there.
          [ -n "$base" ] || base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          echo "==> classifying $base..HEAD"
          # A classifier that fails writes no `prose`, and every heavy job reads empty as "run".
          python3 helpers/prose_only.py classify "$base"
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **On every push to `main`, `main` holds the QEMU and patched-Kani caches for the tree as it now
  # is** (milestone 870 (main keeps its CI caches warm), provisional; the job id and name are
  # provisional too). A pull request or merge group restores `actions/cache` entries from its own
  # ref and from `refs/heads/main` only. A′ above skips the suite on a push to `main` that a merge
  # group already tested, which is nearly every push, so no job on `main` ran a cache step and a new
  # key never reached `main`. After #1899 moved `.qemu-version` to 11.1.2, `main` held only 11.1.1
  # entries and every pull request and merge-group QEMU job spent 265 to 274 s in "Build QEMU if
  # the cache missed"; `test` went from about 13 to 18.5 minutes until calef dispatched this
  # workflow on `main` by hand (run 38084559582). verify.yml's `prove-kernel-riscv64` has the same
  # gap for the patched Kani, and A′ skips it the same way.
  #
  # **It does not ask the gate, on purpose.** It runs on every push to `main` whether the suite runs
  # or not, so a later change to A′ cannot reopen the gap. `lookup-only` asks whether `main` has the
  # key without downloading it: a hit is a few seconds and builds nothing. On a miss the same script
  # every job calls builds into the cached path, and `actions/cache`'s post step saves it under the
  # same key, on `refs/heads/main` because that is the ref a push to `main` runs on. The keys and
  # paths are copied from the jobs that restore them; a copy that drifts saves an entry nobody
  # reads, which is why each key below is character for character the restoring job's.
  # `helpers/cache_save_scope.py`, run by `script/lint`, fails when a path, key or pinned
  # `actions/cache` SHA here differs from any restoring job's in any workflow (#1908). The same
  # mechanism heals an evicted entry: the next push to `main` puts it back.
  #
  # **Coverage, by runner.** QEMU on both pools: x64 serves `swish-check-x86_64` and `bench`, ARM64
  # serves `test`, `swish-check`, `boot-check`, `cpu-matrix-shard` and `watchdog`. The patched Kani
  # on ARM64 only, the one runner `prove-kernel-riscv64` uses. Not covered: `supply-chain`'s vendor
  # tarballs (a miss costs one HTTP request) and rust-cache (calef's ruling (a) on #1814 dropped it
  # from every job but three; notes/actions-cache-budget-2026-10-07.md).
  #
  # BUGS: when the suite also runs on a push to `main` with a cold key, this job and the suite's
  # QEMU jobs build at once and one save wins; the others log "another job may be creating this
  # cache" and carry on. That costs runner minutes on a rare push, never a result.
  main-caches:
    name: main-caches (keep main's QEMU and Kani caches warm, ${{ matrix.runner }})
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.runner }}
    # Stated per job although it equals the workflow's default: this job writes caches, and the
    # Actions cache service authorizes that with the runner's own token, not GITHUB_TOKEN.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            kani: false
          - runner: ubuntu-24.04-arm
            kani: true
    # Cold: QEMU about 4.5 minutes (265 to 274 s in the runs above), the patched Kani about 3.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The `test` job's key, path and build step.
      - name: Does main hold QEMU for this .qemu-version?
        id: qemu
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
          lookup-only: true
      - name: Build QEMU if the cache missed
        if: steps.qemu.outputs.cache-hit != 'true'
        run: script/ci-qemu
      # verify.yml's `prove-kernel-riscv64` key, path and build step.
      - name: Name the carried Kani patch
        id: kani
        if: matrix.kani
        run: echo "patch=$(basename patches/kani-*-riscv64-target.patch .patch)" >> "$GITHUB_OUTPUT"
      - name: Does main hold the patched Kani?
        id: kani-cache
        if: matrix.kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-kani-riscv64
          key: kani-riscv64-${{ runner.os }}-${{ runner.arch }}-${{ steps.kani.outputs.patch }}-${{ hashFiles('patches/kani-*-riscv64-target.patch', 'script/verify-riscv64') }}
          lookup-only: true
      - name: Build the patched Kani if the cache missed
        if: matrix.kani && steps.kani-cache.outputs.cache-hit != 'true'
        run: script/verify-riscv64 --build-only
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **Two shards and an aggregate, because one runner ran out of budget** (lane
  # maintainer/split-test-job, 2026-10-12 UTC, #1930; the job id and shard names are provisional).
  # Measured on seven green merge-group runs on 2026-10-12, the whole job took 17.4 to 18.4 minutes
  # against its 20, and the phases of `script/ci-build test` held to a tenth of a minute run to run:
  # setup 0.6, the host pass 1.9, the std farm and TLS graph 2.7, the aarch64 leg 2.8, riscv64 3.4,
  # x86_64 6.6 (its PVH suite, the root-port boot, the whole suite again under AMD-Vi, and two OVMF
  # boots). It had been 13.6 on 2026-10-09: the TLS graph took the std phase from 1.0 to 2.7, and
  # x86_64 grew from 4.9 to 6.6. No step regressed, so there was nothing cheap to fix.
  #
  # Host crates against the kernel suite was the obvious seam and the wrong one: the host pass is
  # two minutes, so the kernel half would have been about 15.5 and back at the line within days.
  # The seam is the architectures, the same one `swish-check` was cut along. The first shard runs
  # the host pass and the two board legs (projected 10.9 minutes), the second the x86_64 leg with
  # `--no-host` (projected 9.1), each paying its own setup and std farm, which costs about 2.3
  # runner-minutes a run over the single job. The x86_64 leg stays on arm64 under TCG: moving it to
  # the x86_64 pool, as `swish-check-x86_64` did, changes the emulator under the suite and is
  # unmeasured. If one shard nears the line, the next cut is the x86_64 leg's AMD-Vi pass.
  #
  # The required check keeps its name on the aggregate below, as `cpu-matrix` does.
  test-shard:
    name: test shard (${{ matrix.legs }})
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    strategy:
      # Both shards finish, so a red one says which architectures failed and the other still
      # reports.
      fail-fast: false
      matrix:
        include:
          - check: test-aarch64-riscv64
            legs: host crates, aarch64 and riscv64
          - check: test-x86_64
            legs: x86_64
    # A hung kernel means QEMU never exits and the runner would block until the 6-hour default.
    # Fail loudly instead. The bound is a hang detector, not a budget, so it sits well above an
    # honest run. Derivation: this job runs a subset of the legs the chained job ran, whose whole
    # warm run was 26m21s on 2026-09-26 main (x86_64's swish leg alone is about 17 minutes under
    # OVMF, and that leg is another job now), so a warm run is bounded by that figure; a cold QEMU
    # build can add 10-20 minutes on top; 45 is the chained job's own bound, kept rather than
    # shrunk with the workload.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b) arrived later, so the runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # **The provisioning step is explicit** (milestone 286), the same shape the `bench` and `cpu
      # matrix` jobs have always had. `script/ci-build` bootstraps only on its no-argument path,
      # which is the command a developer runs before pushing; a job that names checks has already
      # installed exactly what it needs in its own steps, and a bare `script/ci-build fmt` must not
      # drag an apt install of QEMU onto the rustfmt runner.
      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # The host-logic crates and the kernel under QEMU (TCG), exiting through semihosting, named
      # out of `script/ci-build`'s table, which is the one place the gating set lives;
      # `script/ci-build --list` prints it. Until 2026-09-30 this step chained three more checks
      # behind it in one runner; the three jobs below carry them, each for its own recorded reasons.
      # Since 2026-10-12 each shard runs one of the two `ci` rows that together are the `test` row.
      - run: helpers/hang_evidence.py run -- script/ci-build ${{ matrix.check }}
      # Where the suite's time went (milestone 807 (the kernel suite reports what each test cost),
      # §254 (a gate prints what each item cost), Fork 3): every leg's phases and every test's
      # time, written by `cargo xtask test` as it ran. The step summary costs nothing unless someone
      # opens it; the artifact holds the whole record. No pull request comment, by that ruling.
      - name: Summarize where the time went
        if: always() && hashFiles('target/time-record.tsv') != ''
        run: cargo xtask time-summary target/time-record.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the time record
        if: always() && hashFiles('target/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-test-shard-${{ matrix.check }}
          path: target/time-record.tsv
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The name the ruleset requires, kept stable over the shards. It reads one result and boots
  # nothing, so it runs on the x86_64 pool and has no checkout (helpers/job-budget.py exempts a job
  # without one from the clock steps; the timeout still binds).
  test:
    name: test (host crates and the kernel suite under QEMU)
    runs-on: ubuntu-24.04
    needs: [gate, test-shard]
    # The shards' own condition, so a draft or a prose-only change skips this by condition (which
    # reports Success) rather than leaving the required check unreported. `!cancelled()` reaches the
    # condition when a shard failed, which is the case this job exists to report.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    timeout-minutes: 5
    steps:
      - name: Report the shards' combined result
        run: |
          result="${{ needs['test-shard'].result }}"
          if [ "$result" = success ]; then
            echo "==> test shards: the host crates and every kernel leg passed"
          else
            # script/ci-log-baseline attributes this job by its last `==>` line; the failing
            # shard's own job names the leg.
            echo "==> test shards: $result (the failing shard's job names the leg)"
            exit 1
          fi

  swish-check:
    # **The job keeps its name, "three architectures", while it runs two**, because the name is a
    # required check in the merge queue ruleset and renaming one is an admin act (the header's
    # 2026-09-30 paragraph). The third leg is `swish-check-x86_64` below since milestone 628
    # (provisional). The ruleset names that job too (read 2026-10-08 UTC, ruleset 19596094), so
    # all three legs hold a merge.
    name: swish-check (the interactive shell, three architectures)
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # A hung kernel means QEMU never exits and the runner would block until the 6-hour default.
    # Fail loudly instead. The bound is a hang detector, not a budget, so it sits well above an
    # honest run. Derivation, from when this job carried x86_64's leg: that leg alone was about 17
    # minutes under OVMF, the build it needs is about ten, and a cold QEMU build can add 10-20 more,
    # so the honest worst was near 50 and the detector sat at 60. Since milestone 628
    # (provisional) the leg runs in `swish-check-x86_64` and this job's two legs are about a minute;
    # 60 is not yet lowered, because a cold QEMU build is still the honest worst and one run on the
    # new shape is not a measurement of it.
    #
    #
    # **The graphical fold changes no bound** (2026-10-03 UTC, the `swish-check-graphical` job's
    # boots moved in here): each leg now boots three times, not two, and the added boots are the
    # ones that job ran. Measured against a warm target on the dev Mac, both legs before the fold
    # plus the graphical job's four boots were 199 s including builds, and after it 171 s (aarch64
    # 65 s and riscv64 106 s, one run each, riscv64 noisy). At the 1.5x to 1.8x the flake census
    # measured for CI's runner, the fold adds about one minute of boots to this job and removes a
    # whole job's build. That fits the 20-minute budget with room, so it takes no line in
    # `.github/ci-job-budgets`.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b (real hardware + IOMMU-backed driver isolation)) arrived later, so the
      # runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # **The provisioning step is explicit** (milestone 286 (one enumeration of the checks that
      # gate a pull request)), the same shape the `bench` and `cpu`
      # matrix` jobs have always had. `script/ci-build` bootstraps only on its no-argument path,
      # which is the command a developer runs before pushing; a job that names checks has already
      # installed exactly what it needs in its own steps, and a bare `script/ci-build fmt` must not
      # drag an apt install of QEMU onto the rustfmt runner.
      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # The interactive shell, one row of `script/ci-build`'s table and its own job since the
      # 2026-09-30 split (#1468). Until then it rode the suite job, for arithmetic that was true
      # when measured and was overtaken. On 2026-09-02 the check cost **30 seconds** for both
      # architectures against a warm target while the job's build was around ten minutes, so a
      # separate job would have paid ten minutes to do thirty seconds of work. Milestone 182
      # (x86_64's own interactive-boot entry point) added the OVMF leg, about six minutes then and
      # about 17 minutes by the chained job's own timeout comment, and in group run 36742613581
      # the whole chained job was past 33 minutes while every other job finished in 14m8s. calef
      # approved the split the same day. Its costs are paid openly: its own build, its own QEMU
      # cache restore, and on a cold-cache day its own QEMU compile, on an arm64 pool the header
      # above has already seen starve.
      #
      # The OVMF leg is slow for a mechanical reason, not a fluke: under OVMF every byte the shell
      # prints is also drawn on the firmware screen before the console acknowledges it, so the leg
      # pays for its own output twice (milestone 182's block has the measurement). Under TCG every
      # one of those stores was emulated, which is why that leg moved to `swish-check-x86_64` below
      # (milestone 628 (provisional)) and this job runs the other two.
      #
      # The check earned its place in CI on its first run (milestone 230 (`script/shell-check` is
      # red on `main`, on both architectures, and nothing says so)). The aarch64 leg passed and
      # the riscv64 leg failed, on a check whose local runs were green on both, and the divergence
      # was real rather than flaky infrastructure: the kernel's fault printer and the userspace
      # console server drive the same UART from two address spaces with nothing arbitrating, so a
      # thread dying while the progenitor prints shuffles the two lines together at byte
      # granularity. Local-only would have kept it invisible.
      #
      # **The row fetches `rg` from basalt and the legs walk a tree with it** (the first gap
      # calef's amber ruling on fatal risk 1 names; milestone 810 (`ripgrep` is packaged in basalt
      # and installed with `jig`)). `cargo xtask basalt-fetch` takes basalt's published ripgrep
      # 14.1.1 package for each architecture, accepted only under the SHA-256
      # basalt's recipe records at the commit `xtask/basalt-pin` names, and ripgrep's own host build for the reference answer. The
      # legs then type `jig install ripgrep` against those bytes, so this job tests `jig` and
      # basalt's delivery too, and run the package's `rg` by path over the walk. About 9 MB.
      # Each item's time into the job's record (milestone 808 (every gate accounts for its time)):
      # writers other than the kernel suite append only when NIFE_TIME_RECORD names a file.
      - run: helpers/hang_evidence.py run -- script/ci-build swish-check-aarch64-riscv64
        env:
          NIFE_TIME_RECORD: ${{ github.workspace }}/target/time-record.tsv
      - name: Summarize where the time went
        if: always() && hashFiles('target/time-record.tsv') != ''
        run: cargo xtask time-summary target/time-record.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the time record
        if: always() && hashFiles('target/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-swish-check
          path: target/time-record.tsv
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **The x86_64 leg of the interactive-shell check, on an x86_64 runner, under KVM** (milestone
  # 628 (provisional); the job id and name are provisional). On the arm64 runner this leg ran the
  # x86_64 guest under TCG and was about 18 of `swish-check`'s 21 minutes (run 37083676625, job
  # 111089436799: 128 lines in 985.3 s, 7.7 s a line, against aarch64's 0.2 s). What made it slow
  # is the emulator rather than the guest: notes/benchmarks/swish-check-x86-leg.md has the local
  # one-change-at-a-time measurements and this job's own numbers. GitHub's x86_64 Linux runners
  # expose /dev/kvm, owned by root, so the step below opens it to the runner user (GitHub's own
  # documented recipe), and `swish-check` uses KVM when, and only when, it can open the device.
  #
  # **Nothing the arm64 runner was there for is given up.** ci.yml's header keeps the guest-booting
  # jobs on arm64 so a weakly ordered host can show aarch64 and riscv64 kernels reorderings TCG
  # permits; an x86_64 guest is TSO on any host and under KVM is TSO in silicon, so this leg never
  # had that property to lose. The aarch64 and riscv64 legs stay where they were.
  swish-check-x86_64:
    name: swish-check-x86_64 (the interactive shell, x86_64 under KVM)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # A hang detector, not a budget: setup and build are about ten minutes, a cold QEMU build can
    # add 10-20, and the leg itself is measured in the note above. Kept at the arm64 job's 60 so a
    # run that falls back to TCG (no /dev/kvm on some future image) still finishes and says so
    # rather than being cancelled mid-leg.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b (real hardware + IOMMU-backed driver isolation)) arrived later, so the
      # runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # **The provisioning step is explicit** (milestone 286 (one enumeration of the checks that
      # gate a pull request)), the same shape the `bench` and `cpu`
      # matrix` jobs have always had. `script/ci-build` bootstraps only on its no-argument path,
      # which is the command a developer runs before pushing; a job that names checks has already
      # installed exactly what it needs in its own steps, and a bare `script/ci-build fmt` must not
      # drag an apt install of QEMU onto the rustfmt runner.
      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # GitHub's documented recipe for KVM on its hosted Linux runners: the device exists and is
      # root's, and this hands it to every user. The leg prints "on KVM" in its header when it took
      # it, and the per-line bound it then holds is the other legs' 30 s, not TCG's 45 s.
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The row fetches `rg` from basalt first; the `swish-check` job above says why.
      # Each item's time into the job's record (milestone 808 (every gate accounts for its time)):
      # writers other than the kernel suite append only when NIFE_TIME_RECORD names a file.
      - run: helpers/hang_evidence.py run -- script/ci-build swish-check-x86_64
        env:
          NIFE_TIME_RECORD: ${{ github.workspace }}/target/time-record.tsv
      - name: Summarize where the time went
        if: always() && hashFiles('target/time-record.tsv') != ''
        run: cargo xtask time-summary target/time-record.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the time record
        if: always() && hashFiles('target/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-swish-check-x86_64
          path: target/time-record.tsv
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **`rg` walks in parallel, and the kernel counts its threads** (milestone 121, the third gap of
  # calef's amber ruling on fatal risk 1; lane milestone/121-rg-threads, 2026-10-12 UTC; the job id
  # and row names are provisional). calef: "the path to green on risk 1 requires a foreign program
  # running a second thread." Each row fetches `rg` from basalt (`cargo xtask basalt-fetch`, the
  # `swish-check` job above says how) and boots the kernel suite filtered
  # to `ripgrep` at four cores, where `ripgrep_threads_tests` runs unmodified `rg` as a process,
  # with no thread flag and with `--threads 4`, and fails unless its process started the main
  # thread and one worker per thread asked for, and printed exactly the tree's 138 lines. The
  # aarch64 row also holds the host's `rg` to the same lines. The four `ripgrep_tests`, which no
  # other job runs with `rg` present, come along. Each row then boots the suite once more,
  # filtered to `unmodified_` at one core, which runs basalt's ioping, hackbench and SQLite
  # packages (milestones 906 (ioping is packaged in basalt), 907 (hackbench is packaged in basalt)
  # and 897 (SQLite is packaged in basalt)).
  # Both rows run on arm64, x86_64 under TCG as in `test-shard`. They are two jobs rather than a
  # matrix because a skipped matrix job posts its name unexpanded, `rg-threads (${{ matrix.legs }})`,
  # so a required context naming a leg would never report on a pull request the gate scopes out.
  # A fixed `name:` posts the same context whether the job ran or skipped, as `swish-check` does.
  rg-threads:
    name: rg-threads (aarch64 and riscv64)
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # QEMU, built from source and cached, for the `swish-check` job's reasons above.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"
      - run: helpers/hang_evidence.py run -- script/ci-build rg-threads-aarch64-riscv64
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  rg-threads-x86_64:
    name: rg-threads-x86_64 (x86_64 under TCG)
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # QEMU, built from source and cached, for the `swish-check` job's reasons above.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"
      - run: helpers/hang_evidence.py run -- script/ci-build rg-threads-x86_64
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  boot-check:
    name: boot-check (the default kernels' interactive boot)
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # A hung kernel means QEMU never exits and the runner would block until the 6-hour default.
    # Fail loudly instead. The bound is a hang detector, not a budget, so it sits well above an
    # honest run. Derivation: three debug boots are about a minute against a warm target, so the
    # honest cost is the setup, about ten minutes of build plus 10-20 for a cold QEMU build, near
    # 32 at worst. 45 is the chained job's bound kept for headroom beyond that.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b) arrived later, so the runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # **The provisioning step is explicit** (milestone 286), the same shape the `bench` and `cpu
      # matrix` jobs have always had. `script/ci-build` bootstraps only on its no-argument path,
      # which is the command a developer runs before pushing; a job that names checks has already
      # installed exactly what it needs in its own steps, and a bare `script/ci-build fmt` must not
      # drag an apt install of QEMU onto the rustfmt runner.
      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"

      # `boot-check` (milestone 268 (every architecture boots the same way)), its own job since
      # the 2026-09-30 split (#1468) and before that a rider on the suite job. It is the only
      # thing on a pull request that reads a boot's self-test verdict: `test` boots a `cfg(test)`
      # build that exits through semihosting before the tour, and `swish-check` reads the prompt.
      # The boot a person gets by typing `cargo xtask run` was once unasserted, and that was not
      # theoretical: milestone 268's finding 3 is a checkpoint that could never fire on two of
      # three architectures, and it hid for months because nothing read the channel it was
      # supposed to appear on.
      - run: helpers/hang_evidence.py run -- script/ci-build boot-check
      # The job log carries only the verdict line, which names a failed check but not what it
      # measured; each check's own line is in the boot log.
      - name: Upload the boot logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boot-check-logs
          path: target/boot-check-*.log
      # **And the release x86_64 UEFI image, booted under OVMF to the shell.** Every image a
      # machine gets is release (`install-boot`, `network-bench`), and a debug boot cannot stand in
      # for one: an `asm!` operand sharing a register with a live input is harmless at debug and
      # fatal at release. In this job because it is a required check and already has QEMU and OVMF;
      # the row's comment in script/ci-build has its price.
      - run: helpers/hang_evidence.py run -- script/ci-build release-uefi-boot
      # **And the same release image booted over a network, with no disk attached** (milestone 260
      # (boot xenon over the network)): OVMF PXE-boots it from the real `script/board-netboot`,
      # with the DHCP offer parsed out of `bench/xenon-netboot/dnsmasq.conf`, and a client the
      # config does not name must get no boot file. It is the half of xenon's network boot a
      # stranger can check; the other half is a bench session.
      - run: helpers/hang_evidence.py run -- script/ci-build netboot-rehearsal
      # **And the release aarch64 stick under EDK2 with `acpi=on`** (milestone 578 (an ACPI
      # discovery path for aarch64)): no device tree, only the tables, which is what every aarch64
      # cloud machine hands a kernel. The loader writes the tree from them (§278 (an ACPI machine
      # reaches the aarch64 kernel as a device tree the loader writes)), and nothing else on a pull
      # request boots that path.
      - run: helpers/hang_evidence.py run -- script/ci-build acpi-boot
      # The disk that boot just booted, for a person importing it into a cloud
      # (notes/rented-metal/oracle-a1.md). Sparse 302 MiB; about 2.5 MB compressed.
      - name: Upload the cloud boot disk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nife-aarch64-cloud-image
          path: target/cloud-image/nife-aarch64.img
          retention-days: 14
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **Two shards and an aggregate, because one runner ran out of budget** (lane/cpu-matrix-budget,
  # 2026-10-06 UTC). Measured on 31 green merge-group runs from 2026-09-20 to 2026-10-06: the job's
  # fixed cost (checkout, caches, bootstrap, the kernel build) held at about 4.3 minutes, and each
  # model's boot of the riscv64 suite grew from 1.6 to 3.1 minutes, evenly on all five models,
  # because the suite itself grew (358 tests to 457, most of the new time in login, compositor,
  # display and timetable system tests). Five boots in a row reached 19.8 minutes on a fast runner
  # and 20.1 to 21.0 on slow or cold ones, which failed the budget with every model green. No step
  # regressed, so there was nothing cheap to fix, and raising the budget would only move the date.
  #
  # Two shards rather than five because the fixed cost is paid per shard: two cost about 24
  # runner-minutes against 19.8 (one more arm64 runner per run), five would cost about 37. The
  # three-model shard is the long pole at about 13.6 minutes. Models go to shards in
  # `script/cpu-matrix`'s own order through `CRICKER_CPU_MODELS`, so the control, `rv64`, is in the
  # first shard. If the suite keeps growing at 0.1 minutes per model per day the long shard meets
  # the budget again in about three weeks; a third shard is then one more `include` entry.
  #
  # **Each model stopped repeating the host pass** (lane maintainer/cpu-matrix-budget, 2026-10-13
  # UTC, #2055). The three-model shard's job reached 15.8 to 17.4 minutes on 2026-10-13 merge-group
  # runs, up from 14.6 to 15.7 a day earlier. Its time records say why: each model's system-test
  # suite went from 157 to 184 seconds, 15 of them one new test that waits on purpose for the net
  # stack's 15-second accept bound (#2047), and 4 to 6 more the package fetch over TLS, which grew
  # from 16.5 to 20 to 23 seconds. Under that, each `cargo xtask test --cpu` re-ran the host pass,
  # which `-cpu` cannot change. On the 2026-10-13 13:12 run the first model spent 4.9 of its 8.2
  # minutes outside its two suite images (mostly cold builds, the host pass among them) and each
  # later model 57 seconds, 206 doctests recompiled among them. `script/cpu-matrix` now
  # passes `--no-host`; the `test-aarch64-riscv64` shard runs that pass on the same commit on the
  # same runner type.
  #
  # The required check keeps its name on the aggregate below, the same arrangement verify.yml's
  # header records for `verify (Kani proofs)`: a matrix renames its jobs, and a required name that
  # matches nothing blocks every pull request.
  cpu-matrix-shard:
    name: cpu matrix shard (${{ matrix.models }})
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    strategy:
      # Every shard finishes, for the reason script/cpu-matrix does not stop at the first model:
      # which models failed is the diagnosis.
      fail-fast: false
      matrix:
        include:
          - shard: 1
            models: rv64 sifive-u54 rva22s64
          - shard: 2
            models: rva23s64 thead-c906
    # Up to three QEMU boots plus a std-farm build. Generous because a hung guest must fail loudly
    # rather than sit on the runner's 6-hour default, the same reason the test job has one.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # The same cached QEMU the test and bench jobs use, restored before script/bootstrap for the
      # same reason (bootstrap skips its apt install when QEMU is already on PATH).
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # A JOB OF ITS OWN, not extra work inside `test`, and the reason is wall clock: the matrix is
      # the same riscv64 suite five times over, so folding it into the gate would make every run four
      # times longer for a check whose whole point is that it rarely changes anything. On its own
      # runner it costs nothing a developer waits for.
      #
      # On every push and pull request rather than nightly, because the change that breaks this is a
      # change to kernel/src/arch/riscv64/, which arrives in a pull request, and a nightly would
      # report the failure a day after the merge that caused it.
      #
      # See notes/cpu-models.md, including its BUGS section: a narrower QEMU model is still QEMU.
      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"
      - run: helpers/hang_evidence.py run -- script/ci-build cpu-matrix
        env:
          CRICKER_CPU_MODELS: ${{ matrix.models }}
      # The per-model logs, kept only when something failed. `script/cpu-matrix` now prints an
      # excerpt inline, which answers most questions without leaving the browser; this is for the
      # ones it does not, because the full boot log is thousands of lines and belongs in a download
      # rather than in the job output. Without it the evidence lives only on a runner that is about
      # to be destroyed, which on 2026-08-02 forced a local re-run to read a file CI had already
      # written.
      - name: Upload the per-model logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cpu-matrix-logs-${{ matrix.shard }}
          path: target/cpu-matrix/
      # The models' phases and per-test times (milestone 807), on every run rather than only on
      # failure, because the drift this record exists to catch happens on green runs.
      - name: Summarize where the time went
        if: always() && hashFiles('target/cpu-matrix/time-record.tsv') != ''
        run: cargo xtask time-summary target/cpu-matrix/time-record.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the time record
        if: always() && hashFiles('target/cpu-matrix/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-cpu-matrix-shard-${{ matrix.shard }}
          path: target/cpu-matrix/time-record.tsv
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The name the ruleset requires, kept stable over the shards. It reads one result and boots
  # nothing, so it runs on the x86_64 pool and has no checkout (helpers/job-budget.py exempts a job
  # without one from the clock steps; the timeout still binds).
  cpu-matrix:
    name: cpu matrix (riscv64 across QEMU CPU models)
    runs-on: ubuntu-24.04
    needs: [gate, cpu-matrix-shard]
    # The shards' own condition, so a draft or a prose-only change skips this by condition (which
    # reports Success) rather than leaving the required check unreported. `!cancelled()` reaches the
    # condition when a shard failed, which is the case this job exists to report.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    timeout-minutes: 5
    steps:
      - name: Report the shards' combined result
        run: |
          result="${{ needs['cpu-matrix-shard'].result }}"
          if [ "$result" = success ]; then
            echo "==> cpu-matrix shards: every model passed"
          else
            # script/ci-log-baseline attributes this job by its last `==>` line; the models that
            # failed are named in the shard's own log, on its `cpu-matrix: failed on:` line.
            echo "==> cpu-matrix shards: $result (the failing shard's job names the models)"
            exit 1
          fi

  watchdog:
    name: watchdog (x86_64 TCO reset under q35)
    runs-on: ubuntu-24.04-arm
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # Two soaks that wait on the wall clock (about six minutes together) plus two kernel builds.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # **Milestone 593 (a wedged kernel resets itself), provisional number, and a NARROWER predicate
      # than the other QEMU jobs, deliberately.** The other jobs skip only on the gate's prose-only
      # rule, which this one also obeys at the job level. This one costs a runner for six minutes of
      # mostly waiting, and nothing outside these paths changes what it checks: the TCO driver, the
      # soak that arms it, the harness
      # that judges it, the runner that starts QEMU, and the kernel's features. Not a required check,
      # so a skipped run posts nothing that blocks a merge. A push to `main` always runs it, so a
      # predicate that was wrong about a path shows up one merge later rather than never.
      - name: Does this change touch the watchdog?
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="$(helpers/scope-merge-base.sh \
              "$BASE_REF" \
              "$BASE_SHA" 2>/dev/null || true)"
          # A dispatched run has no event base, and `HEAD~1` alone scoped it to the newest commit:
          # a lane whose last commit was documentation skipped the build its earlier commits needed
          # (#1347, 2026-09-26). Off `main`, the merge base is the whole branch; on `main` it is
          # HEAD itself, so the newest commit stays the scope there.
          [ -n "$base" ] || base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^(kernel/src/arch/x86_64/|kernel/src/soak\.rs|kernel/src/console\.rs|kernel/Cargo\.toml|kernel/build\.rs|xtask/src/soak\.rs|script/soak-test|helpers/qemu-runner-x86_64\.sh|\.qemu-version|\.github/workflows/ci\.yml)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "==> nothing the watchdog proof depends on changed"
          fi

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      - name: Cache QEMU
        if: steps.scope.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        if: steps.scope.outputs.needed == 'true'
        run: script/ci-qemu
      - name: Put it on PATH
        if: steps.scope.outputs.needed == 'true'
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"
      - run: script/bootstrap
        if: steps.scope.outputs.needed == 'true'
      # The wedge first: it is the claim, and the healthy run is its control.
      - run: helpers/hang_evidence.py run -- script/ci-build watchdog-check
        if: steps.scope.outputs.needed == 'true'
      - name: Upload the soak logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watchdog-logs
          path: target/soak-test-*.log
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    needs: gate
    # A comment-only Rust change skips the heavy jobs but not this one: a reflowed comment can
    # break formatting, and a reindent is the class's one non-comment change.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (needs.gate.outputs.prose != 'true' || needs.gate.outputs.comments == 'true') }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every job that installs a toolchain itself does it with this one line. `toolchain install`
      # with no name installs rust-toolchain.toml's pin with every component and target it lists,
      # which is what cargo would fetch on first use anyway, but here inside the retry. Naming
      # `nightly` instead would install the floating channel beside the pin: a second download and a
      # second chance at the CDN, for a toolchain no step uses. helpers/rustup-retry.sh says why the
      # retry exists.
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      - run: helpers/hang_evidence.py run -- script/ci-build fmt
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **Named `lint`, not `clippy`, since 2026-10-08 (UTC).** It runs `script/ci-build lint`: clippy
  # plus the citation, decision, roadmap and prose checks, so a red `clippy` read as a clippy
  # failure when it was usually one of the others. calef: "Should the gate named clippy be renamed?
  # It seems to cause you some confusion when I cite it", then "Go ahead with lint."
  lint:
    name: lint
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `script/lint` runs `script/roadmap --check`, whose merged-branch check reads
          # `git log --merges`. At the default depth 1 that returns nothing, so the check passed
          # vacuously here for as long as it has existed; milestone 247 merged with a stale status
          # and no pull request went red. The check now refuses an empty history too, so this and
          # that refusal are belt and braces.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      # `script/lint` clippies the `user` package, whose build.rs compiles the C component with a
      # bare-metal clang (milestone 36, DECISIONS §30). The test job gets this from script/bootstrap;
      # this job does not run bootstrap (it would install QEMU it never uses), so install clang here.
      # Ubuntu's clang carries every LLVM backend, including RISC-V.
      # shellcheck too: script/lint gates over 50 `#!/bin/sh` scripts <!--count-at-least:sh-scripts--> on it.
      # (That number is re-derived from the tree by script/lint's counted-claims check; the marker is
      # what makes it a claim a machine keeps honest. See notes/counted-claims.md.) Installed explicitly
      # rather than relying on the runner image shipping it, so the gate cannot quietly vanish when
      # that image changes.
      # dtc too: script/lint compares every committed .dtb against the .dts beside it
      # (milestone 491 (a committed .dtb is checked against what its .dts compiles to)), and the
      # check's skip note says CI has the tool, so this job has to. The ubuntu-24.04 image does
      # not ship it.
      # ruby too: two script/lint checks parse YAML with `ruby -ryaml` (helpers/workflow_parses.py,
      # helpers/issue_forms.py). The image ships it; the explicit install is for the reason above.
      - name: Install clang (the C component's compiler), shellcheck, dtc and ruby
        run: sudo apt-get update && sudo apt-get install -y clang shellcheck device-tree-compiler ruby
      # **No rust-cache entry is saved from a merge group, because nothing can ever restore one.**
      # A run restores caches from its own ref and the default branch's, and every merge group runs
      # on a fresh `gh-readonly-queue/...` ref. Measured 2026-10-07 (UTC): 0 hits in 111 merge-group
      # jobs, while those jobs' 163 saved entries held 3.8 GB of the repository's 10 GB, evicting the
      # pull request entries that do hit. Every rust-cache step in ci.yml and verify.yml carries the
      # same `save-if`. Kept only here and on verify's prove and falsify-shard, where a hit saved 2.0
      # to 3.7 minutes; without `shared-key`, because the three build different graphs and a shared
      # entry would only overwrite itself (calef, #1814, 2026-10-07 UTC). See
      # notes/actions-cache-budget-2026-10-07.md.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # cargo-machete (unused dependencies) and typos (spelling), both new gates in script/lint.
      # `cargo install` rather than the runner image, for the reason above: a gate that depends on
      # whatever the image happens to ship is a gate that can vanish without a diff. `--locked`
      # pins each tool's own dependency resolution. Neither is in Ubuntu's archive.
      #
      # These land AFTER rust-cache so the cache restores first; the installs are then usually a
      # no-op against the cached ~/.cargo/bin.
      - name: Install the lint tools (cargo-machete, typos)
        run: |
          command -v cargo-machete >/dev/null || cargo install cargo-machete --locked
          command -v typos        >/dev/null || cargo install typos-cli     --locked
      - run: helpers/hang_evidence.py run -- script/ci-build lint
      # **The fleet tooling's checks, as their own step** (milestone 889 (the tree's gates stop
      # depending on the fleet tooling), provisional). The 22 checks of the lane, queue, label and
      # identity machinery left script/lint for script/lint-fleet, so that a stranger's lint reads
      # no fleet file. They still gate every pull request and merge group from here: a step in
      # this job, rather than a job of its own, because a new job gates nothing until the ruleset
      # requires it, and this job's verdict is already required (as `clippy`, through the relay
      # job below). When the fleet tooling moves to its own repository this step becomes a call to
      # that repository's reusable workflow.
      - name: The fleet tooling's checks
        run: script/lint-fleet
      # The one host-only tool with no selftest in script/lint. The gate (helpers/prose_only.py,
      # HOST_ONLY_TOOLS) skips every heavy job for a change that touches only script/metrics and
      # the report generators beside it, so this job, which never skips, is where it is exercised
      # (lane/ci-scope-host-scripts, 2026-10-07 UTC). 34 cases, under a second.
      - name: Selftest of script/metrics
        run: script/metrics --selftest
      # **What a prose-only change can still break, run here because this is the one job that a
      # prose-only change does not skip.** The gate's classifier names every package whose Rust
      # walks a directory the change touched (`crates/documentation`'s corpus test walks `notes/`,
      # `design/decisions/` and `design/roadmap/`, and went red on main on 2026-09-23 while the old
      # step-level skip hid it). On any other change the first `test-shard` runs these tests in the
      # host pass of `script/ci-build test-aarch64-riscv64`, so between the two the corpus is
      # checked on every pull request.
      - name: The tests of the code that reads the prose this change touched
        if: needs.gate.outputs.prose == 'true' && needs.gate.outputs.prose_tests != ''
        # Through the environment, never spliced into the script: the names come from the tree
        # under test. The classifier also refuses any name that is not `[A-Za-z0-9_-]+`.
        env:
          PROSE_TESTS: ${{ needs.gate.outputs.prose_tests }}
        run: |
          set -eu
          args=""
          for p in $PROSE_TESTS; do args="$args -p $p"; done
          echo "==> cargo test$args"
          # shellcheck disable=SC2086 # one word per package, split on purpose
          cargo test $args
      # **What a comment-only Rust change can still break, beside the clippy and rustdoc passes
      # above.** Doc comments hold doctests, and a doc comment can be read at run time (a derive's
      # help text), so each package the gate owes a run gets `cargo test`, doctests included. A
      # package that builds only for bare metal (`kernel`, `system_tests`, and what
      # helpers/host-excluded-crates.sh derives) has no host test to run, and is named and skipped.
      - name: The host tests of the packages whose comments this change touched
        if: needs.gate.outputs.prose == 'true' && needs.gate.outputs.comments == 'true' && needs.gate.outputs.comment_tests != ''
        # Through the environment, as above; the classifier refuses any name that is not
        # `[A-Za-z0-9_-]+`.
        env:
          COMMENT_TESTS: ${{ needs.gate.outputs.comment_tests }}
        run: |
          set -eu
          bare=" kernel system_tests $(helpers/host-excluded-crates.sh | tr '\n' ' ') "
          args=""
          for p in $COMMENT_TESTS; do
            case "$bare" in
              *" $p "*) echo "==> $p builds only for bare metal: clippy and rustdoc above are its check" ;;
              *) args="$args -p $p" ;;
            esac
          done
          [ -n "$args" ] || exit 0
          echo "==> cargo test$args"
          # shellcheck disable=SC2086 # one word per package, split on purpose
          cargo test $args
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **Transitional: delete this job once ruleset 19596094 requires `lint` instead of `clippy`.**
  # A required check is matched by name, so renaming the job alone would leave the merge queue
  # waiting on a `clippy` that never reports, while groups built ahead of the rename never report
  # `lint`. This job re-reports `lint`'s verdict under the old name, so both names are true at once
  # and the ruleset swap has no window. The order (merge, swap the ruleset once open pull requests
  # have run this workflow, then delete this job) is in notes/scripts.md, "CI leverages them".
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    needs: lint
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Report lint's verdict under the old check name
        env:
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          echo "==> lint: $LINT_RESULT"
          case "$LINT_RESULT" in success|skipped) ;; *) exit 1 ;; esac

  fastpath-footprint:
    name: fastpath footprint (the IPC path must stay L1i-sized)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The pin's `targets` array is every bare-metal target, and this gates every one of them
      # (§19 (architectural parity is a tenet): a fastpath that fits on one ISA and not another is
      # exactly the asymmetry that rule exists to catch). llvm-tools carries the objdump the
      # call-graph walk reads.
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      # Its own job rather than a step in an existing one, for stack-frame-check's reason: it needs a
      # RELEASE kernel, and no other job builds one, so there is nothing to share. Jobs run in
      # parallel, so it costs no wall clock against the 30-minute Kani job.
      - run: helpers/hang_evidence.py run -- script/ci-build fastpath-footprint
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  boot-file-size-check:
    name: boot file size (the release BOOTX64.EFI against its slot budget)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    timeout-minutes: 20
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A release x86_64 kernel and archive, and the UEFI loader, which is the image an install
      # writes into a 64 MiB boot slot (calef, 2026-10-03 UTC). Measured 28 seconds warm on the dev
      # machine; the 20-minute cap is for a cold runner. Its own job because no other job builds a
      # release image, so there is nothing to share, and jobs run in parallel. llvm-tools carries
      # the objcopy that strips the kernel and the objdump that proves it stripped.
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      - run: helpers/hang_evidence.py run -- script/ci-build boot-file-size-check
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  interleavings:
    name: interleavings (loom, every thread interleaving of the atomic protocols)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # Milestone 746 (loom runs in CI), provisional number. Measured 24 seconds wall clock on the dev
    # machine in a cold worktree (compile included, 26 harnesses), against the 20-minute budget. The
    # bound is the budget plus margin; a hung search must fail loudly.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # `memory_regions` carries the falsification witness: that harness passes only when loom finds
      # the pre-#316 double free, so a green run also proves the search can still see a bug.
      - run: script/interleaving-check
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  build-is-reproducible:
    name: reproducible build (the same commit builds the same bytes)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # Measured, not guessed: 11.1 seconds for both builds on the arm64 runner (2026-09-18, its own first
    # run; 11 seconds on x86_64 on 2026-09-24), against 5 seconds for one cold `-p kernel` release build on the dev machine. This job
    # was first written with a 45-minute timeout on the assumption that two cold builds are slow.
    # Generous rather than tight, because a hung build must fail loudly rather than sit on the
    # runner's 6-hour default.
    timeout-minutes: 15
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      # Its own job for fastpath-footprint's reason one step further: this needs TWO release builds
      # that share nothing, so there is not only nothing to reuse from another job, there is nothing
      # to reuse between its own halves. Jobs run in parallel, so it costs no wall clock against the
      # proofs.
      #
      # It builds `git archive HEAD` twice at two different paths rather than reusing the checkout,
      # which is why it does not need `fetch-depth: 0`: one commit is all it reads.
      - run: helpers/hang_evidence.py run -- script/ci-build build-is-reproducible
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  image-permissions:
    name: image permissions (no kernel image ships a writable-executable segment)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The pin's `targets` array is every bare-metal target, and this gates all of them (§19
      # (architectural parity is a tenet): an image that obeys W^X on one ISA and not another is
      # exactly the asymmetry that rule exists to catch, and on 2026-08-31 x86_64 was the one that
      # did not).
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # Its own job rather than a step in `lint`, for `stack-frame-check`'s reason: it builds three
      # kernels and no other job builds the riscv64 or x86_64 one at all, so there is nothing to
      # share. Jobs run in parallel, so it costs no wall clock against the 30-minute Kani job.
      #
      # BUGS: this is not a REQUIRED check in the merge queue's ruleset, because that is a repository
      # setting rather than a file in this tree, so today a red run here is visible and does not block
      # a merge. Making it required is calef's, and is one checkbox.
      - run: helpers/hang_evidence.py run -- script/ci-build image-permissions
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  stack-frame-check:
    name: stack frames (no frame over a third of a thread stack)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every bare-metal target is installed, because `script/stack-depth-check` gates all of them.
      # `script/stack-frame-check` defaults to two: it holds x86_64 out of its DEFAULT set, reachable
      # through `--arch`, because widening it found `kernel::arch::x86_64::iommu::init` at 12,504
      # bytes against a 4,096-byte guard page. That finding and its disposition are in that
      # script's own BUGS. §19 parity still applies to the two gated here: a frame that fits on one
      # ISA and not the other is exactly the asymmetry that rule exists to catch. llvm-tools
      # carries the objcopy and nm that read the `.stack_sizes` section the measurement lives in.
      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      # No rust-cache here (calef, #1814, 2026-10-07 UTC). This job was measured without it first:
      # 115.7 s against a median 112.8 s with it (range 79.9 to 120.0, 20 runs), because the first
      # build absorbed the time the step had spent. See notes/actions-cache-budget-2026-10-07.md.
      # Its own job rather than a step in `lint`: it builds the kernel test binary twice (the flag
      # changes the build, so CI's existing kernel artifacts cannot be reused), and jobs run in
      # parallel so a separate one costs no wall clock against the 30-minute Kani job. **Why it is
      # not in the tier a developer runs before pushing is recorded beside its row** in
      # `script/ci-build`'s table, not here: this file used to carry three such explanations and one
      # of them had been false for a month.
      - run: helpers/hang_evidence.py run -- script/ci-build stack-frame-check
      # The chain, in the same job as the frame, because they need the identical build: same
      # targets, same `-Z emit-stack-sizes`, so the second reuses the first's artifacts and costs
      # near nothing. They answer different halves of one question and a tree that gated only the
      # first was, on 2026-08-16, unable to say whether a guard-page fault was depth at all.
      #
      # The job's display name still says "no frame over a third of a thread stack", which was
      # already stale before this step existed (milestone 124 moved the ceiling to the guard page)
      # and understates it further now. Left alone on purpose: the name is what branch protection
      # matches on, so renaming it is a merge-queue change rather than a wording one.
      - run: helpers/hang_evidence.py run -- script/ci-build stack-depth-check
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  bench:
    name: bench (icount regression tripwire)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # Milestone 21's stated requirement is to catch "the *introduction* of performance problems
      # proximate to the changes that introduce them", and a tripwire that only fires on a
      # developer's laptop cannot do that. icount was chosen for determinism precisely so this is
      # possible: it counts guest instructions, not wall time, so a shared runner's noise does not
      # move it.
      #
      # If CI's counts and bench/baseline-aarch64.txt disagree by more than the 10% tolerance, the fix is a
      # CI-specific baseline, NOT a wider tolerance: widening it to make the job green would delete
      # the only thing the job does. The baseline was committed from an aarch64 macOS host against
      # Homebrew's QEMU, and this runs x86_64 Linux (milestone 587) against our own build, so some drift is expected and
      # the first red run is data rather than a defect.
      # QEMU, built from source and cached. Ubuntu 24.04 ships 8.2 and `-device riscv-iommu-pci`
      # (milestone 16b) arrived later, so the runner's packaged QEMU cannot boot the riscv leg at all.
      # apt cannot fix it: it already installs the newest package for the release, and there is no
      # newer Ubuntu runner image. The version is pinned in .qemu-version so CI and the developer
      # machine emulate on the same thing, which matters for a project whose benchmarks are instruction
      # counts. Cold builds take ~10-20 min; every run after that is a cache hit. Restored BEFORE
      # script/bootstrap on purpose, because bootstrap skips its apt install when QEMU is already on
      # PATH, which is how the built one wins.
      - name: Cache QEMU
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-qemu
          key: qemu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.qemu-version') }}
      - name: Build QEMU if the cache missed
        run: script/ci-qemu
      - name: Put it on PATH
        run: echo "$HOME/.cache/nife-qemu/bin" >> "$GITHUB_PATH"

      # No lint in this job, so no cargo-machete or typos: NIFE_SKIP_LINT_TOOLS=1 skips the two
      # source builds (about 85 s on the arm64 runners, #1778). Only the `lint` job lints, and it
      # installs them itself.
      - run: script/bootstrap
        env:
          NIFE_SKIP_LINT_TOOLS: "1"
      - run: helpers/hang_evidence.py run -- script/ci-build bench
        env:
          NIFE_BENCH_READINGS: ${{ runner.temp }}/bench-readings.tsv
      # Three legs, three architectures, since 2026-09-15: `script/ci-build`'s `bench` row is
      # `script/bench --check && script/bench --riscv --check && script/bench --x86 --check`, so
      # this one step pulls all three tripwires. **This comment said the opposite for six days**,
      # having been written before the x86_64 leg was added and never compared against the script
      # it describes, and a lane read it and concluded that a failure it was looking at had gone
      # undetected on `main` for an unknown length of time. It had not; the leg caught the failure
      # on the first push. That is the same defect the `icount` step below records in its own last
      # paragraph, arriving twice in one file: a claim about what a script does, kept beside the
      # step rather than in the script, and drifting the moment the script changed.
      # See notes/benchmarks.md, 2026-09-21.

      # What `main` measured, kept for the weekly unexplained-drift chart (calef's ruling on #2554,
      # 2026-10-22 UTC): `helpers/baseline_drift.py --update` reads the newest of these per week.
      # A merge group's run is `main`'s reading, because the push that follows it skips the suite
      # for a SHA the queue already passed (the `gate` job). Pull requests keep none: their head is
      # not `main`. Ninety days is GitHub's ceiling, and the weekly fetch commits what it reads.
      - name: Keep the readings
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-readings
          path: ${{ runner.temp }}/bench-readings.tsv
          retention-days: 90

      # The instruction-count instrument (milestone 78), here rather than in its own job because it
      # wants exactly what this job already has: the pinned QEMU, the same cache, and the same skip on
      # a prose-only change (the gate's), which cannot move an instruction count. It costs about seven seconds
      # for both ISAs, against this job's forty-five minute budget.
      #
      # It is not in `script/test`, and notes/instruction-clock.md carries the reason: `-icount`
      # gives every vCPU one shared virtual clock, so the instrument is single-hart, and a suite run
      # there would silently stop proving every cross-core property it exists for. That argument is
      # about a boot mode rather than about a command, which is why it IS in the tier a developer
      # runs before pushing; `script/ci-build`'s table is where that membership lives. **This comment
      # asserted the opposite for a month**, having been written before milestone 62 put the
      # instrument in the local set, and nothing compared the claim against the script.
      - run: helpers/hang_evidence.py run -- script/ci-build icount
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  supply-chain:
    name: supply chain (advisories, licences, vendored integrity)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # No permissions block of its own: the workflow-level `contents: read` above already gives every
    # job the least privilege that works, and this job wants exactly that (read the source, read the
    # advisory database, fetch a tarball from crates.io). Adding a redundant per-job copy would make
    # the workflow-level grant look like a default rather than the decision it is.
    timeout-minutes: 20
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A prebuilt binary rather than `cargo install`, the same trade the coverage job makes: this
      # job compiles nothing of ours, so it has no business compiling a tool either. The version
      # comes from .cargo-deny-version so this and script/supply-chain cannot disagree, which they
      # did on the first run: the laptop had 0.19.1 and `@latest` here got 0.20.2, and the two spell
      # `--config` differently and default it to different directories.
      - name: Read the pinned cargo-deny version
        id: deny
        run: echo "version=$(cat .cargo-deny-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@${{ steps.deny.outputs.version }}
      # The published .crate tarballs script/vendor-verify hashes. Keyed on the pin files, so
      # changing a pin correctly misses the cache and refetches. A miss costs one HTTP request.
      - name: Cache the vendored tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-vendor
          key: nife-vendor-${{ hashFiles('vendor/*.pin') }}
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      - run: helpers/hang_evidence.py run -- script/ci-build supply-chain
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  fuzz:
    name: fuzz (parsers, 60s per target)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # Build, then one-minute runs: six parsers and, since the fuzz-service-handlers lane, the
    # services' request handlers (`script/fuzz --list`). Generous against a cold `-Zbuild-std`, which compiles the
    # standard library with the sanitizer on the first run of the day.
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # No install step: `script/fuzz` installs the version pinned in `.cargo-fuzz-version` when the
      # one on PATH does not match, exactly as it does on a developer's machine. That is the opposite
      # trade from the supply-chain and coverage jobs, which take a prebuilt binary because they
      # compile nothing of ours; this job compiles the fuzz targets and the standard library anyway,
      # so one more `cargo install` behind the same cache is not the expensive part, and having one
      # installation path means CI cannot silently run a different tool than a developer does.
      #
      # `-Zbuild-std` needs `rust-src`, which `rust-toolchain.toml` already lists for the kernel.

      # **A JOB OF ITS OWN**, the same argument `cpu-matrix` makes above and for a stronger reason.
      # Fuzzing has no completion condition: a fuzz target does not pass, it runs out of time. So it
      # cannot be a step inside a gate somebody waits on, because the only knob is how long the wait
      # is, and every second of it is a second the gate is slower for every commit forever.
      #
      # **60 seconds per target, four targets**, plus the build. The number is chosen against what
      # the budget actually buys rather than by feel. Ten minutes on each target on the developer
      # machine came to 317 million executions, and the SLOWEST of the four (`dtb_walk`, which runs
      # seven full walks per accepted input; `device_tree_blob_walk` since the crate's 2026-09-18
      # rename) sustained 19,470 a second. So a minute buys at least a million inputs on every
      # target, from a corpus already past every magic-number check. A runner is a different
      # machine; the order of magnitude is what the budget is chosen against.
      #
      # **What this job is for, stated so it is not mistaken for something else.** It is a SWEEP over
      # the ground the seed corpus reaches quickly, not a search and not a guarantee. Finding
      # something genuinely new is the job of a long run on a developer's machine
      # (`script/fuzz --time 3600`), and it is deliberately not automated: a nightly job that finds a
      # crash at 4am, with no corpus persisted between runs, produces an artifact nobody can
      # reproduce and an alert nobody dispositions, which is DECISIONS §35's wallpaper failure.
      #
      # **Do not mistake it for the regression guard, because it is not one.** Measured rather than
      # assumed: with both of this milestone's `dtb` fixes reverted, sixty seconds from the committed
      # seeds found NOTHING, and fifteen minutes found the overflow after 13.1 million executions.
      # What holds those two bugs down is `crates/device_tree_blob/tests/hostile.rs`, which runs in
      # milliseconds on every `script/test` on both ISAs. The fuzzer finds a thing once; a host test
      # keeps it.
      #
      # **The corpus is not persisted between runs, on purpose.** Caching it would make the job's
      # coverage depend on which runs happened before it, so a red run could not be reproduced from
      # the repository alone. Every run starts from exactly the committed seeds and the two fixture
      # directories, which is the same starting point a developer gets.
      # Each item's time into the job's record (milestone 808 (every gate accounts for its time)):
      # writers other than the kernel suite append only when NIFE_TIME_RECORD names a file.
      - run: helpers/hang_evidence.py run -- script/ci-build fuzz
        env:
          NIFE_TIME_RECORD: ${{ github.workspace }}/target/time-record.tsv
      - name: Upload the time record
        if: always() && hashFiles('target/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-fuzz
          path: target/time-record.tsv
      # A hung step leaves this before timeout-minutes discards the job's log (helpers/hang_evidence.py).
      - name: Upload the hang evidence
        if: always() && hashFiles('target/hang-evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hang-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: target/hang-evidence/
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  coverage:
    name: coverage (host crates)
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    # 25 minutes is the 20-minute budget plus margin (calef, 2026-10-03
    # UTC). Any derivation above that argues for a longer bound predates it and describes a job
    # that no longer fits; `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
