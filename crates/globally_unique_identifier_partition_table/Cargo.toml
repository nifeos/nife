[package]
name = "globally_unique_identifier_partition_table"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The GUID Partition Table (UEFI 2.10 section 5.3) as pure computation: parse, validate and build a table from bytes, with Kani-proven codecs"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "gpt", "partition-table", "kani"]
categories = ["no-std", "embedded", "filesystem", "parser-implementations"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# The GUID Partition Table (UEFI 2.10 section 5.3), as pure computation: parse a table, validate
# one, build one. No I/O of any kind, so it compiles for the host and its tests run in milliseconds
# against disks made by real tools (`sgdisk` and macOS's `diskutil`, both committed as fixtures).
# You cannot find a partition on a real disk without reading the table.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
# The identifier every entry and the header carry. This crate owns only how a GPT stores one
# (mixed-endian, `guid::from_disk`/`to_disk`); the type and its text form are RFC 9562's, taken
# from `uuid` with default features off.
uuid = { version = "1.28.0", default-features = false }
