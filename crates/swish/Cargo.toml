[package]
name = "swish"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The shell's logic, lifted out of `components/src/swish.rs` so it is host-testable and Kani-reachable
# while the program keeps the IO (milestone 70). The same pair `coremark`, `line_editor` and
# `compositor` already are, and CLAUDE.md's reason for letting a crate and a program share a name:
# the crate IS that program's logic, and splitting the names would hide the relationship.
#
# What lives here is everything the shell decides or renders with no capability in hand: the routing
# of a typed line, the pattern-versus-text question, the expansion order, and every sentence the user
# reads. What stays in the program is everything that needs a capability: the terminal page, the
# spawn channel, the FS requests, the pipe endpoints.

[lints]
workspace = true

[dependencies]
# The parser and the planner, the manifests, and the program table. Everything this crate renders is
# one of `grant_plan`'s values (`Refusal`, `Endowment`, `Line`), which is why the split lands here:
# `grant_plan` decides what a line means and this decides what the user is told about it.
grant_contract = { version = "0.1.0", path = "../grant_contract" }
grant_plan = { version = "0.1.0", path = "../grant_plan" }
program_table = { version = "0.1.0", path = "../program_table" }

# The slot a `std` program finds each authority in (milestone 595 (provisional)), so `caps` names
# the slots the progenitor will actually use for one rather than the native positions. Constants
# only, no dependencies.
std_runtime_contract = { version = "0.1.0", path = "../std_runtime_contract" }

# `ConfigPage`, so `caps` prints the inert-configuration values a child would read (milestone 47
# (navigation and naming), DECISIONS §111 (inert configuration is a validated page)) from the
# shell's own view of the same page. No dependencies of its own.
environment_contract = { version = "0.1.0", path = "../environment_contract" }

# `lookup_name` and `stem_parts`, so a bare word at the prompt resolves through the live activation
# set exactly as the progenitor records it (DECISIONS §229 (how a bare name at the prompt reaches an
# installed program), B2).
installed_programs = { version = "0.1.0", path = "../installed_programs" }

# `dir::explain`, the filesystem's half of a refusal. `grant_plan` deliberately keeps this a dev
# dependency so a command line can be checked without linking the filesystem contract; the shell
# links it either way, because `Say::Failed` carries an errno that only `filesystem_contract` can put a sentence
# to, and inventing a friendlier word for it here is exactly what must not happen.
filesystem_contract = { version = "0.1.0", path = "../filesystem_contract" }

# `has_magic`, and only that. Whether an arbitrary word is a pattern at all is asked before anything
# treats it as a path, so `echo a:b` prints text instead of being refused as a name. Expansion itself
# is `grant_plan::expand`; this crate moved the dependency off `user`, which no longer uses it.
glob = { version = "0.1.0", path = "../glob" }

# `index::Ranked` and `index::Found`, so `apropos`'s answer is rendered here with everything else
# the user reads (milestone 40 phase 2). The *reading* of a shard is `manual`'s and needs a
# capability, so it stays in the program; what a person is told about the result does not, and a
# sentence the shell invents is exactly what this crate exists to stop.
documentation = { version = "0.1.0", path = "../documentation" }
