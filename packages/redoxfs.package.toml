# redoxfs: the RedoxFS server, its host tool and the vendored library it serves.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "redoxfs"
kind = "optional"
home = { status = "undecided", reason = "the server and host tool are ours and the library is Redox's; whether the port goes upstream is open" }
crates = ["redoxfs_server", "redoxfs_host", "redoxfs"]
# The server enforces subtree grants itself (milestone 606 (a directory walk costs what it does on
# Linux), rulings D and T1 of 2026-09-27): `redoxfs_server` carries
# `capability_manifest_note::carry_subtree_grants!`, and the progenitor gives its clients a bound badge instead
# of a caretaker. `helpers/packages.py` checks the two agree. Field name provisional.
subtree_grants = "subtree_scope"
paths = ["vendor/redoxfs.divergence.patch", "vendor/redoxfs.pin"]
