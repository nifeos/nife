[package]
name = "byte_sink_fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Test data for the byte-sink contract: the transcript a test writer sends, the file a test sink writes it into, and the sentinels a test sink reports"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "testing"]
categories = ["no-std", "embedded"]
publish = false     # this crate stays in nife and is never published

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
byte_sink_contract = { version = "0.1.0", path = "../byte_sink_contract" }
