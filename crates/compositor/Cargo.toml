[package]
name = "compositor"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The compositor contract of milestone 33 (notes/compositor.md), rung two of the display ladder: the
# scene (which windows exist, where, and in what stacking order), the pure pixel arithmetic that
# turns several client surfaces into one screen honouring a damage rectangle, and the protocol the
# compositor's clients speak. Pure logic, host-tested, no_std, so the compositor, its clients, the
# kernel-side test, and the host-side scanout check share ONE definition and cannot drift. The same
# split `graphics_contract` makes for the framebuffer and `terminal_contract` for the terminal.
#
# Clipping and damage-rectangle intersection are where compositors have their bugs, and they are
# arithmetic, so they belong in a crate whose tests run in milliseconds rather than in an emulator.

[lints]
workspace = true

[dependencies]
# The screen IS the framebuffer contract's surface: rung two composites into the same shared frames
# rung one painted, and flushes through the same display IPC. Depending on graphics_contract rather than
# redeclaring the geometry is what keeps "the screen" one definition (and one pixel format).
graphics_contract = { version = "0.1.0", path = "../graphics_contract" }
