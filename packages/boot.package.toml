# boot: the UEFI loader and what draws the boot on a screen. Debian's grub-efi.
#
# Milestone 611 (every program and crate belongs to a package). The package's name, kind, home
# and membership are provisional, the lane's proposal for calef to ratify; the format is
# helpers/packages.py's header, and notes/package-boundaries.md has the table and the reasons.

name = "boot"
kind = "base"
home = { repo = "boot", status = "provisional" }
# device_tree_patch is an interface because the fuzz workspace links it to rewrite hostile trees,
# and that link is the reason it is a crate of its own (ruled 2026-11-01 UTC).
interfaces = ["screen_console", "bitmap_font", "sealed_pair", "device_tree_patch"]
crates = ["uefi_loader", "serial_console"]

[[exception]]
date = 2026-09-27
member = "serial_console"
crate = "job_mix"
reason = "the board console runs the job mix to prove a board boots; the mix is a fixture a release image should not carry"
