# cargo-mutants configuration (milestone 85). Read automatically by `cargo mutants`; driven here by
# script/mutation. The tool version is pinned in .cargo-mutants-version, the same discipline as
# .cargo-deny-version and .cargo-fuzz-version. Config, not a code dependency (DECISIONS §46): nothing
# in the tree links against cargo-mutants, it only reads our source and runs our tests.
#
# The host-excluded set is NOT recorded here. Every workspace crate that reaches
# crates/user_mode_runtime cannot build for the host, and script/mutation derives that set from
# helpers/host-excluded-crates.sh and passes it to cargo-mutants on the command line, the same
# derivation script/coverage and script/lint's clippy passes consume. What is listed below is
# judgment, each entry with its reason, and it stays limited to things that physically cannot be
# mutated here, never to things that are merely untested.

exclude_globs = [
    # `kernel` itself: no_std, QEMU-only, bare metal, and it takes no dependency on
    # `crates/user_mode_runtime`, so the derivation's dependency-graph walk cannot name it. It does
    # not compile for the host at all.
    "kernel/**",

    # **The system-test image** (milestone 609 (the system tests leave the kernel crate), 2026-09-27
    # UTC). A bare-metal `[[bin]]` that links the kernel as a library, so it is `kernel/**` by
    # another path: its one mutant (`system_tests_main`) put a host `cargo test -p system_tests` in
    # one shard's baseline, which failed with "unwinding panics are not supported without std" and
    # turned the whole weekly run red from 2026-09-28 (milestone 636 (the scheduled workflows are
    # failing)). Like `kernel`, it reaches `kernel` rather than `user_mode_runtime`, so the
    # derivation cannot name it. What proves it is `cargo xtask test`, which boots it on three ISAs.
    "system_tests/**",

    # **The UEFI application itself, and it is here for a THIRD reason** neither of the two above:
    # not a crate that fails to compile for the host, and not a judgement call, but a `[[bin]]`
    # target whose `required-features = ["uefi"]` means `cargo build --workspace` and `cargo test`
    # never put it in the build graph at all. `uefi_loader`'s LIBRARY half is host-tested and stays
    # mutated; only this one file is out of reach, and it is out of reach by construction (it calls
    # firmware and leaves long mode, which is why the library exists beside it).
    #
    # The number this fixes is the whole crate's. Of 189 mutants, 154 are in this file, and every
    # one came back MISSED in "0s build + 0s test" because nothing rebuilt: cargo-mutants edits a
    # source file no compilation reads. That is what scored the crate 3-caught-of-20 in the first
    # published sample and made `uefi_loader` one of the two crates blamed for the tree's score
    # falling from 92.4%. It is the `system_initializer` arithmetic (milestone 244) wearing
    # different clothes, and it is worth naming the difference: that one was unreachable through the
    # dependency graph, so `script/lint`'s bare-metal gate derives it. This one is unreachable
    # through `required-features`, which that gate cannot see, so it has a gate of its own beside
    # it, deriving this entry from `cargo metadata` rather than asking anyone to remember it.
    #
    # What proves this file is `cargo xtask uefi-boot` under OVMF, on `script/test`'s own leg.
    # Excluding it here does not make it proved; see notes/mutation-testing.md for the split.
    "uefi_loader/src/main.rs",
    # And the modules `main.rs` declares, which are the same unbuilt target in other files. Found
    # 2026-09-24: the entry above covered the root only, so `src/arch/` scored 132 of the crate's
    # 182 MISSED at the 2026-09-21 census, every one in a file no host build compiles. `script/lint`
    # now walks the target's module tree, so a new `mod` here fails the gate until it is listed.
    "uefi_loader/src/arch/**",
    "uefi_loader/src/boot_services.rs",
    "uefi_loader/src/chooser.rs",
    "uefi_loader/src/console.rs",
    "uefi_loader/src/loading.rs",
    "uefi_loader/src/placement.rs",

    # **`stick_maker`'s host half and its entry point**, mirroring `script/coverage`'s exemption of
    # the same two paths for the same reason (the stick program, 2026-09-19). `src/host/` runs
    # `diskutil`, `sfdisk`, `mkfs.vfat` and `mount`, or four `kernel32` calls, against a real disk,
    # and the Linux arm erases a whole block device as root; each arm is `#[cfg]`-selected per host
    # OS, so on the Linux census runner the macOS and Windows arms are not even compiled and scored
    # MISSED in "0s build + 0s test". Every decision the program makes is in a file that stays
    # mutated (`disk.rs`, `cli.rs` against a fake host, and the per-host parsers). What proves the
    # host half is `scripts/stick-maker-proof.sh` and `.github/workflows/stick-maker-hosts.yml`,
    # which run each arm on its own host. 61 of the crate's 101 MISSED at the 2026-09-21 census were
    # these two paths; found by milestone 326 (turn a mutation score upward), 2026-09-24.
    "crates/stick_maker/src/host/**",
    "crates/stick_maker/src/main.rs",
    # **A Kani harness module that is its own FILE**, which the `proofs::` entry below cannot reach.
    # cargo-mutants names a mutant by the path of the function WITHIN the file it parsed, so an
    # inline `#[cfg(kani)] mod proofs { .. }` yields `proofs::a_fire_is_strictly_in_the_future` and
    # a `#[cfg(kani)] mod proofs;` in its own file yields `a_fire_is_strictly_in_the_future` with no
    # prefix at all. Same `cfg`, same unreachability under `cargo test`, and the module-path regex
    # silently misses it. Found by milestone 326 (nobody has been assigned to turn a mutation score
    # upward) triaging the 2026-09-14 census, where 36 of `timetable`'s 48 reported survivors were
    # this crate's proof harnesses rather than its code,
    # which is the whole reason it read 73.6%. Glob rather than regex, because the file layout is
    # the thing that differs; `verification.rs` is listed with it so the sibling convention cannot
    # arrive unexcluded. The `**` after `src/` reaches a submodule's harness file, such as
    # `machine_discovery`'s `src/x86_64/verification.rs`.
    "**/src/**/proofs.rs",
    "**/src/**/verification.rs",

    # Host tooling, not shipped code. xtask drives cargo and QEMU; its "tests" are the gates it
    # runs, so a mutant here is caught by CI going red, not by a unit suite. Mutating it would
    # spend hours measuring the build system instead of the OS.
    "xtask/**",
]

# Matched against mutant names ("replace X with Y in path::fn"). Entries arrive with reasons or
# not at all.
exclude_re = [
    # The Kani harness modules: 18 `mod verification` blocks and 3 `mod proofs` (credential_contract,
    # filesystem_contract, regions), every one behind `#[cfg(kani)]`, so `cargo test` never compiles them: a
    # mutant there always "survives", and the first full run reported dozens of exactly that (every
    # one of calendar's harnesses, mutated to `()`, "missed"). Their checker is script/verify, not
    # the test suite, and mutating the proof rather than the code under proof measures nothing this
    # baseline is for. Both names are matched as module paths, which nothing else in the tree uses.
    "verification::",
    "proofs::",

    # The loom models: 6 `mod interleavings` blocks (clock_contract, memory_corruption_canary_gate,
    # memory_regions, spin_lock, thread_wake_handshake, work_steal_slot), every one behind
    # `#[cfg(all(test, loom))]`, so `cargo test` never compiles them and a mutant there always
    # "survives". Exactly the case above wearing different clothes, and found the same way:
    # milestone 326's triage of the 2026-09-14 census reported `Reached::mark` and `Reached::assert`
    # missed in `memory_regions`, which are the non-vacuity flags of a harness the test suite cannot
    # see. Their checker is `script/interleaving-check`, not `cargo test`, and mutating the model
    # rather than the code under model measures nothing this baseline is for. Matched as a module
    # path, which nothing else in the tree uses.
    "interleavings::",

    # **Helper functions in a host test module, which cargo-mutants skips everywhere else in this
    # tree and does not skip here.** The tool already declines to mutate anything under a plain
    # `#[cfg(test)]`, so a helper like `calendar`'s `fields` yields no mutant at all (measured:
    # `cargo mutants -p calendar --list` has 395 entries and none of them is `tests::*`). The six
    # loom crates write their host module as `#[cfg(all(test, not(loom)))]` instead, because the
    # loom model is the other half of the same `test` cfg, and the tool's skip does not recognise
    # the compound form: `memory_corruption_canary_gate`'s deadline helper came back MISSED for
    # exactly that reason. Found by milestone 326 triaging the 2026-09-14 census.
    #
    # A mutant of a test helper is never a defect in the shipped system, which is a stronger
    # argument than the two entries above rather than a weaker one: `verification::` and
    # `interleavings::` at least name code with a checker of its own, and this names code that is
    # not compiled into anything. Matched as a module path, which nothing outside a test module
    # uses.
    "tests::",
]
