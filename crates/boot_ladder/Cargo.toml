[package]
name = "boot_ladder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The fixed heads of the lines a kernel and its shell print while booting, and the self-test verdict they share, as code both the printer and the reader use"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "boot", "console", "serial"]
categories = ["no-std", "embedded"]
publish = false     # set to `true` only in the release that publishes

# The lines a boot prints on a console, as the exact bytes: each head is a system's name followed
# by a fixed shape. The program that prints a line and the programs that read it share this crate,
# so they cannot disagree. `no_std`, no dependencies, so a kernel can always compile it.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
