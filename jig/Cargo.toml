# `jig`, the package manager (milestone 809 (the package client becomes a program)): a `std`
# program built for the `*-unknown-nife` targets with `-Zbuild-std` against the patched rust-src
# (patches/std-nife; `cargo xtask std-src`), as `std_exerciser` is, and for that crate's reason not
# a member of the main workspace: it builds under the farm's toolchain with flags the workspace's
# crates must never inherit. `cargo xtask std-exerciser` builds it after that workspace. Since
# milestone 801 (packages over the internet) it links the TLS graph, so it builds where that graph
# does (`target/tls-graph`, with `cryptography_exerciser/.cargo/config.toml`'s flags), and the
# standard library under it is compiled once for the TLS programs rather than once more.
#
# Name: ratified 2026-10-06 (calef): the guide that makes flat-pack assembly come out the same
# every time. The record is `grant_plan::Prog::Jig`'s doc.

[package]
name = "jig"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

# **Only the public contracts** (milestone 809's "other package managers can emerge": a second
# manager on these crates can do what `jig` can). The request wire and the manifest
# (`grant_plan`'s `spawnproto`), the package format and the catalog's lookup rule
# (`package_archive`), how a name travels on that wire (`filesystem_contract::grant`), the plain
# HTTP reader the progenitor used to run (`http_response`, which left the progenitor's graph in the
# same change), where the package source answers (`socket_contract::fixture`), the `std` layout's
# pages (`std_runtime_contract`), and the syscalls a `std` program has no binding for
# (`user_mode_runtime`, `abi`, `address_space_map`).
[dependencies]
abi = { path = "../crates/abi" }
address_space_map = { path = "../crates/address_space_map" }
filesystem_contract = { path = "../crates/filesystem_contract" }
grant_plan = { path = "../crates/grant_plan" }
http_response = { path = "../crates/http_response" }
capability_manifest_note = { path = "../crates/capability_manifest_note" }
# Finding each program's manifest note in a package, to list what it asks the owner for at install
# (milestone 892 (a std program at the prompt holds the network and a resolver)).
elf = { path = "../crates/elf" }
package_archive = { path = "../crates/package_archive" }
# What is installed, for `list -u`: the installed-programs table's reader and where it lives.
installed_programs = { path = "../crates/installed_programs" }
socket_contract = { path = "../crates/socket_contract" }
std_runtime_contract = { path = "../crates/std_runtime_contract" }
user_mode_runtime = { path = "../crates/user_mode_runtime" }
# **The index over HTTPS** (milestone 801 (packages over the internet)): the index's reader and the
# image's sources (`package_index`, in-tree and `no_std`), the pinned TLS client §196 (nife carries
# TLS) ruled, and the `getrandom` hooks over the entropy service. The same graph
# `pinned_tls_exerciser` links, built with `cryptography_exerciser/.cargo/config.toml`'s flags by
# `cargo xtask std-exerciser`, which passes that file with `--config` rather than keep a copy here.
package_index = { path = "../crates/package_index" }
pinned_tls_client = { path = "../pinned_tls_client" }
entropy_backend = { path = "../entropy_backend" }
# `force-soft` is a feature rather than a cfg, so a binary that links the provider has to name it:
# `pinned_tls_exerciser/Cargo.toml` says why.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

# `std_exerciser`'s profile, for its reasons: overflow checks in release (calef, 2026-10-04 (UTC),
# notes/overflow-checks.md), a small deterministic image, no unwinding.
[profile.release]
overflow-checks = true
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "abort"

[profile.dev]
panic = "abort"

# talc 5.1.1 with upstream's fit-check fix, SFBdragon/talc#57, vendored until a release carries it
# (calef, 2026-10-21 UTC, on #2498). Every workspace whose graph holds talc patches it the same way,
# so no build links the unpatched crate. vendor/README.md has the drop condition.
[patch.crates-io]
talc = { path = "../vendor/talc" }
