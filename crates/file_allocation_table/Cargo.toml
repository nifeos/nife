[package]
name = "file_allocation_table"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "FAT32 volume layout as pure computation: lays out an EFI system partition, with Kani-proven long file name entries"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "fat32", "filesystem", "kani"]
categories = ["no-std", "filesystem"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# Enough of FAT32 (Microsoft's "FAT: General Overview of On-Disk Format", version 1.03) to create
# an EFI system partition holding one boot file, as pure computation. No I/O of any kind: this
# crate says what every sector of the volume must contain and the caller writes them. So it
# compiles for the host and its tests run in milliseconds.

[dependencies]

# The test oracle and nothing else: rust-fatfs's main line, republished on crates.io as `lamfat`
# (MIT). Pinned to one version, and its checksum is in Cargo.lock. It never builds into anything
# that ships; deny.toml refuses it to every other crate.
[dev-dependencies]
lamfat = "=0.4.3"

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
