[package]
name = "intrusive_queue"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An allocation-free intrusive first in, first out queue whose push takes a token that proves the node is on no other queue"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "intrusive", "queue", "linked-list", "kani"]
categories = ["no-std", "no-std::no-alloc", "data-structures"]
documentation = "https://docs.rs/intrusive_queue"
publish = false     # set to true only in the release that publishes

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
