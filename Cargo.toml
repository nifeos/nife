# The vendored RedoxFS engine (vendor/redoxfs) and the host tool that wraps it (tools/redoxfs_host)
# are deliberately kept OUT of this workspace: each is its own workspace root (an empty [workspace]
# in its Cargo.toml) and both are excluded here. This is what keeps our `-D warnings` clippy gate
# and `cargo fmt` off upstream code we do not own, and keeps redoxfs's default features (which pull
# `fuser`, whose build script panics on macOS) out of our builds. They are still gated, just on
# their own: script/lint, script/fmt, and cargo xtask test each drive them by --manifest-path. See
# vendor/README.md. Nothing in the kernel depends on redoxfs yet; that is milestone 32 phase 2.
#
# `vendor/talc`, the heap algorithm carried with an upstream fix, is excluded for the same first
# reason. It is no workspace root of its own: it builds only as the `[patch.crates-io]` below.
#
# `fuzz` is excluded for a different reason (milestone 42): its targets link libFuzzer's `main`, are
# built with a sanitizer and `-Zbuild-std`, and are meaningless to `cargo build`. It is its own
# workspace root as well, so this entry is belt and braces; it is here so a reader of this list sees
# every directory in the tree that is a package and is not ours to build in the ordinary way.
exclude = [
    "vendor/redoxfs",
    "vendor/talc",
    "tools/redoxfs_host",
    "fuzz",
]

# Shared package metadata. Each member opts in with `license.workspace = true`, so the
# dual license is declared in exactly one place. MIT OR Apache-2.0 is the Rust-ecosystem
# convention: it lets downstream users pick whichever fits their project, and the Apache
# half adds an explicit patent grant the bare MIT license lacks. See LICENSE-MIT and
# LICENSE-APACHE.
[workspace.package]
license = "MIT OR Apache-2.0"

# Lint policy, in ONE place (milestone 68). Before this, 19 of 39 crates carried a `[lints.rust]`
# table and every one of them said the same thing (`unexpected_cfgs` for `cfg(kani)`), while the
# other 20 said nothing, so whether a crate was linted at all depended on whether someone had
# remembered. A member opts in with `[lints] workspace = true`, which is one line and cannot drift.
#
# These are WARNINGS here and errors in practice: script/lint runs `-D warnings`. So adding a lint
# to this table is a decision to fix every existing violation first, which is the same ratchet
# discipline DECISIONS §38 applies to dead code. Nothing goes in this table "to see what it finds".
[workspace.lints.rust]
# `cfg(kani)` is set by the model checker, not by cargo, so without this every Kani-gated module is
# an "unexpected cfg" warning. Was duplicated across 19 crates; now stated once.
#
# `cfg(loom)` is the same shape, one tool along (milestone 80): it is set by
# `script/interleaving-check` and by nothing else, so without this line every `#[cfg(loom)]` in
# `crates/work_steal_slot` is an "unexpected cfg" warning in the ordinary lint pass. Listing it here
# rather than in that crate is the point of milestone 68's one-table rule.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
# The lint that composes with `undocumented_unsafe_blocks` below (milestone 82). An `unsafe fn`
# body is one implicit unsafe block, so a function with three unsafe operations carries three
# invariants under a single signature, and the clippy lint cannot see any of them: it fires on
# blocks, and there are no blocks. This one takes the implicitness away. Each interior operation
# gets its own `unsafe {}`, and each block then owes the SAFETY comment the other lint enforces.
# Together they buy the property this kernel is actually after: every unsafe operation sits next to
# the written invariant that makes it sound, whether or not its enclosing fn is unsafe.
#
# **It found nothing, and that is the record rather than a boast.** All 33 `unsafe fn`s in
# `kernel/` and `crates/` were already clean, in every configuration `script/lint` builds, before
# this line existed. The reason is that all 49 packages we own are **edition 2024**, where this
# lint is warn-by-default as part of `rust_2024_compatibility`, and
# `script/lint` runs `-D warnings`. So it has been a hard gate here since the edition bump, and was
# stated nowhere. The milestone's premise, a bounded burn-down of 33 functions, was wrong.
#
# The line is worth its one row for the two things the edition default does not give. A reader of
# the lint policy can see the rule, which is the whole reason milestone 68 put lint policy in one
# place. And a package at an older edition cannot quietly escape it. That is not hypothetical: the
# fiftieth package in the tree, `vendor/redoxfs`, is edition 2021, and an external crate pulled into
# the workspace arrives at whatever edition its author chose.
#
# See notes/unsafe-obligations.md for the survey, and for the three things neither lint can reach.
unsafe_op_in_unsafe_fn = "warn"
# Workspace-wide as of DECISIONS §107 (2026-08-22), a deliberate, recorded exception to §61's own
# rule against adding a lint before every existing violation is fixed: the worklist had shrunk from
# 32 crates to 7 by the time this landed, so the cost is 7 `#[allow(missing_docs)]` lines, not an
# open-ended commitment. Those remaining (`machine_discovery`, `pci`,
# `globally_unique_identifier_partition_table`, `grant_plan`, `compositor`;
# `multicast_dns_protocol` was retired on 2026-09-15) carry the allow explicitly, citing their own item count; see notes/doc-coverage.md
# for the tracked worklist.
missing_docs = "warn"

[workspace.lints.clippy]
# --- The one this project most obviously wanted. Every `unsafe` block states the invariant that
# makes it sound, in a `// SAFETY:` comment the compiler will not let you forget. 205 blocks were
# missing one when milestone 68 started, against ~600 that already had one, so this is a ratchet in
# §38's shape rather than a new convention.
#
# It is worth the noise it makes because of what this kernel IS: `unsafe` is where a capability
# system's guarantees are actually kept or broken, and a claim nobody wrote down is a claim nobody
# can check. The counterpart rule, learned the hard way in this milestone, is that a comment here is
# a load-bearing assertion and not a formality: a generated pass produced one that was FALSE at its
# first site, and was reverted. See DECISIONS §61's BUGS note.
undocumented_unsafe_blocks = "warn"
# --- The pointer casts. Both are about a raw pointer being reinterpreted, which in a kernel is
# how a real fault gets built: `cast_ptr_alignment` catches a `*const u8` becoming a `*const u64`
# that the hardware will then fault on, and `ptr_as_ptr` forces `.cast()` so a constness change
# cannot ride along invisibly inside an `as`.
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"

# DELIBERATELY ABSENT: `cast_possible_truncation`.
#
# It was enabled first and dropped on the measurement, which is why it is recorded here rather than
# simply left out. The case for it is real: this kernel does address arithmetic, and a u64 physical
# address narrowed to u32 by an implicit `as` produces a plausible wrong address rather than an
# error.
#
# The tree says otherwise. Of 497 hits, **199 are `u64`/`i64` to `usize`**, warned about because
# they "may truncate on targets with 32-bit wide pointers". This project has no such target and will
# not have one: §19 names aarch64, riscv64 and x86_64, and all three are 64-bit. So more than half
# the lint's output is about a platform that does not exist here, and clippy cannot be told that
# `usize` is 64 bits for us.
#
# The remaining ~300 are genuine narrowings, and a lint that can only reach them behind 199 false
# ones is a lint that trains a reader to skim. If the fixed-width half is ever worth gating on its
# own, the shape would be `try_from` at the sites that matter, not a blanket the whole tree has to
# `#[allow]` its way out of.

# --- Readability. Both have exactly one defensible rendering, so leaving them to taste just means
# the tree carries both spellings. `manual_let_else` is the one that changes how code reads rather
# than how it looks: a four-line `match` whose only job is to bind or bail becomes one line that
# says so.
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"

# DELIBERATELY ABSENT: `items_after_statements`.
#
# The third lint enabled and then dropped on the evidence. The argument for it is that a `fn` or
# `const` declared halfway down a body reads as executable code on first pass and is not.
#
# All 43 hits in this tree are the same shape, and it is a shape this codebase chose on purpose:
#
#     // `aarch64_cpu` gives CNTKCTL_EL1 no named fields, so set the bit by hand: EL0VCTEN is bit 1.
#     const EL0VCTEN: u64 = 1 << 1;
#     CNTKCTL_EL1.set(CNTKCTL_EL1.get() | EL0VCTEN);
#
# The constant sits beside its use, under the comment that explains it. Obeying the lint would hoist
# all 43 to the tops of their functions, separating each from the paragraph that says what it is and
# piling unrelated constants where a reader looks for the function's first action. That trades a
# real explanation for a formal rule, and this tree's whole commenting convention (CLAUDE.md) is
# built on keeping the constraint next to the code it constrains.

# --- Docs. This tree leans unusually hard on rustdoc (CLAUDE.md's FreeBSD standard), and
# `doc_markdown` catches the failure that makes docs look careless: an identifier written as bare
# prose where it should be `code`, which rustdoc then renders as an English word.
doc_markdown = "warn"

# The measured-boot hash is compiled optimized even in a debug build (milestone 22 phase B.1). The
# progenitor is a 1.2 MB ELF and the kernel hashes it before every boot, including six times per
# aarch64 test run; an unoptimized SHA-256 makes that a visible tax under TCG for no benefit, since
# the crate is pure arithmetic with nothing a debugger would want to step through. Its correctness
# is pinned by host tests against the published FIPS vectors, so the optimized build is not less
# trustworthy.
[profile.dev.package.measured_boot]
opt-level = 2

# Same reason, different arithmetic (milestone 51 lane C). `network_time_protocol`'s nanosecond round trip is
# verified by running it on every one of the 10^9 values in its domain, which is a complete proof and
# takes 0.6 s optimised. Unoptimised it is a minute of nothing, for a crate that is pure fixed-point
# arithmetic with nothing a debugger would want to step through. See the test's own comment for why
# exhaustion beats a bounded solver run here.
[profile.dev.package.network_time_protocol]
opt-level = 2

# Same reason again (milestone 57). `globally_unique_identifier_partition_table`'s mutation tests
# are exhaustive rather than sampled: every byte position in a real header block and a real entry
# array, crossed with every value that byte could have held, must be rejected. That is 460,000 table
# validations, each recomputing a CRC-32, and unoptimised it is a minute of nothing for a crate that
# is byte shuffling and one polynomial. See the tests' own comments for why exhaustion beats a
# bounded solver run on these two properties.
[profile.dev.package.globally_unique_identifier_partition_table]
opt-level = 2

# The credential KDF, compiled optimized even in a debug build (milestone 56, the credential half).
# Exactly the reasoning `measured_boot` records above, one order of magnitude louder: Argon2id at the
# wired cost (4 MiB, three passes) is **5 ms optimised and 67 ms not**, per derivation, on this
# machine, and every one of those milliseconds is multiplied by TCG when the credential service runs
# under QEMU. Argon2 is memory-hard on purpose, so an unoptimised build does not make an attacker's
# job harder, only ours; and the honest cost parameter to publish is one measured against a build
# that is not throwing away an order of magnitude for no reason. Correctness is pinned by
# `crates/credentialer`'s known-answer tests against RFC 9106 and the reference implementation's
# vectors, so the optimised build is not the less trustworthy one. `blake2` and `digest` are
# argon2's own arithmetic and carry the same argument.
[profile.dev.package.credentialer]
opt-level = 2
[profile.dev.package.argon2]
opt-level = 2
[profile.dev.package.blake2]
opt-level = 2
[profile.dev.package.digest]
opt-level = 2

# The screen console, optimised even in a debug build (2026-10-04, #1645), for `measured_boot`'s
# reason above with TCG as the multiplier. Its scroll became a redraw of changed cells from RAM, so
# a full screen of text no longer moves by one optimised `memmove` but by glyph rows built in this
# crate. Unoptimised, the OVMF kernel suite (`cargo xtask uefi-test`, whose kernel prints every test
# onto a 1280x800 screen) went from under 30 s to over 60 s against a 90 s bound, and CI's run of
# it timed out. `bitmap_font` is the lookup inside the loop.
[profile.dev.package.screen_console]
opt-level = 2
[profile.dev.package.bitmap_font]
opt-level = 2

# The terminal's per-pixel path, optimised even in a debug build, for the screen console's reason
# above and one of its own. The kernel's display tests run `Vt::pixel` for every one of the
# 1120x624 scanout's 698,880 pixels per comparison, and unoptimised that took CI's riscv64
# CPU-matrix shard past its 20-minute budget. And the display terminal in a compositor window runs
# on one 4 KiB stack page, which the unoptimised `Vt::pixel` -> `glyph_atlas::blend` -> `to_srgb`
# frames overflowed while a window scrolled (milestone 142 (a text display good enough that people
# use it instead of a GUI), 2026-10-19).
[profile.dev.package.glyph_atlas]
opt-level = 2
[profile.dev.package.video_terminal]
opt-level = 2
# The compositor's and the framebuffer contract's per-pixel functions, for the same reason: the
# compositor tests compute `compositor::expected_screen_pixel` and the pattern tests
# `graphics_contract::pixel` for every pixel of the scanout.
[profile.dev.package.compositor]
opt-level = 2
[profile.dev.package.graphics_contract]
opt-level = 2

# The shell's planner, optimised even in a debug build (milestone 946 (a granted file name can be
# longer than sixteen bytes)). An `Endowment` carries four file grants, each holding a name of up
# to 252 bytes, and an unoptimised build keeps a copy of one in a frame for every `?` and every
# by-value argument, so `plan_against_with` alone took 16 KiB of the shell's stack and the first
# pipeline of a boot ran off its bottom. Optimised, those copies collapse, as they do in a release
# build, and that frame is 5.4 KiB. Measured from the debug `swish`'s disassembly; the numbers are in
# notes/glob-grant/xargs.md ("The bytes a set carries").
[profile.dev.package.grant_plan]
opt-level = 2
# The timetable, for the planner's reason: it holds an `Endowment` per entry, and a replacement
# holds two plans at once, so its debug frames grew by the same file grants and ran
# `login_user_schedule_tests`'s timetable off its 48-page stack in `Registry::register`.
[profile.dev.package.timetable]
opt-level = 2

# Overflow checks in release, ruled by calef 2026-10-04 (UTC) (notes/overflow-checks.md, option A).
# The shipped build now means by `a + b` what every tested build means: an overflow halts rather
# than wraps into a quiet wrong answer. Where a hot path wants a wrap, it says so at the site with
# `wrapping_*` and a reason.
# smoltcp, optimized even in a debug build (milestone 53 (the board's own peripherals: network and
# storage on real silicon)). `script/board-image` packs debug programs (milestone 797 (release
# userspace in board images)), so `net_stack` on radon runs smoltcp unoptimized: a checksum, a
# segment's trip through the assembler and the ring buffer, per frame, at opt-level 0. On QEMU's
# `e1000e` with debug programs this alone moved the drain from 22.9 to 70.3 Mbit/s once the copies
# were bulk (notes/designware-ethernet/the-receive-rate.md has the table). It is a third-party
# crate nobody here steps through, and no job-mix or soak program links it, so no radon baseline
# that 797 guards moves.
[profile.dev.package.smoltcp]
opt-level = 2

[profile.release]
overflow-checks = true

# Note: we deliberately do NOT set `panic = "abort"` here. The bare-metal target
# has abort baked in already, and setting it workspace-wide would break `cargo test`
# for the host-side crates we plan to add (DECISIONS §7).

# talc 5.1.1 with upstream's fit-check fix, SFBdragon/talc#57, vendored until a release carries it
# (calef, 2026-10-21 UTC, on #2498). Every workspace whose graph holds talc patches it the same way,
# so no build links the unpatched crate. vendor/README.md has the drop condition.
[patch.crates-io]
talc = { path = "vendor/talc" }
