# nife-libc: nife's C library, its errno mapping, and the relibc code it is seeded from.
#
# Milestone 835 (a C library, stage 1: files, clock and memory). `sdk`, as the `std` runtime is: a
# C program links it on a developer's machine, and what ships is the program. The library is
# seeded from relibc, vendored under `vendor/relibc/`, and §265 (a C library started from relibc,
# whose Rust platform layer holds the capabilities) carries that provenance. The kind, home and
# membership are provisional; the format is helpers/packages.py's header.
#
# Name: ratified 2026-10-28 (calef, relayed by the maintainer, pull request #2872). The member
# crates keep their names, `c_library` and `c_library_errno`; `c_library`'s own name comes up at
# its first publication, under milestone 857 (crates released on their own, and proofs offered to
# the projects that already exist)'s one-crate-at-a-time review.

name = "nife-libc"
kind = "sdk"
home = { repo = "nife-libc", status = "provisional" }
crates = ["c_library", "c_library_errno"]
paths = ["vendor/relibc/"]
