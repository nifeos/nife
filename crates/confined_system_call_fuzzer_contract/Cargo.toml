[package]
name = "confined_system_call_fuzzer_contract"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# What the confined system call fuzzer and the kernel test that conducts it agree on (milestone 779
# (fuzz the surface a confined process can reach), provisional): the slot each grant lands in, the
# two words the conductor sends, and the layout of the page the fuzzer reports its last call on.
# Two binaries agree on these, so they are a crate (AGENTS.md rule 7). Name: provisional.

[lints]
workspace = true

[dependencies]
moho_abi = { version = "0.1.0", git = "https://github.com/nifeos/moho_abi", rev = "c8d556ec5ca7e567df529368c7dd24943423ab74" }
address_space_layout = { version = "0.1.0", git = "https://github.com/partsfoundry/address_space_layout", rev = "02d497b62915c1fb133ef1de6e76598fa51e67fe" }
