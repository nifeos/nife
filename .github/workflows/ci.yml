      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: it was for a scope check here that the gate's prose classifier replaced
          # (lane/docs-only-ci, 2026-10-05). Kept rather than dropped untested.
          fetch-depth: 0

      - name: Install the pinned toolchain
        run: helpers/rustup-retry.sh toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # Measures the pure-logic host crates only; the kernel/user crates run under QEMU, out of
      # reach of host instrumentation. Gates on the 80%-per-file line-coverage floor (the floor
      # lives in script/coverage, next to the check itself); the report is still published below.
      - run: helpers/hang_evidence.py run -- script/ci-build coverage
      - name: Publish the summary to the run
        run: |
