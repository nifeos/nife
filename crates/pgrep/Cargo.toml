[package]
name = "pgrep"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# Milestone 126's second view-stratum program, and only the filter: a survey and a selector in, a
# list of tids out. It walks nothing itself, because `crates/ps` already walks a domain and a second
# cursor loop would be a second thing to keep correct. No system call, no IO, no allocation. See
# `nifeos/record:notes/process-view.md`.

[dependencies]
moho_abi = { version = "0.1.0", git = "https://github.com/nifeos/moho_abi", rev = "3492929db274b5c4b9eddf60ea26c5ea7a892f65" }
byte_glob = { version = "0.1.0", git = "https://github.com/partsfoundry/byte_glob", rev = "f5dae9092130be6d66f176d2e1942a4c36686818" }
ps = { version = "0.1.0", path = "../ps" }

[lints]
workspace = true
