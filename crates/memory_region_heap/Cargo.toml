[package]
name = "memory_region_heap"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The host unit tests drive the growth and wiring logic through a fake page source, so no syscall
# runs. Bare-metal programs reach the default page source through user_mode_runtime's syscalls, so
# there are no bench or doctest targets.
[lib]
bench = false
doctest = false

[lints]
workspace = true

[dependencies]
abi = { version = "0.1.0", path = "../abi" }
# The heap's default base is the address-space map's heap band.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
# The heap algorithm, with no features: `counters` and the rest stay off. Every nife workspace's
# `[patch.crates-io]` builds it from vendor/talc, which carries upstream's fix SFBdragon/talc#57
# until a release does (vendor/README.md). Outside nife the crate builds crates.io's 5.1.1 unpatched.
talc = { version = "5.1.1", default-features = false }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
