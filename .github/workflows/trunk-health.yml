name: trunk health

# Observed failing: 2026-10-02, run 37072842858: red with `main is red and nobody is assigned to
#   it`, three cadences having never succeeded. See notes/observed-failing.md.

# **The trunk watcher, moved off a laptop** (the `who-took-the-step` proposal, approved by calef
# 2026-09-23). Same move and same reasons as `merge-drain.yml`, which carries the tested premise and
# the cadence BUGS entry; only what is specific to this watcher is written here.
#
# **This is the half of `helpers/trunk-health.sh` that could move.** That script had a second watch
# folded into it on 2026-09-23, `helpers/at-risk-check.sh`, which reads this machine's own worktrees
# and their `git status`. A runner has no lane worktrees, so running it here would report nothing
# forever while the real hazard sat on somebody's laptop unwatched. The fold was undone rather than
# carried along: the at-risk watch stays per-developer under its own `launchd` job, and
# notes/merge-queue.md has the plist and the retirement commands.
#
# **Why this job fails when the trunk is red, rather than only printing.** On a laptop the script
# spoke on the transition to red and stayed quiet after, because a trunk broken for an hour is one
# fact and not twenty-four; the reader was a person watching a log. Here the reader is the Actions
# run list, and a printed line in a green run is a line nobody sees. Exiting non-zero turns a red
# trunk into a red workflow, which GitHub notifies on and which shows in the tab next to every other
# red thing. The script itself is unchanged and still exits 0: `--once` is a check anybody may run,
# and a check that exits 1 at people is a gate rather than a report.
#
# BUGS
#
#   - **Re-announced every five minutes, not only on the transition.** The dedupe the loop form did
#     needed state between polls, and a scheduled run has none. A trunk red for an hour is twelve
#     failed runs here. That is the honest cost of moving; the alternative was carrying a state file
#     in an artifact, which is more machinery than the fact is worth.
#   - **`schedule:` is a floor.** See `merge-drain.yml`'s BUGS: delayed under load, dropped at peak,
#     five minutes at best, and a gap in the run list never means "green".
#   - **A dead cadence only warns.** See the step's own comment: it is a standing condition rather
#     than a transient one, and failing on it every five minutes would drown the red-trunk signal
#     this job exists to carry.
#   - **An API failure warns and does not fail.** UNKNOWN and `cannot ask` rows annotate the run
#     (see the step's comment) and exit 0, so a rate limit does not turn into 288 red runs a day.
#   - **PENDING reads as healthy.** A tip whose checks are still running exits 0 here, because the
#     alternative is a red workflow every time anything merges. So this watcher is late by however
#     long CI takes, which it always was.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: trunk-health
  cancel-in-progress: false

permissions:
  contents: read
  # `actions: read` lets the stopped-watcher check read workflow state with this token, and
  # `issues: write` is its fallback for opening the issue (milestone 723). repeat_issue.py also
  # reads issues with this token, because the App token below holds no issues permission and
  # GitHub's search returns it no issues.
  actions: read
  issues: write

jobs:
  trunk:
    name: is main red
    # The App's secrets live in the `automation` environment (name provisional), whose deployment
    # branches are `main` only. A merge-group build runs on a `gh-readonly-queue/main/...` ref, which
    # is not `main`, so it cannot read them even if a pull request edits this workflow to name the
    # environment. Adopted by calef 2026-09-24 (options 2 and 3 of
    # design/roadmap/0588-a-merge-needs-a-review-no-fork-can-supply.md; the finding is 1 in
    # design/audit-reports/2026-09-24-new-trust-boundaries.md). The protection holds
    # since calef deleted the organisation-level copies of the two secrets on 2026-10-03 (UTC); an
    # org secret would have been visible to every job whatever its environment. Only jobs that mint the App token name it,
    # because each run of a job that does records a deployment.
    environment: automation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      # One ref is enough: this watcher reads `main`'s tip through `git ls-remote` and reads the
      # runs through `gh`. Nothing here walks another branch, which is what makes it cheaper than
      # the drain's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # **Says so when the merge queue ejects more than a fifth of what enters it** (milestone 724
      # (the merge queue reports its ejection share and its time to merge), provisional), for the
      # last two UTC days. A warning rather than a failure, for the dead-cadence reason in the step below: it is a
      # standing condition over a day, and failing every five minutes would drown the red-trunk
      # signal. `continue-on-error` so a GraphQL failure cannot turn the watcher red.
      - name: merge queue ejection share
        continue-on-error: true  # outcome: exception, a GraphQL failure must not turn a five-minute watcher red
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python3 helpers/merge_queue_share.py report

      - name: one pass
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          out=$(helpers/trunk-health.sh --once)
          printf '%s\n' "$out"
          # Hand the REPEAT rows to the issue sync below, before this step can exit on a red
          # trunk: a repeating failure and a red trunk are independent findings. CHURN and every
          # other row stay out here; repeat_issue.py re-checks the shape of what it reads.
          printf '%s\n' "$out" | grep ' REPEAT: ' > repeat-rows.txt || true
          case "$out" in
          *"main is RED"*)
            echo "::error::main is red and nobody is assigned to it"
            exit 1
            ;;
          esac
          # A dead cadence is the other thing this script reports, and it is a WARNING here rather
          # than a failure. A red trunk is transient and somebody fixes it within the hour; a dead
          # cadence is a standing condition, and on the day this was written two of them already
          # were. Failing on it would turn one open problem into 288 red runs a day, which is an
          # alarm that trains its reader to ignore the workflow, including on the days it is right
          # about the trunk. The annotation still shows on the run and in the Actions tab.
          case "$out" in
          *DEAD*|*"produced no result"*)
            echo "::warning::a scheduled workflow has stopped producing results (script/cadence-check)"
            ;;
          esac
          # A pass that could not ask is not a pass that found nothing. UNKNOWN (gh run list failed)
          # and `cannot ask` rows (repeat check, merge watchers, cadence) warn here beside DEAD, for
          # the same reason DEAD only warns: a rate limit is weather, and failing the job on it would
          # bury the red-trunk signal. A warning is loud where silence used to read as health.
          case "$out" in
          *"main: UNKNOWN"*|*"cannot ask"*)
            echo "::warning::trunk-health could not ask GitHub for part of this pass; absence of RED, DEAD or REPEAT rows is not health (helpers/trunk-health.sh)"
            ;;
          esac
          # A repeating failure is the other standing condition this script reports, and it warns
          # here rather than failing for the same reason a dead cadence does: failing every five
          # minutes would drown the red-trunk signal this job exists to carry. The row names the
          # workflow, the repeated line and the span of dates; helpers/trunk-health.sh's repeat
          # section carries the thresholds, and the step below gives the finding its home (one
          # open issue per workflow, milestone 422 (a cadence job whose healthy state is red)).
          case "$out" in
          *REPEAT:*|*CHURN:*)
            echo "::warning::a scheduled workflow keeps failing the same way (repeat check, helpers/trunk-health.sh)"
            ;;
          esac

      # **One issue per distinct repeat, the home ruled for it** (milestone 422 (a cadence job
      # whose healthy state is red, and nothing that notices it repeating), provisional). The
      # one-pass step above hands this the REPEAT rows; dedupe is by workflow name, the body
      # updates when the failing line or span drifts, and CHURN opens nothing. The close is the
      # audit lane's report pull request saying `Closes #N`, routed by audit-cadence.yml's step
      # summary; nothing here closes an issue. `always()` because a red trunk and a repeating
      # failure are independent findings, and continue-on-error for the reason the stopped-watcher
      # step below gives: a reporting failure must not turn the watcher red.
      - name: report a repeating failure
        if: always()
        continue-on-error: true  # outcome: exception, a reporting failure must not turn the watcher red; it warns
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WATCHER_FALLBACK_TOKEN: ${{ github.token }}
        run: |
          test -f repeat-rows.txt || exit 0
          python3 helpers/repeat_issue.py sync < repeat-rows.txt ||
            echo "::warning::repeat_issue.py sync failed; a repeating failure may be unreported"

      # **Reports a stopped merge watcher** (milestone 723 (a stopped merge watcher is reported within
      # three of its own intervals), provisional). Each of the two watchers runs this, so a stopped
      # one is reported by the other, and a running one closes its own issue. It opens the issue as
      # the App when the App may, and as `github-actions[bot]` when it may not
      # (`WATCHER_FALLBACK_TOKEN`); the log says which. `continue-on-error` because a reporting
      # failure must not turn the watcher red, but it prints a warning so it is not silent.
      - name: report a stopped merge watcher
        if: always()
        continue-on-error: true  # outcome: exception, a reporting failure must not turn the watcher red; it warns
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WATCHER_READ_TOKEN: ${{ github.token }}
          WATCHER_FALLBACK_TOKEN: ${{ github.token }}
        run: python3 helpers/watcher_watch.py sync || echo "::warning::watcher_watch.py sync failed; a stopped watcher may be unreported"
