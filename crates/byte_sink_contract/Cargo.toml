[package]
name = "byte_sink_contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One framing for write these bytes there: a message of up to sixteen bytes in three registers, with end of stream and a checked decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/byte_sink_contract"
readme = "README.md"
keywords = ["no-std", "framing", "protocol", "kani"]
categories = ["no-std", "encoding"]
publish = false     # stays until the release that publishes

# The one framing every "write these bytes there" destination speaks, so a terminal, a file and a
# pipe become substitutable in one capability slot. Pure logic, host-tested, no_std and
# dependency-free, so the writers, the sinks and the tests share one definition.

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
