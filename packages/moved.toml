# What has left this repository, and where it went: §201 (one roadmap until a citation has to
# cross) section 4's moved-things registry, the FreeBSD ports form (old, new, date, reason), one
# [[moved]] table per departure. Append-only: a departure is never edited or removed.
#
# `anchor` is the last partsfoundry/nife commit before the design record left. A bare code path in a
# record written before the move means that path at the anchor; text written after it names a path
# as `partsfoundry/<repo>:<path>`, resolved at basalt's pin.
#
# `old` is read the way `git filter-repo` reads a path: a directory names the files under it whose
# home in `packages/homes.toml` at the anchor was the record. The baselines under `design/`, the
# tool data under `notes/` and the notes about one crate alone stayed, as `packages/homes.toml`
# says. `record_commit` is the commit of partsfoundry/record whose files hold the same bytes as every
# moving path here at the anchor, which the removal pull request checked file by file.

