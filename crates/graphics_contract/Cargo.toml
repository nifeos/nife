[package]
name = "graphics_contract"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The framebuffer contract of milestone 29 (notes/framebuffer-contract.md): the geometry and pixel
# format of a shared frame, the small control protocol a client speaks to the GPU driver, and
# the test pattern plus its checksum. Pure logic, host-tested, no_std, so the driver, the client,
# and the kernel-side test share ONE definition and cannot drift. The same split `filesystem_contract` makes
# for the filesystem contract and `terminal_contract` for the terminal's.

[lints]
workspace = true

