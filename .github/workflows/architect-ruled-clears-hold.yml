name: architect ruled clears needs-architect

# Observed failing: 2026-10-06, run 37406519156: on this lane's own PR #1740, carrying both labels,
#   applying `architect-ruled` at 02:55:40Z left only `architect-ruled`. Green by design; the label
#   removal is the arm that carries the claim. See notes/observed-failing.md.

# `needs-architect` means "waiting on calef" and nothing else. A pull request an architect has
# already ruled on carried both labels, passed `architect-hold.yml` (which releases on
# `architect-ruled`) and was skipped by both labelers, yet still listed under
# `gh pr list --label needs-architect`, which is the architect's queue. On 2026-10-06 five of seven
# entries there were already ruled, and the maintainer cleared them by hand (a note-level fix, the
# floor of the ladder in AGENTS.md). This workflow is the gate that does it: applying
# `architect-ruled` removes `needs-architect`.
#
# Scope: only the `labeled` event for `architect-ruled`. It does not fight a person who adds
# `needs-architect` to an already-ruled pull request by hand (architect-ruled.sh records that as
# allowed; the hold check passes on the ruled label regardless). Nothing re-adds the label
# afterwards: architect-label.yml reads the live labels twice via helpers/architect-ruled.sh, and
# coe-architect-label.yml inlines the same live read before its write.
#
# Reads the LIVE labels, not the payload (#1712, 2026-10-05: the payload is a snapshot). Removing
# an absent label is a no-op, so the loop risk of #1378 and #1400 does not apply: this job removes
# `needs-architect` and nothing in the tree reacts to that removal by re-adding it.
#
# Deliberately `pull_request`, never `pull_request_target`, for the fork-safety reason
# architect-label.yml's header gives; a fork's read-only token just logs and exits. No checkout:
# the job needs no repository content. Name: provisional, 2026-10-06.
#
# **A released hold reruns the old red hold runs** (second job, lane/hold-rerun, 2026-10-06). Each
# label event starts a new `architect-hold.yml` run, but GitHub kept counting an older failed run on
# the same head against the pull request, so an armed one never entered the queue. #1766: run
# 37498758799 failed at 16:49:41Z on `needs-architect`, later runs on that SHA passed, and it sat
# out of the queue until a maintainer reran 37498758799 by hand at 19:02:09Z. #1786 is the same
# shape. The rule: when `architect-ruled` is added, or `needs-architect` or `held-by-lane` is
# removed, and no hold remains by architect-hold.yml's own test, rerun every failed or cancelled
# pull_request hold run on the current head. helpers/hold-rerun.sh holds the logic and the
# same-second-duplicate note (notes/merge-queue.md BUGS); helpers/hold-rerun-selftest.sh, run by
# script/lint, pins both it and this file's triggers. `actions: write` on the workflow's own token,
# as merge-drain.yml does for its one `gh run rerun`: the App's token cannot rerun a workflow.
#
# `unlabeled` now fires this workflow for every label removed, so the concurrency group keys on
# whether the event is a release. Unrelated events get a group of their own (their run id) and can
# never cancel a pending release run; two releases in a burst share a group, and the newer does the
# same work as the one it replaces.

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  pull-requests: write

concurrency:
  group: >-
    architect-ruled-clears-hold-${{ github.event.pull_request.number }}-${{
    ((github.event.action == 'labeled' && github.event.label.name == 'architect-ruled') ||
    (github.event.action == 'unlabeled' && (github.event.label.name == 'needs-architect' ||
    github.event.label.name == 'held-by-lane'))) && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  clear:
    name: remove needs-architect once architect-ruled is on
    if: github.event.action == 'labeled' && github.event.label.name == 'architect-ruled'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Remove needs-architect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels="$(gh api "repos/$REPO/issues/$PR_NUMBER" --jq '.labels[].name')" || {
            echo "ruled-clears: could not read labels of PR #$PR_NUMBER; not fatal." >&2
            exit 0
          }
          if ! printf '%s\n' "$labels" | grep -qx 'architect-ruled'; then
            echo "ruled-clears: architect-ruled is no longer on PR #$PR_NUMBER; leaving needs-architect." >&2
            exit 0
          fi
          if ! printf '%s\n' "$labels" | grep -qx 'needs-architect'; then
            echo "ruled-clears: PR #$PR_NUMBER has no needs-architect; nothing to do."
            exit 0
          fi
          if gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label needs-architect 2>&1; then
            echo "ruled-clears: removed needs-architect from PR #$PR_NUMBER (architect-ruled is on it)"
          else
            echo "ruled-clears: could not remove needs-architect from PR #$PR_NUMBER; not fatal." >&2
          fi

  rerun:
    name: rerun failed hold runs once the hold is released
    needs: clear
    # `always()` so a skipped `clear` (an `unlabeled` event) does not skip this job too.
    if: >-
      always() &&
      ((github.event.action == 'labeled' && github.event.label.name == 'architect-ruled') ||
      (github.event.action == 'unlabeled' && (github.event.label.name == 'needs-architect' ||
      github.event.label.name == 'held-by-lane')))
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: helpers
      - name: Rerun failed architect-hold runs on the current head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Exit 1 (a hold remains) and 2 (API unreadable) are logged, not fatal, like the job above.
        run: |
          helpers/hold-rerun.sh "$PR_NUMBER" "$REPO" || echo "hold-rerun: exit $? (see above); not fatal"
