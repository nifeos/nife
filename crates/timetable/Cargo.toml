[package]
name = "timetable"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The whole point of the crate. An entry's command is checked by **the same function the shell
# checks a prompt line with**, so "a scheduled entry is a grant" is one call rather than a second
# implementation that could drift. `version` is required beside `path`: cargo-deny reads a
# path-only dependency as a wildcard, and `user` depends on this crate.
grant_plan = { version = "0.1.0", path = "../grant_plan" }
# Civil-date arithmetic for calendar entries (G5): a day number to a year, month and weekday, and a
# month's length. The crate of milestone 51 (wall-clock time), already Kani-proved inverse over its range, rather than a
# second copy of Hinnant's algorithms here.
calendar = { version = "0.1.0", path = "../calendar" }
clock_contract = { version = "0.1.0", path = "../clock_contract" }
