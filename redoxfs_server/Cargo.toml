# The milestone-32 filesystem server. Its OWN workspace root (empty [workspace]), deliberately not a
# member of the nife workspace, for the same reason redoxfs_host and std_exerciser are: it depends
# on the vendored RedoxFS engine (vendor/redoxfs), which is its own workspace, and cargo forbids a
# member of one workspace from depending on an in-tree crate another workspace owns. Keeping it out
# also keeps our -D warnings clippy gate and cargo fmt off the vendored engine underneath it, while
# our own code here is still gated by --manifest-path (script/lint, script/fmt, cargo xtask test).
#
# The crate is host-testable and target-buildable from one source. `cargo test` (default features,
# `hosttest`) builds the sans-IO Server<D> core against std RedoxFS and a DiskMemory fixture, in
# milliseconds, no emulator. The EL0 binary (added under `--features el0 --no-default-features` for
# the bare targets) wraps that core in the IPC Disk and the serve loop. See notes/fs-server.md.
[workspace]

# Milestone 63 renamed the DIRECTORY from `fs-server/` to `fs_server/` to match the package on
# 2026-08-01. That package name itself was never put to calef and predated the `*_proto`/`*_server`
# habit being written down; it stood until milestone 140's decision doc pointed out it was wrong for
# a different reason (design/roadmap/0140-foreign-filesystems.md, "fs_server is misnamed, and the
# architecture is what makes it wrong"): this project is moving to one program per filesystem type,
# so this crate genuinely only ever will serve RedoxFS, and a generic `fs_server` name claims
# something a second filesystem server (`fat32_server`, when it exists) would contradict.
#
# Name: recorded (design/roadmap/0140-foreign-filesystems.md). Renamed from `fs_server` to
# `redoxfs_server` on 2026-08-25 as that decision's "increment zero", once milestone 138 settled:
# calef, 2026-08-18, "fs_server is misnamed. Its something like redoxfs_server."

[package]
name = "redoxfs_server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Unpublishable by construction: it depends on ../vendor/redoxfs by path, and crates.io forbids path
# dependencies. Saying so is what lets cargo-deny's wildcard ban (deny.toml) tell an in-tree path dep
# apart from a registry `version = "*"`, which is the thing that ban is actually for.
publish = false

[lib]
name = "redoxfs_server"
path = "src/lib.rs"

# The second-mount repro (fix/redoxfs-second-mount): runs the engine under the FS server's own
# allocator, capped the way the device caps it, and does two mounts in one process. Host-only (it
# needs std RedoxFS to build the fixture), so it rides `hosttest` and never enters the el0 build.
[[bin]]
name = "second_mount"
path = "src/bin/second_mount.rs"
required-features = ["hosttest"]
test = false
bench = false

# The EL0 binary. Behind `el0` so a host `cargo test` (which cannot compile user_mode_runtime's EL0 asm)
# never tries to build it; the target build turns defaults off and el0 on. test/bench off for the
# same reason every dedicated binary sets them: the default libtest target needs `extern crate test`,
# which does not exist for the bare-metal targets.
[[bin]]
name = "redoxfs_server"
path = "src/bin/redoxfs_server.rs"
required-features = ["el0"]
test = false
bench = false

# `mkfs` on the target (milestone 57's write half). Its own binary rather than a role of the FS
# server, because the two are opposites in the one way that matters: the server opens an image and
# never creates, and this creates one and never serves. Sharing the package is what gets it the
# vendored engine, the untyped heap and the `Server` core it reopens the new filesystem through.
# Same `el0` gate and the same test/bench reasoning as above. Provisional name (milestone 57's
# lane): calef settles program names.
[[bin]]
name = "mkfs"
path = "src/bin/mkfs.rs"
required-features = ["el0"]
test = false
bench = false

[features]
# Host default: the sans-IO core plus the std RedoxFS a `cargo test` fixture needs.
default = ["hosttest"]
hosttest = ["redoxfs/std", "redox_syscall/std"]
# The EL0 binary's world: the userspace runtime and the ABI constants. Enabled only for the target
# build, which also drops the default (`--no-default-features --features el0`), so the pure no_std
# core is what links into the kernel image.
el0 = ["dep:user_mode_runtime"]

# The initial ramdisk carries this binary's ELF, so keep it small and deterministic (the same knobs
# std_exerciser uses). Only the target build uses the release profile; host tests use dev and unwind.
# Overflow checks in release, ruled by calef 2026-10-04 (UTC) (notes/overflow-checks.md, option A).
# The shipped build now means by `a + b` what every tested build means: an overflow halts rather
# than wraps into a quiet wrong answer. Where a hot path wants a wrap, it says so at the site with
# `wrapping_*` and a reason.
[profile.release]
overflow-checks = true
opt-level = "s"
debug = false
strip = "debuginfo"

[dependencies]
# Ruling D's one shared scope crate: every path this server resolves, and every handle a bound
# badge presents, goes through it. `no_std`, depends only on `filesystem_contract`.
subtree_scope = { version = "0.1.0", path = "../crates/subtree_scope" }
# Ruling T1 (2026-09-27): the note that tells the progenitor this server enforces subtree grants
# itself, carried in the EL0 binary (`carry_subtree_grants!`).
capability_manifest_note = { version = "0.1.0", path = "../crates/capability_manifest_note" }
# The user address-space map (milestone 206 (a program image has under 896 KiB)): every fixed window here is checked against its band.
address_space_map = { version = "0.1.0", path = "../crates/address_space_map" }
# The vendored engine, no default features: the pure no_std core (creation APIs stay host-side).
redoxfs = { path = "../vendor/redoxfs", default-features = false }
# The untyped heap's ALGORITHM (the EL0 binary uses it through user_mode_runtime::heap). Depended on directly so
# the `second_mount` host repro can run the engine under the same allocator, capped the same way, with
# no syscalls and no emulator. no_std, and already in the el0 build through user_mode_runtime.
talc = { version = "5.1.1", default-features = false }
# The same redox_syscall (lib name `syscall`) RedoxFS uses, so our Server's `syscall::error::Result`
# is byte-for-byte the trait's. Cargo unifies the two at one version.
redox_syscall = { version = "0.9.0", default-features = false }

# The wire protocols. NOT optional since milestone 47: the rights ladder a directory capability
# carries (`filesystem_contract::dir`) is the sans-IO core's own vocabulary rather than something the serve loop
# bolts on at the boundary, which is what makes the attenuation impossible to forget. Pure no_std
# logic with no dependencies of its own, so it costs the host build nothing.
filesystem_contract = { version = "0.1.0", path = "../crates/filesystem_contract" }
filesystem_fixture = { version = "0.1.0", path = "../crates/filesystem_fixture" }

# The partition table (milestone 57): `mkfs` finds the partition it is to format by reading the
# GPT off the disk it holds, with the same parser `disk_surveyor` uses. Pure no_std logic with no
# dependencies of its own and no I/O at all, so it costs the host build nothing and the sans-IO core
# never sees it.
globally_unique_identifier_partition_table = { version = "0.1.0", path = "../crates/globally_unique_identifier_partition_table" }

# EL0-only, optional (behind `el0`): the syscall runtime. It does not compile for the host, so it is
# absent from the host test build. (`abi` went with milestone 706 (a `CALL` server can tell a Reply
# from a delegation): the server's one raw `REPLY` became `user_mode_runtime::reply`.)
user_mode_runtime = { version = "0.1.0", path = "../crates/user_mode_runtime", optional = true }

# cargo-machete (script/lint) reports `redox_syscall` unused here and is wrong: the crate's LIB name
# is `syscall`, so every real use reads `use syscall::error::...` and a name-based scan cannot see
# it. Recorded as an ignore rather than left to be rediscovered, since the answer is the same every
# time and the alternative is a gate somebody learns to skip.
[package.metadata.cargo-machete]
ignored = ["redox_syscall"]
