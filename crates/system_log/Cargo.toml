[package]
name = "system_log"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# The system log service's logic (milestone 613 (a system log service: the in-memory half), for
# §242 (a system log)): stamping from the badge, assembling a writer's chunks into lines, F3 to
# JSONL, the 64 KiB ring and the per-user read. Pure, no_std, host-tested, so
# `components/src/system_log.rs` is the system calls around it and nothing else. Name provisional.

[lints]
workspace = true

[dependencies]
byte_sink_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/byte_sink_contract", rev = "8a6c4599882e505d219829fd106d9e572d56f6e9" }
system_log_contract = { version = "0.1.0", path = "../system_log_contract" }
