# Kani proofs, deliberately in their OWN workflow rather than as a job in ci.yml.
#
# Not organisation: GitHub will not let you re-run a failed job while any job in the SAME workflow is
# still running. Kani takes ~47 minutes and the checks outside it are minutes each, so a flaky one
# could not be retried until Kani finished, and on 2026-08-03 that turned several three-minute retries
# into forty-minute waits. Splitting the slowest job out means every other job can be retried the
# moment it fails. (The ~3-minute `build + test` this argument was measured against is now four
# jobs, split 2026-09-30, of which the slowest ends near twenty minutes.)
#
# The check NAME is unchanged (`verify (Kani proofs)`), because that is the string the repository
# ruleset requires. Moving a job between workflows keeps its name, so the required check keeps
# matching; renaming it here would silently stop satisfying the rule.
#
# The triggers must mirror ci.yml exactly, or a pull request gets no verify check at all and blocks
# forever on a rule nothing can satisfy.
#
# Every job here also skips on a draft pull request, the same guard and the same reason ci.yml's
# header records: this is the ~47-minute half of the suite, and a §90 claim commit's whole point is
# to be an empty diff, which cannot fail these proofs differently than `main` already has.
#
# Stock Kani is pinned in `.kani-version` and installed only by `script/kani-install` (milestone
# 795); `script/kani-bump` and the `toolchain bump` workflow move the pin by a pull request that
# changes that one file. The riscv64 job builds 0.67.0 plus a carried patch and is the one row that
# is not on the pin until upstream kani#4913 ships, so `kernel` is proved by two Kani versions
# today. See design/roadmap/0795-pin-stock-kani-to-a-version-bumped-deliberately.md.
name: verify

# Observed failing: 2026-10-03, run 37156069481: the `re-falsify` leg went red on a push to main,
#   naming stale falsification records (timetable::*). One leg of several; the proof shards carry no
#   record of their own. See notes/observed-failing.md.

on:
  push:
    branches: [main]
  pull_request:
    # **`ready_for_review` is not a default activity type, and without it the draft guard below
    # fails open.** A bare `pull_request:` fires on `opened`, `synchronize` and `reopened` only.
    # §90 opens every lane as a draft and work is pushed while it is still one, so those pushes
    # raise `synchronize` with `draft: true` and every job correctly skips. Marking the pull
    # request ready then raises `ready_for_review`, which this workflow did not listen for, so no
    # run followed and the skipped jobs stayed the last word: the required checks were satisfied
    # by jobs that never ran, `mergeStateStatus` read `CLEAN`, and nothing had been verified.
    # Found 2026-08-28 on #567, which sat mergeable with all thirteen checks skipped. The comment
    # on the draft guard asserted this already worked, which is why it went unnoticed for five
    # days: it described the event GitHub raises rather than the events this trigger subscribes to.
    # `architect-hold.yml` had the correct list from the day it was written; these two did not.
    # Adding a type can only cause more runs, never fewer, so this fails safe in the direction the
    # rest of this file argues for.
    types: [opened, reopened, synchronize, ready_for_review]
  # The merge queue tests on a `gh-readonly-queue/...` branch, which raises `merge_group` rather
  # than `pull_request`. `verify (Kani proofs)` is a required check, so without this the queue waits
  # on a run that never starts. See the longer note in ci.yml.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Mirrors ci.yml's group, and must: without it, splitting this job out would have QUIETLY CHANGED
# behaviour. `ci.yml` cancels an in-flight run when a branch is pushed again, so the old Kani run
# died with it. A separate workflow with no group would keep running against the superseded commit,
# burning a runner for ~47 minutes on a SHA nobody will merge, and reporting a check against it.
#
# The group name differs from ci.yml's on purpose. Sharing one would make a push cancel the OTHER
# workflow too, which is the coupling this split exists to remove.
#
# **Mirrors ci.yml's merge-queue exemption too, and must, for the same "triggers must mirror
# exactly" reason this file's own header already gives.** Found 2026-08-27 via PR #546: a
# `gh-readonly-queue/` ref does not change between GitHub's retries of one queue entry, so the old
# `'tip'` fallback here would put a slow `verify` run (Kani's ~47 minutes is this project's own
# stated long pole) in the same group as its own retry and cancel it before it could finish --
# exactly the failure this concurrency block's `main` exemption already prevents for pushes.
concurrency:
  group: verify-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}

# **The required check is `verify (Kani proofs)` and it must stay a single job with that exact name**
# (milestone 119). A `matrix` on the proving job would rename it to `verify (Kani proofs) (1)` and
# `(2)`, so the ruleset's required check would match NOTHING and every pull request would wait
# forever on a check that no longer exists. That is the same trap this file's header already records
# for moving a job between workflows, one step further on.
#
# So the proving moves to a `prove` matrix and the required name survives as a tiny aggregate job
# that reports their combined result. The aggregate is where the name lives; the shards are where
# the time goes.
jobs:
  # Decide the scope ONCE. Before sharding this was folded into the proving job; with shards it has
  # to be its own, because two shards computing it separately could disagree on a moving tree, and
  # because paying `cargo metadata` twice to answer one question is waste.
  # The live draft state, read once. See ci.yml's `gate` job, which carries the full reasoning:
  # the event payload's `draft` is a snapshot that has been wrong, `ready_for_review` did not
  # reliably raise a run to correct it, and a skipped job still satisfies a required check. This
  # asks what the pull request is right now and fails safe toward running.
  #
  # On a push to `main` it asks a second question, A′ (calef, 2026-09-24): did a `merge_group` run
  # of THIS workflow conclude `success` at this exact commit? If so the proofs already ran against
  # this tree and the push cites that run instead of re-proving it for ~47 minutes on a starved
  # runner pool. ci.yml's `gate` carries the evidence (the SHA check against history, the #1213
  # eviction) and the fail-safe cases; they are identical here.
  gate:
    name: draft gate
    runs-on: ubuntu-24.04
    # `actions: read` is for the push branch below: listing this workflow's merge_group runs. The
    # job-level block replaces the workflow's, so the reads the draft half already relied on are
    # restated rather than inherited.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.state.outputs.run }}
      prose: ${{ steps.prose.outputs.prose }}
    timeout-minutes: 10
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - id: state
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A′: a push to `main` whose exact commit a merge group already tested. See the comment
          # above this job. Any answer but a run ID (no run, an API error, a missing permission)
          # leaves `tested` empty and falls through to running everything.
          if [ "${{ github.event_name }}" = "push" ]; then
            tested="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?event=merge_group&head_sha=${{ github.sha }}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
            if [ -n "$tested" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "==> ${{ github.sha }} was tested by merge group run $tested; skipping"
              echo "==> https://github.com/$GITHUB_REPOSITORY/actions/runs/$tested"
              exit 0
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> no successful merge_group run of verify.yml at ${{ github.sha }}; running everything"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> ${{ github.event_name }} is not a pull request; running everything"
            exit 0
          fi
          draft="$(gh pr view "$PR_NUMBER" \
                     --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)"
          if [ "$draft" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "==> pull request is a draft right now; skipping"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "==> live draft state is '${draft:-unreadable}'; running"
          fi
          exit 0
      # Prose-only (lane/docs-only-ci, 2026-10-05): the same classifier and the same base as
      # ci.yml's gate, whose comment has the reasoning. A Markdown change no code reads cannot reach
      # a proof, and skipping `verify (Kani proofs)` at the job level reports Success, which is what
      # the ruleset requires; `scope` already concluded "not needed" for it, one runner later.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.state.outputs.run != 'false'
        with:
          fetch-depth: 0
      - name: Is this change prose that no build or test reads?
        id: prose
        if: steps.state.outputs.run != 'false'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base="$(helpers/scope-merge-base.sh \
              "$BASE_REF" \
              "$BASE_SHA" 2>/dev/null || true)"
          [ -n "$base" ] || base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          echo "==> classifying $base..HEAD"
          python3 helpers/prose_only.py classify "$base"
      # A draft or an already-tested push skips the checkout, so there is no helper to run, and
      # those runs take seconds.
      - name: Check the job's wall time against its budget
        if: always()
        run: |
          if [ -f helpers/job-budget.py ]; then
            python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"
          fi

  scope:
    name: verify scope
    runs-on: ubuntu-24.04
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && needs.gate.outputs.prose != 'true' }}
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
      base: ${{ steps.scope.outputs.base }}
      falsify-shards: ${{ steps.plan.outputs.shards }}
      falsify-count: ${{ steps.plan.outputs.count }}
    timeout-minutes: 10
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Does this change need the proofs?
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base="$BASE_SHA"
          # A dispatched run has no event base, and `HEAD~1` alone scoped it to the newest commit:
          # a lane whose last commit was documentation skipped the build its earlier commits needed
          # (#1347, 2026-09-26). Off `main`, the merge base is the whole branch; on `main` it is
          # HEAD itself, so the newest commit stays the scope there.
          [ -n "$base" ] || base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scope="$(script/verify --affected-since "$base")"
          echo "$scope"
          if [ "$(echo "$scope" | tail -1)" = "verify-scope: not-needed" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "==> nothing in this change can reach a proof"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      # How many re-falsify shards this diff needs, planned here so a diff that reaches no record
      # starts no Kani runner at all. See the `falsify-shard` job.
      - name: Plan the re-falsify shards
        id: plan
        if: steps.scope.outputs.needed == 'true'
        run: |
          plan="$(script/falsifications --plan-since "${{ steps.scope.outputs.base }}")"
          echo "$plan"
          shards="$(echo "$plan" | tail -1)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$shards" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  prove:
    name: prove (shard ${{ matrix.shard }}/4)
    needs: [gate, scope]
    # `!cancelled()` for the same reason `verify` below gives: without it a failed or cancelled
    # dependency skips this job outright, whatever the condition says, and a skipped job still
    # posts a conclusion that satisfies a required check. The scope test is unchanged; it just has
    # to be reached to be applied.
    if: >-
      !cancelled() &&
      needs.scope.outputs.needed == 'true' &&
      needs.gate.outputs.run != 'false'
    runs-on: ubuntu-24.04
    # A shard ran a 12.7-minute median and an 18.4 maximum over 284 pull-request runs, and a 21.1
    # maximum once in about 600 merge-group runs, to 2026-10-19 (UTC).
    # 25 minutes is the 20-minute budget plus margin, from milestone 721 (each merge-group CI job
    # has a 20-minute budget). `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    strategy:
      # **Do not cancel the sibling.** One shard failing is a real result about its own crates, and
      # the other shard's result is still worth having: knowing whether `glob` alone broke or the
      # whole suite did is the difference between one investigation and fifteen.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `save-if`: no rust-cache entry is saved from a merge group, since no later run can restore
      # it. The measurement is at ci.yml's first rust-cache step and in
      # notes/actions-cache-budget-2026-10-07.md.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # **Not cached, on a measurement** (2026-10-07 UTC, lane/cache-kani, after calef's "We should
      # cache kani"). This step takes 8 to 20 seconds, mean 12, over 96 jobs in the 14 verify runs
      # that installed Kani between 37581663864 and 37633221412, and 8 to 21 in falsifications.yml
      # and kani-reach.yml; the 2-to-3-minute figure the request was made on does not appear in any
      # of them. Run 37630636854's shard 1 splits it: `cargo install` 3 s (kani-verifier is a small
      # wrapper crate), the release bundle into ~/.kani 4 s, and Kani's pinned nightly through
      # rustup 8 s. A cache would have to hold both of the last two, about 325 MB on disk per
      # architecture, and restoring 119 MB of the riscv64 cache below takes 2 s, so the best case
      # saves under ten seconds a job. Against that, the repository's caches stood at 10.8 GB
      # against GitHub's 10 GB limit that day, and an entry this size evicts rust-cache entries that
      # cost more to miss. Revisit if this step's time grows past a minute.
      - name: Install Kani
        run: script/kani-install
      # Four shards, calef's ruling on #1979 (2026-10-12 UTC): "A", prove goes from three shards
      # to four. Three was his ruling on #1802 (2026-10-07 UTC): "Add a third prove shard." On
      # 2026-08-14 two was a measurement (`glob` alone was half the job, so a third bought
      # nothing); by 2026-10-07 `machine_discovery` had grown to match `glob`, and the 40-run
      # medians packed to 23.6 minutes at two shards and 15.7 at three. Once #1979 halved
      # re-falsify, three shards (17.4 minutes slowest, n=46) were the build's long pole alone;
      # two probe runs of four took 13.2 and 12.9 minutes slowest, for no more runner-minutes
      # (47.7 against 48.4), since the idle tail at each crate's end shrinks as much as the added
      # setup grows. `glob` (about 12.2 minutes) is now the floor, so a fifth buys nothing.
      # script/verify's comment above `--shard` has the ladder.
      # The balance is by measured seconds from the table in script/verify, which
      # verify-shard-refresh.yml keeps current, and each shard warns when it ran more than 30% off
      # its plan.
      - name: script/verify --shard ${{ matrix.shard }}/4
        run: script/verify --shard ${{ matrix.shard }}/4
        # VERIFY_JOBS=2, not the script's default 4, and this is a measurement, not caution: the
        # first four runs of the parallel suite on this runner were each killed ~15 minutes in,
        # inside glob's largest harnesses, as a bare "operation was canceled" with orphaned cbmc
        # processes. That is GitHub's memory kill: four concurrent CBMC formulas at glob's size
        # exceed this runner's 16 GB; two fit. The script comment's "four fits every machine" was
        # written before CI measured otherwise; the dev Mac keeps 4. (Recovered 2026-08-14 from an
        # unmerged branch tip during a partial-work sweep; the setting had survived, its reason had
        # not, which is exactly the branch-as-filing-cabinet failure AGENTS.md warns about.)
        env:
          VERIFY_JOBS: 2
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **The same `kernel` row, on the other host architecture** (milestone 304 (`cargo kani -p kernel`
  # only ever compiled one architecture, and it was the runner's)), and since milestone 587 (most CI
  # jobs do not need an arm64 host) the other architecture is aarch64.
  #
  # `kernel/src/arch/mod.rs` selects its subtree with `#[cfg(target_arch = ...)]` and Kani compiles
  # for the HOST, so whichever runner proves the `kernel` row proves that runner's `arch/` subtree and
  # compiles no line of the others. Milestone 304 found the suite on arm64 proving `arch/aarch64/` and
  # nothing else, and added an x86_64 job for `--only kernel`. Milestone 587 moved the `prove` shards
  # to `ubuntu-24.04` because the arm64 hosted pool was where the queue waited, which turns the
  # picture over: the shards' own `kernel` row now proves `arch/x86_64/`, the old x86_64 job would
  # repeat it, and `arch/aarch64/` would be proved nowhere. So this job is the x86_64 one mirrored
  # rather than a fourth prover: same command, arm64 label, and the label IS the mechanism.
  #
  # **Cost**: about a minute, and none of it dominant. Run 37630636854 (2026-10-07): 20 s restoring
  # rust-cache, 14 s installing Kani, 12 s proving. (This said "0.1 minutes of proving and the rest
  # Kani's install", from the x86_64 twin's run 36029132635; the install is seconds, measured in
  # the `prove` job's comment above.) Its harnesses are the `arch/aarch64/` ones (the SMMU tables and
  # stream isolation), whose formulas are small, so `VERIFY_JOBS` stays at the script's default. It
  # still waits for an arm64 runner, and that is the price of the proof: one short job in that queue
  # rather than four long ones.
  #
  # **riscv64 is the next job down, not this one.** This paragraph said riscv64 could not be proved
  # here at all, on the grounds that Kani had no cross-target flag. That was true of stock Kani and
  # is not a fact about CBMC, which is host-independent; milestone 589 (Kani can prove riscv64 from the hosts we already have) carries a patch that gives
  # Kani the target instead (DECISIONS §218 (carry a Kani patch so riscv64 is proved)).
  prove-kernel-aarch64:
    name: prove the kernel on aarch64
    needs: [gate, scope]
    if: >-
      always() &&
      needs.scope.outputs.needed == 'true' &&
      needs.gate.outputs.run != 'false'
    runs-on: ubuntu-24.04-arm
    # The whole job is about a minute (above).
    # 25 minutes is the 20-minute budget plus margin, from milestone 721 (each merge-group CI job
    # has a 20-minute budget). `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # Not cached; the `prove` job's comment has the measurement.
      - name: Install Kani
        run: script/kani-install
      - name: script/verify --only kernel
        run: script/verify --only kernel
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # **The same `kernel` row for riscv64**, which no hosted runner is (milestone 589, DECISIONS §218).
  # CBMC checks a goto program and does not care what it runs on; stock Kani compiles for its own host
  # in four places, and `patches/kani-0.67.0-riscv64-target.patch` unpins them. script/verify-riscv64
  # builds Kani from the release tag plus that patch, then runs `script/verify --only kernel` for
  # `riscv64gc-unknown-linux-gnu`, and refuses to report green unless Kani's output landed under that
  # triple (a stock Kani would silently prove the host's `arch/` instead).
  #
  # **The cache is the whole cost story.** The key is the runner's architecture, the patch's file
  # name (which is the Kani version) and the hash of the patch and of the script that builds it, so a
  # version bump, a rebase or a change to the build all miss, and nothing else does. The path is
  # fixed because Kani bakes its build tree's absolute path into `kani-driver`; script/verify-riscv64
  # says more. Measured 2026-09-25: cold 2 min 57 s for the job (145 s of it building Kani), warm
  # 45 s (20 s of it installing Kani's toolchain, 3 s proving).
  #
  # Folded into `verify (Kani proofs)` like its aarch64 sibling rather than made a required check of
  # its own, for the reason that job's report step gives: the ruleset requires that one string, and a
  # new name there is a change no lane makes.
  prove-kernel-riscv64:
    name: prove the kernel on riscv64
    needs: [gate, scope]
    if: >-
      always() &&
      needs.scope.outputs.needed == 'true' &&
      needs.gate.outputs.run != 'false'
    runs-on: ubuntu-24.04-arm
    # Cold about 3 minutes, warm under 1 (above).
    # 25 minutes is the 20-minute budget plus margin, from milestone 721 (each merge-group CI job
    # has a 20-minute budget). `helpers/job-budget.py` is the rule and `script/lint` holds it.
    timeout-minutes: 25
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No rust-cache in this job (calef, #1814, 2026-10-07 UTC): a hit gained under half a minute,
      # and without it the time the step spent moves into the first cargo build rather than
      # growing. See notes/actions-cache-budget-2026-10-07.md.
      # The patch's file name carries the Kani version, and hashFiles reads bytes, not names, so the
      # name goes into the key on its own.
      - name: Name the carried Kani patch
        id: kani
        run: echo "patch=$(basename patches/kani-*-riscv64-target.patch .patch)" >> "$GITHUB_OUTPUT"
      - name: Cache the patched Kani
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nife-kani-riscv64
          key: kani-riscv64-${{ runner.os }}-${{ runner.arch }}-${{ steps.kani.outputs.patch }}-${{ hashFiles('patches/kani-*-riscv64-target.patch', 'script/verify-riscv64') }}
      - name: Build the patched Kani if the cache missed
        run: script/verify-riscv64 --build-only
      - name: script/verify-riscv64
        run: script/verify-riscv64
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The per-pull-request half of DECISIONS §134, and the half `script/mutation` has no equivalent
  # for. A lane that touches a harness or the code it covers re-falsifies **that harness only**,
  # which is seconds rather than the weekly sweep's minutes, and it closes the window in which a
  # refactor silently invalidates a record while everything stays green.
  #
  # **A gate here, a report weekly, and the split is the one `script/lint`'s own comments draw.** A
  # patch that no longer applies, or a harness that survives its own falsification, is a defect in
  # the commit that caused it and not a fact about the tree that morning; the weekly sweep is the
  # opposite, and is a report. This costs seconds per record because a falsification runs one
  # harness, and **that sentence stopped being true for two of them on 2026-09-23**. The replay of
  # #1156's 44 new records ran the full 45 minutes below and was cancelled mid-solver:
  # `nifefs::a_short_image_is_refused_not_indexed` and
  # `package_archive::a_short_file_is_refused` each take 20 to 31 minutes at 3.0-3.6 GB, where
  # every other record in `crates/` finishes in seconds. Both crates' BUGS sections carry the
  # measurement. Raising the timeout is not the fix and was deliberately not taken here: a per-pull
  # request gate that can spend an hour is a gate that gets disabled, and the real question is
  # whether those two proofs can be made cheap. **They were, 2026-09-24**: both harnesses now carry
  # `#[kani::unwind(9)]`, measured to change nothing on the correct tree, and their records go red in
  # seconds (#1239, #1243). And `script/falsifications` now gives each record 15 minutes and reports
  # one that runs out as `no verdict` (#1242), so the next such record costs a quarter of this job
  # rather than all of it.
  #
  # **Required since milestone 742 (provisional), through `verify (Kani proofs)` below, and that
  # is a correction.** Until 2026-10-04 (UTC) this was deliberately not a required check, so that
  # it could "fail loudly without being one more name in a ruleset". It failed loudly and nothing
  # stopped on it. d0b1ff821 (#1532) dropped `timetable`'s `mod proofs;`, this job went red on that
  # pull request, and the queue merged it anyway; #1535 and #1538 then merged red behind it until
  # #1554 restored the line. Of the last 60 merged pull requests, 4 merged with this job red and
  # every one of the 4 was that real defect, none a flake. So it is folded into the aggregate job
  # below, the way milestones 587 and 589 folded the kernel proof rows: no ruleset edit, one string
  # still required. It costs the critical path little, because it runs beside the shards: measured
  # over 10 merge-group runs, it finished after both shards once (by about four minutes) and before
  # them nine times. It rides `scope.needed` so a documentation-only change does not pay for a Kani
  # install.
  # **Sharded, sized by the diff** (calef, 2026-10-06 UTC: "I feel like the full sweep should be
  # sharded now with a target for 20 minutes for our long pole"). The scope job runs
  # `script/falsifications --plan-since`, which packs the records this diff reaches into the fewest
  # shards whose estimated replay is at most 17 minutes (20 until calef ruled on #1802, 2026-10-07
  # UTC), weighed by each record's measured time (notes/project-metrics/falsification-times.tsv,
  # written back by the weekly sweep and by verify-shard-refresh.yml). A diff that reaches nothing
  # gets no shard and spends no runner here; one crate gets one; the full set of 233 records gets
  # four, the heaviest planned at 1,010 s (three at about 1,185 s each before the change).
  #
  # Why it had to change: #1726 and #1734 each reached every record and were cancelled at this
  # job's old 45-minute limit (#1734 in run 37399689439, 125 of 225 replayed), once `glob` and
  # `machine_discovery` landed 35 minutes of solver-heavy records between them. A single job sized
  # to the full sweep was the other option and lost to this ruling: it would put an hour on the
  # merge queue's critical path, where the prove shards take 16 to 29 minutes.
  falsify-shard:
    name: re-falsify (shard ${{ matrix.shard }}/${{ needs.scope.outputs.falsify-count }})
    needs: [gate, scope]
    if: >-
      !cancelled() &&
      needs.scope.outputs.needed == 'true' &&
      needs.scope.outputs.falsify-shards != '[]' &&
      needs.scope.outputs.falsify-shards != '' &&
      needs.gate.outputs.run != 'false'
    runs-on: ubuntu-24.04-arm
    # 30 against the 17-minute target (20 until calef's 2026-10-07 ruling on #1802): ample, for a stale weight, a cold Kani install, or one
    # record at its own 15-minute limit. A shard that needs more is a packing input to fix (the
    # times file, or SHARD_TARGET in script/falsifications), not a limit to raise. The same reason
    # is this job's 25-minute budget in .github/ci-job-budgets, which allows the 30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.falsify-shards) }}
    steps:
      - name: Start the job wall-time clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}
      # Not cached; the `prove` job's comment has the measurement.
      - name: Install Kani
        run: script/kani-install
      - name: script/falsifications --affected-since --shard
        run: |
          script/falsifications --affected-since "${{ needs.scope.outputs.base }}" \
            --shard "${{ matrix.shard }}/${{ needs.scope.outputs.falsify-count }}"
        # Two records at a time, each in its own worktree (maintainer/merge-group-critical-path,
        # 2026-10-12 UTC). This step replayed one record at a time on a 4-core runner, and at 16 to
        # 18 minutes it was the merge group's long pole. Two, not four, for the reason the `prove`
        # job's VERIFY_JOBS gives: two CBMC formulas fit a 16 GB runner and four were killed. The
        # shards are still planned by serial seconds against SHARD_TARGET, so the shard count and
        # the runners it takes are what calef ruled on #1802; each shard now finishes in a bit over
        # half its plan. script/falsifications, above PARALLEL_KINDS, has the mechanism.
        env:
          FALSIFICATIONS_JOBS: 2
          # Each record's replay time into the job's record (milestone 808 (every gate accounts
          # for its time)), which `helpers/ci_job_times.py update` folds into the daily record.
          NIFE_TIME_RECORD: ${{ github.workspace }}/target/time-record.tsv
      - name: Summarize where the time went
        if: always() && hashFiles('target/time-record.tsv') != ''
        run: cargo xtask time-summary target/time-record.tsv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the time record
        if: always() && hashFiles('target/time-record.tsv') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: time-record-falsify-shard-${{ matrix.shard }}
          path: target/time-record.tsv
      - name: Check the job's wall time against its budget
        if: always()
        run: python3 helpers/job-budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The name the rest of the tree knows this check by, kept stable over the matrix the way
  # `verify (Kani proofs)` stands over the prove shards. It reads one result and needs no runner
  # time beyond that.
  falsify:
    name: re-falsify the harnesses this change can reach
    needs: [gate, scope, falsify-shard]
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the shards' combined result
        run: |
          shards='${{ needs.scope.outputs.falsify-shards }}'
          result="${{ needs['falsify-shard'].result }}"
          echo "shards: $shards"
          echo "falsify-shard: $result"
          case "${{ needs.scope.result }}" in
            success|skipped) ;;
            *) echo "==> the scope job did not finish, so nothing planned the shards" >&2; exit 1 ;;
          esac
          case "$result" in
            success) echo "==> every reachable falsification still turns its harness red" ;;
            skipped)
              # Skipped is green only when the scope job decided it: no proofs needed, or no shard.
              if [ "${{ needs.scope.outputs.needed }}" = "true" ] && [ "$shards" != "[]" ]; then
                echo "==> the shards were skipped although the plan named some" >&2; exit 1
              fi
              echo "==> nothing in this change can reach a falsification" ;;
            *) echo "==> a re-falsify shard reported '$result'" >&2; exit 1 ;;
          esac

  verify:
    name: verify (Kani proofs)
    needs: [gate, scope, prove, prove-kernel-aarch64, prove-kernel-riscv64, falsify]
    # **`!cancelled()` is load-bearing.** Without it this job is skipped whenever a shard fails or the
    # scope job says the proofs are not needed, and a required check that never reports blocks the
    # merge forever, which notes/repo-hardening.md names as the single most likely way to get this
    # wrong. It must always run and always report -- except on a draft, which can never reach the
    # merge queue in the first place, so there is nothing here for it to protect yet, and on a
    # prose-only change, where a skip by condition reports Success (see the gate). It is
    # `!cancelled()` rather than `always()` so a run superseded by a newer push or by
    # `ready_for_review` stops instead of reporting a spurious failure from cancelled shards and
    # holding the concurrency group; ci.yml's draft gate has the incident (2026-09-24, #1202).
    if: >-
      !cancelled() &&
      needs.gate.outputs.run != 'false' &&
      needs.gate.outputs.prose != 'true'
    runs-on: ubuntu-24.04
    # Reads two strings. The proving is upstream; nothing here needs a toolchain, a checkout or a
    # cache.
    timeout-minutes: 5
    steps:
      # The result vocabulary is success | failure | cancelled | skipped, and `skipped` is the one
      # that must pass: it is what `prove` reports when the scope job proved nothing can reach a
      # harness, which is the deliberate green-without-proving path this workflow has always had.
      # Anything else, including `cancelled`, is a shard that did not finish and must not read as a
      # suite that did.
      - name: Report the shards' combined result
        run: |
          scope="${{ needs.scope.result }}"
          prove="${{ needs.prove.result }}"
          kernel_aarch64="${{ needs['prove-kernel-aarch64'].result }}"
          kernel_riscv64="${{ needs['prove-kernel-riscv64'].result }}"
          echo "scope: $scope"
          echo "prove: $prove"
          echo "prove-kernel-aarch64: $kernel_aarch64"
          echo "prove-kernel-riscv64: $kernel_riscv64"
          if [ "$scope" != "success" ]; then
            echo "==> the scope job did not finish; refusing to report the proofs as green" >&2
            exit 1
          fi
          case "$prove" in
            success) echo "==> every shard proved its crates" ;;
            skipped) echo "==> nothing in this change can reach a proof" ;;
            *)       echo "==> a shard reported '$prove'" >&2; exit 1 ;;
          esac
          # The aarch64 kernel row (milestone 587; it was the x86_64 row from milestone 304 until the
          # shards moved to x86_64 and began proving that one themselves), judged by exactly the
          # vocabulary above and for the same reasons: `skipped` is the deliberate
          # green-without-proving path the scope job decides, and anything else, `cancelled`
          # included, is a job that did not finish and must not read as one that did. It is folded
          # into THIS job rather than made a second required check, because the ruleset requires the
          # string `verify (Kani proofs)` and nothing else; adding a name to a ruleset is a change
          # nobody can make from a lane, and a proof that fails while the required check stays green
          # is the invisible failure this file has already recorded twice.
          case "$kernel_aarch64" in
            success) echo "==> the kernel proved on aarch64 too" ;;
            skipped) echo "==> nothing in this change can reach a proof" ;;
            *)       echo "==> the aarch64 kernel row reported '$kernel_aarch64'" >&2; exit 1 ;;
          esac
          # The riscv64 kernel row (milestone 589), judged by the same vocabulary for the same
          # reasons, and folded in here for the same reason as the aarch64 row above.
          case "$kernel_riscv64" in
            success) echo "==> the kernel proved on riscv64 too" ;;
            skipped) echo "==> nothing in this change can reach a proof" ;;
            *)       echo "==> the riscv64 kernel row reported '$kernel_riscv64'" >&2; exit 1 ;;
          esac
          # The per-pull-request falsification (milestone 742, provisional), judged by the same
          # vocabulary: `skipped` is the scope job's documentation-only path, and anything but
          # success means a recorded falsification no longer turns its harness red (a survivor), no
          # longer applies (stale), or gave no verdict. Each of those is a proof that may have
          # stopped being able to fail, which is what this check is for.
          falsify="${{ needs.falsify.result }}"
          echo "falsify: $falsify"
          case "$falsify" in
            success) echo "==> every reachable falsification still turns its harness red" ;;
            skipped) echo "==> nothing in this change can reach a falsification" ;;
            *)       echo "==> re-falsify reported '$falsify': script/falsifications --affected-since names the record" >&2; exit 1 ;;
          esac
