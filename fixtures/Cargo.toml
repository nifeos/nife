# Name: recorded (design/roadmap/0039-repository-structure.md's "Not everything in `user/` is a
# service", performed by milestone 175). The programs that exist to exercise or measure the system
# rather than to be shipped: test clients, attackers that share the honest path, stand-in servers,
# workloads and benchmarks. 39 named eight of them by hand on a tree less than half this size and
# called mixing them with the real components "much of why the directory reads as shapeless"; this
# is that separation. `tests/` was not available and would have been wrong anyway, since Cargo owns
# that directory name and these are `[[bin]]` targets rather than test harnesses. Nobody has put
# the name to an architect.

[package]
name = "fixtures"
version = "0.1.0"
edition = "2024"
license.workspace = true

# The six ELF child builders (milestones 19d and 19e): each is entered by the kernel's
# `spawn_elf_child_builder`, reads one child out of the archive by name, builds it in userspace and
# reports. Three of the children exist only to be built and are listed beside their builders; the
# other three are `console`, `least_authority_demo` and `coremark`.
[[bin]]
name = "report_child_builder"
path = "src/report_child_builder.rs"
# This is a bare-metal `no_std` binary with no unit tests, and the default test/bench targets link
# libtest (`extern crate test`), which does not exist for the aarch64-unknown-none target. Turning
# them off is what lets `cargo clippy --all-targets` (and any --all-targets build) work here instead
# of failing to find crate `test`. The kernel keeps its test target because it supplies its own
# harness via `custom_test_frameworks`.
test = false
bench = false

