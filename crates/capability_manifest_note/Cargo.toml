[package]
name = "capability_manifest_note"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The type a note carries. The note is `grant_plan::Manifest` in bytes, so the vocabulary is the one
# the shell already binds lines against and the progenitor already endows from.
grant_plan = { version = "0.1.0", path = "../grant_plan" }
# The zone limits and spelling, which are the resolver's: a manifest asks for what a badge can carry.
domain_name_resolution_contract = { path = "../domain_name_resolution_contract" }

[dev-dependencies]
# Only to hold its note header to this crate's: the leaf crate repeats `OWNER` so it can depend on nothing.
interfaces_note = { path = "../interfaces_note" }
