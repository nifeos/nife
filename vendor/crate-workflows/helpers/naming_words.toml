# The words the naming checks refuse in a Rust name, each with the word that replaces it.
#
# Read by helpers/spelled_out.py and helpers/unit_symbols.py, whose headers are the manual. A key is
# one component of a name: names split at `_`, at digits and at CamelCase boundaries, and compare
# in lowercase, so `rx` here refuses `rx_ring`, `RxRing` and `RX_RING` alike. A value is what the
# failure message tells the author to write instead.
#
# The rule behind both tables: a name spells out what it holds, and an abbreviation stays only
# where nobody says its expansion (`pci`, `elf`, `usb`, `cpu`, `id`, `io`). A name that mirrors a
# datasheet, a specification or the standard library keeps its owner's spelling, and says so where
# the reader meets it (spelled_out.py's header gives the form). This file holds no exemption.
#
# The file's name and its table names are provisional.

[spelled_out]
op = "operation"
ops = "operations"
recv = "receive"
rx = "receive"
tx = "transmit"
config = "configuration"
configs = "configurations"
spec = "specification"
specs = "specifications"
arg = "argument (say whose: a program argument)"
args = "arguments (or operands, for the non-option words of a command)"
mem = "memory"
dir = "directory"
dirs = "directories"
va = "virtual_address"
pa = "physical_address"
ipi = "inter_processor_interrupt"
ipis = "inter_processor_interrupts"
nmi = "non_maskable_interrupt"
nmis = "non_maskable_interrupts"
ist = "interrupt_stack_table"
msr = "model_specific_register"
msrs = "model_specific_registers"
ipc = "inter_process_communication"
dtb = "device_tree_blob"
asid = "address_space_identifier"
asids = "address_space_identifiers"
gpt = "globally_unique_identifier_partition_table"
nvme = "non_volatile_memory_express"
pcie = "pci_express"
dma = "direct_memory_access"
pr = "pull_request"
prs = "pull_requests"
initrd = "initial_ramdisk"
prog = "program"
progs = "programs"
pos = "position"
opt = "option"
opts = "options"
mtime = "modification_time"
cap = "capability"
caps = "capabilities"
phy = "physical_layer_device"
init = "initialize"
irq = "interrupt, interrupt_number or interrupt_line, by what it holds"
irqs = "interrupts, interrupt_numbers or interrupt_lines, by what it holds"
fifo = "queue"
fifos = "queues"
min = "minimum"
max = "maximum"
os = "operating_system"
rgmii = "reduced_gigabit_media_independent_interface"
mdio = "management_data_input_output"
sdio = "a name for what the controller is (the vendor's instance label is not a name)"

# A refused component that is an English word in front of these: "opt in" and "opt out" are verbs,
# not `option` abbreviated.
[spelled_out_before]
opt = ["in", "out"]

# Unit symbols. A name spells its unit: an uppercase constant erases the case an SI symbol depends
# on (`MHZ` is `mHz` too, and `_MS` could be megasiemens), and the micro sign has no ASCII form.
[units]
ns = "nanoseconds"
nsec = "nanoseconds"
nsecs = "nanoseconds"
nanos = "nanoseconds"
us = "microseconds"
usec = "microseconds"
usecs = "microseconds"
micros = "microseconds"
ms = "milliseconds"
msec = "milliseconds"
msecs = "milliseconds"
millis = "milliseconds"
sec = "seconds"
secs = "seconds"
mins = "minutes"
hz = "hertz"
khz = "kilohertz"
mhz = "megahertz"
ghz = "gigahertz"
kb = "kilobytes"
mb = "megabytes"
gb = "gigabytes"
tb = "terabytes"
kib = "kibibytes"
mib = "mebibytes"
gib = "gibibytes"
bps = "bits_per_second"
kbps = "kilobits_per_second"
mbps = "megabits_per_second"
gbps = "gigabits_per_second"

# Symbols that are a unit only in one place: straight after `per` (`SECS_PER_MIN`, `kib_per_s`) or,
# for `s`, straight after a number (`within_30_s`). Anywhere else `s` is a variable or a mode-bit
# prefix and `min` is a minimum, which the spelled-out table holds.
[units_after_per]
s = "second"
min = "minute"

[units_after_number]
s = "seconds"

# British spellings, refused in a name: the house spelling is American. Read by
# helpers/british_spelling.py. A key is one component of a name, in lowercase; the value is the
# American form. The tables below hold stems and endings so one line covers a family.
[british]
analyse = "analyze"
analysed = "analyzed"
analyses = "analyzes"
analyser = "analyzer"
analysing = "analyzing"
paralyse = "paralyze"
catalyse = "catalyze"
catalogue = "catalog"
catalogues = "catalogs"
catalogued = "cataloged"
cataloguing = "cataloging"
grey = "gray"
greys = "grays"
greyed = "grayed"
greying = "graying"
programme = "program"
programmes = "programs"
whilst = "while"
amongst = "among"
practise = "practice"
practises = "practices"
practised = "practiced"
practising = "practicing"
spelt = "spelled"
learnt = "learned"
burnt = "burned"
licence = "license"
licences = "licenses"
defence = "defense"
defences = "defenses"
offence = "offense"
offences = "offenses"
pretence = "pretense"
artefact = "artifact"
artefacts = "artifacts"
aluminium = "aluminum"
ageing = "aging"
cheque = "check"
draught = "draft"
kerb = "curb"
mould = "mold"
moulded = "molded"
moulding = "molding"
plough = "plow"
sceptic = "skeptic"
sceptical = "skeptical"
storey = "story"
storeys = "stories"
tyre = "tire"
tyres = "tires"
sulphur = "sulfur"
speciality = "specialty"
maths = "math"
manoeuvre = "maneuver"
acknowledgement = "acknowledgment"
enquire = "inquire"
enquiry = "inquiry"
enquiries = "inquiries"
fulfil = "fulfill"
enrol = "enroll"
instalment = "installment"
skilful = "skillful"
wilful = "willful"
jewellery = "jewelry"
pyjamas = "pajamas"
cancelled = "canceled"
cancelling = "canceling"
labelled = "labeled"
labelling = "labeling"
modelled = "modeled"
modelling = "modeling"
travelled = "traveled"
travelling = "traveling"
traveller = "traveler"
signalled = "signaled"
signalling = "signaling"
fuelled = "fueled"
fuelling = "fueling"
levelled = "leveled"
levelling = "leveling"
channelled = "channeled"
channelling = "channeling"
totalled = "totaled"
totalling = "totaling"
tunnelled = "tunneled"
tunnelling = "tunneling"
marshalled = "marshaled"
marshalling = "marshaling"
counselled = "counseled"
quarrelled = "quarreled"
centring = "centering"
centred = "centered"

# A stem that takes `ise` where American takes `ize`: `initialise`, `initialisation`, `initialised`.
# Only stems listed here count, so `rise`, `promise` and `exercise` are never read.
[british_ise]
stems = [
    "initial", "serial", "optim", "normal", "final", "synchron", "custom", "minim", "maxim",
    "util", "summar", "author", "categor", "character", "emphas", "general", "special", "standard",
    "visual", "capital", "material", "priorit", "random", "sanit", "token", "virtual", "central",
    "local", "modern", "memor", "apolog", "critic", "real", "recogn", "organ", "legal", "mobil",
    "stabil", "crystal", "equal", "item", "pressur", "harmon", "hospital", "sympath", "digit",
    "colon", "penal", "fertil", "jeopard", "subsid", "unit", "formal", "social", "factor",
    "canon", "unrecogn", "plural",
]
endings = ["e", "ed", "ing", "es", "er", "ers", "ation", "ations"]

# A stem that takes `our` where American takes `or`: `colour`, `behavioural`.
[british_our]
stems = [
    "col", "behavi", "fav", "hon", "neighb", "flav", "lab", "hum", "rum", "vap", "harb", "arm",
    "od", "rig", "vig", "savi", "parl", "tum", "val", "endeav", "sav",
]
endings = ["our", "ours", "oured", "ouring", "ourful", "ourless", "ourable", "ourite", "ourites",
           "oural", "ourally"]

# A stem that takes `re` where American takes `er`: `centre`, `metres`.
[british_re]
stems = ["cent", "met", "lit", "fib", "theat", "calib", "somb", "lust", "meag"]
endings = ["re", "res"]

# Register, mask, address and size names. Read by helpers/register_names.py, whose header is the
# manual.
#
# A qualifier that makes `address` something other than a location in memory: an address of a
# network, a bus or a mailbox is not virtual or physical.
[address_qualifiers]
words = ["virtual", "physical", "mac", "ip", "ipv4", "ipv6", "i2c", "email", "socket", "network",
         "ethernet", "peer"]

# The words that give a size, a length or a limit its unit, or say it is not a quantity of memory:
# `BUFFER_SIZE_BYTES`, `RING_SIZE_ENTRIES`, `PAGE_SIZE_SHIFT`. A name that holds `size`, `len` or
# `length` and none of these fails.
[size_units]
words = ["bytes", "kibibytes", "mebibytes", "gibibytes", "tebibytes", "bits", "words", "sectors",
         "blocks", "pages", "entries", "elements", "characters", "descriptors", "slots", "lines",
         "shift", "order"]

# Short words a name keeps, each with its reason. Read by helpers/abbreviations.py, which reports
# every component of a name that is neither an English word nor a technical word
# (helpers/technical_words.txt) nor listed here. A word belongs here when nobody says its
# expansion, or when the standard library spells it so and a name that mirrors it keeps the spelling.
[accepted]
id = "the standard library's own spelling (ThreadId), and nobody says identifier in its place"
pci = "nobody says Peripheral Component Interconnect"
elf = "nobody says Executable and Linkable Format"
usb = "nobody says Universal Serial Bus"
cpu = "nobody says central processing unit in code"
io = "nobody says input/output in a name"
syscall = "the word every kernel and its readers use"
bios = "nobody says Basic Input/Output System"
efi = "nobody says Extensible Firmware Interface"
uefi = "nobody says Unified Extensible Firmware Interface"
xor = "the operator's name"
sd = "the card's name; nobody says Secure Digital"
mac = "the address's name; nobody says media access control address"
len = "the standard library's spelling (len, is_empty)"
iter = "the standard library's spelling (iter, iter_mut, into_iter)"
mut = "the standard library's spelling (get_mut, as_mut)"
std = "the standard library's crate name"
alloc = "the standard library's crate name"
eq = "the standard library's spelling (PartialEq, assert_eq)"
ne = "the standard library's spelling (assert_ne)"
cmp = "the standard library's spelling (Ord::cmp, PartialOrd::partial_cmp)"
ord = "the standard library's spelling (Ord, PartialOrd)"
fmt = "the standard library's spelling (core::fmt)"
usize = "a primitive type"
isize = "a primitive type"
utf = "the encoding's name (UTF-8); nobody says Unicode Transformation Format"
ascii = "the encoding's name"
ram = "nobody says random-access memory"
rom = "nobody says read-only memory"
ok = "the standard library's spelling (Result::Ok)"
str = "the standard library's string slice (as_str, from_str)"
vec = "the standard library's spelling (Vec, to_vec)"
le = "the standard library's spelling (to_le_bytes, from_le_bytes)"

# Components the English word list holds that a name still spells out, each with the word to
# write. helpers/abbreviations.py reports them although a dictionary has them.
[abbreviations]
err = "error"
errs = "errors"
info = "information"
temp = "temporary"
ref = "reference"
refs = "references"
lib = "library"
doc = "document"
sec = "seconds or secondary, by what it holds"
dev = "device"
devs = "devices"
param = "parameter"
params = "parameters"

# What helpers/abbreviations.py suggests for a component that is not a word. A suggestion is a hint
# in a report, never a rule; the spelled-out table above suggests too.
[expansions]
val = "value"
vals = "values"
cnt = "count"
idx = "index"
buf = "buffer"
bufs = "buffers"
ptr = "pointer"
addr = "address"
num = "number"
ctx = "context"
desc = "descriptor"
descs = "descriptors"
reg = "register"
regs = "registers"
src = "source"
dst = "destination"
tmp = "temporary"
hdr = "header"
msg = "message"
pkt = "packet"
cmd = "command"
req = "request"
resp = "response"
res = "result"
sz = "size"
cur = "current"
prev = "previous"
nxt = "next"
cfg = "configuration"
ack = "acknowledge"
