# The words the milestone 7-19 capability demonstrations agree on (milestone 291).
# The name block, with the refusals, is in src/lib.rs where `script/names` reads it.
[package]
name = "capability_witness_contract"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
# The window `report_child` finds on its startup page: where `report_child_builder` maps one page
# for it, and what the page says about it.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
startup_page_contract = { version = "0.1.0", path = "../startup_page_contract" }
