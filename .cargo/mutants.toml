# cargo-mutants configuration (milestone 85). Read automatically by `cargo mutants`; driven here by
# script/mutation. The tool version is pinned in .cargo-mutants-version, the same discipline as
# .cargo-deny-version and .cargo-fuzz-version. Config, not a code dependency (DECISIONS §46): nothing
# in the tree links against cargo-mutants, it only reads our source and runs our tests.
#
# The host-excluded set is NOT recorded here. Every workspace crate that reaches
# crates/user_mode_runtime cannot build for the host, and script/mutation derives that set from
# helpers/host-excluded-crates.sh and passes it to cargo-mutants on the command line, the same
# derivation script/coverage and script/lint's clippy passes consume. What is listed below is
# judgment, each entry with its reason. For the host census it stays limited to things that
# physically cannot be mutated here, never to things that are merely untested; the kernel's own
# section at the foot of `exclude_globs` adds entries of the `xtask` kind, where the mutant
# compiles and runs but a verdict on it measures the harness or the test image, never a shipped
# kernel.

exclude_globs = [
    # `kernel` itself: no_std, QEMU-only, bare metal, and it takes no dependency on
    # `crates/user_mode_runtime`, so the derivation's dependency-graph walk cannot name it. It does
    # not compile for the host at all.
    "kernel/**",

    # **The system-test image** (milestone 609 (the system tests leave the kernel crate), 2026-09-27
    # UTC). A bare-metal `[[bin]]` that links the kernel as a library, so it is `kernel/**` by
    # another path: its one mutant (`system_tests_main`) put a host `cargo test -p system_tests` in
    # one shard's baseline, which failed with "unwinding panics are not supported without std" and
    # turned the whole weekly run red from 2026-09-28 (milestone 636 (the scheduled workflows are
    # failing)). Like `kernel`, it reaches `kernel` rather than `user_mode_runtime`, so the
    # derivation cannot name it. What proves it is `cargo xtask test`, which boots it on three ISAs.
    "system_tests/**",

    # **The UEFI application itself, and it is here for a THIRD reason** neither of the two above:
    # not a crate that fails to compile for the host, and not a judgement call, but a `[[bin]]`
    # target whose `required-features = ["uefi"]` means `cargo build --workspace` and `cargo test`
    # never put it in the build graph at all. `uefi_loader`'s LIBRARY half is host-tested and stays
    # mutated; only this one file is out of reach, and it is out of reach by construction (it calls
    # firmware and leaves long mode, which is why the library exists beside it).
    #
    # The number this fixes is the whole crate's. Of 189 mutants, 154 are in this file, and every
    # one came back MISSED in "0s build + 0s test" because nothing rebuilt: cargo-mutants edits a
    # source file no compilation reads. That is what scored the crate 3-caught-of-20 in the first
    # published sample and made `uefi_loader` one of the two crates blamed for the tree's score
    # falling from 92.4%. It is the `system_initializer` arithmetic (milestone 244) wearing
    # different clothes, and it is worth naming the difference: that one was unreachable through the
    # dependency graph, so `script/lint`'s bare-metal gate derives it. This one is unreachable
    # through `required-features`, which that gate cannot see, so it has a gate of its own beside
    # it, deriving this entry from `cargo metadata` rather than asking anyone to remember it.
    #
    # What proves this file is `cargo xtask uefi-boot` under OVMF, on `script/test`'s own leg.
    # Excluding it here does not make it proved; see notes/mutation-testing.md for the split.
    "uefi_loader/src/main.rs",
    # And the modules `main.rs` declares, which are the same unbuilt target in other files. Found
    # 2026-09-24: the entry above covered the root only, so `src/arch/` scored 132 of the crate's
    # 182 MISSED at the 2026-09-21 census, every one in a file no host build compiles. `script/lint`
    # now walks the target's module tree, so a new `mod` here fails the gate until it is listed.
    "uefi_loader/src/arch/**",
    "uefi_loader/src/boot_services.rs",
    "uefi_loader/src/chooser.rs",
    "uefi_loader/src/console.rs",
    "uefi_loader/src/loading.rs",
    "uefi_loader/src/placement.rs",

    # **`stick_maker`'s host half and its entry point**, mirroring `script/coverage`'s exemption of
    # the same two paths for the same reason (the stick program, 2026-09-19). `src/host/` runs
    # `diskutil`, `sfdisk`, `mkfs.vfat` and `mount`, or four `kernel32` calls, against a real disk,
    # and the Linux arm erases a whole block device as root; each arm is `#[cfg]`-selected per host
    # OS, so on the Linux census runner the macOS and Windows arms are not even compiled and scored
    # MISSED in "0s build + 0s test". Every decision the program makes is in a file that stays
    # mutated (`disk.rs`, `cli.rs` against a fake host, and the per-host parsers). What proves the
    # host half is `scripts/stick-maker-proof.sh` and `.github/workflows/stick-maker-hosts.yml`,
    # which run each arm on its own host. 61 of the crate's 101 MISSED at the 2026-09-21 census were
    # these two paths; found by milestone 326 (turn a mutation score upward), 2026-09-24.
    "crates/stick_maker/src/host/**",
    "crates/stick_maker/src/main.rs",
    # **A Kani harness module that is its own FILE**, which the `proofs::` entry below cannot reach.
    # cargo-mutants names a mutant by the path of the function WITHIN the file it parsed, so an
    # inline `#[cfg(kani)] mod proofs { .. }` yields `proofs::a_fire_is_strictly_in_the_future` and
    # a `#[cfg(kani)] mod proofs;` in its own file yields `a_fire_is_strictly_in_the_future` with no
    # prefix at all. Same `cfg`, same unreachability under `cargo test`, and the module-path regex
    # silently misses it. Found by milestone 326 (nobody has been assigned to turn a mutation score
    # upward) triaging the 2026-09-14 census, where 36 of `timetable`'s 48 reported survivors were
    # this crate's proof harnesses rather than its code,
    # which is the whole reason it read 73.6%. Glob rather than regex, because the file layout is
    # the thing that differs; `verification.rs` is listed with it so the sibling convention cannot
    # arrive unexcluded. The `**` after `src/` reaches a submodule's harness file, such as
    # `machine_discovery`'s `src/x86_64/verification.rs`.
    "**/src/**/proofs.rs",
    "**/src/**/verification.rs",

    # Host tooling, not shipped code. xtask drives cargo and QEMU; its "tests" are the gates it
    # runs, so a mutant here is caught by CI going red, not by a unit suite. Mutating it would
    # spend hours measuring the build system instead of the OS.
    "xtask/**",

    # **The kernel's own section** (roadmap 955, the kernel and its programs are mutated under
    # QEMU). The kernel's mutation runs, the diff-scoped check on kernel pull requests and the
    # rolling census, list with `--no-config`, because the `kernel/**` entry at the top of this
    # array excludes the crate whole from the host census and a config-reading run would list
    # nothing. This section is theirs to consume: a kernel run reads this file, takes the
    # `exclude_globs` entries that name a path under `kernel/src/` (the host census's own
    # `kernel/**` entry above does not, and it is why a config-reading kernel run lists nothing),
    # and treats a file any of them matches as outside its corpus. On a host run the section is
    # unreachable by construction: `kernel/**` has already removed every path the entries name,
    # and no entry matches a path outside `kernel/`.
    #
    # A module behind a plain `#[cfg(test)]`, such as `kernel/src/tests.rs` or any inline
    # `mod tests`, needs no entry here: the tool already declines to mutate those. It is exactly
    # the compound and feature forms below, which that skip does not recognize, that would
    # otherwise reach an image build and score MISSED.
    #
    # The bench and workload boots. `bench`, `icount`, `storage_bench`, `disk_throughput`,
    # `network_bench`, `job_mix`, `lock_wait` and `soak_test` are kernel features that neither
    # test image enables: the kernel unit-test image builds default features under `cfg(test)`
    # and the system image adds only `system_tests` (`system_tests/Cargo.toml`). The module
    # declarations stay behind their feature cfgs, so a patch to one of these files edits a file
    # no image build reads: both tiers run the unmutated kernel, the verdict is always
    # "survived", and the run pays both image preparations for it. What proves each module is
    # the boot that builds its feature (`script/bench`, `cargo xtask soak` and its siblings),
    # never the test suite. The `uefi_loader` entries above are this same pattern.
    "kernel/src/bench.rs",
    "kernel/src/bench/**",
    "kernel/src/icount.rs",
    "kernel/src/storage_bench.rs",
    "kernel/src/disk_throughput.rs",
    "kernel/src/network_bench.rs",
    "kernel/src/job_mix.rs",
    "kernel/src/lock_wait.rs",
    "kernel/src/soak.rs",

    # The boot self-tests (milestone 268 (every architecture boots the same way)). `cfg(not(any(test, feature = "system_tests", feature =
    # "bench")))` compiles them into a production boot and into no test image, so a mutant there
    # is unreachable in both tiers: the group above, worn from the other side. Their checker is
    # the boot ladder verdict (`boot_ladder::SELF_TEST`), which a program reads, and
    # notes/self-test-checks.md holds the checks.
    "kernel/src/self_test.rs",

    # The test harness and what the two suites share. `cfg(any(test, feature = "system_tests"))`
    # puts these in both images, so their mutants run; but a mutant of the harness measures the
    # harness, which is the judgment that leaves `xtask` out above, and its verdict says nothing
    # about a shipped kernel.
    "kernel/src/testing.rs",
    "kernel/src/user/test_support.rs",
    "kernel/src/user/fs_service/test_files.rs",

    # The system-test image's own scaffolding, behind `feature = "system_tests"` alone: the
    # fault-injection hooks the tests trip on demand and the stand-in installer. The kernel image
    # declares none of them, so their mutants pay the kernel tier to survive it, and a shipping
    # build has no code that could fire, so a system-tier verdict is a verdict on the test image.
    # Each module's own header states the cfg and the reason.
    "kernel/src/retype_fault.rs",
    "kernel/src/delegation_pause.rs",
    "kernel/src/user/fs_service/test_install.rs",
]

# Matched against mutant names ("replace X with Y in path::fn"). Entries arrive with reasons or
# not at all.
exclude_re = [
    # The Kani harness modules: 18 `mod verification` blocks and 3 `mod proofs` (credential_contract,
    # filesystem_contract, regions), every one behind `#[cfg(kani)]`, so `cargo test` never compiles them: a
    # mutant there always "survives", and the first full run reported dozens of exactly that (every
    # one of calendar's harnesses, mutated to `()`, "missed"). Their checker is script/verify, not
    # the test suite, and mutating the proof rather than the code under proof measures nothing this
    # baseline is for. Both names are matched as module paths, which nothing else in the tree uses.
    "verification::",
    "proofs::",

    # The loom models: 6 `mod interleavings` blocks (clock_contract, memory_corruption_canary_gate,
    # memory_regions, spin_lock, thread_wake_handshake, work_steal_slot), every one behind
    # `#[cfg(all(test, loom))]`, so `cargo test` never compiles them and a mutant there always
    # "survives". Exactly the case above wearing different clothes, and found the same way:
    # milestone 326's triage of the 2026-09-14 census reported `Reached::mark` and `Reached::assert`
    # missed in `memory_regions`, which are the non-vacuity flags of a harness the test suite cannot
    # see. Their checker is `script/interleaving-check`, not `cargo test`, and mutating the model
    # rather than the code under model measures nothing this baseline is for. Matched as a module
    # path, which nothing else in the tree uses.
    "interleavings::",

    # **Helper functions in a host test module, which cargo-mutants skips everywhere else in this
    # tree and does not skip here.** The tool already declines to mutate anything under a plain
    # `#[cfg(test)]`, so a helper like `calendar`'s `fields` yields no mutant at all (measured:
    # `cargo mutants -p calendar --list` has 395 entries and none of them is `tests::*`). The six
    # loom crates write their host module as `#[cfg(all(test, not(loom)))]` instead, because the
    # loom model is the other half of the same `test` cfg, and the tool's skip does not recognise
    # the compound form: `memory_corruption_canary_gate`'s deadline helper came back MISSED for
    # exactly that reason. Found by milestone 326 triaging the 2026-09-14 census.
    #
    # A mutant of a test helper is never a defect in the shipped system, which is a stronger
    # argument than the two entries above rather than a weaker one: `verification::` and
    # `interleavings::` at least name code with a checker of its own, and this names code that is
    # not compiled into anything. Matched as a module path, which nothing outside a test module
    # uses.
    "tests::",

    # **e1000e's register words** (roadmap 954, part 4). One entry per function and shape whose
    # OR-to-XOR swaps are no-ops because the operands share no bit, and one per file's
    # constant-level swaps and zero shifts for the same reason. The argument compiles: a `const`
    # assertion beside each covered word states the disjointness, the field membership or the
    # shift identity, and an edit that broke it would fail the build there. Line and column stay
    # `[0-9]+`, so an edit above a word cannot strand its entry; a rename or a rewrite that made
    # operands overlap stops matching and the mutant reappears in the census as a survivor, which
    # fails the weekly check. The killed mutants an entry sweeps are named in its reason.
    #
    # The control words and the transmit inter-packet gap (control.rs): the assertion beside each
    # const fn states its operands' pairwise disjointness.
    "^crates/e1000e/src/control\\.rs:\\d+:\\d+: replace \\| with \\^ in rctl$",
    "^crates/e1000e/src/control\\.rs:\\d+:\\d+: replace \\| with \\^ in tctl$",
    "^crates/e1000e/src/control\\.rs:\\d+:\\d+: replace \\| with \\^ in tipg$",
    # The receive-error and transmit-command bytes (descriptor.rs) and the file's transmit
    # descriptor word: single distinct bits, and a u16 length under a command byte at bit 24; the
    # assertions beside them compile both arguments.
    "^crates/e1000e/src/descriptor\\.rs:\\d+:\\d+: replace \\| with \\^$",
    "^crates/e1000e/src/descriptor\\.rs:\\d+:\\d+: replace \\| with \\^ in transmit_word$",
    # The flush (pch/flush.rs): the dummy transmit's 512-byte length under a flag byte at bit 24,
    # and RXDCTL's three added constants, which land in the register half the mask clears or
    # share no bits with each other; the assertions beside each function compile both.
    "^crates/e1000e/src/pch/flush\\.rs:\\d+:\\d+: replace \\| with \\^ in transmit_word$",
    "^crates/e1000e/src/pch/flush\\.rs:\\d+:\\d+: replace \\| with \\^ in rxdctl$",
    # The flash registers (pch/non_volatile_memory.rs). status::DONE and control::GO are `1 << 0`
    # and `1 >> 0` is the same word, the shift identity; the file-level shift entry also sweeps
    # the other `1 << n` status bits and the two `0b11 << n` masks, whose swaps are killed by
    # the_flash_register_bits_are_the_ich8_unions. initialize_cycle ORs two write-one-to-clear
    # error bits that share no bit (assertion beside the const modules), and its DONE write meets
    # a bit the status write before it has already carried. read_u32_at_byte ORs the byte count
    # into the field it just masked out (assertion beside the const modules).
    "^crates/e1000e/src/pch/non_volatile_memory\\.rs:\\d+:\\d+: replace << with >>$",
    "^crates/e1000e/src/pch/non_volatile_memory\\.rs:\\d+:\\d+: replace \\| with \\^ in initialize_cycle$",
    "^crates/e1000e/src/pch/non_volatile_memory\\.rs:\\d+:\\d+: replace \\| with \\^ in read_u32_at_byte$",
    # The PHY (pch/physical_layer_device.rs): a value shifted left by five never reaches the
    # five-bit register field beside it (assertion beside paged_offset), and the identifier's high
    # word sits at bit 16 while the low one is a u16 (assertion beside id_at).
    "^crates/e1000e/src/pch/physical_layer_device\\.rs:\\d+:\\d+: replace \\| with \\^ in paged_offset$",
    "^crates/e1000e/src/pch/physical_layer_device\\.rs:\\d+:\\d+: replace \\| with \\^ in id_at$",
    # The I219 bring-up (pch/sequence.rs): the ULP word's eight single-bit operands (assertion
    # beside the constant), the identifier composition accessible shares with id_at (assertion
    # beside it), the two OEM bits (beside oem_bits), the LANPHYPC counter value inside the field
    # its word masks out (beside toggle_lanphypc), the SMBus address and flags (beside
    # write_system_management_bus_address), initialize_hardware's unnamed Intel bits and the
    # write-back constant that sets nothing the next line's prefetch does not set again (inside
    # it; its TARC1 read join and its prefetch join are killed by
    # initialize_hardware_writes_freebsds_values_from_any_starting_state), the copper link's
    # advertised bits (beside setup_copper_link; the joins on a register's own value are killed by
    # the same test), and the transmit errata's request count inside the field its word masks out
    # (beside transmit_errata).
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in accessible$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in oem_bits$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in toggle_lanphypc$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in write_system_management_bus_address$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in initialize_hardware$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in setup_copper_link$",
    "^crates/e1000e/src/pch/sequence\\.rs:\\d+:\\d+: replace \\| with \\^ in transmit_errata$",

    # **Milestone 954 (a survivor accepted once is not accepted forever), part 4, this crate's
    # noise:** `replace | with ^` over operands that share no bit, one entry per function, each
    # naming the `const` beside the code whose `assert!` lets the compiler check the disjointness
    # (`THE_*_SHARE_NO_BIT`). `x | y` equals `x ^ y` whenever the operands share no bit, so no test
    # can kill these mutants, and the census counted them survived every week. The regex anchors on
    # the file's path and the function's full name so it cannot reach another crate's or a longer
    # name; the line and column are left to `\d+` because they move with every edit. A function
    # named here that later gains a `|` over overlapping bits generates no mutant for it; that is
    # the exclusion's known limit, narrowed by the named constant, which fails the build if the
    # bits ever collide.
    #
    # Where a function's survivor set also holds a site the disjointness claim does not cover, the
    # site's own row stays and says so; only the all-disjoint functions are excluded here.
    #
    # Command::word composes the start bit (31), the hold register (29) and the index masked to
    # bits 5:0: THE_COMMAND_WORD_FIELDS_SHARE_NO_BIT (command.rs).
    '^crates/designware_mobile_storage/src/command\.rs:\d+:\d+: replace \| with \^ in Command::word$',
    # reset clears the three enables, disjoint per
    # THE_DIRECT_MEMORY_ACCESS_ENABLES_SHARE_NO_BIT (registers.rs); the excluded
    # `ctrl | CTRL_ALL_RESET` write's mutant, which
    # reset_clears_the_enables_keeps_other_bits_and_asks_for_all_three_resets killed, is covered by
    # the same exclusion.
    '^crates/designware_mobile_storage/src/host\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::reset$',
    # set_clock writes the card clock enable (0) and low power (16), disjoint per
    # THE_CLOCK_ENABLES_SHARE_NO_BIT (registers.rs).
    '^crates/designware_mobile_storage/src/host\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::set_clock$',
    # finish waits for DTO with ACD, and the data-error group with the data-timeout group, disjoint
    # per THE_TRANSFER_OVER_BITS_SHARE_NO_BIT and
    # THE_DATA_ERROR_AND_TIMEOUT_BITS_SHARE_NO_BIT (registers.rs).
    '^crates/designware_mobile_storage/src/host\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::finish$',
    # wait_queue tests the data-error group against the data-timeout group, disjoint per
    # THE_DATA_ERROR_AND_TIMEOUT_BITS_SHARE_NO_BIT (registers.rs).
    '^crates/designware_mobile_storage/src/host\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::wait_queue$',
    # descriptor writes OWN (31) with CH (4), disjoint per
    # THE_DESCRIPTOR_OWN_AND_CHAIN_BITS_SHARE_NO_BIT (internal_direct_memory_access.rs).
    '^crates/designware_mobile_storage/src/internal_direct_memory_access\.rs:\d+:\d+: replace \| with \^ in descriptor$',
    # internal_direct_memory_access_start ORs the enable pair and BMOD's enable with fixed burst,
    # disjoint per THE_DIRECT_MEMORY_ACCESS_ENABLES_SHARE_NO_BIT and
    # THE_BUS_MODE_BITS_SHARE_NO_BIT (registers.rs); the `ctrl | CTRL_USE_INTERNAL_DMAC` write's
    # mutant, which one_transfer_arms_and_stops_the_internal_direct_memory_access_register_by_register
    # killed, is covered by the same exclusion.
    '^crates/designware_mobile_storage/src/internal_direct_memory_access\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::internal_direct_memory_access_start$',
    # internal_direct_memory_access_wait tests the same two disjoint pairs as finish, per
    # THE_TRANSFER_OVER_BITS_SHARE_NO_BIT and THE_DATA_ERROR_AND_TIMEOUT_BITS_SHARE_NO_BIT
    # (registers.rs).
    '^crates/designware_mobile_storage/src/internal_direct_memory_access\.rs:\d+:\d+: replace \| with \^ in Host<R, D>::internal_direct_memory_access_wait$',
    # fifoth_for_pio composes the burst code (bit 29), the receive watermark (bits 27:16) and the
    # transmit watermark (bits 11:0), disjoint per
    # THE_POLLED_FIFO_THRESHOLD_FIELDS_SHARE_NO_BIT (registers.rs).
    '^crates/designware_mobile_storage/src/registers\.rs:\d+:\d+: replace \| with \^ in fifoth_for_pio$',
    # fifoth_for_direct_memory_access composes the same three fields with the larger burst
    # encoding, disjoint per
    # THE_DIRECT_MEMORY_ACCESS_FIFO_THRESHOLD_FIELDS_SHARE_NO_BIT (registers.rs).
    '^crates/designware_mobile_storage/src/registers\.rs:\d+:\d+: replace \| with \^ in fifoth_for_direct_memory_access$',

    # The crate's const-item survivors leave the same way. cargo-mutants names a const item's
    # mutant with no function, so the file and the shape are the narrowest scope that survives an
    # edit, and these entries reach the killed mutants of the same shapes in the same files; the
    # tests that killed them stay. The compositions' disjointness is compiler-checked by the
    # THE_*_SHARE_NO_BIT constants in the same files, and the constants' values are pinned by
    # the_register_bits_are_the_databooks, the_operating_condition_arguments_are_the_specs and
    # a_short_response_is_not_asked_for_as_a_long_one; the shift survivors are the `1 << 0`
    # constants, where the shift is the identity.
    '^crates/designware_mobile_storage/src/registers\.rs:\d+:\d+: replace \| with \^$',
    '^crates/designware_mobile_storage/src/card\.rs:\d+:\d+: replace \| with \^$',
    '^crates/designware_mobile_storage/src/command\.rs:\d+:\d+: replace \| with \^$',
    '^crates/designware_mobile_storage/src/registers\.rs:\d+:\d+: replace << with >>$',
    # **designware_ethernet's disjoint-bits and zero-shift sites** (milestone 954 (a survivor
    # accepted once is not accepted forever), 2026-10-28 UTC).
    #
    # A `|` over operands that share no bit equals a `^` over them, and a shift by zero equals the
    # reverse shift, so no test can kill those mutants. Each entry's argument is a named
    # `THE_*_SHARE_NO_BIT` constant beside the code, which fails the build if the operands ever
    # come to share a bit, and helpers/mutation_exclusion_check.py fails an entry whose named
    # constant is gone; for a shift by a literal, the argument is the identity itself. One
    # function per entry (one file, for a constant with no enclosing function), never the crate;
    # the shape is pinned so an entry cannot reach a different mutation. Each entry's limit, which
    # the assertion narrows but does not close: a future `|` or shift added inside the excluded
    # scope generates no mutant for it, and where a function's other mutants of the same shape are
    # already killed, the entry stops running them too, while the tests that killed them stay.
    # The register bits are `1 << n`; the survivors are the `1 << 0` bits, where the shift is the
    # identity (`1 << 0 == 1 >> 0`). Every constant with `n > 0` has its value pinned
    # literal-for-literal by registers::tests::the_bits_are_where_dwqereg_puts_them, which stays.
    "^crates/designware_ethernet/src/registers\\.rs:\\d+:\\d+: replace << with >>$",
    # The clause 22 constants are `1 << n` the same way; the survivor is GB, `1 << 0`, the
    # identity. Every other constant's value is pinned by
    # management_data_input_output::tests::the_clause_22_bits_are_the_standards, which stays.
    "^crates/designware_ethernet/src/management_data_input_output\\.rs:\\d+:\\d+: replace << with >>$",
    # BUS's four burst-length bits are asserted pairwise disjoint by
    # THE_BURST_LENGTH_BITS_SHARE_NO_BIT, beside BUS.
