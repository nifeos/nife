[package]
name = "user_mode_runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The user-mode runtime for a capability microkernel: the one system call wrapper, the entry macro, the panic handler and typed windows over memory the kernel handed a process, on aarch64, riscv64 and x86_64"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "runtime", "system-call"]
categories = ["no-std", "embedded", "os"]
publish = false     # `false` until the release that publishes this crate; that release deletes the line

# Host tests exercise the pure logic (bounds and alignment checks, the frame's accessors, the stubs'
# encodings) on any architecture this crate has arms for. Clippy runs on the bare-metal targets
# with `--lib`, because `--all-targets` there would pull in libtest, which does not exist for the
# `*-unknown-none` targets. There are no benches.
[lib]
bench = false

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-none",
    "aarch64-unknown-none-softfloat",
    "riscv64imac-unknown-none-elf",
]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker; the entry macro's `cfg(kani)` arms depend on it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"

[dependencies]
moho_abi = { version = "0.1.0-pre.1", git = "https://github.com/nifeos/moho_abi", rev = "b4b6ec3a01475d4ab012cd104da32895955f7b15" }
address_space_layout = { version = "0.1.0", git = "https://github.com/partsfoundry/address_space_layout", rev = "02d497b62915c1fb133ef1de6e76598fa51e67fe" }
# The clock contract, for `NANOSECONDS_PER_SECOND` in `monotonic_nanoseconds`. Dependency-free and
# no_std.
clock_contract = { version = "0.1.0", git = "https://github.com/partsfoundry/clock_contract", rev = "802ad77c24721a0572e42339f4cc6ffee16a1166" }
current_cpu_contract = { version = "0.1.0", path = "../current_cpu_contract" }
# The entropy contract, for `entropy::fill_random_bytes`: the client loop four programs had copied.
# Dependency-free and no_std, like the other protocol crates here.
entropy_contract = { version = "0.1.0-pre.1", git = "https://github.com/partsfoundry/entropy_contract", rev = "5150f14f781160debacd33310a6941f8829d958c" }
# The socket contract's frame layout: `socket_frame::Frame` reads and writes the shared frame
# through it. Dependency-free and no_std,
# like the protocol crates above. The type lives here rather than in socket_contract because a
# contract crate never links the runtime: the dependency runs from this crate to that one.
socket_contract = { version = "0.1.0", path = "../socket_contract" }

# Only riscv64 and x86_64 read the counter frequency from the kernel's timebase page; aarch64 reads
# `CNTFRQ_EL0` and would warn about an unused dependency.
[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
counter_frequency_contract = { version = "0.1.0-pre.2", git = "https://github.com/partsfoundry/counter_frequency_contract", rev = "4decec9d5e43054c88a6d5e6f5254b37906db92e" }
