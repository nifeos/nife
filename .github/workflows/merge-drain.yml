name: merge drain

# Observed failing: 2026-10-04, run 37219317166: `LABELLED #1611 (conflict)`, putting
#   `needs-maintainer` on a pull request a maintainer had to pick up. Green by design; the label is
#   the claim. See notes/observed-failing.md.

# **The merge drain, moved off a laptop** (`design/decisions/` on `who-took-the-step`, approved by
# calef 2026-09-23). It used to run under `launchd` on patagonia as calef's own token, which made
# three different actors wear one name and made a singleton singleton only because one laptop
# happened to be awake. Here it is `nife-smelter[bot]`, one workflow, one schedule, owned by the
# organization, with a run list every contributor can read.
#
# **Since 2026-10-03 it arms nothing** (milestone 727 (a queue eviction goes to a maintainer session), provisional; calef's rulings on #1564). It
# labels `needs-maintainer` (name provisional) on a pull request a maintainer session must pick up,
# dequeues one that became held, labels a resolved draft `unblocked`, and reruns a cancelled
# duplicate CI run, and once per pull request dequeues and re-enqueues a queue head stuck after its
# merge group finished (calef, #1833; the one action on the queue it kept). `helpers/merge-drain.sh`'s header has what was removed and why.
#
# **The premise was tested before any of this was written**, because the plan of 2026-09-24 (an App
# that arms and enqueues) rested on it.
# `cli/cli#7213` reports `gh pr merge --auto` failing under a GitHub App installation token where a
# personal token succeeds. Measured on 2026-09-24 against a throwaway pull request, under a token
# minted here from the `nife-smelter` App: `gh pr merge N --auto --merge` exited 0 and armed;
# `enablePullRequestAutoMerge` through `gh api graphql` returned data; `enqueuePullRequest` and
# `dequeuePullRequest` both reached GitHub's business logic and were refused on eligibility rather
# than on permission; `gh pr list --json` and `gh pr comment` both worked, the comment rendering as
# `nife-smelter[bot]`. The issue does not reproduce on this repository with this App.
#
# **This runs `--once`, not the watching form.** The loop is `schedule:` now. That is not a change
# in kind: the `launchd` jobs this replaces already fired `--once` every five minutes rather than
# running the script's own 150-second loop, so the cadence moves from five minutes to five minutes
# plus whatever GitHub's scheduler adds. See BUGS.
#
# BUGS
#
#   - **`workflow_run:` on CI completion joined 2026-09-30, day four of compromised throughput.** It
#     is also the moment a merge group's CI fails and the queue ejects, so the detector sees an
#     ejection within a pass of it rather than up to five minutes later.
#     The cron fired three times in 24 hours (01:29, 07:05, 13:35) while ejections stranded green
#     pull requests for hours between runs; the schedule's own BUGS entry below predicted it. The
#     first attempt used `pull_request:` triggers and failed before logging a line, and the reason
#     is the record: a pull_request-event run cannot reach the `automation` environment's secrets,
#     so the drain had no App token. `workflow_run` fires from the default
#     branch's copy of this file when any CI run completes, which is precisely the moment a green
#     pull request becomes eligible to strand: trusted context, real token, one cheap `--once`
#     pass, concurrency collapsing duplicates.
#   - **`schedule:` is a floor, not a promise.** GitHub's shortest interval is five minutes, and
#     scheduled runs are delayed under load and dropped entirely during peaks. A reader must not
#     take the run list as a heartbeat: a gap means "no run", never "nothing to do", and the drain
#     has no way to tell the difference either. calef accepted this cost on 2026-09-23 when he
#     approved the move; what is bought for it is that nothing depends on one laptop being awake.
#   - **GitHub can leave a run `waiting` on a deployment with nothing to approve, and it never
#     moves.** 2026-10-06, 10:47 to 21:40 UTC: run 37452061017 held the `merge-drain` group, sixty
#     later runs were replaced while pending, and three ejections went unlabeled until calef saw
#     them. The `unstick` job below cancels such a run on the next trigger; helpers/watcher_watch.py
#     (THE STUCK RUN) has the rule and the evidence. It cannot help if no trigger fires at all.
#   - **Nothing reports this workflow's own death.** Same gap the `launchd` jobs had, one level
#     along: a disabled workflow shows in the Actions tab, but only to somebody who looks. It is
#     better than an unloaded `launchd` job, whose stopped state lived in one transcript, and it is
#     not a mechanism.
#   - **A scheduled workflow only runs from the default branch.** Nothing in this file takes effect
#     until it is on `main`, so a change to the drain cannot be tested by pushing it to a branch.
#     `workflow_dispatch` on `main` is the way to exercise it, and `helpers/merge-drain.sh --once`
#     from any checkout is still the way to try a change before merging it.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  # `actions: write` is for exactly one call, `gh run rerun` on a CI run a concurrency group
  # cancelled as a same-second duplicate (2026-09-24, notes/merge-queue.md BUGS). The App's token
  # does the rest of the pass and cannot rerun a workflow: milestone 128 (automation identity) minted it with Contents
  # and Pull requests only. This token is passed to the script as MERGE_DRAIN_RERUN_TOKEN and is
  # read nowhere else, so the rerun shows as `github-actions[bot]` while the log line, which is
  # what the record counts, carries the drain's own instance tag.
  actions: write
  # `issues: write` is for `helpers/watcher_watch.py sync`'s fallback token (milestone 723), and for
  # creating the `needs-maintainer` label, which the App's token may not do.
  issues: write

jobs:
  # **Frees a run GitHub left waiting on nothing** (lane/drain-revival, 2026-10-06). A job that names
  # an environment waits on its deployment, and a waiting job holds its concurrency group. On
  # 2026-10-06 one drain run waited eleven hours on an `automation` deployment with no reviewer and
  # no timer, and every later run was replaced while pending. This job names no environment and no
  # group, so it runs on every trigger whatever the drain job is doing, and it cancels any such run
  # in the repository (ci-failing hit the same that day). The rule, and what it never touches, is
  # THE STUCK RUN in helpers/watcher_watch.py.
  unstick:
    name: free a run stuck waiting on no rule
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: helpers/watcher_watch.py
          sparse-checkout-cone-mode: false
      - name: cancel stuck runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 helpers/watcher_watch.py unstick

  drain:
    name: drain the merge queue
    # The App's secrets live in the `automation` environment (name provisional), whose deployment
    # branches are `main` only. A merge-group build runs on a `gh-readonly-queue/main/...` ref, which
    # is not `main`, so it cannot read them even if a pull request edits this workflow to name the
    # environment. Adopted by calef 2026-09-24 (options 2 and 3 of
    # design/roadmap/0588-a-merge-needs-a-review-no-fork-can-supply.md; the finding is 1 in
    # design/audit-reports/2026-09-24-new-trust-boundaries.md). The protection holds
    # since calef deleted the organisation-level copies of the two secrets on 2026-10-03 (UTC); an
    # org secret would have been visible to every job whatever its environment. Only jobs that mint the App token name it,
    # because each run of a job that does records a deployment.
    environment: automation
    # One drain, and the platform holds it rather than a person remembering. `cancel-in-progress:
    # false` because a pass that is part way through labeling should finish; a queued duplicate is
    # the thing to drop, and GitHub drops it. On the job, not the workflow, since 2026-10-06: a
    # workflow-level group also held back `unstick` below, the one job that can free it.
    concurrency:
      group: merge-drain
      cancel-in-progress: false
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          # Exactly the set the App held before milestone 128 (the automation gets its own identity)
          # widened it for sessions, Administration among them. Named here so the widening reaches no
          # workflow; notes/session-identity.md.
          permission-contents: write
          permission-pull-requests: write

      # **All branches, no blobs.** `helpers/lane-claim-check.sh` runs inside the drain's pass and
      # reads `origin/<branch>` refs directly (`git merge-base --is-ancestor`, `git rev-list
      # --count`, `git diff --shortstat`), so a single-ref checkout makes it silently report
      # nothing. `fetch-depth: 0` gets every branch; `filter: blob:none` keeps a 549 MB history from
      # being cloned in full 288 times a day, and the partial clone fetches the few blobs
      # `git diff --shortstat` actually touches on demand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none

      # **The label exists before the pass needs it**, created or updated idempotently with the
      # workflow's own token, so no setup step has to be remembered. Milestone 630 (a merge-queue ejection is caught before the queue, and recovered after it)'s `queue-ejected`
      # label is retired by the same step: nothing sets or clears it any more, and a label that
      # outlives its mechanism is a false signal. Deleting a label that is gone fails, and is
      # ignored; this line can go once the label is gone.
      - name: the needs-maintainer label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-maintainer --repo "$GITHUB_REPOSITORY" --force --color FBCA04 \
            --description "A maintainer session must pick this up; set and cleared by the merge drain (milestone 727)"
          gh label delete queue-ejected --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

      - name: one pass
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # Which drain spoke. "smelter did it" stops being an answer the moment the automation runs
          # in more than one place, and an installation token carries the App rather than the
          # caller, so the instance has to travel in the content. A laptop run tags itself with its
          # hostname; this tags itself with the run that can be opened and read.
          MERGE_DRAIN_INSTANCE: actions:${{ github.run_id }}
          MERGE_DRAIN_RERUN_TOKEN: ${{ github.token }}
        run: helpers/merge-drain.sh

      # **Reports a stopped merge watcher** (milestone 723 (a stopped merge watcher is reported within
      # three of its own intervals), provisional). Each of the two watchers runs this, so a stopped
      # one is reported by the other, and a running one closes its own issue. It opens the issue as
      # the App when the App may, and as `github-actions[bot]` when it may not
      # (`WATCHER_FALLBACK_TOKEN`); the log says which. `continue-on-error` because a reporting
      # failure must not turn the drain red, but it prints a warning so it is not silent.
      - name: report a stopped merge watcher
        if: always()
        continue-on-error: true  # outcome: exception, a reporting failure must not turn the drain red; it warns
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          WATCHER_READ_TOKEN: ${{ github.token }}
          WATCHER_FALLBACK_TOKEN: ${{ github.token }}
        run: python3 helpers/watcher_watch.py sync || echo "::warning::watcher_watch.py sync failed; a stopped watcher may be unreported"
