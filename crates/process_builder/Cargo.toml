[package]
name = "process_builder"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]
abi = { version = "0.1.0", path = "../abi" }
elf = { version = "0.1.0", path = "../elf" }
user_mode_runtime = { version = "0.1.0", path = "../user_mode_runtime" }
# The user address-space map (milestone 206 (a program image has under 896 KiB)): where a child's
# stack goes, and the check that refuses an image the map has no room for, shared with
# `kernel::user::load` so the two loaders agree.
address_space_map = { version = "0.1.0", path = "../address_space_map" }
# The x86_64 timebase page's fixed VA (milestone 161's `cntfrq` follow-up): this crate's own
# x86_64-gated code in `lay_out_child` needs the same constant `kernel::user::load` and
# `user_mode_runtime::cntfrq` agree on, so no party keeps its own copy.
counter_frequency_contract = { version = "0.1.0", path = "../counter_frequency_contract" }
# The protocol words, the endowment and the retention declaration. The loader consumes them and
# the contract never depends on this crate (DECISIONS §235 (the OS is built and updated from packages, and its source divides by purpose) P3).
supervision_contract = { version = "0.1.0", path = "../supervision_contract" }
