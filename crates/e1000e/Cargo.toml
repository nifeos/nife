[package]
name = "e1000e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Intel e1000e-family (82574L, I219) network controller logic: registers, descriptors and ring logic behind small traits, proven with Kani"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["no-std", "kani", "driver"]
categories = ["no-std", "embedded", "hardware-support"]
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)

# no_std for a kernel and a network stack, std for host tests. It owns what the two halves of an
# Intel e1000e-family driver agree on: register offsets and bits, the descriptor formats, the DMA
# region's layout, the spawn handoff, and the whole receive and transmit ring logic behind two small
# traits. The caller supplies the volatile register accesses; everything they compute is here,
# host-tested against a simulated device and reachable by the model checker.

# No dependencies: the device-tree walk and the process layout around this driver are the
# caller's.

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
