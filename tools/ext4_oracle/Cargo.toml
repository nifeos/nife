# Its own workspace root, deliberately NOT a member of the nife workspace, for the reason
# tools/glyph_atlas_generator is one: `rsext4` below is ruled for this host tool only, and its own
# lockfile keeps it out of the graph any shipped program is built from. `script/supply-chain` finds
# that lockfile on its own and runs cargo-deny over it; deny.toml's `wrappers` entry refuses
# `rsext4` in any graph where something else depends on it, and the package-boundary rule refuses
# a link to this crate from anything outside a test package (packages/ext4-oracle.package.toml).
# `script/fmt` reaches it by --manifest-path; the CI job `ext4 read oracle` builds, lints and runs it.
[workspace]

# Name: provisional. It is the oracle of milestone 190 (ext4, read and write), and the directory
# already carried the name. calef names things.
[package]
name = "ext4_oracle"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# The implementation under test. Ruled 2026-11-16 (UTC) on pull request #3639: a host-only
# dependency of this tool, pinned exactly, in a workspace of its own, never in a nife image,
# kernel, program or shipping lockfile. That ruling is not the §46 (thin primitives or whole
# subsystems) ruling on whether nife ships `rsext4`, which stays open. Taken from partsfoundry/rsext4,
# the fork that carries nife's fixes until upstream releases them (ruled 2026-11-23 UTC), pinned
# by `rev` under §305 (git dependencies are allowed on `nifeos/*` only, pinned to a landed
# commit), because `expected.txt` and `write-expected.txt` describe what that commit reads and
# writes; a bump re-measures them.
# Default features off: the reader needs no `std` integration from the crate, and the defaults
# would add nothing the oracle reads.
[dependencies]
rsext4 = { version = "0.10.0-nifeos.1", git = "https://github.com/partsfoundry/rsext4", rev = "388ebd6a4ec0c6c91af5bbaf577c8737c2322f94", default-features = false }
