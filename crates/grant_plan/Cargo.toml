[package]
name = "grant_plan"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

[lints]
workspace = true

[dependencies]

# The matcher, and only the matcher. `glob` is a total function on two byte strings with no
# filesystem in it; deciding what a match *grants* is command-line logic, which is this crate's job.
# Depending on it here is what makes "one matcher, driven by both `echo` and the grant planner" true
# in the code rather than a convention two callers are trusted to keep.
# The `version` is required, not decoration: cargo-deny treats a path dep with no version as a
# wildcard, and `allow-wildcard-paths` deliberately does not exempt a crate that other crates depend
# on. `grant_plan` is depended on by `user` and `kernel`, so it is exactly that case.
glob = { version = "0.1.0", path = "../glob" }

# The argument page's layout (milestone 205 (how a foreign program is told what to do), DECISIONS §170 (how a foreign program is told what to do)): `argv` assembles a line's words onto
# it, so the shell and the std PAL that reads the page share one definition.
program_argument_contract = { version = "0.1.0", path = "../program_argument_contract" }

# `filesystem_contract` is a DEV dependency only, and deliberately: the shell must be able to check a command
# line without linking the filesystem contract. It is here so one host test can pin the grant name
# limit against the contract that actually carries it, which is what makes the duplicated constant
# safe rather than a drift waiting to happen.
[dev-dependencies]
filesystem_contract = { version = "0.1.0", path = "../filesystem_contract" }
primitive_benchmark_contract = { version = "0.1.0", path = "../primitive_benchmark_contract" }
